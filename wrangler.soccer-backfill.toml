name = "fbis-soccer-pitchapi-backfill"
main = "workers/soccer-pitchapi-backfill-worker.mjs"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[triggers]
crons = [] # Retired sport: never reactivate recurring collection

# SOCCER_CONTROL_TOKEN and SOCCER_WORKER_TOKEN exist in the live Worker as
# plain-text bindings. Move both to true secrets before the first GitHub deploy.
# Do not put credential values in source control.

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
CLOUDFLARE_ACCOUNT_ID = "2fdc80b8d99070adcef12f7a785c3fc1"

# Shared account admission; policy stays paused until measured costs and bounded jobs are configured.
[[durable_objects.bindings]]
name = "FBIS_ACCOUNT_BUDGET"
class_name = "AccountBudget"
script_name = "fbis-account-budget"
