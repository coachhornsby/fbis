name: CFB Tier 3 private weekly dataset import
on:
  pull_request:
    paths:
      - "functions/lib/cfbTier3Weekly.js"
      - "functions/lib/cfbTier3FeatureRegistry.js"
      - "functions/api/college-tier3.js"
      - "migrations/0105_cfb_tier3_training_research.sql"
      - "migrations/0109_cfb_tier3_schema_identity.sql"
      - "test/cfb-tier3-weekly.test.js"
      - ".github/workflows/cfb-tier3-weekly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-private-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate CSV import (offline; zero paid CFBD calls)
        run: node --test test/cfb-tier3-weekly.test.js
