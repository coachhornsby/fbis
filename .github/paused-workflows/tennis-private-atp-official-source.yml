name: Tennis Phase 2 ATP official portrait source verification
on:
  push:
    branches: [main]
    paths:
      - 'migrations/0120_tennis_private_portrait_phase2.sql'
      - '.github/workflows/tennis-private-atp-official-source.yml'
  workflow_dispatch:
  schedule:
    # Weekly source reconciliation while official ATP identity coverage is incomplete.
    - cron: '32 12 * * 2'
permissions:
  contents: read
concurrency:
  group: fbis-tennis-atp-official-source
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for source registry deployment and schema
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            response="$(curl --max-time 10 -fsS -H "x-harvest-secret: ${HARVEST_SECRET}" \
              'https://fbis-myz.pages.dev/api/tennis-private-portrait-phase2' || true)"
            if jq -e '.ok == true and .totals.roster == 1074 and .totals.canonicalMatched == 1074' <<<"$response" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          echo "PHASE2_PRODUCTION_SCHEMA_UNAVAILABLE"
          exit 1
      - name: Require official ATP player-ID linkage already established from ranked source links
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl --retry 2 --max-time 20 -fsS -H "x-harvest-secret: ${HARVEST_SECRET}" 'https://fbis-myz.pages.dev/api/tennis-private-portrait-phase2')"
          echo "$response" | jq -e '.ok == true and (.byTour[] | select(.tour == "atp") | .official_id_linked >= 530 and .roster == 559)' >/dev/null
          echo "ATP official source links preserved; verifying headshot responses without image GET"
      - name: Verify ATP candidate headshot sources by HEAD only
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          node scripts/tennis-private-atp-headshot-source-check.mjs
