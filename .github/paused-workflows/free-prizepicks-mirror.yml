# User directive 2026-10-16: do not ingest the free PrizePicks GitHub mirror.
# Scheduled runs and merge/push-triggered ingestion are disabled.  A manual
# workflow dispatch is a no-op until an explicitly reviewed reactivation.
name: Free PrizePicks mirror — PAUSED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm mirror ingestion is disabled
        run: |
          echo "FREE_PRIZEPICKS_MIRROR_INGESTION_DISABLED"
          echo "FBIS uses only separately authorized, budget-capped Zen Studio collection for FBIS-modeled props."
          echo "No mirror HTTP fetch, D1 writes, Apify charges, or wager authorization."
