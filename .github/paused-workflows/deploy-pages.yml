name: Deploy Pages

# Compatibility entrypoint only. CI is the sole Pages production authority.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-canonical-release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request canonical main release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref main
