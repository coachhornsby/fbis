name: Tennis profile production acceptance
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tennis v2 profile refresh"]
    types: [completed]
permissions:
  contents: read
jobs:
  acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed cohort and historical-profile acceptance
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: node scripts/verify-tennis-profile-cohort-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-profile-cohort-acceptance
          path: artifacts/tennis-profile-cohort-acceptance.json
          retention-days: 30
          if-no-files-found: warn
