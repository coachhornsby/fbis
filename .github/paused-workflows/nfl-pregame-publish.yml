name: NFL pregame research publication

on:
  schedule:
    # Every 20 minutes: catch T48/T24/T6/FINAL roll-forwards without inventing past freezes.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional Chicago board date YYYY-MM-DD"
        required: false
        default: ""
      strict:
        description: "Fail job if current-checkpoint coverage < 100%"
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - "functions/lib/nflPregamePublication.js"
      - "functions/api/nfl-pregame-publish.js"
      - "scripts/nfl-pregame-publish-slate.mjs"
      - "migrations/0114_nfl_research_publications.sql"
      - ".github/workflows/nfl-pregame-publish.yml"

permissions:
  contents: read

concurrency:
  group: nfl-pregame-publish
  cancel-in-progress: false

jobs:
  migrate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply NFL research publication migration (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute fbis --remote --file=migrations/0114_nfl_research_publications.sql

      - name: Publish + reconcile current eligible NFL checkpoints
        env:
          BASE: https://fbis-myz.pages.dev
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          NFL_PUBLISH_DATE: ${{ github.event.inputs.date || '' }}
          GITHUB_SHA: ${{ github.sha }}
          # Cron/reconcile must not wait for Pages to show this workflow SHA
          # (workflow-only pushes never update deploymentCommit).
          REQUIRE_DEPLOY_SHA: ${{ github.event_name == 'push' && '1' || '0' }}
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          READY_ATTEMPTS: "24"
          RECONCILE_ATTEMPTS: "6"
          RECONCILE_DELAY_MS: "8000"
          ARTIFACT_DIR: artifacts/nfl-pregame-publish
        run: |
          set -euo pipefail
          STRICT_FLAG=""
          if [ "${{ github.event.inputs.strict || 'false' }}" = "true" ]; then
            STRICT_FLAG="--strict"
          fi
          # Scheduled runs fail the job if coverage remains incomplete after reconcile retries.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STRICT_FLAG="--strict"
          fi
          # shellcheck disable=SC2086
          node scripts/nfl-pregame-publish-slate.mjs $STRICT_FLAG

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-pregame-publish-${{ github.run_id }}
          path: artifacts/nfl-pregame-publish
          if-no-files-found: warn
          retention-days: 14
