name: NBA market-quote freshness watch
on:
  workflow_dispatch:
  schedule:
    - cron: "55 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/nba-market-freshness-gate.mjs"
      - "test/nba-market-freshness-gate.test.mjs"
      - ".github/workflows/nba-market-freshness-watch.yml"
  pull_request:
    paths:
      - "scripts/nba-market-freshness-gate.mjs"
      - "test/nba-market-freshness-gate.test.mjs"
      - ".github/workflows/nba-market-freshness-watch.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node --test test/nba-market-freshness-gate.test.mjs
      - name: Verify live NBA_DB market coverage
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ed992525-d2ed-4b1d-8a12-feeb2efa152c
        run: node scripts/nba-market-freshness-gate.mjs
      - uses: actions/upload-artifact@v7
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: nba-market-freshness-${{ github.run_id }}
          path: artifacts/nba-market-freshness.json
          retention-days: 60
          if-no-files-found: warn
