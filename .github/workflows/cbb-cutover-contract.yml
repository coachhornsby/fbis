name: CBB cutover contract (no authority changes)
on:
  pull_request:
    paths:
      - 'functions/lib/cbb*.js'
      - 'functions/lib/databaseTopology.js'
      - 'functions/lib/sportCutoverRehearsal.js'
      - 'functions/lib/sportMigrationQualify.js'
      - 'functions/lib/sportWorkingCopy.js'
      - 'functions/lib/store.js'
      - 'functions/lib/publishedProjectionStore.js'
      - 'functions/lib/pinnoddsIngestion.js'
      - 'functions/lib/marketCoverageAudit.js'
      - 'functions/api/track.js'
      - 'functions/api/strategy.js'
      - 'functions/api/final-grade.js'
      - 'test/cbb-*.js'
      - 'ops/sql/cbb-shared-sport-guards.sql'
      - 'functions/api/cbb-team-profiles.js'
      - 'functions/api/collect.js'
      - 'test/cbb-research-owner.test.js'
      - 'scripts/cbb-cutover-audit.mjs'
      - '.github/workflows/cbb-cutover-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/cbb-cutover-rehearsal.test.js test/cbb-shard-guards.test.js test/cbb-paused-recovery.test.js test/cbb-shared-owner-isolation.test.js test/cbb-migration-retry.test.mjs test/cbb-exact-migration.test.js test/cbb-research-owner.test.js test/cbb-cutover-shadow-ownership.test.js test/cbb-team-profiles.test.js test/cbb-directory-phase-b.test.js test/cbb-directory-phase-b-sportsdataverse.test.js test/sport-cutover-all11-routing-gate.test.js
      - run: node scripts/cbb-cutover-audit.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: cbb-cutover-owner-inventory
          path: artifacts/cbb-cutover/ownership-manifest.json
