name: CFB Week 6 direct harvest retry (one time)

# One success-gated run for exactly one week-scoped source request pair.
# The original five-date season-wide request is NOT retried.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cfb-week6-direct-harvest-20261022
  cancel-in-progress: false

jobs:
  harvest-cfb-week6:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          contains(github.event.workflow_run.head_commit.message, '[CFB-DIRECT-WEEK6-20261022]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: One authenticated CFBD Week 6 research fetch, bounded by D1 quota
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}" || { echo "HARVEST_SECRET missing"; exit 2; }
          mkdir -p sanitized
          url="https://fbis-myz.pages.dev/api/college?job=cfb-drive-week6-harvest&trigger=workflow_dispatch&operatorApproved=true&year=2026&week=6"
          http="$(curl --silent --show-error --retry 0 --max-time 240 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            -o response.json -w '%{http_code}' "$url")" || http="000"
          echo "CFB week-only operator HTTP ${http}"
          if jq -e . response.json >/dev/null 2>&1; then
            jq '{ok,status,errors,collection: (.d1.cfbDriveWeek |
               {ok,status,reason,season,week,verifiedFinals,providerGames,
                providerDrives,matchedDrives,accepted,alreadyPresent,
                rejected,sourceDatabase,networkCalls})}' response.json > sanitized/result.json
            jq -c . sanitized/result.json
            cat sanitized/result.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"ok":false,"error":"NON_JSON_HARVEST_RESPONSE"}' > sanitized/result.json
            cat sanitized/result.json
            exit 1
          fi
          test "$http" = "200"
          jq -e '.ok == true and .status == "success" and
                 .d1.cfbDriveWeek.ok == true and
                 .d1.cfbDriveWeek.sourceDatabase == "CFB_DB"' response.json >/dev/null
      - name: Fetch read-only verified research counts
        if: success()
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          http="$(curl -sS --show-error --retry 0 --max-time 90 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -o research-status.json -w '%{http_code}' \
            "https://fbis-myz.pages.dev/api/cfb-simulation?mode=drives")"
          test "$http" = "200"
          jq '{source,sourceGames,sourceDrives,trainingReady,runs,grades,limitations}' \
            research-status.json > sanitized/status.json
          jq -c . sanitized/status.json
          cat sanitized/status.json >> "$GITHUB_STEP_SUMMARY"
      - name: Persist sanitized receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-week6-direct-harvest-receipts
          path: sanitized/*.json
          retention-days: 14
          if-no-files-found: ignore
