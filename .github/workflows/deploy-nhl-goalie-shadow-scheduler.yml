name: Deploy NHL goalie shadow scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nhl-goalie-shadow-scheduler
  cancel-in-progress: true

# Superseded by fbis-orchestrator, which owns the live 17 * * * * cron.
# Kept manual-only for rollback/forensics; do not auto-deploy a duplicate scheduler.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Focused NHL shadow tests
        run: node --test test/nhl-goalie-prob-shadow.test.js test/nhl-goalie-shadow-scheduler.test.js
      - name: Deploy Cloudflare cron worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.nhl-goalie-shadow-scheduler.toml
