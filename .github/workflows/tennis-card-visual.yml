name: Tennis card visual regression
on:
  pull_request:
    paths:
      - 'src/components/board/TennisMatchCard.jsx'
      - 'src/components/board/tennisMatchCard.css'
      - 'src/lib/tennisCardPresentation.js'
      - 'scripts/tennis-card-visual.mjs'
      - 'test/fixtures/tennis-card-visual.*'
      - '.github/workflows/tennis-card-visual.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/tennis-card-visual.mjs
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: tennis-card-visual
          path: artifacts/tennis-card-visual/
          retention-days: 30
