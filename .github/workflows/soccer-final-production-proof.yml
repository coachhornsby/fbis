name: Soccer final production source proof
on:
  push:
    branches: [fix/soccer-final-production-proof-20261015]
    paths: [.github/workflows/soccer-final-production-proof.yml]
permissions:
  contents: read
concurrency:
  group: soccer-final-card-proof
  cancel-in-progress: false
jobs:
  soccer-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
      SOCCER_PINN_SNAPSHOT_ID: pinnodds-20261015-12-full-board-1-prematch
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - name: Verify deployed soccer adapter ancestry
        run: |
          set -euo pipefail
          status=$(curl -fsS --retry 4 --retry-all-errors --max-time 45 -H "x-harvest-secret: $HARVEST_SECRET" "$BASE/api/soccer-prospective-shadow?mode=summary")
          sha=$(jq -r '.collectorCodeSha' <<<"$status")
          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/920a04724ed16b3b47bd33a4528bd942da443b7e...$sha" --jq .status)
          [ "$relation" = identical ] || [ "$relation" = ahead ]
      - name: Reactivate the signed market stream after storage headroom returns
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --max-time 60 -X POST -H "x-harvest-secret: $HARVEST_SECRET" "$BASE/api/polymarket-stream-start" | tee artifacts/stream-start.json
          jq -e '.ok and .connected' artifacts/stream-start.json
      - name: Verify soccer shadow records and source delivery
        run: |
          set -euo pipefail
          day=$(TZ=America/Chicago date -d '+2 days' +%F)
          for league in ger.1 fra.1 esp.1; do
            curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --max-time 120 -H "x-harvest-secret: $HARVEST_SECRET" "$BASE/api/soccer-prospective-shadow?mode=snapshot&competition=$league&date=$day" > "artifacts/shadow-$league.json"
            jq -e '.ok and .researchOnly and (.canQualify==false) and (.canAuthorize==false)' "artifacts/shadow-$league.json"
          done
          tomorrow=$(TZ=America/Chicago date -d '+1 day' +%F)
          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --max-time 120 "$BASE/api/projections?sport=soccer&date=$tomorrow" > artifacts/soccer-board.json
          jq '{games:(.games|length),sourceOffers:[.games[].market.venueOffers[]?.source]|group_by(.)|map({source:.[0],offers:length})}' artifacts/soccer-board.json
          jq -e '(.games|length)>0 and any(.games[].market.venueOffers[]?; .source=="PinnOdds") and any(.games[].market.venueOffers[]?; .source=="Polymarket US WebSocket")' artifacts/soccer-board.json
          curl -fsS --max-time 30 https://fbis-polymarket-us-stream.coachhornsby.workers.dev/health > artifacts/stream-health.json
          jq -e '.ok and .operational and .connected' artifacts/stream-health.json
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: soccer-post-storage-${{ github.run_id }}
          path: artifacts/**
