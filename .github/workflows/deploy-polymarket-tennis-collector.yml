name: Deploy Polymarket Tennis cron collector
on:
  pull_request:
    paths:
      - "services/polymarket-tennis-collector/**"
      - "wrangler.polymarket-tennis-collector.toml"
      - "functions/lib/tennisExchangeInventory.js"
      - ".github/workflows/deploy-polymarket-tennis-collector.yml"
  push:
    branches: [main]
    paths:
      - "services/polymarket-tennis-collector/**"
      - "wrangler.polymarket-tennis-collector.toml"
      - "functions/lib/tennisExchangeInventory.js"
      - ".github/workflows/deploy-polymarket-tennis-collector.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbis-polymarket-tennis-cron-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run Tennis source and collector tests
        run: node --test test/tennis-exchange-first-inventory.test.mjs test/polymarket-tennis-cron.test.mjs
      - name: Validate independent Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.polymarket-tennis-collector.toml --outdir /tmp/tennis-collector
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy Cloudflare five-minute Tennis collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.polymarket-tennis-collector.toml
      - name: Confirm read-only cron Worker health endpoint
        run: |
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 -sS \
            https://fbis-polymarket-tennis-collector.coachhornsby.workers.dev/health \
            | jq -e '.ok == true and .readOnly == true and .canAuthorizeWager == false and .schedule == "EVERY_5_MINUTES"'
