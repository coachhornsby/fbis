name: Sport D1 shadow delta sync (recurring)

# Continuous working-set + prefix shadow sync for all 11 sport D1s.
# PRIMARY remains authoritative — cutover stays gated.
# Agents cannot workflow_dispatch (403) — touch the ops trigger.
on:
  schedule:
    # Every 20 minutes, offset from high-load boundaries.
    - cron: "5,25,45 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/triggers/sport-delta-sync"
      - ".github/workflows/sport-delta-sync-recurring.yml"
      - "scripts/sport-delta-sync-ops.mjs"
      - "functions/lib/sportWorkingCopy.js"

permissions:
  contents: read

concurrency:
  # v2 group unblocks a stuck v1 queue that never started after #1417.
  group: fbis-sport-delta-sync-recurring-v2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Bound concurrency so 11 sports do not stampede PRIMARY/Pages at once.
      max-parallel: 3
      matrix:
        sport: [nfl, cfb, nhl, nba, mlb, cbb, wnba, soccer, tennis, npb, kbo]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # Need history so production descendant SHAs can satisfy merge-base ancestor checks.
          fetch-depth: 0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Wait until production contains this sync change
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --prune
          # Accept exact SHA or a descendant — concurrent main merges must not fail the matrix.
          for i in $(seq 1 60); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)-$i" || true)"
            if [ "$code" = "200" ]; then
              while IFS= read -r prod_sha; do
                [ -n "$prod_sha" ] || continue
                if git cat-file -e "$prod_sha^{commit}" 2>/dev/null \
                  && git merge-base --is-ancestor "$EXPECTED_SHA" "$prod_sha"; then
                  echo "production_contains=$EXPECTED_SHA deployed_sha=$prod_sha"
                  exit 0
                fi
              done < <(jq -r '.. | strings | select(test("^[0-9a-f]{40}$"))' "$body" 2>/dev/null | sort -u)
            fi
            sleep 6
          done
          echo "Production never reached this commit or a descendant inside the bounded gate."
          exit 1
      - name: Delta-sync ${{ matrix.sport }} shadow working set
        if: github.event_name != 'pull_request'
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE_URL: https://fbis-myz.pages.dev
          SPORT: ${{ matrix.sport }}
          INCLUDE_PREFIX: "true"
          SYNC_ROUNDS: "3"
          SYNC_PAGE_SIZE: "250"
          SYNC_MAX_PAGES: "8"
          # Incomplete-first prefix catch-up (profiles/rosters/research/models).
          PREFIX_PAGE_SIZE: "150"
          PREFIX_MAX_PAGES: "12"
          PREFIX_ROUNDS: "2"
          # Large prefix sports (CFB) need headroom beyond Pages soft limits; ops also retries 503.
          SYNC_TIMEOUT_MS: "360000"
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET}" || { echo "HARVEST_SECRET not configured"; exit 1; }
          mkdir -p artifacts
          node scripts/sport-delta-sync-ops.mjs | tee "artifacts/sport-delta-sync-${SPORT}.json"
          jq -e '.ok==true and .productStillPrimary==true and .canAuthorizeWager==false and .cutoverAuthorized==false' \
            "artifacts/sport-delta-sync-${SPORT}.json" >/dev/null
      - uses: actions/upload-artifact@v4.6.2
        if: always() && github.event_name != 'pull_request'
        with:
          name: sport-delta-sync-${{ matrix.sport }}
          path: artifacts/sport-delta-sync-${{ matrix.sport }}.json
          if-no-files-found: ignore
          retention-days: 14

