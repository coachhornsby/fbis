name: FBIS public model cards — one bounded release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fbis-public-model-card-deploy-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbis-public-model-cards-once
  cancel-in-progress: false

jobs:
  static-board-public-model-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NODE_OPTIONS: "--max-old-space-size=2048"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Install pinned exchange release dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix services/account-budget
      - name: Validate no-sign-in model publication and unchanged private gates
        run: |
          node --check deploy/board/functions/_middleware.js
          node --check services/exchangeDiagnostics.mjs
          node --check functions/lib/exchangeCardDelivery.js
          node --test test/retired-provider-policy.test.js test/retired-provider-pages.test.mjs test/odds-provider-router.test.js
          node --test test/recovery-card-facts.test.mjs test/exchange-card-delivery.test.mjs
          node --test test/exchange-relay-pages.test.mjs test/kalshi-market-stream.test.mjs test/exchange-cycle-allocation.test.mjs test/polymarket-stream-broker.test.js test/kalshi-signed-collector.test.js test/job-execution-budget.test.mjs test/account-budget-admission.test.mjs
          node --check functions/lib/publicFourSportProjection.js
          node --check src/lib/publicSportAuto.js
          node --check 'deploy/board/functions/api/public/sports/[sport]/[date].js'
          node --test test/public-four-sport-projections.test.mjs test/four-sport-private-recovery.test.mjs
      - name: Build existing static Pages board (free public scoreboards only)
        run: npm run build --prefix deploy/board
      - name: Fail closed on missing Pages credentials or assets
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "MISSING_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "MISSING_PAGES_TOKEN"; exit 1; }
          test -f deploy/board/dist/index.html || { echo "MISSING_STATIC_BOARD"; exit 1; }
          test -f 'deploy/board/functions/api/public/sports/[sport]/[date].js' || { echo "MISSING_PUBLIC_MODEL_ROUTE"; exit 1; }
      - name: One-shot bounded Pages release (does not turn on GitHub auto-deploy)
        working-directory: deploy/board
        run: npx wrangler pages deploy dist --project-name fbis --branch main --commit-hash "${GITHUB_SHA}"
      - name: Validate bounded exchange runtimes
        run: node --test test/account-budget-runtime.test.mjs test/kalshi-job-budget-runtime.test.mjs test/kalshi-market-runtime.test.mjs test/polymarket-rest-runtime.test.mjs test/polymarket-bounded-runtime.test.mjs test/polymarket-roster-routing-runtime.test.mjs
      - name: Release bounded exchange workers and activate last
        run: |
          npx wrangler deploy --config wrangler.kalshi-public-collector.toml --keep-vars
          npx wrangler deploy --config wrangler.polymarket-rest-collector.toml --keep-vars
          npx wrangler deploy --config wrangler.polymarket-roster-publisher.toml --keep-vars
          npx wrangler deploy --config wrangler.polymarket-us-stream.toml --keep-vars
          node scripts/activate-exchange-cycle.mjs
