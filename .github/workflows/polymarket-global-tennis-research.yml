name: Polymarket Global ATP WTA research collection
on:
  schedule:
    # Avoid the top-of-hour Actions scheduler contention, retain 15-minute cadence.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/api/polymarket-global-tennis-collect.js"
      - "functions/lib/tennisPolymarketGlobal.js"
      - ".github/workflows/polymarket-global-tennis-research.yml"
permissions:
  contents: read
concurrency:
  group: polymarket-global-tennis-research
  cancel-in-progress: false
jobs:
  gamma_research:
    if: github.repository == 'coachhornsby/fbis'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Capture bounded Gamma tennis market discovery into R2
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          test -n "$HARVEST_SECRET" || { echo "HARVEST_SECRET_NOT_CONFIGURED"; exit 1; }
          curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors --retry-delay 15 --max-time 260 \
            -X POST "https://fbis-myz.pages.dev/api/polymarket-global-tennis-collect" \
            -H "x-harvest-secret: $HARVEST_SECRET" -H "content-type: application/json" \
            -d '{}' > /tmp/tennis-gamma-receipt.json
          jq -e '.ok == true and .canAuthorizeWager == false and .source == "POLYMARKET_GLOBAL_GAMMA"' /tmp/tennis-gamma-receipt.json
          # Reject misleading green runs that report an old capture clock.
          captured_epoch="$(date -u -d "$(jq -r '.asOf' /tmp/tennis-gamma-receipt.json)" +%s)"
          now_epoch="$(date -u +%s)"
          test "$captured_epoch" -le "$((now_epoch+60))"
          test "$captured_epoch" -ge "$((now_epoch-600))"

          echo "Polymarket.com ATP/WTA fixtures: $(jq -r '.fixtureCount' /tmp/tennis-gamma-receipt.json), matched events: $(jq -r '.matchedEvents' /tmp/tennis-gamma-receipt.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "Source capture time: $(jq -r '.asOf' /tmp/tennis-gamma-receipt.json) · Search warnings: $(jq -r '.errors | length' /tmp/tennis-gamma-receipt.json)" >> "$GITHUB_STEP_SUMMARY"
