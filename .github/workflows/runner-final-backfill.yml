name: Runner-backed final score backfill

on:
  push:
    branches:
      - "ops/backfill-final-grade-runner-20260928"

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build unresolved sport/date targets
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/before.json"
          http="$(curl -sS --max-time 180 --retry 1 --retry-all-errors             -H "x-harvest-secret: ${HARVEST_SECRET}"             -o "$report" -w "%{http_code}"             "${FBIS_BASE}/api/learning-report?since=2026-01-01&limit=5000")"
          echo "before report http=$http"
          test "$http" = "200"
          jq -e '.ok == true and .source=="prediction_snapshots"' "$report" >/dev/null

          raw="$RUNNER_TEMP/raw.tsv"
          targets="$RUNNER_TEMP/targets.tsv"
          jq -r '.audit[] | select(.learningStatus=="AWAITING FINAL") | [(.sport|ascii_downcase),(.start//""),(.date//"")] | @tsv' "$report" > "$raw"
          : > "$targets"
          yesterday="$(TZ=America/Chicago date -d 'yesterday' +%F)"
          while IFS=$'\t' read -r sport start stored_date; do
            [ -n "$sport" ] || continue
            game_date=""
            if [ -n "$start" ]; then
              game_date="$(TZ=America/Chicago date -d "$start" +%F 2>/dev/null || true)"
            fi
            if [ -z "$game_date" ]; then game_date="$stored_date"; fi
            [ -n "$game_date" ] || continue
            if [[ "$game_date" < "$yesterday" || "$game_date" == "$yesterday" ]]; then
              printf '%s\t%s\n' "$sport" "$game_date" >> "$targets"
            fi
          done < "$raw"
          sort -u "$targets" -o "$targets"
          echo "targets=$(wc -l < "$targets")"
          cat "$targets"
          echo "targets_file=$targets" >> "$GITHUB_ENV"
          echo "before_report=$report" >> "$GITHUB_ENV"

      - name: Fetch trusted finals on runner and grade all snapshots
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          COLLEGE_DATA_API_KEY: ${{ secrets.COLLEGE_DATA_API_KEY }}
          FBIS_BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -u
          calls=0
          fetched_ok=0
          fetched_fail=0
          grade_ok=0
          grade_fail=0
          matched=0
          unmatched=0
          accepted=0

          while IFS=$'\t' read -r sport date; do
            [ -n "$sport" ] || continue
            calls=$((calls+1))
            payload="$(mktemp)"
            response="$(mktemp)"
            if ! node scripts/fetch-final-scoreboard.mjs "$sport" "$date" > "$payload"; then
              fetched_fail=$((fetched_fail+1))
              echo "FETCH_FAIL ${sport} ${date}"
              continue
            fi
            fetched_ok=$((fetched_ok+1))
            final_n="$(jq -r '.completed // 0' "$payload")"
            fetch_n="$(jq -r '.fetched // 0' "$payload")"
            if [ "$final_n" -le 0 ]; then
              echo "NO_FINALS ${sport} ${date} fetched=${fetch_n}"
              continue
            fi

            http="$(curl -sS --max-time 120 --retry 1 --retry-delay 2               -X POST               -H "x-harvest-secret: ${HARVEST_SECRET}"               -H "content-type: application/json"               --data-binary @"$payload"               -o "$response" -w "%{http_code}"               "${FBIS_BASE}/api/final-grade")"
            if [ "$http" = "200" ] && jq -e '.ok == true' "$response" >/dev/null 2>&1; then
              grade_ok=$((grade_ok+1))
              m="$(jq -r '.matched // 0' "$response")"
              u="$(jq -r '.unmatched // 0' "$response")"
              a="$(jq -r '.accepted // 0' "$response")"
              matched=$((matched+m))
              unmatched=$((unmatched+u))
              accepted=$((accepted+a))
              echo "GRADE_OK ${sport} ${date} fetched=${fetch_n} finals=${final_n} accepted=${a} matched=${m} unmatched=${u}"
            else
              grade_fail=$((grade_fail+1))
              echo "GRADE_FAIL ${sport} ${date} http=${http:-000}"
              cat "$response" || true
            fi
          done < "$targets_file"

          {
            echo "## Runner-backed historical final grading"
            echo "- target sport/dates: $calls"
            echo "- scoreboard fetch success: $fetched_ok"
            echo "- scoreboard fetch failures: $fetched_fail"
            echo "- grade API success: $grade_ok"
            echo "- grade API failures: $grade_fail"
            echo "- final rows accepted: $accepted"
            echo "- snapshot game ids graded: $matched"
            echo "- snapshot game ids unresolved: $unmatched"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch post-backfill learning report
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          after="$RUNNER_TEMP/after.json"
          http="$(curl -sS --max-time 180 --retry 1 --retry-all-errors             -H "x-harvest-secret: ${HARVEST_SECRET}"             -o "$after" -w "%{http_code}"             "${FBIS_BASE}/api/learning-report?since=2026-01-01&limit=5000")"
          echo "after report http=$http"
          test "$http" = "200"
          jq -e '.ok == true and .source=="prediction_snapshots"' "$after" >/dev/null
          echo "after_report=$after" >> "$GITHUB_ENV"

      - name: Get fresh GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          sep='?'
          if [[ "$url" == *'?'* ]]; then sep='&'; fi
          body="$(curl -fsSL             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${url}${sep}audience=sports-projection-orchestrator")"
          token="$(jq -r '.value // empty' <<<"$body")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Sync learning dashboard to Google Sheets
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ORCH_URL: https://sports-projection-orchestrator.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/sync.json"
          http="$(curl -sS --max-time 180 --retry 1 --retry-all-errors             -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "content-type: application/json"             --data-binary @"$after_report"             -o "$body" -w "%{http_code}"             "${ORCH_URL}/api/sync-learning-dashboard")"
          echo "dashboard sync http=$http"
          cat "$body"
          test "$http" = "200"
          jq -e '.ok == true' "$body" >/dev/null

          {
            echo "## Learning population after historical backfill"
            echo "- snapshots: $(jq -r '.totals.snapshotRows' "$after_report")"
            echo "- canonical projections: $(jq -r '.totals.canonicalProjections' "$after_report")"
            echo "- graded canonical projections: $(jq -r '.totals.gradedProjections' "$after_report")"
            echo "- awaiting finals: $(jq -r '.totals.awaitingFinals' "$after_report")"
            echo "- rejected post-start: $(jq -r '.totals.rejectedPostStart' "$after_report")"
            echo "- sheet model rows: $(jq -r '.modelRows' "$body")"
            echo "- sheet audit rows: $(jq -r '.auditRows' "$body")"
            echo "- All Projections finals reconciled: $(jq -r '.allProjectionFinalsReconciled' "$body")"
          } >> "$GITHUB_STEP_SUMMARY"
