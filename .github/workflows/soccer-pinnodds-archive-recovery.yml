name: Recover soccer PinnOdds prematch archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/triggers/soccer-pinnodds-archive-recovery']
permissions:
  contents: read
concurrency:
  group: soccer-pinnodds-archive-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - name: Wait for production release
        run: node scripts/verify-deployment-sha.mjs "$GITHUB_SHA"
      - name: Recover existing capture without a paid provider pull
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/recover-soccer-pinnodds-prematch.mjs | tee artifacts/soccer-pinn-recovery.jsonl
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: soccer-pinn-recovery-${{ github.run_id }}
          path: artifacts/**
