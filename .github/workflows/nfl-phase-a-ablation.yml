name: NFL Phase A feature ablation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/nfl-phase-a-ablation.py"
      - "scripts/nfl-pro-v1-1-walkforward.py"
      - ".github/workflows/nfl-phase-a-ablation.yml"

permissions:
  contents: read
  actions: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install -q pandas numpy pyarrow scikit-learn
      - name: Restore pinned training CSV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/nfl
          EXPECTED="$(awk '/nfl_game_training_2015_2026.csv/{print $1; exit}' research/nfl/v1-1-reproduction-20261018/dataset-hashes.txt)"
          if gh run download 36968847766 -n nfl-game-training-2015-2026 -D artifacts/nfl 2>/tmp/dl.err; then
            echo "downloaded artifact"
          else
            cat /tmp/dl.err || true
            python scripts/build-nfl-training-dataset.py
          fi
          ACTUAL="$(sha256sum artifacts/nfl/nfl_game_training_2015_2026.csv | awk '{print $1}')"
          echo "expected=$EXPECTED actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Run Phase A ablation
        run: python scripts/nfl-phase-a-ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-phase-a-ablation-${{ github.run_id }}
          path: |
            artifacts/nfl-phase-a-ablation
            research/nfl/phase-a-ablation-20261018.json
          retention-days: 30
