name: KBO NPB Phase 2 controlled seed once
on:
  push:
    branches: ["codex/kbo-npb-phase2-seed-run"]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
    steps:
      - name: Require harvest auth
        run: test -n "${HARVEST_SECRET:-}"
      - name: Seed and verify September 2025
        shell: bash
        run: |
          set -euo pipefail
          call () {
            local payload="$1" body code attempt
            body="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              code="$(curl -sS --connect-timeout 5 --max-time 120 -o "$body" -w "%{http_code}"                 -X POST -H "x-harvest-secret: $HARVEST_SECRET" -H "content-type: application/json"                 -d "$payload" "$BASE/api/asian-baseball-history-backfill" || printf '000')"
              if [ "$code" = "200" ]; then cat "$body"; rm -f "$body"; return 0; fi
              echo "seed attempt $attempt HTTP $code" >&2
              cat "$body" >&2 || true
              if [[ ! "$code" =~ ^(000|429|500|502|503|504)$ ]] || [ "$attempt" -eq 8 ]; then rm -f "$body"; return 1; fi
              sleep 8
            done
          }
          call '{"league":"NPB","season":2025,"month":9,"maxRequests":1}' | tee /tmp/npb.json | jq .
          for i in 1 2 3 4 5; do
            call '{"league":"KBO","season":2025,"month":9,"maxRequests":7}' | tee /tmp/kbo.json | jq .
            [ "$(jq -r '.status // empty' /tmp/kbo.json)" = "DONE" ] && break
          done
          for spec in "NPB 2025 9" "KBO 2025 9"; do
            set -- $spec
            body="$(curl -fsS --connect-timeout 5 --max-time 30 --retry 4 --retry-delay 5 --retry-all-errors               -H "x-harvest-secret: $HARVEST_SECRET"               "$BASE/api/asian-baseball-history-backfill?league=$1&season=$2&month=$3")"
            echo "$body" | tee "/tmp/$1-report.json" | jq .
            echo "$body" | jq -e '.ok == true and .persistedGames > 0 and .completedResultCoverage == 1 and .canonicalTeamMappingCoverage == 1 and .temporalMetadataCoverage == 1' >/dev/null
          done
