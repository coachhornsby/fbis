name: CBB data-stack walk-forward

on:
  push:
    branches: [main]
    paths:
      - "functions/lib/kenpomCbb.js"
      - "functions/lib/torvikCbb.js"
      - "functions/lib/collegeApply.js"
      - "functions/lib/collegeJobsCore.js"
      - "functions/api/cbb-walkforward-source.js"
      - "scripts/cbb-data-stack-walkforward.mjs"
      - "scripts/cbb-market-edge-lab.mjs"
      - "scripts/cbb-freeze-dataset.mjs"
      - "scripts/cbb-verify-frozen-dataset.mjs"
      - "scripts/cbb-ge4-confirmation-v1.mjs"
      - "scripts/cbb-structural-confirmation-v1.mjs"
      - "scripts/cbb-build-structural-snapshots.mjs"
      - "scripts/cbb-qa-structural-snapshot.mjs"
      - "scripts/cbb-publish-structural-snapshot.mjs"
      - "functions/api/cbb-snapshot-archive.js"
      - ".github/workflows/cbb-data-stack-walkforward.yml"
  workflow_dispatch:
    inputs:
      seasons:
        description: "CBB starting seasons"
        type: string
        default: "2018,2019,2020,2021,2022,2023,2024,2025"

permissions:
  contents: read

concurrency:
  group: cbb-data-stack-walk-forward
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Wait for exact production SHA
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="https://fbis-myz.pages.dev"
          for i in $(seq 1 50); do
            BODY="$(curl -fsS --max-time 20 "$BASE/api/health" || true)"
            SHA="$(printf '%s' "$BODY" | jq -r '.deploymentCommit // .build.commit // empty' 2>/dev/null || true)"
            echo "production_sha=${SHA:-unknown} target=${TARGET_SHA}"
            if [ "$SHA" = "$TARGET_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "Production did not reach target SHA in validation window."
          exit 1

      - name: Refresh CBB source catalogs by season
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          INPUT_SEASONS: ${{ github.event.inputs.seasons }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}" || { echo "HARVEST_SECRET missing"; exit 2; }
          SEASONS="${INPUT_SEASONS:-2018,2019,2020,2021,2022,2023,2024,2025}"
          IFS="," read -ra YRS <<< "$SEASONS"
          for y in "${YRS[@]}"; do
            y="$(echo "$y" | xargs)"
            [ -n "$y" ] || continue
            echo "refresh season=$y"
            tmp="$(mktemp)"
            HTTP=$(curl -sS --max-time 240 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              -o "$tmp" -w "%{http_code}" \
              "https://fbis-myz.pages.dev/api/college?job=cbb-reference-backfill&seasons=${y}&trigger=workflow_dispatch")
            jq -c '{ok,status,job,errors:(.errors // []),report:[.d1.report[]? | {source,path,n,ok,status,reason}]}' "$tmp" || cat "$tmp"
            test "$HTTP" = "200"
            jq -e '.ok == true and .status == "success"' "$tmp" >/dev/null
            rm -f "$tmp"
            sleep 2
          done

      - name: Run leakage-safe data-stack comparison
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CBB_WF_SEASONS: ${{ github.event.inputs.seasons }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export CBB_WF_SEASONS="${CBB_WF_SEASONS:-2018,2019,2020,2021,2022,2023,2024,2025}"
          mkdir -p artifacts
          node scripts/cbb-data-stack-walkforward.mjs | tee artifacts/cbb-data-stack-run.log

      - name: Summarize comparison
        run: |
          set -euo pipefail
          FILE="artifacts/cbb-data-stack-walkforward.json"
          jq -e . "$FILE" >/dev/null
          {
            echo "## CBB data-stack walk-forward"
            echo
            echo "### Coverage"
            jq -r '.coverage[] | "- season \(.season): games=\(.games), KenPom=\(.kenpomMatched), Torvik=\(.torvikMatched), Torvik archive=\(.torvikArchive)"' "$FILE"
            echo
            echo "### Full available samples"
            jq -r '.aggregate | to_entries[] | "- \(.key): n=\(.value.n), margin MAE=\(.value.marginMae), total MAE=\(.value.totalMae), winner accuracy=\(.value.winnerAccuracy)%"' "$FILE"
            echo
            echo "### Fair KenPom incremental sample"
            jq -r '.fairComparison.kenpomIncremental | to_entries[] | "- \(.key): n=\(.value.n), margin MAE=\(.value.marginMae), total MAE=\(.value.totalMae), winner accuracy=\(.value.winnerAccuracy)%"' "$FILE"
            echo
            echo "### Three-way overlap"
            jq -r '.fairComparison.threeWayOverlap | to_entries[] | "- \(.key): n=\(.value.n), margin MAE=\(.value.marginMae), total MAE=\(.value.totalMae), winner accuracy=\(.value.winnerAccuracy)%"' "$FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run market-residual edge lab
        continue-on-error: true
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          node scripts/cbb-market-edge-lab.mjs artifacts/cbb-data-stack-predictions.json | tee artifacts/cbb-market-edge-run.log

      - name: Freeze enriched historical dataset
        if: always() && hashFiles('artifacts/cbb-market-research-dataset.json') != ''
        env:
          CBB_DATASET_VERSION: cbb-enriched-v2026.10.02
        run: |
          node scripts/cbb-freeze-dataset.mjs artifacts/cbb-market-research-dataset.json
          node scripts/cbb-verify-frozen-dataset.mjs artifacts/frozen/$CBB_DATASET_VERSION

      - name: Build pregame structural snapshots
        if: always() && hashFiles('artifacts/cbb-market-research-dataset.json') != ''
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          node scripts/cbb-build-structural-snapshots.mjs artifacts/cbb-market-research-dataset.json | tee artifacts/cbb-structural-build-run.log

      - name: QA structural snapshot
        if: always() && hashFiles('artifacts/cbb-structural-dataset.json') != ''
        run: |
          set -euo pipefail
          node scripts/cbb-qa-structural-snapshot.mjs artifacts/cbb-structural-dataset.json | tee artifacts/cbb-structural-qa-run.log

      - name: Publish immutable structural snapshot
        if: success() && hashFiles('artifacts/cbb-structural-dataset.json') != ''
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CBB_SNAPSHOT_VERSION: cbb-structural-historical-v2026.10.03-r${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/cbb-publish-structural-snapshot.mjs artifacts/cbb-structural-dataset.json | tee artifacts/cbb-structural-publish-run.log

      - name: Run >=4 confirmation test against frozen dataset
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cbb-ge4-confirmation-v1.mjs artifacts/frozen/cbb-enriched-v2026.10.02 | tee artifacts/cbb-ge4-confirmation-v1-run.log

      - name: Run structural confirmation audit
        if: success() && hashFiles('artifacts/cbb-structural-dataset.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          CBB_SNAPSHOT_VERSION="cbb-structural-historical-v2026.10.03-r${{ github.run_id }}" node scripts/cbb-structural-confirmation-v1.mjs artifacts/cbb-structural-dataset.json | tee artifacts/cbb-structural-confirmation-v1-run.log

      - name: Run combined CBB tier test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cbb-combined-tiers-v1.mjs artifacts/frozen/cbb-enriched-v2026.10.02 | tee artifacts/cbb-combined-tiers-v1-run.log

      - name: Run sub-4 CBB expansion study
        run: node scripts/cbb-sub4-expansion.mjs artifacts/cbb-market-research-dataset.json | tee artifacts/cbb-sub4-expansion-run.log

      - name: Summarize market edge research
        if: always() && hashFiles('artifacts/cbb-market-edge-lab.json') != ''
        run: |
          set -euo pipefail
          FILE="artifacts/cbb-market-edge-lab.json"
          jq -e '.ok == true and .joinedRows > 0' "$FILE" >/dev/null
          {
            echo
            echo "## CBB market-residual research"
            echo
            jq -r '"- joined market games: \(.joinedRows) / source \(.sourceRows)"' "$FILE"
            jq -r '"- spread orientation check: \(.marketAudit.spreadOrientationConsistency)"' "$FILE"
            echo
            echo "### Untouched holdout aggregate"
            jq -r '.aggregateHoldout | to_entries[] | "- \(.key): n=\(.value.n), win=\(.value.winPct)%, units=\(.value.units), ROI=\(.value.roi)%, assumed price=\(.value.assumedPricePct)%"' "$FILE"
            echo
            echo "### Fold-selected specifications"
            jq -r '.folds[] | "- test \(.testSeason): side=\(.side.spec.family // "none") λ=\(.side.spec.lambda // "na") threshold=\(.side.spec.threshold // "na"); total=\(.total.spec.family // "none") λ=\(.total.spec.lambda // "na") threshold=\(.total.spec.threshold // "na")"' "$FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cbb-data-stack-walk-forward
          path: artifacts/
          if-no-files-found: error
          retention-days: 90