name: WNBA possession-shot ablation resume
# activation-touch: 2026-10-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wnba-possession-shot-ablation-resume.yml"
      - "scripts/wnba-possession-ablation.mjs"
      - ".github/workflows/wnba-possession-shot-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnba-possession-shot-ablation-resume
  cancel-in-progress: true

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: "37420822041"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Restore immutable completed shards from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/chunks artifacts/pbp artifacts/stints artifacts/merged
          chunks="2024-05 2024-06 2024-07 2024-08 2024-09 2024-10 2025-05 2025-06 2025-07 2025-08 2025-09 2025-10 2026-05 2026-06 2026-07 2026-08 2026-09 2026-10"
          for id in $chunks; do
            base="research/wnba/possession-shot/v1/run-${SOURCE_RUN_ID}/shards/${id}"
            mkdir -p "artifacts/chunks/${id}"
            npx wrangler r2 object get "fbis-archive/${base}/wnba-canonical-${id}.jsonl" --file "artifacts/chunks/${id}/wnba-canonical-${id}.jsonl" --remote
            npx wrangler r2 object get "fbis-archive/${base}/wnba-pbp-${id}.jsonl" --file "artifacts/pbp/wnba-pbp-${id}.jsonl" --remote
            npx wrangler r2 object get "fbis-archive/${base}/wnba-lineup-stints-${id}.jsonl" --file "artifacts/stints/wnba-lineup-stints-${id}.jsonl" --remote
          done

      - name: Rebuild merged canonical state from frozen shards
        run: |
          set -euo pipefail
          node scripts/wnba-merge-canonical.mjs artifacts/chunks artifacts/merged/wnba-canonical.jsonl
          node scripts/wnba-merge-pbp.mjs artifacts/pbp artifacts/merged/wnba-pbp.jsonl
          node scripts/wnba-merge-lineup-stints.mjs artifacts/stints artifacts/merged/wnba-lineup-stints.jsonl
          node scripts/wnba-possession-state-build.mjs             games=artifacts/merged/wnba-canonical.jsonl             pbp=artifacts/merged/wnba-pbp.jsonl             out=artifacts/merged/wnba-possession-state.jsonl             shots=artifacts/merged/wnba-shot-events.jsonl             profiles=artifacts/merged/wnba-shot-profiles.jsonl
          node scripts/wnba-possession-qa.mjs             games=artifacts/merged/wnba-canonical.jsonl             pbp=artifacts/merged/wnba-pbp.jsonl             states=artifacts/merged/wnba-possession-state.jsonl             stints=artifacts/merged/wnba-lineup-stints.jsonl             out=artifacts/merged/wnba-possession-qa.json

      - name: Enforce QA gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('artifacts/merged/wnba-possession-qa.json','utf8'));
          console.log(JSON.stringify({games:q.games,coverage:q.coverage,gates:q.gates,shooting:q.shooting,lineup:q.lineup,state:q.state},null,2));
          const required=["pbpCoveragePass","possessionCoveragePass","zoneResolutionPass","gameStateCoveragePass"];
          for(const k of required) if(!q.gates?.[k]) throw new Error("QA gate failed: "+k);
          NODE

      - name: Run linear-time chronological ablation
        run: |
          time node scripts/wnba-possession-ablation.mjs             games=artifacts/merged/wnba-canonical.jsonl             states=artifacts/merged/wnba-possession-state.jsonl             stints=artifacts/merged/wnba-lineup-stints.jsonl             out=artifacts/merged/wnba-possession-ablation.json             rows=artifacts/merged/wnba-possession-ablation-rows.jsonl
          cat artifacts/merged/wnba-possession-ablation.json

      - name: Freeze repaired merged checkpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          IMM="research/wnba/possession-shot/v1/run-${GITHUB_RUN_ID}/merged-linear"
          CUR="models/wnba/possession-shot/research-current"
          for f in artifacts/merged/*; do
            [ -f "$f" ] || continue
            n="$(basename "$f")"
            npx wrangler r2 object put "fbis-archive/${IMM}/${n}" --file "$f" --remote
            npx wrangler r2 object put "fbis-archive/${CUR}/${n}" --file "$f" --remote
          done
          printf '{"sourceShardRunId":"%s","resumeRunId":%s,"immutablePrefix":"%s","updatedAt":"%s","ablationMode":"linear-time"}\n'             "${SOURCE_RUN_ID}" "${GITHUB_RUN_ID}" "${IMM}" "$(date -u +%FT%TZ)" > artifacts/merged/pointer.json
          npx wrangler r2 object put "fbis-archive/${CUR}/pointer.json" --file artifacts/merged/pointer.json --remote

      - uses: actions/upload-artifact@v6
        with:
          name: wnba-possession-ablation-resume-${{ github.run_id }}
          path: artifacts/merged/
          retention-days: 90
