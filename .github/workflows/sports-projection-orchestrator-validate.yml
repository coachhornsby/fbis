name: Sports Projection Orchestrator Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sports-projection-orchestrator-validate.yml"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: VALIDATE RENDER ORCHESTRATOR
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          sep='?'
          if [[ "$url" == *'?'* ]]; then sep='&'; fi
          body="$(curl -fsSL             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${url}${sep}audience=sports-projection-orchestrator")"
          token="$(jq -r '.value // empty' <<<"$body")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Validate model providers
        id: models
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ORCH_URL: https://sports-projection-orchestrator.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          http="$(curl -sS --max-time 180 --retry 1 --retry-all-errors             -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "content-type: application/json"             -o "$body" -w "%{http_code}"             "${ORCH_URL}/api/validate/models")"
          echo "HTTP=$http"
          cat "$body"
          test "$http" = "200"
          jq -e '.openai.projection.identity.projection_id | length > 0' "$body" >/dev/null
          jq -e '.gemini.projection.identity.projection_id | length > 0' "$body" >/dev/null
          jq -e '.persisted == false' "$body" >/dev/null

      - name: Validate Sheets credential state
        id: sheets
        if: always()
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ORCH_URL: https://sports-projection-orchestrator.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          http="$(curl -sS --max-time 60             -H "Authorization: Bearer ${OIDC_TOKEN}"             -o "$body" -w "%{http_code}"             "${ORCH_URL}/api/validate/sheets")"
          echo "HTTP=$http"
          cat "$body"
          test "$http" = "200"
          jq -e '.ok == true' "$body" >/dev/null

      - name: Wait for FBIS feature digest deployment
        env:
          BASE: https://fbis-myz.pages.dev
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)" || true)"
            live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$body" 2>/dev/null | tr 'A-F' 'a-f')"
            expected="$(echo "$EXPECTED_SHA" | tr 'A-F' 'a-f')"
            echo "feature-deploy attempt=$attempt http=$code live=$live expected=$expected"
            if [ "$code" = "200" ] && [ "$live" = "$expected" ]; then exit 0; fi
            sleep 12
          done
          echo "FBIS production did not reach feature-digest SHA."
          exit 1

      - name: Validate selective candidate gate
        id: selector
        if: always()
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ORCH_URL: https://sports-projection-orchestrator.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          http="$(curl -sS --max-time 180             -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "content-type: application/json"             -d '{"dryRun":true}'             -o "$body" -w "%{http_code}"             "${ORCH_URL}/api/select-candidates")"
          echo "HTTP=$http"
          cat "$body"
          test "$http" = "200"
          jq -e '.ok == true' "$body" >/dev/null
          jq -e '.selected <= 5' "$body" >/dev/null
          jq -e '.eligible >= .selected' "$body" >/dev/null
          jq -e '.dailyCap == 8' "$body" >/dev/null

      - name: Final validation gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "models_outcome=${{ steps.models.outcome }}"
          echo "sheets_outcome=${{ steps.sheets.outcome }}"
          echo "selector_outcome=${{ steps.selector.outcome }}"
          test "${{ steps.models.outcome }}" = "success"
          test "${{ steps.sheets.outcome }}" = "success"
          test "${{ steps.selector.outcome }}" = "success"
