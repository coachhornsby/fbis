name: Soccer canonical history ingest

on:
  schedule:
    - cron: "15 10 * * *"
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental or bootstrap"
        required: false
        default: "incremental"

permissions:
  contents: read

concurrency:
  group: soccer-canonical-history
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          run=false
          mode=incremental

          if [ "$EVENT_NAME" = "schedule" ]; then
            hour="$(TZ=America/Chicago date +%H)"
            [ "$hour" = "05" ] && run=true
            mode=incremental
          else
            run=true
            mode="${INPUT_MODE:-incremental}"
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  ingest:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        league: ["eng.1","esp.1","ger.1","ita.1","fra.1","usa.1","usa.nwsl"]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Ingest bounded monthly chunks
        env:
          BASE: https://fbis-myz.pages.dev
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          LEAGUE: ${{ matrix.league }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"

          today="$(TZ=America/Chicago date +%F)"
          if [ "$MODE" = "bootstrap" ]; then
            case "$LEAGUE" in
              usa.1|usa.nwsl) start="2025-02-01" ;;
              *) start="2025-08-01" ;;
            esac
          else
            start="$(TZ=America/Chicago date -d '4 days ago' +%F)"
          fi

          if [ "$MODE" = "incremental" ]; then
            export SOCCER_ADVANCED=1
            export SOCCER_ADVANCED_MAX=12
          else
            export SOCCER_ADVANCED=0
            export SOCCER_ADVANCED_MAX=0
          fi

          cursor="$start"
          while [ "$cursor" < "$today" ] || [ "$cursor" = "$today" ]; do
            month_end="$(date -u -d "$cursor +1 month -1 day" +%F)"
            if [ "$month_end" > "$today" ]; then month_end="$today"; fi

            payload="$(mktemp)"
            node scripts/soccer-backfill-payload.mjs "$cursor" "$month_end" "$LEAGUE" > "$payload"
            games="$(jq '.games|length' "$payload")"
            echo "league=$LEAGUE range=$cursor..$month_end games=$games"

            if [ "$games" -gt 0 ]; then
              offset=0
              while [ "$offset" -lt "$games" ]; do
                chunk="$(mktemp)"; out="$(mktemp)"
                jq --argjson offset "$offset" '. as $r | $r + {games: $r.games[$offset:($offset+25)]}' "$payload" > "$chunk"
                code="$(curl -sS --connect-timeout 5 --max-time 25 --retry 2 --retry-delay 2 --retry-all-errors                   -X POST -H "x-harvest-secret: $HARVEST_SECRET" -H "content-type: application/json"                   --data-binary "@$chunk" -o "$out" -w "%{http_code}" "$BASE/api/soccer-form-backfill")"
                cat "$out"; echo
                test "$code" = "200"
                jq -e '.ok == true and .failed == 0' "$out" >/dev/null
                offset=$((offset+25))
                rm -f "$chunk" "$out"
              done
            fi

            rm -f "$payload"
            [ "$month_end" = "$today" ] && break
            cursor="$(date -u -d "$month_end +1 day" +%F)"
          done
