name: Soccer form backfill
on:
  push:
    branches: [main]
    paths:
      - "functions/lib/soccerFbisV1.js"
      - "functions/api/soccer-form-backfill.js"
      - "functions/lib/slateEngineCore.js"
      - "functions/lib/slateEngine.js"
      - ".github/workflows/soccer-form-backfill.yml"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Wait for production SHA
        env:
          BASE: https://fbis-myz.pages.dev
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            live="$(curl -sS --max-time 15 "$BASE/api/health?_t=$(date +%s)" | jq -r '.deploymentCommit // .build.commitSha // empty' | tr 'A-F' 'a-f')"
            exp="$(echo "$EXPECTED" | tr 'A-F' 'a-f')"
            echo "deployment check $i live=$live expected=$exp"
            [ "$live" = "$exp" ] && exit 0
            sleep 15
          done
          exit 1
      - name: Backfill prior and current soccer team form
        env:
          BASE: https://fbis-myz.pages.dev
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CHUNK_SIZE: "50"
        run: |
          set -euo pipefail
          for range in "2025-08-01 2026-06-15" "2026-07-15 2026-10-01"; do
            set -- $range
            payload="$(mktemp)"
            node scripts/soccer-backfill-payload.mjs "$1" "$2" > "$payload"
            games="$(jq '.games|length' "$payload")"
            echo "soccer runner payload $1..$2 games=$games chunk_size=$CHUNK_SIZE"
            test "$games" -gt 0

            chunks=$(( (games + CHUNK_SIZE - 1) / CHUNK_SIZE ))
            for ((i=0; i<chunks; i++)); do
              offset=$(( i * CHUNK_SIZE ))
              chunk="$(mktemp)"
              out="$(mktemp)"
              jq --argjson offset "$offset" --argjson size "$CHUNK_SIZE"                 '. as $root | $root + {games: $root.games[$offset:($offset + $size)]}'                 "$payload" > "$chunk"
              chunk_games="$(jq '.games|length' "$chunk")"
              echo "soccer backfill $1..$2 chunk=$((i+1))/$chunks games=$chunk_games"
              code="$(curl -sS --max-time 90 --retry 2 --retry-all-errors                 -X POST -H "x-harvest-secret: $HARVEST_SECRET" -H "content-type: application/json"                 --data-binary "@$chunk" -o "$out" -w "%{http_code}" "$BASE/api/soccer-form-backfill")"
              echo "soccer backfill $1..$2 chunk=$((i+1))/$chunks http=$code"
              cat "$out"; echo
              test "$code" = "200"
              jq -e '.ok == true and .source == "trusted-runner-payload" and .finals > 0 and .failed == 0' "$out" >/dev/null
              rm -f "$chunk" "$out"
            done
            rm -f "$payload"
          done
