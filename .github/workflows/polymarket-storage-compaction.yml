name: Polymarket verified payload storage compaction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ops/triggers/polymarket-storage-compaction]
permissions:
  contents: read
concurrency:
  group: fbis-polymarket-payload-compaction
  # Each row is compare-and-swap and replayable; supersede obsolete migration code.
  cancel-in-progress: true
jobs:
  compact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Validate 5,000-row bounded migration budget
        run: node --test test/storage-compaction-budget.test.mjs
      - name: Wait for validated production deployment
        env:
          VERIFY_MAX_ATTEMPTS: '150'
        run: node scripts/verify-deployment-sha.mjs "$GITHUB_SHA"
      - name: Compact only source receipts already archived and hash verified
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          COMPACTION_APPLY: 'true'
          COMPACTION_MAX_ROWS: '5000'
          COMPACTION_START_ROWID: '509110'
          COMPACTION_CUTOFF: '2026-10-15T19:00:00Z'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/compact-polymarket-storage-runner.mjs
      - name: Publish bounded migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: polymarket-storage-result
          path: /tmp/fbis-polymarket-storage-result.json
          if-no-files-found: ignore
