name: Polymarket verified payload storage compaction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ops/triggers/polymarket-storage-compaction]
permissions:
  contents: read
concurrency:
  group: fbis-polymarket-payload-compaction
  # Each row is compare-and-swap and replayable; supersede obsolete migration code.
  cancel-in-progress: true
jobs:
  compact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - name: Wait for validated production deployment
        env:
          VERIFY_MAX_ATTEMPTS: '150'
        run: node scripts/verify-deployment-sha.mjs "$GITHUB_SHA"
      - name: Compact only source receipts already archived and hash verified
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          COMPACTION_APPLY: 'true'
          COMPACTION_MAX_ROWS: '500000'
        run: node scripts/compact-polymarket-storage.mjs
      - name: Publish bounded migration evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: polymarket-storage-result
          path: /tmp/fbis-polymarket-storage-result.json
          if-no-files-found: ignore

  soccer-recovery:
    needs: compact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
      SOCCER_PINN_SNAPSHOT_ID: pinnodds-20261015-12-full-board-1-prematch
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - name: Replay existing soccer capture after database recovery
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/recover-soccer-pinnodds-prematch.mjs | tee artifacts/soccer-pinn-recovery.jsonl
      - name: Reconcile source identities without changing quote clocks
        run: |
          set -euo pipefail
          cursor=''
          for page in $(seq 1 100); do
            body=$(jq -nc --arg cursor "$cursor" '{cursor:$cursor}')
            curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --max-time 100 -H "x-harvest-secret: $HARVEST_SECRET" -H 'content-type: application/json' -d "$body" "$BASE/api/soccer-market-reconcile" > "artifacts/page-$page.json"
            jq -c '{ok,examined,matched,inserted,nextCursor,reasons,originalClocksPreserved,paidProviderCalls}' "artifacts/page-$page.json"
            jq -e '.ok and .originalClocksPreserved and .paidProviderCalls==0' "artifacts/page-$page.json" >/dev/null
            cursor=$(jq -r '.nextCursor // empty' "artifacts/page-$page.json")
            [ -n "$cursor" ] || break
          done
          [ -z "$cursor" ] || { echo 'Reconciliation page budget exhausted'; exit 1; }
      - name: Verify soccer shadow records and source delivery
        run: |
          set -euo pipefail
          day=$(TZ=America/Chicago date -d '+2 days' +%F)
          for league in ger.1 fra.1 esp.1; do
            curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --max-time 120 -H "x-harvest-secret: $HARVEST_SECRET" "$BASE/api/soccer-prospective-shadow?mode=snapshot&competition=$league&date=$day" > "artifacts/shadow-$league.json"
            jq -e '.ok and .researchOnly and (.canQualify==false) and (.canAuthorize==false)' "artifacts/shadow-$league.json"
          done
          tomorrow=$(TZ=America/Chicago date -d '+1 day' +%F)
          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --max-time 120 "$BASE/api/slate?sport=soccer&date=$tomorrow" > artifacts/soccer-board.json
          jq '{games:(.games|length),sourceOffers:[.games[].market.venueOffers[]?.source]|group_by(.)|map({source:.[0],offers:length})}' artifacts/soccer-board.json
          curl -fsS --max-time 30 https://fbis-polymarket-us-stream.coachhornsby.workers.dev/health > artifacts/stream-health.json
          jq -e '.ok and .operational and .connected' artifacts/stream-health.json
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: soccer-post-storage-${{ github.run_id }}
          path: artifacts/**
