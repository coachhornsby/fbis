name: FBIS model learning cycle

on:
  schedule:
    # 05:30 America/Chicago across DST; local gate prevents duplicate execution.
    - cron: "30 10 * * 1"
    - cron: "30 11 * * 1"
  workflow_dispatch:

concurrency:
  group: fbis-model-learning-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: WEEKLY MODEL LEARNING
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate to Monday 05:30 America/Chicago
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dow="$(TZ=America/Chicago date +%u)"
          hour="$(TZ=America/Chicago date +%H)"
          if [ "$dow" = "1" ] && [ "$hour" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No-op twin UTC schedule; local dow=$dow hour=$hour"
          fi

      - name: Require research secret
        if: steps.gate.outputs.run == 'true'
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: test -n "${HARVEST_SECRET:-}"

      - name: Run CFB temporal validation
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          out="artifacts/model-learning-cfb.json"
          http="$(curl -sS --max-time 180 --retry 1             -H "x-harvest-secret: ${HARVEST_SECRET}"             -H "accept: application/json"             -o "$out" -w "%{http_code}"             "$BASE/api/college?job=model-train-validate&sport=cfb&referenceModelId=CFB-FBIS-v2&trigger=schedule")"
          echo "CFB learning http=$http"
          cat "$out"
          test "$http" = "200"
          jq -e '.ok == true and .job == "model-train-validate" and .d1.bound == true and .d1.sport == "cfb"' "$out" >/dev/null

      - name: Run CBB temporal validation
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          out="artifacts/model-learning-cbb.json"
          http="$(curl -sS --max-time 180 --retry 1             -H "x-harvest-secret: ${HARVEST_SECRET}"             -H "accept: application/json"             -o "$out" -w "%{http_code}"             "$BASE/api/college?job=model-train-validate&sport=cbb&referenceModelId=CBB-PINNACLE-IMPLIED&trigger=schedule")"
          echo "CBB learning http=$http"
          cat "$out"
          test "$http" = "200"
          jq -e '.ok == true and .job == "model-train-validate" and .d1.bound == true and .d1.sport == "cbb"' "$out" >/dev/null

      - name: Analyze CFB drift and error slices
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          out="artifacts/model-findings-cfb.json"
          http="$(curl -sS --max-time 180 --retry 1 -H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json" -o "$out" -w "%{http_code}" "$BASE/api/college?job=model-learn-analyze&sport=cfb&referenceModelId=CFB-FBIS-v2&trigger=schedule")"
          echo "CFB findings http=$http"
          cat "$out"
          test "$http" = "200"
          jq -e '.ok == true and .job == "model-learn-analyze" and .d1.bound == true and .d1.sport == "cfb"' "$out" >/dev/null

      - name: Analyze CBB drift and error slices
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          out="artifacts/model-findings-cbb.json"
          http="$(curl -sS --max-time 180 --retry 1 -H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json" -o "$out" -w "%{http_code}" "$BASE/api/college?job=model-learn-analyze&sport=cbb&referenceModelId=CBB-PINNACLE-IMPLIED&trigger=schedule")"
          echo "CBB findings http=$http"
          cat "$out"
          test "$http" = "200"
          jq -e '.ok == true and .job == "model-learn-analyze" and .d1.bound == true and .d1.sport == "cbb"' "$out" >/dev/null

      - name: Run sample-gated continuous learning governance across all sports
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for sport in mlb nfl cfb cbb nba wnba nhl soccer; do
            out="artifacts/model-learning-core-${sport}.json"
            http="$(curl -sS --max-time 180 --retry 1 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              -o "$out" -w "%{http_code}" \
              "$BASE/api/continuous-learning?sport=${sport}&recentN=50")"
            echo "${sport^^} canonical learning http=$http"
            cat "$out"
            test "$http" = "200"
            jq -e --arg sport "$sport" '
              .ok == true and
              .sport == $sport and
              .source == "prediction_snapshots" and
              .governance.tier2 == "SAMPLE_COUNT_GATED_RECALIBRATION" and
              .governance.autoPromote == false and
              .governance.productionOnlineLearning == false
            ' "$out" >/dev/null
          done

      - name: Evaluate executed-bet feedback population
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl -fsS --max-time 60 -H "x-harvest-secret: ${HARVEST_SECRET}" \
            "${BASE}/api/bet-learning" > artifacts/model-learning-executed-bets.json
          jq -e '.ok == true and .governance.autoTrain == false and .governance.autoPromote == false' artifacts/model-learning-executed-bets.json >/dev/null

      - name: Build learning summary
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          {
            echo "## FBIS weekly model learning"
            echo ""
            echo "### Canonical continuous-learning governance"
            for sport in mlb nfl cfb cbb nba wnba nhl soccer; do
              file="artifacts/model-learning-core-${sport}.json"
              echo "#### ${sport^^}"
              echo "- source rows: $(jq -r '.queriedRows' "$file")"
              echo "- canonical graded games: $(jq -r '.canonicalRows' "$file")"
              echo "- models evaluated: $(jq -r '.models | length' "$file")"
              echo "- tier-1 alerts: $(jq '[.models[].monitoring.alerts[]?] | length' "$file")"
              echo "- recalibration fits: $(jq '[.models[] | select(.recalibration.status=="FIT")] | length' "$file")"
              echo "- manual-promotion eligible: $(jq '[.models[] | select(.recalibration.tier3.gate.passes==true)] | length' "$file")"
              echo "- tier-5 state: $(jq -r '.tier5.status' "$file")"
              jq -r '.models[]? | "- \(.modelId): n=\(.monitoring.observedN), brier=\(.monitoring.metrics.probability.brier // "NA"), margin_MAE=\(.monitoring.metrics.score.margin.mae // "NA"), recalibration=\(.recalibration.status // "NA")"' "$file"
              echo ""
            done
            echo "### College challenger validation"
            for sport in cfb cbb; do
              file="artifacts/model-learning-${sport}.json"
              findings="artifacts/model-findings-${sport}.json"
              echo "#### ${sport^^}"
              echo "- reference: $(jq -r '.d1.referenceModelId // "none"' "$file")"
              echo "- models evaluated: $(jq -r '.d1.validation | length' "$file")"
              echo "- paired comparisons: $(jq -r '.d1.paired | length' "$file")"
              echo "- learning findings: $(jq -r '.d1.findings | length' "$findings")"
              jq -r '.d1.validation[]? | "- \(.modelId): n=\(.metrics.n), seasons=\(.metrics.seasons), total_MAE=\(.metrics.total.mae // "NA"), margin_MAE=\(.metrics.margin.mae // "NA"), brier=\(.metrics.probability.brier // "NA"), leakage=\(.leakageOk)"' "$file"
              echo ""
            done
            echo "Continuous learning is sample-count gated. Tier 5 is shadow-only. No automatic model promotion or wager-authority change."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload learning evidence
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: fbis-model-learning-${{ github.run_id }}
          path: |
            artifacts/model-learning-*.json
            artifacts/model-findings-*.json
            artifacts/model-learning-executed-bets.json
          if-no-files-found: error
          retention-days: 90
