name: MLB player intelligence
on:
  push:
    branches: [main]
    paths: [ops/triggers/mlb-intelligence-proof]
  workflow_dispatch:
    inputs:
      start:
        description: First official date (YYYY-MM-DD); blank uses yesterday
        default: ''
      end:
        description: Last date, max seven days per batch
        default: ''
      gameId:
        description: Optional official game ID for correction/retry
        default: ''
      limit:
        description: Max final games (1-40)
        default: '40'
  schedule:
    - cron: '20 12 * * *'
permissions:
  contents: read
concurrency:
  group: mlb-player-intelligence-ingest
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/mlb-player-intelligence.test.js
      - name: Archive official feeds and import compact versioned game records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          GAME_ID: ${{ github.event_name == 'push' && '813071' || inputs.gameId }}
          LIMIT: ${{ inputs.limit || '40' }}
        run: node scripts/mlb-player-intelligence-collect.mjs "start=$START" "end=$END" "gameId=$GAME_ID" "limit=$LIMIT" persist=true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mlb-player-intelligence-${{ github.run_id }}
          path: artifacts/mlb-intelligence/receipt.json
          retention-days: 90
