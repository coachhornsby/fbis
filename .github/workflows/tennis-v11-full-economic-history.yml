name: Tennis v1.1 full historical economic export

on:
  pull_request:
    paths:
      - "scripts/tennis-v11-economic-export-2018-2019.mjs"
      - "functions/lib/tennisTwoSidedV11.js"
      - "functions/lib/tennisFbisV1.js"
      - ".github/workflows/tennis-v11-full-economic-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TENNIS_ECON_EXPORT_SIMS: "500"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export strict 2018-2019 deep holdout
        run: node scripts/tennis-v11-economic-export-2018-2019.mjs
      - name: Verify temporal integrity
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("artifacts/tennis-v11-economic-2018-2019-summary.json","utf8"));
          if(r.design?.futureLeakage!==false) throw new Error("future leakage guard missing");
          if(r.design?.eventFreeze!==true) throw new Error("event freeze missing");
          if((r.sample?.holdout||0)<5000) throw new Error("insufficient holdout");
          if(!Number.isFinite(r.predictive?.calibrated?.brier)) throw new Error("missing calibrated brier");
          console.log(JSON.stringify(r,null,2));
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: tennis-v11-economic-2018-2019
          path: |
            artifacts/tennis-v11-economic-2018-2019.jsonl
            artifacts/tennis-v11-economic-2018-2019-summary.json
          retention-days: 30
