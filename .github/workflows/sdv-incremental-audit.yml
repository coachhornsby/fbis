name: SportsDataverse incremental acquisition audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sdv-incremental-acquisition.py"
      - ".github/workflows/sdv-incremental-audit.yml"
  schedule:
    - cron: "35 11 * * *"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install SportsDataverse
        run: pip install --disable-pip-version-check sportsdataverse
      - name: Probe incremental families
        run: python scripts/sdv-incremental-acquisition.py
      - name: Enforce no duplicate upstream acquisition
        run: |
          node scripts/data-stack-audit.mjs > artifacts/data-stack-audit.log
          node -e 'const r=require("./artifacts/data-stack-audit.json"); if(!r.ok) process.exit(1)'
      - uses: actions/upload-artifact@v4
        with:
          name: sdv-incremental-audit-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
