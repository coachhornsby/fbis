name: CFB CFBD provider-line enrichment
on:
  push:
    branches: ["research/cfb-bulk-history-v3"]
    paths:
      - "scripts/cfb-cfbd-market-enrichment.mjs"
      - ".github/workflows/cfb-cfbd-market-enrichment.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Pull all available CFBD provider lines 2004-2026
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE: https://fbis-myz.pages.dev
          CFB_MARKET_START: "2004"
          CFB_MARKET_END: "2026"
        run: node scripts/cfb-cfbd-market-enrichment.mjs
      - run: cat artifacts/cfb-history-v3/cfbd_market_qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-cfbd-market-history
          path: artifacts/cfb-history-v3/*
          if-no-files-found: error
          retention-days: 90
