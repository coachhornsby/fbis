name: Sport simulation research contract
on:
  pull_request:
    paths:
      - 'functions/lib/sportSimulationResearch.js'
      - 'test/sport-simulation-research.test.js'
      - 'test/sport-accountability.test.js'
      - 'test/sport-shadow-generators.test.js'
      - 'functions/lib/sportAccountability.js'
      - 'functions/lib/sportShadowGenerators.js'
      - 'functions/api/simulation-intelligence.js'
      - 'src/features/modelLab/**'
      - 'src/App.jsx'
      - '.github/workflows/sport-simulation-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Research contract tests (no secrets or production bindings)
        run: node --test test/sport-simulation-research.test.js test/sport-accountability.test.js test/sport-shadow-generators.test.js
