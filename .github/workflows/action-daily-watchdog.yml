name: ACTION daily watchdog

on:
  schedule:
    # GitHub cron can arrive late. These two DST anchors are safe because the
    # daily API is idempotent and the watchdog first reads persisted state.
    - cron: "15 14 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:

concurrency:
  group: action-daily-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    name: ACTION DAILY WATCHDOG
    runs-on: ubuntu-latest
    steps:
      - name: Require operator secret
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: test -n "${HARVEST_SECRET:-}"

      - name: Inspect current daily state
        id: inspect
        env:
          BASE: "https://fbis-myz.pages.dev"
        run: |
          set -euo pipefail
          body="$(mktemp)"
          http="$(curl -sS --max-time 30 --retry 0 -o "$body" -w "%{http_code}" "$BASE/api/action-daily-status")"
          echo "STATUS http=$http"
          cat "$body"
          test "$http" = "200"
          jq -e . "$body" >/dev/null
          state="$(jq -r '.state // empty' "$body")"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          case "$state" in
            HEALTHY) echo "ACTION daily already verified healthy." ;;
            MISSING|RUNNING|STALE|DEGRADED) echo "Recoverable watchdog state=$state" ;;
            FAILED|UNAVAILABLE|"") echo "Terminal watchdog state=$state"; exit 1 ;;
            *) echo "Unexpected watchdog state=$state"; exit 1 ;;
          esac

      - name: Start missing or degraded daily run
        if: steps.inspect.outputs.state == 'MISSING' || steps.inspect.outputs.state == 'DEGRADED'
        id: start_missing
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          http="$(curl -sS --max-time 30 --retry 0 -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -d '{"mode":"start"}' -o "$body" -w "%{http_code}" \
            "$BASE/api/action-daily-async?mode=start")"
          echo "START http=$http"
          cat "$body"
          test "$http" = "202" -o "$http" = "200"
          jq -e '.ok == true' "$body" >/dev/null
          status="$(jq -r '.status // empty' "$body")"
          case "$status" in
            started_daily|actor_running|already_collected_today) ;;
            no_slate)
              echo "no_slate=true" >> "$GITHUB_OUTPUT"
              echo "No slate today; watchdog has nothing to collect."
              exit 0
              ;;
            *) echo "Unexpected START status=$status"; exit 1 ;;
          esac

      - name: Resume harvest without starting another paid run
        if: steps.inspect.outputs.state != 'HEALTHY' && steps.start_missing.outputs.no_slate != 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(mktemp)"
            set +e
            http="$(curl -sS --max-time 45 --retry 0 -X POST \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "content-type: application/json" \
              -d '{"mode":"harvest"}' -o "$body" -w "%{http_code}" \
              "$BASE/api/action-daily-async?mode=harvest")"
            curl_ec=$?
            set -e
            echo "HARVEST attempt=${attempt} http=${http} curl_ec=${curl_ec}"
            cat "$body" || true
            status="$(jq -r '.status // empty' "$body" 2>/dev/null || true)"
            if [ "$curl_ec" -eq 0 ] && [ "$http" = "200" ] && { [ "$status" = "success_daily" ] || [ "$status" = "already_collected_today" ]; }; then exit 0; fi
            if [ "$curl_ec" -eq 0 ] && [ "$http" = "202" ] && [ "$status" = "harvest_partial" ]; then
              echo "ACTION harvest persisted a bounded chunk; resuming remaining rows."
              sleep 3
              continue
            fi
            if { [ "$curl_ec" -eq 0 ] && [ "$http" = "202" ] && [ "$status" = "actor_running" ]; } || [ "$curl_ec" -eq 28 ]; then
              echo "ACTION Actor still running/transient timeout; retrying."
              sleep 30
              continue
            fi
            echo "Watchdog harvest failed status=$status http=$http"
            exit 1
          done
          echo "Watchdog did not reach terminal harvest state; no second paid run was started."
          exit 1

      - name: Verify persisted state and slate coverage
        if: steps.start_missing.outputs.no_slate != 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(mktemp)"
            http="$(curl -sS --max-time 30 --retry 0 -o "$body" -w "%{http_code}" "$BASE/api/action-daily-status")"
            echo "VERIFY attempt=${attempt} http=${http}"
            cat "$body"
            if [ "$http" != "200" ]; then sleep 15; continue; fi
            jq -e . "$body" >/dev/null
            state="$(jq -r '.state // empty' "$body")"
            verified="$(jq -r '.verifiedPersisted // false' "$body")"
            covered="$(jq -r '.verifiedSlateCoverage // false' "$body")"
            if [ "$state" = "HEALTHY" ] && [ "$verified" = "true" ] && [ "$covered" = "true" ]; then
              echo "ACTION daily watchdog verified healthy persisted slate coverage."
              exit 0
            fi
            if [ "$state" = "RUNNING" ]; then sleep 15; continue; fi
            echo "Verification failed state=$state persisted=$verified slateCoverage=$covered"
            exit 1
          done
          echo "ACTION daily watchdog could not verify healthy persisted state."
          exit 1
