name: NHL-PRO-v2 research validation

on:
  schedule:
    - cron: "15 11 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/nhl-pro-v2-walkforward.mjs"
      - ".github/workflows/nhl-pro-v2-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
      - name: Restore NHL PBP cache
        uses: actions/cache@v4.2.0
        with:
          path: .cache/nhl-pro-v2
          key: nhl-pro-v2-pbp-v1-${{ runner.os }}-${{ hashFiles('scripts/nhl-pro-v2-walkforward.mjs', 'scripts/nhl-pro-v2-fit.mjs') }}
          restore-keys: |
            nhl-pro-v2-pbp-v1-${{ runner.os }}-
      - name: Run NHL-PRO-v2 strict walk-forward
        run: |
          set -euo pipefail
          node scripts/nhl-pro-v2-walkforward.mjs \
            --seasons=20232024,20242025,20252026 \
            --concurrency=8 \
            --cache-dir=.cache/nhl-pro-v2 \
            --out=data/models/nhl-pro-v2-validation.json
      - name: Verify PIT integrity
        run: |
          set -euo pipefail
          jq -e '.pointInTime == true' data/models/nhl-pro-v2-validation.json >/dev/null
          jq -e '.marketInformed == false' data/models/nhl-pro-v2-validation.json >/dev/null
          jq -e '.integrity.noMarketInputs == true' data/models/nhl-pro-v2-validation.json >/dev/null
          jq -e '.integrity.fetchErrors == 0' data/models/nhl-pro-v2-validation.json >/dev/null
          jq '.aggregate,.promotion' data/models/nhl-pro-v2-validation.json
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nhl-pro-v2-validation-${{ github.run_id }}
          path: data/models/nhl-pro-v2-validation.json
          retention-days: 90

      - name: Persist validation artifact
        run: |
          set -euo pipefail
          cp data/models/nhl-pro-v2-validation.json "$RUNNER_TEMP/nhl-pro-v2-validation.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            if jq -S 'del(.generatedAt)' data/models/nhl-pro-v2-validation.json > "$RUNNER_TEMP/old-validation.norm" 2>/dev/null \
              && jq -S 'del(.generatedAt)' "$RUNNER_TEMP/nhl-pro-v2-validation.json" > "$RUNNER_TEMP/new-validation.norm" \
              && cmp -s "$RUNNER_TEMP/old-validation.norm" "$RUNNER_TEMP/new-validation.norm"; then
              echo "validation artifact unchanged apart from generatedAt"
              exit 0
            fi
            cp "$RUNNER_TEMP/nhl-pro-v2-validation.json" data/models/nhl-pro-v2-validation.json
            git add data/models/nhl-pro-v2-validation.json
            if git diff --cached --quiet -- data/models/nhl-pro-v2-validation.json; then
              echo "validation artifact unchanged"
              exit 0
            fi
            git commit -m "data: update NHL-PRO-v2 walk-forward validation"
            if git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
