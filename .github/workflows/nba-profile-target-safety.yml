name: NBA profile persistence target safety
on:
  pull_request:
    paths:
      - "scripts/nba-profile-persistence-verify.mjs"
      - "test/nba-profile-persistence-target.test.mjs"
      - ".github/workflows/nba-profile-target-safety.yml"
  push:
    branches: [main]
    paths:
      - "scripts/nba-profile-persistence-verify.mjs"
      - "test/nba-profile-persistence-target.test.mjs"
      - ".github/workflows/nba-profile-target-safety.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - run: node --test test/nba-profile-persistence-target.test.mjs
