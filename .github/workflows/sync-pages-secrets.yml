name: Sync Pages Secrets

# Operator-triggered: copy GitHub Actions secrets into Cloudflare Pages.
# Never accept raw secret values via workflow_dispatch inputs (Actions logs).
#
# Odds pool: Parlay → TheOdds → SharpAPI → TheRundown → fail closed.
# Action/Apify: APIFY_TOKEN + shadow config only (never ODDS_PROVIDER_ORDER).
# Empty GitHub secrets skip put (never overwrite Cloudflare).
# Never embed secret values in YAML.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-pages-secrets
  cancel-in-progress: true

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Put Cloudflare Pages secrets from GitHub Actions secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
          THEODDS_API_KEY: ${{ secrets.THEODDS_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTION_APIFY_ENABLED: ${{ secrets.ACTION_APIFY_ENABLED }}
          ACTION_APIFY_PLAN: ${{ secrets.ACTION_APIFY_PLAN }}
          ACTION_APIFY_MONTHLY_BUDGET_USD: ${{ secrets.ACTION_APIFY_MONTHLY_BUDGET_USD }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "${value}" ]; then
              echo "skip ${name} (empty — leave existing Cloudflare secret unchanged)"
              return 0
            fi
            printf '%s' "${value}" | npx wrangler pages secret put "${name}" --project-name fbis
            echo "set ${name}"
          }
          put_secret SHARPAPI_API_KEY "${SHARPAPI_API_KEY}"
          put_secret THERUNDOWN_API_KEY "${THERUNDOWN_API_KEY}"
          put_secret THEODDS_API_KEY "${THEODDS_API_KEY}"
          # Action/Apify shadow candidate — never router authority.
          put_secret APIFY_TOKEN "${APIFY_TOKEN}"
          put_secret ACTION_APIFY_ENABLED "${ACTION_APIFY_ENABLED}"
          put_secret ACTION_APIFY_PLAN "${ACTION_APIFY_PLAN}"
          put_secret ACTION_APIFY_MONTHLY_BUDGET_USD "${ACTION_APIFY_MONTHLY_BUDGET_USD}"
