name: Sync Pages Odds Secrets

# Operator-triggered: copy odds fallback keys from GitHub Actions secrets into
# Cloudflare Pages. Never accept raw key values via workflow_dispatch inputs
# (those appear in Actions logs).
#
# Provider pool: Parlay → TheOdds → SharpAPI → TheRundown → fail closed.
# SharpAPI / TheRundown are intentional production fallbacks once newly rotated
# keys are installed. Empty GitHub secrets skip put (never overwrite Cloudflare).
# Never embed fallback values in YAML.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-pages-odds-secrets
  cancel-in-progress: true

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Put Cloudflare Pages secrets from GitHub Actions secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
          THEODDS_API_KEY: ${{ secrets.THEODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "${value}" ]; then
              echo "skip ${name} (empty — leave existing Cloudflare secret unchanged)"
              return 0
            fi
            printf '%s' "${value}" | npx wrangler pages secret put "${name}" --project-name fbis
            echo "set ${name}"
          }
          put_secret SHARPAPI_API_KEY "${SHARPAPI_API_KEY}"
          put_secret THERUNDOWN_API_KEY "${THERUNDOWN_API_KEY}"
          put_secret THEODDS_API_KEY "${THEODDS_API_KEY}"
