name: Sync Pages Odds Secrets

# One-shot / operator-triggered: write free odds backup keys into Cloudflare Pages
# using the existing CLOUDFLARE_API_TOKEN already stored in GitHub Actions.
# Does not require opening the Cloudflare dashboard.

on:
  workflow_dispatch:
    inputs:
      sharpapi_api_key:
        description: SharpAPI free key (sk_live_...)
        required: false
        type: string
      therundown_api_key:
        description: The Rundown free key
        required: false
        type: string
      theodds_api_key:
        description: Optional The Odds API key
        required: false
        type: string

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Put Cloudflare Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHARPAPI_API_KEY: ${{ inputs.sharpapi_api_key }}
          THERUNDOWN_API_KEY: ${{ inputs.therundown_api_key }}
          THEODDS_API_KEY: ${{ inputs.theodds_api_key }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "${value}" ]; then
              echo "skip ${name} (empty)"
              return 0
            fi
            printf '%s' "${value}" | npx wrangler pages secret put "${name}" --project-name fbis
            echo "set ${name}"
          }
          put_secret SHARPAPI_API_KEY "${SHARPAPI_API_KEY}"
          put_secret THERUNDOWN_API_KEY "${THERUNDOWN_API_KEY}"
          put_secret THEODDS_API_KEY "${THEODDS_API_KEY}"
