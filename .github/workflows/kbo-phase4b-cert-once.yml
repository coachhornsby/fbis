name: KBO Phase 4B one-shot certification
on:
  pull_request:
    branches:
      - main
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/kbo-phase4b-live-cert.py
