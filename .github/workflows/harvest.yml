name: FBIS research pipeline

# UTC crons are fixed. Chicago offset changes with DST:
# CDT (UTC-5, ~Mar–Nov): 13:00 UTC = 8:00 AM CDT; 11:20 UTC = 6:20 AM CDT
# CST (UTC-6, ~Nov–Mar): 13:00 UTC = 7:00 AM CST; 11:20 UTC = 5:20 AM CST
# Intended operator windows are CDT morning collect / ~06:20 harvest.
# Scheduled verification requires an actual GitHub `schedule` run, not only workflow_dispatch.

on:
  schedule:
    - cron: "0 13,16,18,20,22,0,2 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options:
          - all
          - collect-full
          - collect-cache
          - harvest
        default: all

concurrency:
  group: fbis-research-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect projections and/or grade finals
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          JOB_INPUT: ${{ github.event.inputs.job }}
        run: |
          set -euo pipefail
          BASE="https://fbis-myz.pages.dev"
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          JOB="${JOB_INPUT:-}"
          if [ -z "$JOB" ]; then
            if [ "$HOUR" = "11" ] && [ "$MIN" -ge 15 ]; then
              JOB="harvest"
            elif [ "$HOUR" = "13" ] || [ "$HOUR" = "16" ]; then
              JOB="collect-full"
            else
              JOB="collect-cache"
            fi
          fi
          echo "job=$JOB utc=${HOUR}:${MIN}"

          call_api() {
            local path="$1"
            local tmp
            tmp="$(mktemp)"
            local attempt=1
            local max=3
            while [ "$attempt" -le "$max" ]; do
              set +e
              curl -sS --max-time 90 --retry 0 \
                -H "x-harvest-secret: ${HARVEST_SECRET}" \
                -H "accept: application/json" \
                -o "$tmp" -w "%{http_code}" \
                "${BASE}${path}" > "${tmp}.code"
              local curl_ec=$?
              set -e
              if [ "$curl_ec" -eq 0 ]; then
                break
              fi
              echo "transient curl error attempt ${attempt}/${max}"
              if [ "$attempt" -eq "$max" ]; then
                echo "request failed after retries"
                exit 1
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            python3 - "$tmp" "${tmp}.code" <<'PY'
import json, sys
path, code_path = sys.argv[1], sys.argv[2]
http = open(code_path).read().strip()
raw = open(path, encoding="utf-8").read()
try:
    data = json.loads(raw)
except json.JSONDecodeError:
    print("non-json response http="+http)
    print(raw[:400])
    sys.exit(1)
ok = data.get("ok") is True and data.get("status") == "success"
summary = {
    "http": http,
    "ok": data.get("ok"),
    "job": data.get("job"),
    "status": data.get("status"),
    "games_discovered": data.get("games_discovered"),
    "snapshots_inserted": data.get("snapshots_inserted"),
    "snapshots_already_present": data.get("snapshots_already_present"),
    "snapshots_failed": data.get("snapshots_failed"),
    "finals_graded": data.get("finals_graded"),
    "d1_bound": (data.get("d1") or {}).get("bound"),
    "errors": data.get("errors") or [],
    "deployment_commit": data.get("deployment_commit"),
    "model_version": data.get("model_version"),
}
print(json.dumps(summary, indent=2))
if http not in ("200",) or not ok:
    sys.exit(1)
PY
          }

          run_collect() {
            local odds="$1"
            call_api "/api/collect?odds=${odds}"
          }
          run_harvest() {
            call_api "/api/harvest?days=3"
          }

          case "$JOB" in
            collect-full) run_collect full ;;
            collect-cache) run_collect cache ;;
            harvest) run_harvest ;;
            all)
              run_collect full
              run_harvest
              ;;
            *)
              echo "unknown job $JOB"
              exit 1
              ;;
          esac
