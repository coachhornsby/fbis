name: FBIS research pipeline

on:
  schedule:
    - cron: "0 0,2,13,16,18,20,22 * * *"
    - cron: "20 11 * * *"
    # Temporary schedule-proof slots (removed after verification).
    - cron: "55 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options:
          - all
          - collect-full
          - collect-cache
          - harvest
          - health
        default: all

concurrency:
  group: fbis-research-pipeline
  cancel-in-progress: false

jobs:
  determine-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      trigger: ${{ steps.mode.outputs.trigger }}
      run_url: ${{ steps.mode.outputs.run_url }}
    steps:
      - id: mode
        env:
          JOB_INPUT: ${{ github.event.inputs.job }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          HOUR="$(date -u +%H)"
          MIN="$(date -u +%M)"
          MODE="${JOB_INPUT:-}"
          TRIGGER="http"
          if [ "${EVENT_NAME}" = "schedule" ]; then
            TRIGGER="schedule"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TRIGGER="workflow_dispatch"
          fi
          if [ -z "$MODE" ]; then
            if [ "$HOUR" = "11" ] && [ "$MIN" -ge 15 ]; then
              MODE="harvest"
            elif [ "$HOUR" = "14" ] && [ "$MIN" -lt 5 ]; then
              MODE="harvest"
            elif [ "$HOUR" = "13" ] || [ "$HOUR" = "16" ]; then
              MODE="collect-full"
            else
              MODE="collect-cache"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=${MODE} trigger=${TRIGGER} utc=${HOUR}:${MIN}"

  verify-deployment:
    runs-on: ubuntu-latest
    needs: [determine-mode]
    steps:
      - name: Ensure production /api/health matches workflow SHA
        env:
          BASE: "https://fbis-myz.pages.dev"
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          attempts=10
          for i in $(seq 1 "$attempts"); do
            code="$(curl -sS --max-time 20 -o "$tmp" -w "%{http_code}" "${BASE}/api/health?_t=$(date +%s)")" || code="000"
            if [ "$code" = "200" ] && jq -e . "$tmp" >/dev/null 2>&1; then
              live="$(jq -r '.deploymentCommit // empty' "$tmp")"
              if [ -n "$live" ] && [ "$live" = "$EXPECTED_SHA" ]; then
                echo "Deployment SHA verified: $live"
                exit 0
              fi
              echo "SHA mismatch attempt ${i}/${attempts}: expected=${EXPECTED_SHA} live=${live:-<empty>}"
            else
              echo "Health endpoint unavailable attempt ${i}/${attempts} http=${code}"
            fi
            sleep $((i * 6))
          done
          echo "Production deployment SHA did not converge to workflow SHA."
          jq . "$tmp" || true
          exit 1

  collect:
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    if: contains(fromJSON('["collect-full","collect-cache","all"]'), needs.determine-mode.outputs.mode)
    strategy:
      fail-fast: false
      matrix:
        sport: [mlb, nba, nfl, cfb, cbb]
    steps:
      - name: Collect by sport (isolated)
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          MODE: ${{ needs.determine-mode.outputs.mode }}
          SPORT: ${{ matrix.sport }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
        run: |
          set -euo pipefail
          odds="cache"
          if [ "$MODE" = "collect-full" ] || [ "$MODE" = "all" ]; then odds="full"; fi
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"

          call_api() {
            local path="$1"
            local tmp http curl_ec st ok retryable body_err
            tmp="$(mktemp)"
            for attempt in 1 2 3 4; do
              set +e
              curl -sS --max-time 120 --retry 0 \
                -H "x-harvest-secret: ${HARVEST_SECRET}" \
                -H "accept: application/json" \
                -o "$tmp" -w "%{http_code}" \
                "${BASE}${path}&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}" > "${tmp}.code"
              curl_ec=$?
              set -e
              http="$(tr -d '\r\n' < "${tmp}.code")"
              if [ "$curl_ec" -ne 0 ]; then
                echo "transport error attempt ${attempt}/4"
                sleep $((attempt * 5))
                continue
              fi
              if ! jq -e . "$tmp" >/dev/null 2>&1; then
                if [ "$http" = "429" ] || [ "$http" = "500" ] || [ "$http" = "502" ] || [ "$http" = "503" ] || [ "$http" = "504" ]; then
                  echo "non-json retryable http=${http} attempt ${attempt}/4"
                  sleep $((attempt * 5))
                  continue
                fi
                echo "non-json non-retryable http=${http}"
                head -c 300 "$tmp" || true
                return 1
              fi
              st="$(jq -r '.status // ""' "$tmp")"
              ok="$(jq -r '.ok == true' "$tmp")"
              body_err="$(jq -r '(.errors // []) | join(" | ")' "$tmp")"
              retryable="false"
              if [ "$http" = "429" ] || [ "$http" = "500" ] || [ "$http" = "502" ] || [ "$http" = "503" ] || [ "$http" = "504" ]; then retryable="true"; fi
              if [ "$st" = "failed" ] && echo "$body_err" | grep -qiE "429|503|502|504|timeout|temporar|rate|overloaded"; then retryable="true"; fi
              if [ "$retryable" = "true" ] && [ "$attempt" -lt 4 ]; then
                echo "retryable application/http failure http=${http} status=${st} attempt ${attempt}/4"
                sleep $((attempt * 5))
                continue
              fi
              jq --arg http "$http" '{http:$http,ok:.ok,status:.status,sport:.sports,errors:(.errors//[]),games:.games_discovered,writes_failed:.failed_writes}' "$tmp"
              if [ "$http" != "200" ] || [ "$ok" != "true" ] || [ "$st" != "success" ]; then
                return 1
              fi
              return 0
            done
            return 1
          }

          if [ "$SPORT" = "cfb" ] || [ "$SPORT" = "nfl" ]; then
            for off in -1 0 1 2; do
              call_api "/api/collect?odds=${odds}&sport=${SPORT}&dayOffset=${off}"
            done
          else
            call_api "/api/collect?odds=${odds}&sport=${SPORT}"
          fi

  harvest:
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    if: contains(fromJSON('["harvest","all"]'), needs.determine-mode.outputs.mode)
    strategy:
      fail-fast: false
      matrix:
        sport: [mlb, nba, nfl, cfb, cbb]
    steps:
      - name: Harvest by sport (isolated)
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          SPORT: ${{ matrix.sport }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
        run: |
          set -euo pipefail
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          tmp="$(mktemp)"
          for attempt in 1 2 3 4; do
            set +e
            curl -sS --max-time 120 --retry 0 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              -o "$tmp" -w "%{http_code}" \
              "${BASE}/api/harvest?days=3&sport=${SPORT}&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}" > "${tmp}.code"
            curl_ec=$?
            set -e
            http="$(tr -d '\r\n' < "${tmp}.code")"
            if [ "$curl_ec" -ne 0 ] || [ "$http" = "429" ] || [ "$http" = "500" ] || [ "$http" = "502" ] || [ "$http" = "503" ] || [ "$http" = "504" ]; then
              if [ "$attempt" -lt 4 ]; then
                echo "retryable harvest failure sport=${SPORT} http=${http} attempt ${attempt}/4"
                sleep $((attempt * 5))
                continue
              fi
            fi
            break
          done
          if ! jq -e . "$tmp" >/dev/null 2>&1; then
            echo "non-json harvest response http=${http}"
            head -c 300 "$tmp" || true
            exit 1
          fi
          jq --arg http "$http" '{http:$http,ok:.ok,status:.status,sport:(.sports // []),finals_graded:.finals_graded,errors:(.errors // [])}' "$tmp"
          ok="$(jq -r '.ok == true' "$tmp")"
          st="$(jq -r '.status // ""' "$tmp")"
          if [ "$http" != "200" ] || [ "$ok" != "true" ] || [ "$st" != "success" ]; then
            exit 1
          fi

  health:
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    if: needs.determine-mode.outputs.mode == 'health'
    steps:
      - name: Read-only health diagnostic
        run: |
          set -euo pipefail
          curl -sS --max-time 20 "https://fbis-myz.pages.dev/api/health?_t=$(date +%s)" | jq .

  summary:
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment, collect, harvest, health]
    if: always()
    steps:
      - name: Consolidated pipeline summary
        env:
          MODE: ${{ needs.determine-mode.outputs.mode }}
          VERIFY: ${{ needs.verify-deployment.result }}
          COLLECT: ${{ needs.collect.result }}
          HARVEST: ${{ needs.harvest.result }}
          HEALTH: ${{ needs.health.result }}
        run: |
          set -euo pipefail
          echo "mode=${MODE}"
          echo "verify-deployment=${VERIFY}"
          echo "collect=${COLLECT}"
          echo "harvest=${HARVEST}"
          echo "health=${HEALTH}"
          if [ "$VERIFY" != "success" ]; then
            echo "Deployment SHA verification failed."
            exit 1
          fi
          if [ "$MODE" = "health" ]; then
            [ "$HEALTH" = "success" ] && exit 0 || exit 1
          fi
          if [ "$MODE" = "collect-full" ] || [ "$MODE" = "collect-cache" ]; then
            [ "$COLLECT" = "success" ] && exit 0 || exit 1
          fi
          if [ "$MODE" = "harvest" ]; then
            [ "$HARVEST" = "success" ] && exit 0 || exit 1
          fi
          if [ "$MODE" = "all" ]; then
            [ "$COLLECT" = "success" ] && [ "$HARVEST" = "success" ] && exit 0 || exit 1
          fi
          echo "Unknown mode ${MODE}"
          exit 1
