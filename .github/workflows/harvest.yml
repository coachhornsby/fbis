name: FBIS research pipeline

# Core model/settlement pipeline only.
# IMPORTANT: this workflow never executes ACTION/Apify. Paid ACTION collection is
# owned exclusively by action-orchestrator.yml. Legacy odds-provider credentials
# are also disconnected at /api/collect.
#
# UTC schedule contract:
#   collect-full  — 13:00, 16:00
#   collect-cache — 00:00, 02:00, 18:00, 20:00, 22:00
#   harvest       — 11:20, 16:20
#   health        — :35 hourly; read-mostly, core collect/settle recovery only

on:
  schedule:
    - cron: "0 13,16 * * *"
    - cron: "0 0,2,18,20,22 * * *"
    - cron: "20 11,16 * * *"
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which core research job to run
        type: choice
        options:
          - all
          - collect-full
          - collect-cache
          - harvest
          - health
        default: all

concurrency:
  group: fbis-research-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  determine-mode:
    name: RESEARCH MODE
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      trigger: ${{ steps.mode.outputs.trigger }}
      run_url: ${{ steps.mode.outputs.run_url }}
      scheduled_slot: ${{ steps.mode.outputs.scheduled_slot }}
    steps:
      - id: mode
        env:
          JOB_INPUT: ${{ github.event.inputs.job }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_EXPRESSION: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          HOUR="$(date -u +%H)"
          MIN="$(date -u +%M)"
          MODE="${JOB_INPUT:-}"
          TRIGGER="http"
          if [ "${EVENT_NAME}" = "schedule" ]; then
            TRIGGER="schedule"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TRIGGER="workflow_dispatch"
          fi
          if [ -z "$MODE" ]; then
            if [ "${EVENT_NAME}" = "schedule" ] && [ "${SCHEDULED_EXPRESSION}" = "20 11,16 * * *" ]; then
              MODE="harvest"
            elif [ "${EVENT_NAME}" = "schedule" ] && [ "${SCHEDULED_EXPRESSION}" = "0 13,16 * * *" ]; then
              MODE="collect-full"
            elif [ "${EVENT_NAME}" = "schedule" ] && [ "${SCHEDULED_EXPRESSION}" = "0 0,2,18,20,22 * * *" ]; then
              MODE="collect-cache"
            elif [ "${EVENT_NAME}" = "schedule" ]; then
              MODE="health"
            elif [ "$HOUR" = "11" ] && [ "$MIN" -ge 15 ]; then
              MODE="harvest"
            elif [ "$HOUR" = "16" ] && [ "$MIN" -ge 20 ]; then
              MODE="harvest"
            elif [ "$HOUR" = "13" ] || { [ "$HOUR" = "16" ] && [ "$MIN" -lt 20 ]; }; then
              MODE="collect-full"
            else
              MODE="collect-cache"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          echo "scheduled_slot=${SCHEDULED_EXPRESSION:-manual}" >> "$GITHUB_OUTPUT"

  verify-deployment:
    name: VERIFY LIVE PRODUCTION SHA
    runs-on: ubuntu-latest
    needs: [determine-mode]
    outputs:
      outcome: ${{ steps.verify.outputs.verify_outcome }}
      production_sha: ${{ steps.verify.outputs.production_sha }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Resolve live production SHA
        id: verify
        env:
          BASE: "https://fbis-myz.pages.dev"
          VERIFY_MODE: resolve-live
          VERIFY_MAX_ATTEMPTS: "12"
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$(mktemp)"
          node scripts/verify-deployment-sha.mjs > "$out"
          cat "$out"
          outcome="$(jq -r '.outcome // "unavailable"' "$out")"
          production="$(jq -r '.productionSha // .actualSha // empty' "$out")"
          echo "verify_outcome=${outcome}" >> "$GITHUB_OUTPUT"
          echo "production_sha=${production}" >> "$GITHUB_OUTPUT"
          if [ "$outcome" != "match" ] || [ "${#production}" -ne 40 ]; then
            echo "NO VERIFIED PRODUCTION SHA — research writes blocked."
            exit 1
          fi

  collect:
    name: RESEARCH COLLECT
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    if: needs.verify-deployment.outputs.outcome == 'match' && contains(fromJSON('["collect-full","collect-cache","all"]'), needs.determine-mode.outputs.mode)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sport: [mlb, nba, nfl, cfb, cbb]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Collect by sport
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          MODE: ${{ needs.determine-mode.outputs.mode }}
          SPORT: ${{ matrix.sport }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          SCHEDULED_SLOT: ${{ needs.determine-mode.outputs.scheduled_slot }}
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          test "${#PRODUCTION_SHA}" -eq 40

          live="$(curl -sS --max-time 20 "${BASE}/api/health?_t=$(date +%s)" | jq -r '.deploymentCommit // .build.commitSha // empty' | tr 'A-F' 'a-f')"
          expected="$(echo "$PRODUCTION_SHA" | tr 'A-F' 'a-f')"
          if [ "$live" != "$expected" ]; then
            echo "Production SHA changed mid-run (${expected} -> ${live})"
            exit 1
          fi

          odds="cache"
          if [ "$MODE" = "collect-full" ] || [ "$MODE" = "all" ]; then odds="full"; fi
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          SLOT_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('SCHEDULED_SLOT',''), safe=''))")"

          call_collect() {
            local off="$1"
            local suffix=""
            if [ -n "$off" ]; then suffix="&dayOffset=${off}"; fi
            tmp="$(mktemp)"
            code="$(curl -sS --max-time 150 --retry 0 -o "$tmp" -w '%{http_code}' \
              -H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json" \
              "${BASE}/api/collect?odds=${odds}&sport=${SPORT}${suffix}&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}&scheduledSlot=${SLOT_ENC}")"
            jq -c '{ok,status,errors:(.errors//[])[:3],games:.games_discovered}' "$tmp" || true
            test "$code" = "200"
            jq -e '.ok == true and .status == "success"' "$tmp" >/dev/null
          }

          if [ "$SPORT" = "cfb" ] || [ "$SPORT" = "nfl" ]; then
            for off in 0 1 2; do call_collect "$off"; done
          else
            call_collect ""
          fi

          # NFL publication proof remains research evidence only.
          if [ "$SPORT" = "nfl" ]; then
            set +e
            mkdir -p artifacts
            BASE="$BASE" HARVEST_SECRET="$HARVEST_SECRET" ARTIFACT_DIR=artifacts node scripts/nfl-publish-proof.mjs || true
            test -f artifacts/nfl-live-ops-summary.json || echo '{"ok":false,"reason":"summary-missing"}' > artifacts/nfl-live-ops-summary.json
            curl -sS --max-time 20 "${BASE}/api/published-projections?sport=nfl&limit=5" > artifacts/nfl-published-after-collect.json || true
            set -e
          fi

      - name: Upload NFL live-ops proof artifacts
        if: always() && matrix.sport == 'nfl'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-live-ops-${{ github.run_id }}-${{ matrix.sport }}
          path: artifacts/nfl-*.json
          if-no-files-found: warn
          retention-days: 14

  harvest:
    name: RESEARCH HARVEST
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment, collect]
    if: always() && needs.verify-deployment.result == 'success' && needs.verify-deployment.outputs.outcome == 'match' && contains(fromJSON('["harvest","all"]'), needs.determine-mode.outputs.mode) && (needs.determine-mode.outputs.mode != 'all' || needs.collect.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sport: [cfb, mlb, nba, nfl, cbb]
        dayOffset: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Harvest by sport and date
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          SPORT: ${{ matrix.sport }}
          DAY_OFFSET: ${{ matrix.dayOffset }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          SCHEDULED_SLOT: ${{ needs.determine-mode.outputs.scheduled_slot }}
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          DAY="$(TZ=America/Chicago date -d "today - ${DAY_OFFSET} days" +%F)"
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          SLOT_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('SCHEDULED_SLOT',''), safe=''))")"
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 180 --retry 1 --retry-delay 5 -o "$tmp" -w '%{http_code}' \
            -H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json" \
            "${BASE}/api/harvest?date=${DAY}&sport=${SPORT}&settleOnly=1&gradeResearch=1&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}&scheduledSlot=${SLOT_ENC}")"
          jq -c '{ok,status,finals_graded,errors:(.errors//[])[:3]}' "$tmp" || true
          test "$code" = "200"
          jq -e '.ok == true and .status == "success"' "$tmp" >/dev/null

  health:
    name: RESEARCH HEALTH / CORE CATCH-UP
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    if: needs.determine-mode.outputs.mode == 'health' && needs.verify-deployment.outputs.outcome == 'match'
    steps:
      - name: Core health diagnostic and missed-slot recovery
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          tmp="$(mktemp)"
          curl -sS --max-time 20 "${BASE}/api/health?_t=$(date +%s)" -o "$tmp"
          jq '{state,failures,staleChecks,operatorNotes,schedule:.pipeline.schedule,settleTargets:.pipeline.settleTargets,commit:.deploymentCommit}' "$tmp"

          live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$tmp" | tr 'A-F' 'a-f')"
          expected="$(echo "$PRODUCTION_SHA" | tr 'A-F' 'a-f')"
          if [ "$live" != "$expected" ]; then
            echo "Production SHA changed mid-run (${expected} -> ${live})"
            exit 1
          fi

          collect_state="$(jq -r '.pipeline.schedule.collect.state // "unknown"' "$tmp")"
          harvest_state="$(jq -r '.pipeline.schedule.harvest.state // "unknown"' "$tmp")"
          need_collect=0
          need_harvest=0
          if [ "$collect_state" = "missed" ] || [ "$collect_state" = "delayed" ]; then need_collect=1; fi
          if [ "$harvest_state" = "missed" ] || [ "$harvest_state" = "delayed" ]; then need_harvest=1; fi
          if [ "$need_collect" -eq 0 ] && [ "$need_harvest" -eq 0 ]; then
            echo "No core catch-up required."
            exit 0
          fi

          run_url_enc="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"

          # Repair premature/cross-date grading only when a settle catch-up is required.
          if [ "$need_harvest" -eq 1 ]; then
            curl -sS --max-time 45 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" -H "content-type: application/json" \
              -d '{"action":"cleanup-future-grades"}' "${BASE}/api/track" | jq -c '{ok,strategyTicketsReset,executedBetsReset}' || true
            curl -sS --max-time 45 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" -H "content-type: application/json" \
              -d '{"action":"cleanup-cross-date-strategy"}' "${BASE}/api/track" | jq -c '{ok,voided,voidPlanned}' || true
          fi

          collect_failed=0
          if [ "$need_collect" -eq 1 ]; then
            echo "Recovering missed core collect only — ACTION is intentionally excluded."
            for sport in mlb cfb nfl; do
              body="$(mktemp)"
              code="$(curl -sS --max-time 120 --retry 1 --retry-delay 10 -o "$body" -w '%{http_code}' \
                -H "x-harvest-secret: ${HARVEST_SECRET}" \
                "${BASE}/api/collect?odds=cache&sport=${sport}&trigger=schedule&scheduledSlot=watchdog-recovery&runUrl=${run_url_enc}")" || code=000
              jq -c '{ok,status,errors:(.errors//[])[:3]}' "$body" 2>/dev/null || true
              if [ "$code" != "200" ] || [ "$(jq -r '.ok == true' "$body" 2>/dev/null || echo false)" != "true" ]; then collect_failed=1; fi
            done
          fi

          harvest_failed=0
          if [ "$need_harvest" -eq 1 ]; then
            curl -sS --max-time 20 "${BASE}/api/health?_t=$(date +%s)" -o "$tmp"
            mapfile -t TARGETS < <(jq -r '[.pipeline.settleTargets // [] | .[] | select((.openExecutedBets // 0) > 0 or (.openStrategyTickets // 0) > 0) | "\(.sport):\(.date)"] | .[0:14] | .[]' "$tmp")
            if [ "${#TARGETS[@]}" -eq 0 ]; then
              mapfile -t TARGETS < <(for i in 0 1 2 3; do day="$(TZ=America/Chicago date -d "today - $i days" +%F)"; for sport in mlb cfb nfl; do echo "${sport}:${day}"; done; done)
            fi
            for sport_day in "${TARGETS[@]}"; do
              sport="${sport_day%%:*}"
              day="${sport_day##*:}"
              body="$(mktemp)"
              code="$(curl -sS --max-time 120 --retry 1 --retry-delay 10 -o "$body" -w '%{http_code}' \
                -H "x-harvest-secret: ${HARVEST_SECRET}" \
                "${BASE}/api/harvest?date=${day}&sport=${sport}&settleOnly=1&gradeResearch=1&trigger=schedule&scheduledSlot=watchdog-recovery&runUrl=${run_url_enc}")" || code=000
              if [ "$code" != "200" ] || [ "$(jq -r '.ok == true' "$body" 2>/dev/null || echo false)" != "true" ]; then harvest_failed=1; fi
              sleep 3
            done
          fi

          if [ "$collect_failed" != "0" ] || [ "$harvest_failed" != "0" ]; then
            echo "Core catch-up incomplete collect_failed=${collect_failed} harvest_failed=${harvest_failed}"
            exit 1
          fi

      - name: NFL publication proof (soft)
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set +e
          mkdir -p artifacts
          BASE="$BASE" HARVEST_SECRET="$HARVEST_SECRET" ARTIFACT_DIR=artifacts node scripts/nfl-publish-proof.mjs || true
          curl -sS --max-time 20 "${BASE}/api/published-projections?sport=nfl&limit=5" > artifacts/nfl-published-after-health.json || true
          set -e

      - name: Upload NFL health publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-health-publish-${{ github.run_id }}
          path: artifacts/nfl-*.json
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: RESEARCH SUMMARY
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment, collect, harvest, health]
    if: always()
    steps:
      - name: Consolidated core pipeline summary
        env:
          MODE: ${{ needs.determine-mode.outputs.mode }}
          VERIFY: ${{ needs.verify-deployment.result }}
          COLLECT: ${{ needs.collect.result }}
          HARVEST: ${{ needs.harvest.result }}
          HEALTH: ${{ needs.health.result }}
        run: |
          set -euo pipefail
          echo "mode=${MODE} verify=${VERIFY} collect=${COLLECT} harvest=${HARVEST} health=${HEALTH}"
          echo "ACTION: NOT OWNED BY THIS WORKFLOW"
          if [ "$VERIFY" != "success" ]; then exit 1; fi
          case "$MODE" in
            health) [ "$HEALTH" = "success" ] ;;
            collect-full|collect-cache) [ "$COLLECT" = "success" ] ;;
            harvest) [ "$HARVEST" = "success" ] ;;
            all) [ "$COLLECT" = "success" ] && [ "$HARVEST" = "success" ] ;;
            *) exit 1 ;;
          esac
