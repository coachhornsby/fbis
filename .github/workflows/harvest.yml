name: FBIS research pipeline

on:
  schedule:
    - cron: "0 0,2,13,16,18,20,22 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [all, collect-full, collect-cache, harvest]
        default: all

concurrency:
  group: fbis-research-pipeline-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: ${{ matrix.sport }} / pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sport: [mlb, nba, nfl, cfb, cbb]
    steps:
      - name: Verify deployment and run sport pipeline
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          JOB_INPUT: ${{ github.event.inputs.job }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.sha }}
          SPORT: ${{ matrix.sport }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          BASE="https://fbis-myz.pages.dev"
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          JOB="${JOB_INPUT:-}"
          TRIGGER="http"
          [ "$EVENT_NAME" = "schedule" ] && TRIGGER="schedule"
          [ "$EVENT_NAME" = "workflow_dispatch" ] && TRIGGER="workflow_dispatch"
          if [ -z "$JOB" ]; then
            if [ "$HOUR" = "11" ] && [ "$MIN" -ge 15 ]; then JOB="harvest"
            elif [ "$HOUR" = "13" ] || [ "$HOUR" = "16" ]; then JOB="collect-full"
            else JOB="collect-cache"; fi
          fi
          RUN_URL_ENC=$(python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['RUN_URL'], safe=''))")
          echo "### ${SPORT} / ${JOB}" >> "$GITHUB_STEP_SUMMARY"

          deployed=""
          for attempt in 1 2 3 4 5 6; do
            health=$(curl -fsS --max-time 20 "${BASE}/api/health" 2>/dev/null || true)
            deployed=$(printf '%s' "$health" | jq -r '.deployment_commit // empty' 2>/dev/null || true)
            if [ "$deployed" = "$EXPECTED_SHA" ]; then break; fi
            echo "deployment wait ${attempt}/6 expected=${EXPECTED_SHA} actual=${deployed:-unavailable}"
            [ "$attempt" -lt 6 ] && sleep $((attempt * 5))
          done
          if [ "$deployed" != "$EXPECTED_SHA" ]; then
            echo "- deployment mismatch: expected ${EXPECTED_SHA}, got ${deployed:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          call_api() {
            path="$1"
            label="$2"
            for attempt in 1 2 3 4; do
              tmp=$(mktemp)
              http=$(curl -sS --max-time 100 \
                -H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json" \
                -o "$tmp" -w "%{http_code}" \
                "${BASE}${path}&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}" 2>/dev/null || true)
              valid=false
              jq -e . "$tmp" >/dev/null 2>&1 && valid=true
              accepted=false
              [ "$valid" = true ] && [ "$http" = 200 ] && \
                [ "$(jq -r '(.ok == true) and (.status == "success")' "$tmp")" = true ] && accepted=true
              if [ "$accepted" = true ]; then
                summary=$(jq -r '"games=\(.games_discovered // 0), inserted=\(.snapshots_inserted // 0), already=\(.snapshots_already_present // 0), failed=\(.failed_writes // 0), graded=\(.finals_graded // 0), commit=\(.deployment_commit // "?")"' "$tmp")
                echo "- ${label}: success (${summary})" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              status=$(jq -r '.status // "invalid-response"' "$tmp" 2>/dev/null || echo invalid-response)
              errors=$(jq -c '.errors // []' "$tmp" 2>/dev/null || echo '[]')
              echo "${label} attempt=${attempt}/4 http=${http} status=${status} errors=${errors}"
              if [[ "$http" =~ ^4 ]] && [ "$http" != 429 ]; then break; fi
              [ "$attempt" -lt 4 ] && sleep $((attempt * attempt * 4))
            done
            echo "- ${label}: failed after retries (http=${http}, status=${status})" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          collect_sport() {
            odds="$1"
            if [ "$SPORT" = cfb ] || [ "$SPORT" = nfl ]; then
              failures=0
              for offset in -1 0 1 2 3 4 5 6; do
                call_api "/api/collect?odds=${odds}&sport=${SPORT}&dayOffset=${offset}" "collect day ${offset}" || failures=$((failures + 1))
              done
              [ "$failures" -eq 0 ]
            else
              call_api "/api/collect?odds=${odds}&sport=${SPORT}" "collect"
            fi
          }
          run_harvest() { call_api "/api/harvest?days=7&sport=${SPORT}" "harvest"; }

          failures=0
          case "$JOB" in
            collect-full) collect_sport full || failures=$((failures + 1)) ;;
            collect-cache) collect_sport cache || failures=$((failures + 1)) ;;
            harvest) run_harvest || failures=$((failures + 1)) ;;
            all)
              collect_sport full || failures=$((failures + 1))
              run_harvest || failures=$((failures + 1))
              ;;
            *) echo "unknown job ${JOB}"; exit 1 ;;
          esac
          [ "$failures" -eq 0 ]

  summary:
    name: Consolidated pipeline result
    if: always()
    needs: [pipeline]
    runs-on: ubuntu-latest
    steps:
      - name: Report recovery result
        env:
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
        run: |
          echo "## FBIS pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "Five sports ran independently with retries. Aggregate result: **${PIPELINE_RESULT}**." >> "$GITHUB_STEP_SUMMARY"
          [ "$PIPELINE_RESULT" = success ]
