name: FBIS research pipeline

on:
  schedule:
    - cron: "0 13,16 * * *"
    - cron: "0 0,2,18,20,22 * * *"
    - cron: "20 11,16 * * *"
    # Hourly watchdog. It is read-mostly and only catches up a genuinely missed slot.
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options:
          - all
          - collect-full
          - collect-cache
          - harvest
          - health
        default: all

concurrency:
  group: fbis-research-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  determine-mode:
    name: RESEARCH MODE
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      trigger: ${{ steps.mode.outputs.trigger }}
      run_url: ${{ steps.mode.outputs.run_url }}
      scheduled_slot: ${{ steps.mode.outputs.scheduled_slot }}
    steps:
      - id: mode
        env:
          JOB_INPUT: ${{ github.event.inputs.job }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_EXPRESSION: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          HOUR="$(date -u +%H)"
          MIN="$(date -u +%M)"
          MODE="${JOB_INPUT:-}"
          TRIGGER="http"
          if [ "${EVENT_NAME}" = "schedule" ]; then
            TRIGGER="schedule"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TRIGGER="workflow_dispatch"
          fi
          if [ -z "$MODE" ]; then
            if [ "${EVENT_NAME}" = "schedule" ] && [ "${SCHEDULED_EXPRESSION}" = "20 11,16 * * *" ]; then
              MODE="harvest"
            elif [ "${EVENT_NAME}" = "schedule" ] && [ "${SCHEDULED_EXPRESSION}" = "0 13,16 * * *" ]; then
              MODE="collect-full"
            elif [ "${EVENT_NAME}" = "schedule" ] && [ "${SCHEDULED_EXPRESSION}" = "0 0,2,18,20,22 * * *" ]; then
              MODE="collect-cache"
            elif [ "${EVENT_NAME}" = "schedule" ]; then
              MODE="health"
            elif [ "$HOUR" = "11" ] && [ "$MIN" -ge 15 ]; then
              MODE="harvest"
            elif [ "$HOUR" = "16" ] && [ "$MIN" -ge 20 ]; then
              MODE="harvest"
            elif [ "$HOUR" = "13" ] || { [ "$HOUR" = "16" ] && [ "$MIN" -lt 20 ]; }; then
              MODE="collect-full"
            else
              MODE="collect-cache"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          echo "scheduled_slot=${SCHEDULED_EXPRESSION:-manual}" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=${MODE} trigger=${TRIGGER} scheduled=${SCHEDULED_EXPRESSION:-manual} actual_utc=${HOUR}:${MIN}"

  verify-deployment:
    name: VERIFY LIVE PRODUCTION SHA
    runs-on: ubuntu-latest
    needs: [determine-mode]
    outputs:
      outcome: ${{ steps.verify.outputs.verify_outcome }}
      actual: ${{ steps.verify.outputs.verify_actual }}
      reason: ${{ steps.verify.outputs.verify_reason }}
      production_sha: ${{ steps.verify.outputs.production_sha }}
      fail_closed: ${{ steps.verify.outputs.fail_closed }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Resolve live production SHA (not workflow checkout SHA)
        id: verify
        env:
          BASE: "https://fbis-myz.pages.dev"
          VERIFY_MODE: resolve-live
          VERIFY_MAX_ATTEMPTS: "12"
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Scheduled research must operate against the SHA that is actually live.
          # Comparing github.sha races concurrent main deploys and causes false-red.
          # Fail closed if health never yields a full 40-char production SHA.
          out="$(mktemp)"
          set +e
          node scripts/verify-deployment-sha.mjs > "$out"
          ec=$?
          set -e
          cat "$out"
          outcome="$(jq -r '.outcome // "unavailable"' "$out")"
          actual="$(jq -r '.actualSha // .productionSha // empty' "$out")"
          reason="$(jq -r '.reason // "resolve-failed"' "$out")"
          production="$(jq -r '.productionSha // .actualSha // empty' "$out")"
          echo "verify_outcome=${outcome}" >> "$GITHUB_OUTPUT"
          echo "verify_actual=${actual}" >> "$GITHUB_OUTPUT"
          echo "verify_reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "production_sha=${production}" >> "$GITHUB_OUTPUT"
          if [ "$ec" -ne 0 ] || [ "$outcome" != "match" ] || [ "${#production}" -ne 40 ]; then
            echo "fail_closed=true" >> "$GITHUB_OUTPUT"
            echo "NO VERIFIED PRODUCTION SHA — research writes blocked. workflow_sha=${WORKFLOW_SHA} live=${production:-unavailable} outcome=${outcome} reason=${reason}"
            exit 1
          fi
          echo "fail_closed=false" >> "$GITHUB_OUTPUT"
          echo "Live production SHA snapshot for this research run: ${production}"
          if [ "$(echo "$WORKFLOW_SHA" | tr 'A-F' 'a-f')" != "$(echo "$production" | tr 'A-F' 'a-f')" ]; then
            echo "Note: workflow checkout SHA (${WORKFLOW_SHA}) differs from live production (${production}); using live as provenance."
          fi
      - name: Record verification outcome
        if: always() && steps.verify.outputs.verify_outcome != 'match'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          EXPECTED_SHA: ${{ steps.verify.outputs.production_sha || github.sha }}
          OUTCOME: ${{ steps.verify.outputs.verify_outcome }}
          ACTUAL: ${{ steps.verify.outputs.verify_actual }}
          REASON: ${{ steps.verify.outputs.verify_reason }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          SCHEDULED_SLOT: ${{ needs.determine-mode.outputs.scheduled_slot }}
        run: |
          set -euo pipefail
          if [ -z "${HARVEST_SECRET:-}" ]; then
            echo "HARVEST_SECRET unavailable; cannot persist verify failure row."
            exit 0
          fi
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          curl -sS --max-time 30 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            "${BASE}/api/collect?verifyRecord=1&verifyOutcome=${OUTCOME:-unavailable}&expectedSha=${EXPECTED_SHA}&actualSha=${ACTUAL:-}&reason=${REASON:-}&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}" || true

  collect:
    name: RESEARCH COLLECT
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    if: needs.verify-deployment.outputs.outcome == 'match' && contains(fromJSON('["collect-full","collect-cache","all"]'), needs.determine-mode.outputs.mode)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sport: [mlb, nba, nfl, cfb, cbb]
    steps:
      - name: Assert production SHA unchanged
        env:
          BASE: "https://fbis-myz.pages.dev"
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          test "${#PRODUCTION_SHA}" -eq 40
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 20 -o "$tmp" -w "%{http_code}" "${BASE}/api/health?_t=$(date +%s)")"
          live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$tmp" | tr 'A-F' 'a-f')"
          expected="$(echo "$PRODUCTION_SHA" | tr 'A-F' 'a-f')"
          echo "mid-run SHA check http=${code} expected=${expected} live=${live}"
          if [ "$code" != "200" ] || [ "${#live}" -ne 40 ]; then
            echo "Production SHA unavailable mid-run — fail closed for writes."
            exit 1
          fi
          if [ "$live" != "$expected" ]; then
            echo "Production SHA changed mid-run (${expected} -> ${live}) — fail closed (no mixed SHAs)."
            exit 1
          fi
      - name: Collect by sport (isolated)
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          MODE: ${{ needs.determine-mode.outputs.mode }}
          SPORT: ${{ matrix.sport }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          SCHEDULED_SLOT: ${{ needs.determine-mode.outputs.scheduled_slot }}
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          echo "collect provenance production_sha=${PRODUCTION_SHA} sport=${SPORT}"
          odds="cache"
          if [ "$MODE" = "collect-full" ] || [ "$MODE" = "all" ]; then odds="full"; fi
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          SCHEDULED_SLOT_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('SCHEDULED_SLOT',''), safe=''))")"

          call_api() {
            local path="$1"
            local tmp http curl_ec st ok retryable body_err
            tmp="$(mktemp)"
            for attempt in 1 2; do
              set +e
              curl -sS --max-time 120 --retry 0 \
                -H "x-harvest-secret: ${HARVEST_SECRET}" \
                -H "accept: application/json" \
                -o "$tmp" -w "%{http_code}" \
                "${BASE}${path}&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}&scheduledSlot=${SCHEDULED_SLOT_ENC}" > "${tmp}.code"
              curl_ec=$?
              set -e
              http="$(tr -d '\r\n' < "${tmp}.code")"
              if [ "$curl_ec" -ne 0 ]; then
                echo "transport error attempt ${attempt}/2"
                sleep $((attempt * 5))
                continue
              fi
              if ! jq -e . "$tmp" >/dev/null 2>&1; then
                if [ "$http" = "429" ] || [ "$http" = "500" ] || [ "$http" = "502" ] || [ "$http" = "503" ] || [ "$http" = "504" ]; then
                  echo "non-json retryable http=${http} attempt ${attempt}/2"
                  sleep $((attempt * 5))
                  continue
                fi
                echo "non-json non-retryable http=${http}"
                head -c 300 "$tmp" || true
                return 1
              fi
              st="$(jq -r '.status // ""' "$tmp")"
              ok="$(jq -r '.ok == true' "$tmp")"
              body_err="$(jq -r '(.errors // []) | join(" | ")' "$tmp")"
              retryable="false"
              if [ "$http" = "429" ] || [ "$http" = "500" ] || [ "$http" = "502" ] || [ "$http" = "503" ] || [ "$http" = "504" ]; then retryable="true"; fi
              if [ "$st" = "failed" ] && echo "$body_err" | grep -qiE "429|503|502|504|timeout|temporar|rate|overloaded"; then retryable="true"; fi
              if [ "$retryable" = "true" ] && [ "$attempt" -lt 2 ]; then
                echo "retryable application/http failure http=${http} status=${st} attempt ${attempt}/2"
                sleep $((attempt * 5))
                continue
              fi
              jq --arg http "$http" '{http:$http,ok:.ok,status:.status,sport:.sports,errors:(.errors//[]),games:.games_discovered,writes_failed:.failed_writes}' "$tmp"
              if [ "$http" != "200" ] || [ "$ok" != "true" ] || [ "$st" != "success" ]; then
                return 1
              fi
              return 0
            done
            return 1
          }

          # Seed/refresh NFL team_form in small chunks before collect (Pages timeout-safe).
          if [ "$SPORT" = "nfl" ]; then
            season="$(date -u +%Y)"
            for start in 1 4 7 10 13 16; do
              end=$((start + 2))
              if [ "$end" -gt 18 ]; then end=18; fi
              weeks=$(seq -s, "$start" "$end")
              form_http=$(curl -sS --max-time 90 -o /tmp/nfl-form-backfill.json -w "%{http_code}" \
                -H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json" \
                "${BASE}/api/harvest?formBackfill=1&formSeason=${season}&formWeeks=${weeks}&includePostseason=0&trigger=${TRIGGER}" || echo "000")
              echo "nfl_form_backfill season=${season} weeks=${weeks} http=${form_http}"
              jq -c '{ok:.ok,formApplied:.formApplied,formSkipped:.formSkipped,finalsSeen:.finalsSeen,errors:(.errors//[])}' /tmp/nfl-form-backfill.json || true
              sleep 1
            done
          fi

          if [ "$SPORT" = "cfb" ] || [ "$SPORT" = "nfl" ]; then
            for off in 0 1 2; do
              call_api "/api/collect?odds=${odds}&sport=${SPORT}&dayOffset=${off}"
            done
          else
            call_api "/api/collect?odds=${odds}&sport=${SPORT}"
          fi

          # NFL research live-ops proof: board FBIS count + one published ledger row.
          # Soft evidence only — must never fail the collect matrix job.
          if [ "$SPORT" = "nfl" ]; then
            set +e
            mkdir -p artifacts
            curl -sS --max-time 60 -o artifacts/nfl-today-after-collect.json \
              "${BASE}/api/today?sport=nfl" || true
            node -e '
const fs = require("fs");
const today = JSON.parse(fs.readFileSync("artifacts/nfl-today-after-collect.json", "utf8"));
const games = today.games || [];
const fbis = games.filter((g) => g.projectionKind === "FBIS" && g.projHome != null);
const summary = {
  fbisCount: fbis.length,
  sample: fbis.slice(0, 6).map((g) => ({
    id: g.id,
    matchup: (g.away?.abbr || "?") + "@" + (g.home?.abbr || "?"),
    engine: g.projectionEngine,
    version: g.researchProjection?.modelVersion || g.projectionRecipe?.version,
    away: g.projAway,
    home: g.projHome,
    maturity: g.projectionMaturity,
    publicationStatus: g.publicationStatus,
    start: g.start,
  })),
  publishCandidate: fbis.find((g) => {
    const t = Date.parse(g.start || "");
    return Number.isFinite(t) && t > Date.now() + 5 * 60 * 1000;
  }) || null,
};
fs.writeFileSync("artifacts/nfl-live-ops-summary.json", JSON.stringify(summary, null, 2));
console.log(JSON.stringify({ fbisCount: summary.fbisCount, candidate: summary.publishCandidate?.id || null }));
'
            candidate=$(jq -r ".publishCandidate.id // empty" artifacts/nfl-live-ops-summary.json 2>/dev/null || true)
            if [ -n "${candidate:-}" ]; then
              pub_http=$(curl -sS --max-time 60 -o artifacts/nfl-publish-proof.json -w "%{http_code}" \
                -H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json" -H "content-type: application/json" \
                -d "{\"sport\":\"nfl\",\"gameId\":\"${candidate}\"}" \
                "${BASE}/api/published-projections" || echo "000")
              echo "nfl_publish_proof candidate=${candidate} http=${pub_http}"
            else
              echo '{"ok":false,"reason":"no-pregame-fbis-candidate"}' > artifacts/nfl-publish-proof.json
              echo "nfl_publish_proof skipped — no pregame FBIS candidate"
            fi
            curl -sS --max-time 30 -o artifacts/nfl-published-list.json \
              "${BASE}/api/published-projections?sport=nfl&limit=20" || true
            set -e
          fi

      - name: Upload NFL live-ops proof artifacts
        if: always() && matrix.sport == 'nfl'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-live-ops-${{ github.run_id }}-${{ matrix.sport }}
          path: artifacts/nfl-*.json
          if-no-files-found: warn
          retention-days: 14

  action-market-intel:
    name: ACTION MARKET INTELLIGENCE (soft-fail)
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    # Parallel to incumbent collect. Soft-fail so ACTION never blocks production odds collect/harvest.
    if: needs.verify-deployment.outputs.outcome == 'match' && contains(fromJSON('["collect-full","collect-cache","all"]'), needs.determine-mode.outputs.mode)
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sport: [cfb, mlb, nfl, nba, cbb]
    steps:
      - name: Assert production SHA unchanged
        env:
          BASE: "https://fbis-myz.pages.dev"
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          test "${#PRODUCTION_SHA}" -eq 40
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 20 -o "$tmp" -w "%{http_code}" "${BASE}/api/health?_t=$(date +%s)")"
          live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$tmp" | tr 'A-F' 'a-f')"
          expected="$(echo "$PRODUCTION_SHA" | tr 'A-F' 'a-f')"
          echo "mid-run SHA check http=${code} expected=${expected} live=${live}"
          if [ "$code" != "200" ] || [ "${#live}" -ne 40 ] || [ "$live" != "$expected" ]; then
            echo "Production SHA unavailable/changed — skip ACTION write (fail soft)."
            exit 1
          fi
      - name: Collect ACTION market snapshots (shadow-governed)
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          SPORT: ${{ matrix.sport }}
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          echo "ACTION market-intel sport=${SPORT} production_sha=${PRODUCTION_SHA}"
          echo "role=market_intelligence governance=shadow inProductionRouter=false canQualify=false"
          if [ -z "${HARVEST_SECRET:-}" ]; then
            echo "HARVEST_SECRET missing — cannot collect ACTION (soft-fail)."
            exit 1
          fi
          plan="$(mktemp)"
          code="$(curl -sS --max-time 60 -o "$plan" -w "%{http_code}" \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            "${BASE}/api/action-apify-collect?mode=plan&sport=${SPORT}&lifecycle=pregame&profile=BASE")"
          echo "plan_http=${code}"
          jq 'del(.. | .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?)' "$plan" || cat "$plan"
          test "$code" = "200"
          allowed="$(jq -r '.safety.allowed // .safety.ok // true' "$plan")"
          estimate="$(jq -r '(.plan.estimatedCostUsd // .budget.estimatedNextRunUsd // 0)' "$plan")"
          echo "safety_allowed=${allowed} estimate=${estimate}"
          if [ "$allowed" = "false" ]; then
            echo "Plan safety blocked — no ACTION spend."
            exit 0
          fi
          python3 - <<PY
          est = float("${estimate}" or 0)
          if est > 1.0:
              raise SystemExit(f"estimate {est} exceeds soft cap 1.0")
          print(f"estimate_ok={est}")
          PY
          body="$(mktemp)"
          code="$(curl -sS --max-time 300 -o "$body" -w "%{http_code}" \
            -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -H "accept: application/json" \
            -d "{\"execute\":\"1\",\"sport\":\"${SPORT}\",\"lifecycle\":\"pregame\",\"profile\":\"BASE\"}" \
            "${BASE}/api/action-apify-collect?execute=1&sport=${SPORT}&lifecycle=pregame&profile=BASE")"
          echo "exec_http=${code}"
          jq 'del(.. | .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?, .rows?)' "$body" || cat "$body"
          test "$code" = "200"
          jq -e '.ok == true' "$body" >/dev/null

  harvest:
    name: RESEARCH HARVEST
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment, collect]
    if: always() && needs.verify-deployment.result == 'success' && needs.verify-deployment.outputs.outcome == 'match' && contains(fromJSON('["harvest","all"]'), needs.determine-mode.outputs.mode) && (needs.determine-mode.outputs.mode != 'all' || needs.collect.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sport: [cfb, mlb, nba, nfl, cbb]
        dayOffset: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Assert production SHA unchanged
        env:
          BASE: "https://fbis-myz.pages.dev"
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          test "${#PRODUCTION_SHA}" -eq 40
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 20 -o "$tmp" -w "%{http_code}" "${BASE}/api/health?_t=$(date +%s)")"
          live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$tmp" | tr 'A-F' 'a-f')"
          expected="$(echo "$PRODUCTION_SHA" | tr 'A-F' 'a-f')"
          echo "mid-run SHA check http=${code} expected=${expected} live=${live}"
          if [ "$code" != "200" ] || [ "${#live}" -ne 40 ]; then
            echo "Production SHA unavailable mid-run — fail closed for writes."
            exit 1
          fi
          if [ "$live" != "$expected" ]; then
            echo "Production SHA changed mid-run (${expected} -> ${live}) — fail closed (no mixed SHAs)."
            exit 1
          fi
      - name: Harvest by sport (isolated)
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          SPORT: ${{ matrix.sport }}
          DAY_OFFSET: ${{ matrix.dayOffset }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          SCHEDULED_SLOT: ${{ needs.determine-mode.outputs.scheduled_slot }}
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          echo "harvest provenance production_sha=${PRODUCTION_SHA} sport=${SPORT}"
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          SCHEDULED_SLOT_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('SCHEDULED_SLOT',''), safe=''))")"
          tmp="$(mktemp)"
          DAY="$(TZ=America/Chicago date -d "today - ${DAY_OFFSET} days" +%F)"
          for attempt in 1 2 3; do
            set +e
            curl -sS --max-time 180 --retry 0 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              -o "$tmp" -w "%{http_code}" \
              "${BASE}/api/harvest?date=${DAY}&sport=${SPORT}&settleOnly=1&gradeResearch=1&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}&scheduledSlot=${SCHEDULED_SLOT_ENC}" > "${tmp}.code"
            curl_ec=$?
            set -e
            http="$(tr -d '\r\n' < "${tmp}.code")"
            if [ "$curl_ec" -ne 0 ] || [ "$http" = "429" ] || [ "$http" = "500" ] || [ "$http" = "502" ] || [ "$http" = "503" ] || [ "$http" = "504" ] || [ "$http" = "524" ]; then
              if [ "$attempt" -lt 3 ]; then
                echo "retryable harvest failure sport=${SPORT} day=${DAY} http=${http} attempt ${attempt}/3"
                sleep $((attempt * 10))
                continue
              fi
            fi
            break
          done
          if ! jq -e . "$tmp" >/dev/null 2>&1; then
            echo "non-json harvest response http=${http} day=${DAY}"
            head -c 300 "$tmp" || true
            exit 1
          fi
          jq --arg http "$http" --arg day "$DAY" '{http:$http,day:$day,ok:.ok,status:.status,sport:(.sports // []),finals_graded:.finals_graded,executed_bets:[(.sports // [])[] | {sport,executedBets}],errors:(.errors // [])}' "$tmp"
          ok="$(jq -r '.ok == true' "$tmp")"
          st="$(jq -r '.status // ""' "$tmp")"
          if [ "$http" != "200" ] || [ "$ok" != "true" ] || [ "$st" != "success" ]; then
            exit 1
          fi

  health:
    name: RESEARCH HEALTH / CATCH-UP
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    if: needs.determine-mode.outputs.mode == 'health' && needs.verify-deployment.outputs.outcome == 'match'
    steps:
      - name: Assert production SHA unchanged
        env:
          BASE: "https://fbis-myz.pages.dev"
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          test "${#PRODUCTION_SHA}" -eq 40
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 20 -o "$tmp" -w "%{http_code}" "${BASE}/api/health?_t=$(date +%s)")"
          live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$tmp" | tr 'A-F' 'a-f')"
          expected="$(echo "$PRODUCTION_SHA" | tr 'A-F' 'a-f')"
          if [ "$code" != "200" ] || [ "$live" != "$expected" ]; then
            echo "Production SHA unavailable or changed mid-run — fail closed."
            exit 1
          fi
      - name: Health diagnostic and missed-slot recovery
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          PRODUCTION_SHA: ${{ needs.verify-deployment.outputs.production_sha }}
        run: |
          set -euo pipefail
          BASE="https://fbis-myz.pages.dev"
          echo "health/catch-up provenance production_sha=${PRODUCTION_SHA}"
          tmp="$(mktemp)"
          curl -sS --max-time 20 "${BASE}/api/health?_t=$(date +%s)" -o "$tmp"
          jq '{state,failures,staleChecks,operatorNotes,schedule:.pipeline.schedule,settleTargets:.pipeline.settleTargets,retryOpen:.pipeline.retryOpen,commit:.deploymentCommit}' "$tmp"
          collect_state="$(jq -r '.pipeline.schedule.collect.state // "unknown"' "$tmp")"
          harvest_state="$(jq -r '.pipeline.schedule.harvest.state // "unknown"' "$tmp")"
          harvest_ok="$(jq -r '.checks[] | select(.name=="scheduled-harvest") | .ok' "$tmp")"
          harvest_stale="$(jq -r '.checks[] | select(.name=="scheduled-harvest") | .stale' "$tmp")"
          collect_ok="$(jq -r '.checks[] | select(.name=="scheduled-collect") | .ok' "$tmp")"
          need_collect=0
          need_harvest=0
          if [ "$collect_state" = "missed" ] || [ "$collect_ok" = "false" ] || [ "$collect_state" = "delayed" ]; then need_collect=1; fi
          if [ "$harvest_state" = "missed" ] || [ "$harvest_ok" = "false" ] || [ "$harvest_stale" = "true" ]; then need_harvest=1; fi
          if [ "$need_collect" -eq 0 ] && [ "$need_harvest" -eq 0 ]; then
            echo "No catch-up required. collect=${collect_state} harvest=${harvest_state} harvest_ok=${harvest_ok} harvest_stale=${harvest_stale}"
            exit 0
          fi
          if [ -z "${HARVEST_SECRET:-}" ]; then
            echo "Catch-up required but HARVEST_SECRET is unavailable; fail visibly."
            exit 1
          fi
          run_url_enc="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          # Reopen premature grades before settle (moved out of deploy release gate).
          cleanup_tmp="$(mktemp)"
          set +e
          cleanup_code="$(curl -sS --max-time 45 -o "$cleanup_tmp" -w "%{http_code}" \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -H "accept: application/json" \
            -d '{"action":"cleanup-future-grades"}' \
            "${BASE}/api/track")"
          cleanup_ec=$?
          set -e
          echo "cleanup-future-grades curl_ec=${cleanup_ec} http=${cleanup_code:-000}"
          jq -c '{ok,strategyTicketsReset,executedBetsReset}' "$cleanup_tmp" 2>/dev/null || true
          collect_failed=0
          if [ "$need_collect" -eq 1 ]; then
            echo "Recovering missed/stale/delayed collect slot"
            for sport in mlb cfb; do
              body="$(mktemp)"
              ok_collect=0
              for attempt in 1 2 3; do
                set +e
                code="$(curl -sS --max-time 120 -o "$body" -w '%{http_code}' -H "x-harvest-secret: ${HARVEST_SECRET}" "${BASE}/api/collect?mode=cache&sport=${sport}&trigger=schedule&scheduledSlot=watchdog-recovery&runUrl=${run_url_enc}")"
                curl_ec=$?
                set -e
                echo "collect-recovery ${sport} attempt=${attempt} curl_ec=${curl_ec} http=${code}"
                jq -c '{ok,status,errors:(.errors//[])[:3]}' "$body" 2>/dev/null || head -c 300 "$body" || true
                if [ "$curl_ec" -eq 0 ] && [ "$code" = "200" ] && [ "$(jq -r '.ok == true' "$body" 2>/dev/null || echo false)" = "true" ]; then
                  ok_collect=1
                  break
                fi
                if [ "$curl_ec" -ne 0 ] || [ "$code" = "000" ] || [ "$code" = "429" ] || [ "$code" = "500" ] || [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ] || [ "$code" = "524" ]; then
                  sleep $((attempt * 15))
                  continue
                fi
                sleep $((attempt * 8))
              done
              if [ "$ok_collect" != "1" ]; then
                echo "collect-recovery ${sport} failed after retries (continuing so harvest catch-up can still run)"
                collect_failed=1
              fi
            done
          fi
          harvest_failed=0
          if [ "$need_harvest" -eq 1 ]; then
            echo "Recovering missed/stale harvest using targeted settle dates"
            # Void cross-date duplicate OPEN strategy tickets before settle.
            cross_tmp="$(mktemp)"
            set +e
            cross_code="$(curl -sS --max-time 90 -o "$cross_tmp" -w "%{http_code}" \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "content-type: application/json" \
              -H "accept: application/json" \
              -d '{"action":"cleanup-cross-date-strategy"}' \
              "${BASE}/api/track")"
            cross_ec=$?
            set -e
            echo "cleanup-cross-date-strategy curl_ec=${cross_ec} http=${cross_code:-000}"
            jq -c '{ok,voided,voidPlanned,keepN}' "$cross_tmp" || true
            # Refresh settleTargets after voids so volume-sorted targets are accurate.
            curl -sS --max-time 20 "${BASE}/api/health?_t=$(date +%s)" -o "$tmp"
            mapfile -t TARGETS < <(jq -r '
              [.pipeline.settleTargets // []
                | .[]
                | select((.openExecutedBets // 0) > 0 or (.openStrategyTickets // 0) > 0)
                | "\(.sport):\(.date)"]
              | .[0:14]
              | .[]
            ' "$tmp")
            if [ "${#TARGETS[@]}" -eq 0 ]; then
              mapfile -t TARGETS < <(for i in 0 1 2 3; do
                day="$(TZ=America/Chicago date -d "today - $i days" +%F)"
                for sport in mlb cfb nfl; do echo "${sport}:${day}"; done
              done)
            fi
            harvest_failed=0
            for sport_day in "${TARGETS[@]}"; do
              sport="${sport_day%%:*}"
              day="${sport_day##*:}"
              body="$(mktemp)"
              ok_day=0
              for attempt in 1 2 3 4; do
                set +e
                code="$(curl -sS --max-time 90 -o "$body" -w '%{http_code}' -H "x-harvest-secret: ${HARVEST_SECRET}" "${BASE}/api/harvest?date=${day}&sport=${sport}&settleOnly=1&gradeResearch=1&trigger=schedule&scheduledSlot=watchdog-recovery&runUrl=${run_url_enc}")"
                curl_ec=$?
                set -e
                echo "harvest ${sport} ${day} attempt=${attempt} curl_ec=${curl_ec} http=${code}"
                body_snip="$(head -c 400 "$body" 2>/dev/null || true)"
                if [ "$curl_ec" -ne 0 ] || [ "$code" = "000" ] || [ "$code" = "429" ] || [ "$code" = "500" ] || [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ] || [ "$code" = "524" ]; then
                  sleep $((attempt * 10))
                  continue
                fi
                if echo "$body_snip" | grep -qiE 'D1.*(overload|too many|busy|retry)|error code: 1102'; then
                  sleep $((attempt * 15))
                  continue
                fi
                jq '{ok,status,finals_graded,errors,dates,executed_bets:(.sports//[])}' "$body" || true
                if [ "$code" = "200" ] && [ "$(jq -r '.ok == true' "$body" 2>/dev/null || echo false)" = "true" ]; then
                  ok_day=1
                  break
                fi
                sleep $((attempt * 5))
              done
              if [ "$ok_day" -ne 1 ]; then
                echo "targeted settle failed for ${sport} ${day}"
                harvest_failed=1
              fi
              sleep 5
            done
          fi
          if [ "$collect_failed" != "0" ] || [ "$harvest_failed" != "0" ]; then
            echo "Catch-up incomplete collect_failed=${collect_failed} harvest_failed=${harvest_failed}"
            exit 1
          fi

  summary:
    name: RESEARCH SUMMARY
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment, collect, action-market-intel, harvest, health]
    if: always()
    steps:
      - name: Consolidated pipeline summary
        env:
          MODE: ${{ needs.determine-mode.outputs.mode }}
          VERIFY: ${{ needs.verify-deployment.result }}
          COLLECT: ${{ needs.collect.result }}
          HARVEST: ${{ needs.harvest.result }}
          HEALTH: ${{ needs.health.result }}
          ACTION: ${{ needs.action-market-intel.result }}
        run: |
          set -euo pipefail
          echo "mode=${MODE}"
          echo "verify-deployment=${VERIFY}"
          echo "collect=${COLLECT}"
          echo "harvest=${HARVEST}"
          echo "health=${HEALTH}"
          echo "action-market-intel=${ACTION} (soft-fail; never blocks pipeline)"
          echo "verify-outcome=${{ needs.verify-deployment.outputs.outcome }}"
          echo "production-sha=${{ needs.verify-deployment.outputs.production_sha }}"
          echo "verify-reason=${{ needs.verify-deployment.outputs.reason }}"
          if [ "$VERIFY" != "success" ]; then
            echo "VERIFY LIVE PRODUCTION SHA fail-closed (no research writes)."
            exit 1
          fi
          if [ "$MODE" = "health" ]; then
            [ "$HEALTH" = "success" ] && exit 0 || exit 1
          fi
          if [ "$MODE" = "collect-full" ] || [ "$MODE" = "collect-cache" ]; then
            [ "$COLLECT" = "success" ] && exit 0 || exit 1
          fi
          if [ "$MODE" = "harvest" ]; then
            [ "$HARVEST" = "success" ] && exit 0 || exit 1
          fi
          if [ "$MODE" = "all" ]; then
            [ "$COLLECT" = "success" ] && [ "$HARVEST" = "success" ] && exit 0 || exit 1
          fi
          echo "Unknown mode ${MODE}"
          exit 1
