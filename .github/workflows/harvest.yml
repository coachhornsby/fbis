name: FBIS research pipeline

# UTC crons are fixed. Chicago offset changes with DST:
# CDT (UTC-5, ~Mar–Nov): 13:00 UTC = 8:00 AM CDT; 11:20 UTC = 6:20 AM CDT
# CST (UTC-6, ~Nov–Mar): 13:00 UTC = 7:00 AM CST; 11:20 UTC = 5:20 AM CST
# Intended operator windows are CDT morning collect / ~06:20 harvest.
# Scheduled verification requires an actual GitHub `schedule` run, not only workflow_dispatch.

on:
  schedule:
    - cron: "0 0,2,13,16,18,20,22 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options:
          - all
          - collect-full
          - collect-cache
          - harvest
        default: all

concurrency:
  group: fbis-research-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Collect projections and/or grade finals
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          JOB_INPUT: ${{ github.event.inputs.job }}
        run: |
          set -euo pipefail
          BASE="https://fbis-myz.pages.dev"
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          JOB="${JOB_INPUT:-}"
          if [ -z "$JOB" ]; then
            if [ "$HOUR" = "11" ] && [ "$MIN" -ge 15 ]; then
              JOB="harvest"
            elif [ "$HOUR" = "13" ] || [ "$HOUR" = "16" ]; then
              JOB="collect-full"
            else
              JOB="collect-cache"
            fi
          fi
          echo "job=$JOB utc=${HOUR}:${MIN}"

          call_api() {
            local path="$1"
            local tmp
            tmp="$(mktemp)"
            local attempt=1
            local max=3
            while [ "$attempt" -le "$max" ]; do
              set +e
              curl -sS --max-time 90 --retry 0 \
                -H "x-harvest-secret: ${HARVEST_SECRET}" \
                -H "accept: application/json" \
                -o "$tmp" -w "%{http_code}" \
                "${BASE}${path}" > "${tmp}.code"
              local curl_ec=$?
              set -e
              if [ "$curl_ec" -eq 0 ]; then
                break
              fi
              echo "transient curl error attempt ${attempt}/${max}"
              if [ "$attempt" -eq "$max" ]; then
                echo "request failed after retries"
                exit 1
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            local http
            http="$(tr -d '\r\n' < "${tmp}.code")"
            if ! jq -e . "$tmp" >/dev/null 2>&1; then
              echo "non-json response http=${http}"
              head -c 400 "$tmp" || true
              echo
              exit 1
            fi
            jq --arg http "$http" '{
              http: $http,
              ok: .ok,
              job: .job,
              status: .status,
              games_discovered: .games_discovered,
              snapshots_inserted: .snapshots_inserted,
              snapshots_already_present: .snapshots_already_present,
              snapshots_failed: .snapshots_failed,
              immutable_conflicts: (.immutable_conflicts // 0),
              failed_writes: (.failed_writes // .snapshots_failed // 0),
              finals_graded: .finals_graded,
              d1_bound: (.d1.bound // null),
              errors: (.errors // []),
              deployment_commit: .deployment_commit,
              model_version: .model_version
            }' "$tmp"
            local summary
            summary="$(jq -r --arg http "$http" '"job=\(.job // "?") status=\(.status // "?") http=\($http) games=\(.games_discovered // 0) inserted=\(.snapshots_inserted // 0) already=\(.snapshots_already_present // 0) conflicts=\(.immutable_conflicts // 0) failed=\(.snapshots_failed // 0) graded=\(.finals_graded // 0) d1=\(.d1.bound // false) commit=\(.deployment_commit // "")"' "$tmp")"
            echo "$summary"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "- $summary" >> "$GITHUB_STEP_SUMMARY"
            fi
            local ok_flag
            ok_flag="$(jq -r '(.ok == true) and (.status == "success")' "$tmp")"
            if [ "$http" != "200" ] || [ "$ok_flag" != "true" ]; then
              echo "job unsuccessful http=${http} ok_flag=${ok_flag}"
              exit 1
            fi
          }

          # One Worker invocation cannot cover every board (subrequest cap).
          # Split by sport, and football by date, so a CFB Saturday cannot exhaust D1 writes.
          SPORTS="mlb nba nfl cfb cbb"
          collect_sport() {
            local odds="$1"
            local sport="$2"
            if [ "$sport" = "cfb" ] || [ "$sport" = "nfl" ]; then
              local off
              for off in -1 0 1 2; do
                echo "collect sport=${sport} dayOffset=${off} odds=${odds}"
                call_api "/api/collect?odds=${odds}&sport=${sport}&dayOffset=${off}"
              done
            else
              echo "collect sport=${sport} odds=${odds}"
              call_api "/api/collect?odds=${odds}&sport=${sport}"
            fi
          }
          run_collect() {
            local odds="$1"
            local sport
            for sport in $SPORTS; do
              collect_sport "$odds" "$sport"
            done
          }
          run_harvest() {
            local sport
            for sport in $SPORTS; do
              echo "harvest sport=${sport}"
              call_api "/api/harvest?days=3&sport=${sport}"
            done
          }

          case "$JOB" in
            collect-full) run_collect full ;;
            collect-cache) run_collect cache ;;
            harvest) run_harvest ;;
            all)
              run_collect full
              run_harvest
              ;;
            *)
              echo "unknown job $JOB"
              exit 1
              ;;
          esac
