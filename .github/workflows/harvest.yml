name: FBIS research pipeline

on:
  schedule:
    - cron: "0 13,16 * * *"
    - cron: "0 0,2,18,20,22 * * *"
    - cron: "20 11,16 * * *"
    # Hourly watchdog. It is read-mostly and only catches up a genuinely missed slot.
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options:
          - all
          - collect-full
          - collect-cache
          - harvest
          - health
        default: all

concurrency:
  group: fbis-research-pipeline
  cancel-in-progress: false

jobs:
  determine-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      trigger: ${{ steps.mode.outputs.trigger }}
      run_url: ${{ steps.mode.outputs.run_url }}
      scheduled_slot: ${{ steps.mode.outputs.scheduled_slot }}
    steps:
      - id: mode
        env:
          JOB_INPUT: ${{ github.event.inputs.job }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_EXPRESSION: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          HOUR="$(date -u +%H)"
          MIN="$(date -u +%M)"
          MODE="${JOB_INPUT:-}"
          TRIGGER="http"
          if [ "${EVENT_NAME}" = "schedule" ]; then
            TRIGGER="schedule"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TRIGGER="workflow_dispatch"
          fi
          if [ -z "$MODE" ]; then
            if [ "${EVENT_NAME}" = "schedule" ] && [ "${SCHEDULED_EXPRESSION}" = "20 11,16 * * *" ]; then
              MODE="harvest"
            elif [ "${EVENT_NAME}" = "schedule" ] && [ "${SCHEDULED_EXPRESSION}" = "0 13,16 * * *" ]; then
              MODE="collect-full"
            elif [ "${EVENT_NAME}" = "schedule" ] && [ "${SCHEDULED_EXPRESSION}" = "0 0,2,18,20,22 * * *" ]; then
              MODE="collect-cache"
            elif [ "${EVENT_NAME}" = "schedule" ]; then
              MODE="health"
            elif [ "$HOUR" = "11" ] && [ "$MIN" -ge 15 ]; then
              MODE="harvest"
            elif [ "$HOUR" = "16" ] && [ "$MIN" -ge 20 ]; then
              MODE="harvest"
            elif [ "$HOUR" = "13" ] || { [ "$HOUR" = "16" ] && [ "$MIN" -lt 20 ]; }; then
              MODE="collect-full"
            else
              MODE="collect-cache"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          echo "scheduled_slot=${SCHEDULED_EXPRESSION:-manual}" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=${MODE} trigger=${TRIGGER} scheduled=${SCHEDULED_EXPRESSION:-manual} actual_utc=${HOUR}:${MIN}"

  verify-deployment:
    runs-on: ubuntu-latest
    needs: [determine-mode]
    outputs:
      outcome: ${{ steps.verify.outputs.verify_outcome }}
      actual: ${{ steps.verify.outputs.verify_actual }}
      reason: ${{ steps.verify.outputs.verify_reason }}
      fail_closed: ${{ steps.verify.outputs.fail_closed }}
    steps:
      - name: Ensure production /api/health matches workflow SHA
        id: verify
        env:
          BASE: "https://fbis-myz.pages.dev"
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          attempts=12
          last_outcome="unavailable"
          last_actual=""
          last_reason="health-unreachable"
          expected="$(echo "$EXPECTED_SHA" | tr 'A-F' 'a-f')"
          for i in $(seq 1 "$attempts"); do
            set +e
            code="$(curl -sS --max-time 20 -D "${tmp}.hdr" -o "$tmp" -w "%{http_code}" "${BASE}/api/health?_t=$(date +%s)")"
            curl_ec=$?
            set -e
            ctype="$(grep -i '^content-type:' "${tmp}.hdr" 2>/dev/null | tr -d '\r' | awk -F': ' '{print tolower($2)}' || true)"
            live=""
            ok_shape="false"
            if [ "$curl_ec" -eq 0 ] && [ "$code" = "200" ] && echo "$ctype" | grep -q 'application/json' && jq -e . "$tmp" >/dev/null 2>&1; then
              live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$tmp")"
              ok_json="$(jq -r '.ok == true' "$tmp")"
              if [ "$ok_json" = "true" ]; then ok_shape="true"; fi
            fi
            actual="$(echo "$live" | tr 'A-F' 'a-f')"
            last_actual="$actual"
            if [ "$curl_ec" -ne 0 ] || [ "$code" = "000" ] || [ "$code" = "429" ] || [ "$code" = "500" ] || [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ]; then
              last_outcome="unavailable"
              last_reason="health-http-${code}"
              echo "TEMPORARY health delay attempt ${i}/${attempts} http=${code} curl_ec=${curl_ec} expected=${expected}"
            elif [ "$ok_shape" != "true" ]; then
              last_outcome="invalid-response"
              last_reason="health-shape-or-content-type"
              echo "INVALID health response attempt ${i}/${attempts} http=${code} content-type=${ctype} expected=${expected}"
            elif [ -z "$actual" ] || [ "$actual" = "unavailable" ] || [ "${#actual}" -ne 40 ]; then
              last_outcome="propagating"
              last_reason="sha-unavailable-or-not-full-40"
              echo "PROPAGATING SHA attempt ${i}/${attempts} expected=${expected} actual=${actual:-<empty>}"
            elif [ "$actual" != "$expected" ]; then
              last_outcome="mismatch"
              last_reason="sha-mismatch"
              echo "SHA MISMATCH attempt ${i}/${attempts} expected=${expected} actual=${actual}"
              if [ "$i" -ge 3 ]; then
                echo "verify_outcome=${last_outcome}" >> "$GITHUB_OUTPUT"
                echo "verify_actual=${last_actual}" >> "$GITHUB_OUTPUT"
                echo "verify_reason=${last_reason}" >> "$GITHUB_OUTPUT"
                echo "fail_closed=true" >> "$GITHUB_OUTPUT"
                echo "Genuine SHA mismatch after bounded retries. Fail closed. expected=${expected} actual=${last_actual}"
                jq . "$tmp" || true
                exit 1
              fi
            else
              echo "Deployment SHA verified: ${actual}"
              echo "verify_outcome=match" >> "$GITHUB_OUTPUT"
              echo "verify_actual=${actual}" >> "$GITHUB_OUTPUT"
              echo "verify_reason=" >> "$GITHUB_OUTPUT"
              echo "fail_closed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 6))
          done
          echo "verify_outcome=${last_outcome}" >> "$GITHUB_OUTPUT"
          echo "verify_actual=${last_actual}" >> "$GITHUB_OUTPUT"
          echo "verify_reason=${last_reason}" >> "$GITHUB_OUTPUT"
          echo "fail_closed=false" >> "$GITHUB_OUTPUT"
          echo "Temporary health/SHA unavailability after retries. Recorded; collection continues. outcome=${last_outcome} expected=${EXPECTED_SHA} actual=${last_actual:-unavailable} reason=${last_reason}"
          jq . "$tmp" || true
          exit 0
      - name: Record verification outcome
        if: always() && steps.verify.outputs.verify_outcome != 'match'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          EXPECTED_SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.verify.outputs.verify_outcome }}
          ACTUAL: ${{ steps.verify.outputs.verify_actual }}
          REASON: ${{ steps.verify.outputs.verify_reason }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          SCHEDULED_SLOT: ${{ needs.determine-mode.outputs.scheduled_slot }}
        run: |
          set -euo pipefail
          if [ -z "${HARVEST_SECRET:-}" ]; then
            echo "HARVEST_SECRET unavailable; cannot persist verify failure row."
            exit 0
          fi
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          SCHEDULED_SLOT_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('SCHEDULED_SLOT',''), safe=''))")"
          curl -sS --max-time 30 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            "${BASE}/api/collect?verifyRecord=1&verifyOutcome=${OUTCOME:-unavailable}&expectedSha=${EXPECTED_SHA}&actualSha=${ACTUAL:-}&reason=${REASON:-}&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}" || true


  collect:
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    if: contains(fromJSON('["collect-full","collect-cache","all"]'), needs.determine-mode.outputs.mode)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sport: [mlb, nba, nfl, cfb, cbb]
    steps:
      - name: Collect by sport (isolated)
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          MODE: ${{ needs.determine-mode.outputs.mode }}
          SPORT: ${{ matrix.sport }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          SCHEDULED_SLOT: ${{ needs.determine-mode.outputs.scheduled_slot }}
        run: |
          set -euo pipefail
          odds="cache"
          if [ "$MODE" = "collect-full" ] || [ "$MODE" = "all" ]; then odds="full"; fi
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          SCHEDULED_SLOT_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('SCHEDULED_SLOT',''), safe=''))")"

          call_api() {
            local path="$1"
            local tmp http curl_ec st ok retryable body_err
            tmp="$(mktemp)"
            for attempt in 1 2; do
              set +e
              curl -sS --max-time 120 --retry 0 \
                -H "x-harvest-secret: ${HARVEST_SECRET}" \
                -H "accept: application/json" \
                -o "$tmp" -w "%{http_code}" \
                "${BASE}${path}&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}&scheduledSlot=${SCHEDULED_SLOT_ENC}" > "${tmp}.code"
              curl_ec=$?
              set -e
              http="$(tr -d '\r\n' < "${tmp}.code")"
              if [ "$curl_ec" -ne 0 ]; then
                echo "transport error attempt ${attempt}/2"
                sleep $((attempt * 5))
                continue
              fi
              if ! jq -e . "$tmp" >/dev/null 2>&1; then
                if [ "$http" = "429" ] || [ "$http" = "500" ] || [ "$http" = "502" ] || [ "$http" = "503" ] || [ "$http" = "504" ]; then
                  echo "non-json retryable http=${http} attempt ${attempt}/2"
                  sleep $((attempt * 5))
                  continue
                fi
                echo "non-json non-retryable http=${http}"
                head -c 300 "$tmp" || true
                return 1
              fi
              st="$(jq -r '.status // ""' "$tmp")"
              ok="$(jq -r '.ok == true' "$tmp")"
              body_err="$(jq -r '(.errors // []) | join(" | ")' "$tmp")"
              retryable="false"
              if [ "$http" = "429" ] || [ "$http" = "500" ] || [ "$http" = "502" ] || [ "$http" = "503" ] || [ "$http" = "504" ]; then retryable="true"; fi
              if [ "$st" = "failed" ] && echo "$body_err" | grep -qiE "429|503|502|504|timeout|temporar|rate|overloaded"; then retryable="true"; fi
              if [ "$retryable" = "true" ] && [ "$attempt" -lt 2 ]; then
                echo "retryable application/http failure http=${http} status=${st} attempt ${attempt}/2"
                sleep $((attempt * 5))
                continue
              fi
              jq --arg http "$http" '{http:$http,ok:.ok,status:.status,sport:.sports,errors:(.errors//[]),games:.games_discovered,writes_failed:.failed_writes}' "$tmp"
              if [ "$http" != "200" ] || [ "$ok" != "true" ] || [ "$st" != "success" ]; then
                return 1
              fi
              return 0
            done
            return 1
          }

          if [ "$SPORT" = "cfb" ] || [ "$SPORT" = "nfl" ]; then
            for off in 0 1 2; do
              call_api "/api/collect?odds=${odds}&sport=${SPORT}&dayOffset=${off}"
            done
          else
            call_api "/api/collect?odds=${odds}&sport=${SPORT}"
          fi

  harvest:
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment, collect]
    if: always() && needs.verify-deployment.result == 'success' && contains(fromJSON('["harvest","all"]'), needs.determine-mode.outputs.mode) && (needs.determine-mode.outputs.mode != 'all' || needs.collect.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sport: [cfb, mlb, nba, nfl, cbb]
    steps:
      - name: Harvest by sport (isolated)
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          TRIGGER: ${{ needs.determine-mode.outputs.trigger }}
          SPORT: ${{ matrix.sport }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
          SCHEDULED_SLOT: ${{ needs.determine-mode.outputs.scheduled_slot }}
        run: |
          set -euo pipefail
          RUN_URL_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          SCHEDULED_SLOT_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('SCHEDULED_SLOT',''), safe=''))")"
          tmp="$(mktemp)"
          for attempt in 1 2 3; do
            set +e
            curl -sS --max-time 540 --retry 0 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              -o "$tmp" -w "%{http_code}" \
              "${BASE}/api/harvest?days=6&sport=${SPORT}&trigger=${TRIGGER}&runUrl=${RUN_URL_ENC}&scheduledSlot=${SCHEDULED_SLOT_ENC}" > "${tmp}.code"
            curl_ec=$?
            set -e
            http="$(tr -d '\r\n' < "${tmp}.code")"
            if [ "$curl_ec" -ne 0 ] || [ "$http" = "429" ] || [ "$http" = "500" ] || [ "$http" = "502" ] || [ "$http" = "503" ] || [ "$http" = "504" ] || [ "$http" = "524" ]; then
              if [ "$attempt" -lt 3 ]; then
                echo "retryable harvest failure sport=${SPORT} http=${http} attempt ${attempt}/3"
                sleep $((attempt * 10))
                continue
              fi
            fi
            break
          done
          if ! jq -e . "$tmp" >/dev/null 2>&1; then
            echo "non-json harvest response http=${http}"
            head -c 300 "$tmp" || true
            exit 1
          fi
          jq --arg http "$http" '{http:$http,ok:.ok,status:.status,sport:(.sports // []),finals_graded:.finals_graded,executed_bets:[(.sports // [])[] | {sport,executedBets}],errors:(.errors // [])}' "$tmp"
          ok="$(jq -r '.ok == true' "$tmp")"
          st="$(jq -r '.status // ""' "$tmp")"
          if [ "$http" != "200" ] || [ "$ok" != "true" ] || [ "$st" != "success" ]; then
            exit 1
          fi

  health:
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment]
    if: needs.determine-mode.outputs.mode == 'health'
    steps:
      - name: Health diagnostic and missed-slot recovery
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          RUN_URL: ${{ needs.determine-mode.outputs.run_url }}
        run: |
          set -euo pipefail
          BASE="https://fbis-myz.pages.dev"
          tmp="$(mktemp)"
          curl -sS --max-time 20 "${BASE}/api/health?_t=$(date +%s)" -o "$tmp"
          jq . "$tmp"
          collect_state="$(jq -r '.pipeline.schedule.collect.state // "unknown"' "$tmp")"
          harvest_state="$(jq -r '.pipeline.schedule.harvest.state // "unknown"' "$tmp")"
          if [ "$collect_state" != "missed" ] && [ "$harvest_state" != "missed" ]; then
            echo "No catch-up required. collect=${collect_state} harvest=${harvest_state}"
            exit 0
          fi
          if [ -z "${HARVEST_SECRET:-}" ]; then
            echo "A scheduled slot is missed but HARVEST_SECRET is unavailable; fail visibly."
            exit 1
          fi
          run_url_enc="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          if [ "$collect_state" = "missed" ]; then
            echo "Recovering missed collect slot"
            body="$(mktemp)"
            code="$(curl -sS --max-time 180 -o "$body" -w '%{http_code}' -H "x-harvest-secret: ${HARVEST_SECRET}" "${BASE}/api/collect?mode=cache&sport=all&trigger=schedule&scheduledSlot=watchdog-recovery&runUrl=${run_url_enc}")"
            jq '{ok,status,mode,sports,errors}' "$body"
            [ "$code" = "200" ] && [ "$(jq -r '.ok == true' "$body")" = "true" ] || exit 1
          fi
          if [ "$harvest_state" = "missed" ]; then
            echo "Recovering missed harvest slot"
            harvest_failed=0
            for sport in cfb mlb nba nfl cbb; do
              body="$(mktemp)"
              ok_sport=0
              for attempt in 1 2 3; do
                set +e
                code="$(curl -sS --max-time 540 -o "$body" -w '%{http_code}' -H "x-harvest-secret: ${HARVEST_SECRET}" "${BASE}/api/harvest?days=6&sport=${sport}&trigger=schedule&scheduledSlot=watchdog-recovery&runUrl=${run_url_enc}")"
                curl_ec=$?
                set -e
                echo "harvest ${sport} attempt=${attempt} curl_ec=${curl_ec} http=${code}"
                if [ "$curl_ec" -ne 0 ] || [ "$code" = "000" ] || [ "$code" = "504" ] || [ "$code" = "524" ]; then
                  sleep $((attempt * 8))
                  continue
                fi
                jq '{ok,status,finals_graded,errors}' "$body" || true
                if [ "$code" = "200" ] && [ "$(jq -r '.ok == true' "$body" 2>/dev/null || echo false)" = "true" ]; then
                  ok_sport=1
                  break
                fi
                sleep $((attempt * 5))
              done
              if [ "$ok_sport" -ne 1 ]; then harvest_failed=1; fi
            done
            [ "$harvest_failed" = "0" ] || exit 1
          fi

  summary:
    runs-on: ubuntu-latest
    needs: [determine-mode, verify-deployment, collect, harvest, health]
    if: always()
    steps:
      - name: Consolidated pipeline summary
        env:
          MODE: ${{ needs.determine-mode.outputs.mode }}
          VERIFY: ${{ needs.verify-deployment.result }}
          COLLECT: ${{ needs.collect.result }}
          HARVEST: ${{ needs.harvest.result }}
          HEALTH: ${{ needs.health.result }}
        run: |
          set -euo pipefail
          echo "mode=${MODE}"
          echo "verify-deployment=${VERIFY}"
          echo "collect=${COLLECT}"
          echo "harvest=${HARVEST}"
          echo "health=${HEALTH}"
          echo "verify-outcome=${{ needs.verify-deployment.outputs.outcome }}"
          echo "verify-actual=${{ needs.verify-deployment.outputs.actual }}"
          echo "verify-reason=${{ needs.verify-deployment.outputs.reason }}"
          if [ "$VERIFY" != "success" ]; then
            echo "Deployment SHA verification fail-closed (genuine mismatch)."
            exit 1
          fi
          if [ "$MODE" = "health" ]; then
            [ "$HEALTH" = "success" ] && exit 0 || exit 1
          fi
          if [ "$MODE" = "collect-full" ] || [ "$MODE" = "collect-cache" ]; then
            [ "$COLLECT" = "success" ] && exit 0 || exit 1
          fi
          if [ "$MODE" = "harvest" ]; then
            [ "$HARVEST" = "success" ] && exit 0 || exit 1
          fi
          if [ "$MODE" = "all" ]; then
            [ "$COLLECT" = "success" ] && [ "$HARVEST" = "success" ] && exit 0 || exit 1
          fi
          echo "Unknown mode ${MODE}"
          exit 1
