name: Projection sheet export

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/projection-sheet-export.yml"
      - "functions/api/projection-sheet-feed.js"
      - "functions/api/player-projection-sheet-feed.js"
      - "functions/lib/productProjection.js"
      - "functions/api/wager-feed.js"
      - "services/sports-projection-orchestrator/orchestrator.mjs"
      - "workers/sports-projection-orchestrator-worker.mjs"

permissions:
  contents: read
  id-token: write

concurrency:
  group: projection-sheet-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Warm Ballpark Pal cache for MLB projection window
        # Ballpark Pal is MLB-only enrichment. Its outage must never suppress
        # the cross-sport projection export, wager feed, or sheet sync.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for off in -1 0; do
            date="$(TZ=America/Chicago date -d "$off day" +%F)"
            body="$(mktemp)"
            code="$(curl -sS --max-time 90 --retry 1 --retry-all-errors               -o "$body" -w "%{http_code}"               "https://fbis-myz.pages.dev/api/slate?sport=mlb&date=${date}&_t=$(date +%s)")"
            echo "pal-cache-warm date=${date} http=${code}"
            test "$code" = "200"
            jq -e '.pal.enabled == true' "$body" >/dev/null
            jq -c '{date:"'"${date}"'",pal:{cached:.pal.cached,stage:.pal.stage,recordsReturned:.pal.recordsReturned,usable:.pal.usable,matched:.pal.matched,reason:.pal.reason}}' "$body"
          done

      - name: Grade recent frozen projections from free scoreboards
        env:
          BASE: https://fbis-myz.pages.dev
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          COLLEGE_DATA_API_KEY: ${{ secrets.COLLEGE_DATA_API_KEY }}
        shell: bash
        run: |
          set -u
          test -n "${HARVEST_SECRET:-}" || { echo "Missing HARVEST_SECRET"; exit 1; }
          ok=0
          failed=0
          matched=0
          unmatched=0
          today="$(TZ=America/Chicago date +%F)"
          for offset in 0 1 2; do
            day="$(TZ=America/Chicago date -d "$today - $offset day" +%F)"
            for sport in mlb npb kbo nfl nba wnba nhl cfb cbb soccer; do
              payload="$(mktemp)"
              response="$(mktemp)"
              if node scripts/fetch-final-scoreboard.mjs "$sport" "$day" > "$payload"; then
                finals="$(jq -r '.completed // 0' "$payload")"
                if [ "$finals" = "0" ]; then
                  continue
                fi
                http="$(curl -sS --max-time 120 --retry 1 --retry-delay 2                   -X POST                   -H "x-harvest-secret: ${HARVEST_SECRET}"                   -H "content-type: application/json"                   --data-binary "@$payload"                   -o "$response" -w "%{http_code}"                   "$BASE/api/final-grade")"
                if [ "$http" = "200" ] && jq -e '.ok == true' "$response" >/dev/null 2>&1; then
                  ok=$((ok+1))
                  m="$(jq -r '.matched // 0' "$response")"
                  u="$(jq -r '.unmatched // 0' "$response")"
                  matched=$((matched+m))
                  unmatched=$((unmatched+u))
                  echo "hourly-grade sport=$sport date=$day finals=$finals matched=$m unmatched=$u"
                else
                  failed=$((failed+1))
                  echo "hourly-grade FAILED sport=$sport date=$day http=$http"
                  cat "$response" || true
                fi
              else
                failed=$((failed+1))
                echo "scoreboard fetch FAILED sport=$sport date=$day"
              fi
            done
          done
          {
            echo "## Hourly final grading"
            echo "- successful batches: $ok"
            echo "- failed batches: $failed"
            echo "- matched snapshot ids: $matched"
            echo "- unresolved snapshot ids: $unmatched"
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail soft by sport/date; the next hourly run retries unresolved finals.

      - name: Export live projection slates
        env:
          BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          out="artifacts/projection-sheet-export.ndjson"
          : > "$out"

          export_one () {
            sport="$1"; date="$2"
            tmp="$(mktemp)"
            code="$(curl -sS --max-time 120 -o "$tmp" -w "%{http_code}" "$BASE/api/projections?sport=${sport}&date=${date}")"
            echo "projection-export sport=${sport} date=${date} http=${code}"
            if [ "$code" != "200" ]; then
              echo "Projection endpoint failed for ${sport} ${date}:"
              cat "$tmp" || true
              return 1
            fi
            if ! jq -e '.ok == true and (.games | type == "array")' "$tmp" >/dev/null; then
              echo "Projection endpoint returned an invalid contract for ${sport} ${date}:"
              cat "$tmp" || true
              return 1
            fi
            jq -c --arg sport "$sport" --arg date "$date" '{
              marker:"SHEET_EXPORT",sport:$sport,date:$date,generatedAt:.generatedAt,
              games:[.games[]|{
                id,start,away:.away.abbr,home:.home.abbr,neutral,
                modelName:.model.name,engine:.model.engine,maturity:.model.maturity,
                modelVersion:.modelVersion,
                independent:.projection.independent,
                awayProj:.projection.away,homeProj:.projection.home,
                margin:.projection.margin,total:.projection.total,
                marketSpread:.market.spread,marketTotal:.market.total,marketSource:.market.source,
                qualityScore:.quality.score,qualityState:.quality.state,flags:.quality.flags,
                gameState:.gameState,snapshot:.snapshot,leagueTiming:.leagueTiming,
                subprojections:.subprojections,playerProjections:.playerProjections,
                unavailableReason:.projection.unavailableReason
              }]
            }' "$tmp" | tee -a "$out"
          }

          # This job exports live/current slates. Hard-coded historical dates
          # eventually age outside the product API window and create false-red
          # hourly failures. Resolve dates from America/Chicago each run instead.
          today="$(TZ=America/Chicago date +%F)"
          dates=(
            "$today"
            "$(TZ=America/Chicago date -d "$today + 1 day" +%F)"
            "$(TZ=America/Chicago date -d "$today + 2 days" +%F)"
          )

          failed=0
          for sport in mlb npb kbo nfl cfb cbb nba wnba nhl soccer; do
            for date in "${dates[@]}"; do
              if ! export_one "$sport" "$date"; then
                failed=1
              fi
            done
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more live projection exports failed."
            exit 1
          fi

      - name: Build actionable wager feed
        env:
          BASE: https://fbis-myz.pages.dev
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET}" || { echo "Missing HARVEST_SECRET"; exit 1; }
          mkdir -p artifacts
          raw="artifacts/wager-feed-raw.ndjson"
          out="artifacts/wager-feed.json"
          : > "$raw"
          today="$(TZ=America/Chicago date +%F)"
          dates=(
            "$today"
            "$(TZ=America/Chicago date -d "$today + 1 day" +%F)"
            "$(TZ=America/Chicago date -d "$today + 2 days" +%F)"
          )
          for sport in mlb npb kbo nfl cfb cbb nba wnba nhl soccer; do
            for date in "${dates[@]}"; do
              tmp="$(mktemp)"
              code="$(curl -sS --max-time 120 --retry 1 --retry-all-errors                 -H "x-harvest-secret: ${HARVEST_SECRET}"                 -o "$tmp" -w "%{http_code}"                 "$BASE/api/wager-feed?sport=${sport}&date=${date}")"
              echo "wager-feed sport=${sport} date=${date} http=${code}"
              test "$code" = "200"
              if ! jq -e '.ok == true and (.rows | type == "array")' "$tmp" >/dev/null 2>&1; then
                echo "INVALID WAGER FEED RESPONSE sport=${sport} date=${date}"
                head -c 2000 "$tmp" || true
                echo
                exit 1
              fi
              jq -c '.' "$tmp" >> "$raw"
            done
          done
          jq -s '[.[].rows[]] | unique_by([.sport,.eventStart,.market,.pick,.side,.line])' "$raw" > "$out"
          echo "wager-feed rows=$(jq 'length' "$out") ready=$(jq '[.[]|select(.status=="READY")]|length' "$out") shop=$(jq '[.[]|select(.decision=="SHOP")]|length' "$out")"
          {
            echo "## Actionable wager feed"
            echo "- Qualified candidates: $(jq 'length' "$out")"
            echo "- READY bets: $(jq '[.[]|select(.status=="READY")]|length' "$out")"
            echo "- SHOP candidates: $(jq '[.[]|select(.decision=="SHOP")]|length' "$out")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist projection feeds to Google Sheets
        id: sheet_sync
        env:
          ORCH_URL: https://fbis-orchestrator.coachhornsby.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          sep='?'
          if [[ "$url" == *'?'* ]]; then sep='&'; fi
          oidc_body="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${url}${sep}audience=sports-projection-orchestrator")"
          token="$(jq -r '.value // empty' <<<"$oidc_body")"
          test -n "$token"
          body="$(mktemp)"
          http="$(curl -sS --max-time 180 --retry 1 --retry-all-errors             -X POST             -H "Authorization: Bearer ${token}"             -H "content-type: application/json"             -d '{}'             -o "$body" -w "%{http_code}"             "${ORCH_URL}/api/sync-operational-sheets")"
          echo "OPERATIONAL SHEET SYNC HTTP=$http"
          cat "$body"
          test "$http" = "200"
          jq -e '.ok == true and .ledger.persisted > 0 and .npb.persisted >= 0 and .kbo.persisted >= 0 and .pitchers.exactPersisted >= 0 and .opsTelemetry.healthRows > 0' "$body" >/dev/null

          wager_payload="$(mktemp)"
          jq -c '{rows:.}' artifacts/wager-feed.json > "$wager_payload"
          wager_body="$(mktemp)"
          wager_http="$(curl -sS --max-time 180 --retry 1 --retry-all-errors             -X POST             -H "Authorization: Bearer ${token}"             -H "content-type: application/json"             --data-binary "@$wager_payload"             -o "$wager_body" -w "%{http_code}"             "${ORCH_URL}/api/sync-wager-feed")"
          echo "WAGER FEED SYNC HTTP=$wager_http"
          cat "$wager_body"
          test "$wager_http" = "200"
          jq -e '.ok == true and .persisted >= 0' "$wager_body" >/dev/null
          {
            echo "## Operational Google Sheet persistence"
            echo "- Projection Ledger rows: $(jq -r '.ledger.persisted' "$body")"
            echo "- Exact MLB pitcher rows: $(jq -r '.pitchers.exactPersisted' "$body")"
            echo "- NPB Ops rows: $(jq -r '.npb.persisted' "$body")"
            echo "- KBO Ops rows: $(jq -r '.kbo.persisted' "$body")"
            echo "- Ops health rows: $(jq -r '.opsTelemetry.healthRows' "$body")"
            echo "- Ops incident rows: $(jq -r '.opsTelemetry.incidentRows' "$body")"
            echo "- Ops avg MTTR sec: $(jq -r '.opsTelemetry.avgMttrSeconds // "null"' "$body")"
            echo "- Wager Feed rows: $(jq -r '.persisted' "$wager_body")"
            echo "- Wager Feed READY: $(jq -r '.ready' "$wager_body")"
            echo "- Wager Feed SHOP: $(jq -r '.shop' "$wager_body")"
            echo "- Synced: $(jq -r '.syncedAt' "$body")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload projection export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-sheet-export-${{ github.run_id }}
          path: |
            artifacts/projection-sheet-export.ndjson
            artifacts/wager-feed-raw.ndjson
            artifacts/wager-feed.json
          if-no-files-found: warn
          retention-days: 14
