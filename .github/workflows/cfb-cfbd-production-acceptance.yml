name: CFB CFBD controlled production acceptance
on:
  push:
    branches:
      - ops/cfb-cfbd-live-acceptance-20261015
    paths:
      - .github/workflows/cfb-cfbd-production-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cfb-cfbd-controlled-acceptance
  cancel-in-progress: false
jobs:
  quota-exhaustion-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify current provider quota from authoritative health
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          mkdir -p artifacts
          code=$(curl -sS --max-time 45 -o artifacts/before.json -w '%{http_code}' -H "x-harvest-secret: ${HARVEST_SECRET}" "https://fbis-myz.pages.dev/api/college?job=college-health&trigger=workflow_dispatch")
          echo "health HTTP=${code}"
          jq -c '{ok,status,acquisition:.d1.cfbdAcquisition}' artifacts/before.json
          test "$code" = "200"
          jq -e '.ok == true and .d1.cfbdAcquisition.bound == true and .d1.cfbdAcquisition.providerRemaining == 0 and .d1.cfbdAcquisition.rateLimited >= 1' artifacts/before.json >/dev/null
      - name: Prove CFB/CBBD scheduled jobs pause without network requests
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for job in cfb-postgame-harvest cfb-current-refresh cbb-current-refresh cbb-postgame-harvest; do
            file="artifacts/${job}.json"
            code=$(curl -sS --max-time 45 -o "$file" -w '%{http_code}' -H "x-harvest-secret: ${HARVEST_SECRET}" "https://fbis-myz.pages.dev/api/college?job=${job}&trigger=schedule")
            echo "${job} HTTP=${code}"
            jq -c '{ok,status,reason,networkCalls,sdvCollectionUnaffected,acquisition:.d1.cfbdAcquisition}' "$file"
            test "$code" = "200"
            jq -e '.status == "paused" and .reason == "COLLEGE_SHARED_MONTHLY_QUOTA_EXHAUSTED" and .networkCalls == 0' "$file" >/dev/null
          done
      - name: Prove no additional provider calls were reserved
        if: always()
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 45 -o artifacts/after.json -w '%{http_code}' -H "x-harvest-secret: ${HARVEST_SECRET}" "https://fbis-myz.pages.dev/api/college?job=college-health&trigger=workflow_dispatch")
          echo "health-after HTTP=${code}"
          jq -c '{acquisition:.d1.cfbdAcquisition}' artifacts/after.json
          jq -e '.d1.cfbdAcquisition.attemptsToday == 1 and .d1.cfbdAcquisition.providerRemaining == 0' artifacts/after.json >/dev/null
      - name: Upload private diagnostic proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-cfbd-quota-paused-proof
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
