name: NBA Phase 26 independent R2 recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/nba-independent-r2-recovery.mjs"
      - ".github/workflows/nba-phase26-independent-r2-recovery.yml"
permissions:
  contents: read
concurrency:
  group: nba-phase26-independent-r2-recovery
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with:
          repository: coachhornsby/fbis
          run-id: 40060554881
          pattern: nba-primary-archive-shard-*
          path: archive-evidence
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Independent R2 retrieval and local SQLite recovery (no PRIMARY access)
        env:
          NBA_RECOVERY_SHARD: ${{ matrix.shard }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/nba-independent-r2-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-independent-r2-recovery-${{ matrix.shard }}
          path: artifacts/nba-independent-recovery/shard-${{ matrix.shard }}/receipt.json
          if-no-files-found: warn
          retention-days: 90
