name: CBB FBIS native v1 walk-forward

on:
  push:
    branches: [main]
    paths:
      - "functions/lib/cbbFbisRatings.js"
      - "functions/lib/cbbFbisHca.js"
      - "functions/lib/cbbConferenceMembership.js"
      - "functions/lib/collegeApply.js"
      - "functions/lib/collegeModels.js"
      - "functions/api/cbb-walkforward-source.js"
      - "scripts/cbb-fbis-native-v1-walkforward.mjs"
      - "scripts/cbb-fbis-native-v1-aggregate.mjs"
      - "scripts/cbb-fbis-v2-fit.mjs"
      - "scripts/cbb-hca-rankings-v1.mjs"
      - "test/cbb-fbis-native-v1.test.js"
      - ".github/workflows/cbb-fbis-native-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbb-fbis-native-v1-partitioned-v2
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Unit test native FBIS CBB engine
        run: node --test test/cbb-fbis-native-v1.test.js
      - name: Verify native CBB source endpoint is live
        env:
          HARVEST_SECRET: "${{ secrets.HARVEST_SECRET }}"
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 https://fbis-myz.pages.dev/api/health)"
          printf '%s' "$health" | jq -e 'type == "object"' >/dev/null
          # Do not block research on deployment SHA churn. Native endpoint code
          # was deployed separately; this workflow only needs production alive.
          echo "production health OK"

  season:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        season: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Download pinned leakage-safe benchmark
        uses: actions/download-artifact@v4
        with:
          name: cbb-structural-snapshot-37166703044
          github-token: "${{ github.token }}"
          repository: coachhornsby/fbis
          run-id: 37166703044
          path: artifacts/source
      - name: Run season ${{ matrix.season }}
        env:
          HARVEST_SECRET: "${{ secrets.HARVEST_SECRET }}"
          FBIS_BASE: "https://fbis-myz.pages.dev"
          FBIS_SEASONS: "${{ matrix.season }}"
        run: |
          set -euo pipefail
          node scripts/cbb-fbis-native-v1-walkforward.mjs             artifacts/source/base/cbb-data-stack-predictions.json             artifacts/source/base/cbb-market-research-dataset.json             | tee "artifacts/cbb-fbis-native-v1-run-${{ matrix.season }}.log"
      - name: Validate season artifact
        run: |
          set -euo pipefail
          F="artifacts/cbb-fbis-native-v1-walkforward-${{ matrix.season }}.json"
          jq -e '.ok == true and .rows >= 0' "$F" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: cbb-fbis-native-v1-season-${{ matrix.season }}-${{ github.run_id }}
          path: |
            artifacts/cbb-fbis-native-v1-walkforward-${{ matrix.season }}.json
            artifacts/cbb-fbis-native-v1-predictions-${{ matrix.season }}.json
            artifacts/cbb-fbis-native-v1-run-${{ matrix.season }}.log
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: season
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Download season artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cbb-fbis-native-v1-season-*-${{ github.run_id }}
          path: artifacts/parts
          merge-multiple: true
      - name: Require all 8 season prediction files
        run: |
          set -euo pipefail
          count=$(find artifacts/parts -name 'cbb-fbis-native-v1-predictions-20*.json' | wc -l)
          echo "season prediction artifacts=$count"
          test "$count" -eq 8
      - name: Aggregate full walk-forward
        run: |
          set -euo pipefail
          node scripts/cbb-fbis-native-v1-aggregate.mjs artifacts/parts | tee artifacts/cbb-fbis-native-v1-aggregate.log
      - name: Fit residual, margin and confidence layers
        run: |
          set -euo pipefail
          node scripts/cbb-fbis-v2-fit.mjs artifacts/cbb-fbis-native-v2-predictions.json | tee artifacts/cbb-fbis-v2-fit.log
      - name: Fit money-first market residual selector
        run: |
          set -euo pipefail
          node scripts/cbb-money-selector-v1.mjs artifacts/cbb-fbis-native-v2-predictions.json artifacts/cbb-fbis-v2-fit.json | tee artifacts/cbb-money-selector-v1.log
          jq -e '.id == "CBB-MONEY-SELECTOR-v1" and .automaticWagerAuthorization == false' artifacts/cbb-money-selector-v1.json >/dev/null
      - name: Syntax check HCA rankings generator
        run: node --check scripts/cbb-hca-rankings-v1.mjs
      - name: Generate current FBIS HCA rankings
        run: |
          set -euo pipefail
          node scripts/cbb-hca-rankings-v1.mjs artifacts/parts/cbb-fbis-native-v1-predictions-2025.json | tee artifacts/cbb-hca-rankings-v1.log
          jq -e '.teams > 300 and .venueCoveragePct >= 85' artifacts/cbb-hca-rankings-v1.json >/dev/null
      - name: Summarize
        run: |
          F=artifacts/cbb-fbis-native-v1-walkforward.json
          FIT=artifacts/cbb-fbis-v2-fit.json
          jq -e '.ok == true and .rows > 0' "$F" >/dev/null
          {
            echo "## FBIS-CBB-RATINGS-v1 partitioned walk-forward"
            jq -r '"- all: FBIS total MAE=\(.samples.all.fbis.totalMae), KenPom=\(.samples.all.kenpom.totalMae), advantage=\(.samples.all.totalMaeAdvantage)"' "$F"
            jq -r '"- validation 2023-24: FBIS=\(.samples.validation.fbis.totalMae), KenPom=\(.samples.validation.kenpom.totalMae), advantage=\(.samples.validation.totalMaeAdvantage)"' "$F"
            jq -r '"- confirmation 2025: FBIS=\(.samples.confirmation.fbis.totalMae), KenPom=\(.samples.confirmation.kenpom.totalMae), advantage=\(.samples.confirmation.totalMaeAdvantage)"' "$F"
            jq -r '"- total promotion screen: \(.promotion.totalPass)"' "$F"
            jq -r '"- residual total layer enabled: \(.total.enabled), validation gain=\(.total.evaluation.validation.gain), 2025 gain=\(.total.evaluation.confirmation.gain)"' "$FIT"
            jq -r '"- dedicated margin layer enabled: \(.margin.enabled), validation gain=\(.margin.evaluation.validation.gain), 2025 gain=\(.margin.evaluation.confirmation.gain)"' "$FIT"
            jq -r '"- market confidence layer enabled: \(.confidence.enabled), validation ROI=\(.confidence.evaluation.validation.roi)%, 2025 ROI=\(.confidence.evaluation.confirmation.roi)%"' "$FIT"
            jq -r '"- HCA rankings: teams=\(.teams), venue coverage=\(.venueCoveragePct)%, altitude coverage=\(.altitudeCoveragePct)%"' artifacts/cbb-hca-rankings-v1.json
            jq -r '"- money selector side threshold=\(.models.side.thresholdSelection.threshold), validation ROI=\(.models.side.validation.roi)%, 2025 secondary ROI=\(.models.side.secondary2025.roi)%"' artifacts/cbb-money-selector-v1.json
            jq -r '"- frozen side dislocation >=10: validation ROI=\(.sideDislocation.validation.roi)%, 2025 secondary ROI=\(.sideDislocation.secondary2025.roi)%"' artifacts/cbb-money-selector-v1.json
            jq -r '"- money selector total threshold=\(.models.total.thresholdSelection.threshold), validation ROI=\(.models.total.validation.roi)%, 2025 secondary ROI=\(.models.total.secondary2025.roi)%"' artifacts/cbb-money-selector-v1.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cbb-fbis-native-v1-aggregate-${{ github.run_id }}
          path: |
            artifacts/cbb-fbis-native-v1-walkforward.json
            artifacts/cbb-fbis-native-v2-predictions.json
            artifacts/cbb-fbis-native-v1-aggregate.log
            artifacts/cbb-fbis-v2-fit.json
            artifacts/cbb-fbis-v2-fit.log
            artifacts/cbb-hca-rankings-v1.json
            artifacts/cbb-hca-rankings-v1.csv
            artifacts/cbb-hca-rankings-v1.log
          if-no-files-found: error
          retention-days: 90
