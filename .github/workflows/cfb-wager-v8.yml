name: CFB v8 wager engine
on:
  push:
    branches: ["research/cfb-v5-context-engine"]
    paths: ["scripts/cfb-wager-v8.py",".github/workflows/cfb-wager-v8.yml"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  wager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas numpy scikit-learn
      - name: Restore frozen v6 control
        uses: actions/download-artifact@v4
        with:
          name: cfb-v6
          path: artifacts/cfb-control
          github-token: ${{ github.token }}
          run-id: 37179014409
      - name: Run walk-forward wager engine
        run: python scripts/cfb-wager-v8.py
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-wager-v8
          path: artifacts/cfb-final/wager-v8/*
          retention-days: 90
