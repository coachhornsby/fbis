name: FBIS core-market hourly heartbeat
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-market-hourly-watchdog.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: fbis-core-market-hourly-heartbeat
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - name: Unit-check health and bounded recovery policy
        run: node --test test/core-market-pulse.test.mjs
      - name: Verify published Pages SHA on push
        if: github.event_name == 'push'
        run: node scripts/verify-deployment-sha.mjs "$GITHUB_SHA"
      - name: Inspect live PinnOdds and Polymarket; repair disconnected WS once
        id: pulse
        continue-on-error: true
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: node scripts/core-market-pulse.mjs
      - name: Publish CORE board snapshot (schedule backup for 15m SLA)
        id: core_snapshot
        continue-on-error: true
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE_URL: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/core-board-snapshot-ops.mjs | tee artifacts/core-board-snapshot-ops-hourly.json
          jq -e '.ok==true and .canAuthorizeWager==false and (.failures|length)==0' \
            artifacts/core-board-snapshot-ops-hourly.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-market-pulse-${{ github.run_id }}
          path: |
            artifacts/core-market-pulse.json
            artifacts/core-board-snapshot-ops-hourly.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Reconcile persistent infrastructure incident
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PULSE_RESULT: ${{ steps.pulse.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="FBIS core-market heartbeat degraded"
          issue="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [ "$PULSE_RESULT" != "success" ]; then
            if [ -z "$issue" ]; then
              gh issue create --title "$title" --body "Core PinnOdds/Polymarket heartbeat failed. Automatic recovery is limited to one signed Polymarket WebSocket reconnect; paid PinnOdds or Action collections are NEVER launched by this watchdog. See $RUN_URL and its core-market-pulse artifact for causes and current state."
            fi
            echo "Core market infrastructure DEGRADED: $RUN_URL"
            exit 1
          fi
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Hourly heartbeat has recovered at $RUN_URL. Closed automatically after a successful read-only verification."
          fi
          echo "Core market infrastructure HEALTHY: $RUN_URL"
