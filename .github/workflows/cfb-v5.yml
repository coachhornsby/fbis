name: CFB v5 context research
on:
  push:
    branches: ["research/cfb-v5-context-engine"]
    paths:
      - "scripts/cfb-v5-context.py"
      - "scripts/cfb-v5-walkforward.py"
      - "scripts/cfb-bulk-history-v3.py"
      - "scripts/cfb-provenance-catalog.py"
      - "scripts/cfb-conference-history.py"
      - "scripts/fbis-freeze-snapshot.py"
      - "scripts/fbis-publish-r2.py"
      - ".github/workflows/cfb-v5.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cfb-v5-context-research
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn
      - name: Preflight Cloudflare archive credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Build historical conference dimension from SportsDataverse
        env:
          CFB_CONF_START: "2004"
          CFB_CONF_END: "2026"
        run: python scripts/cfb-conference-history.py
      - name: Build CFB game history
        env:
          CFB_BULK_START: "2004"
          CFB_BULK_END: "2026"
        run: python scripts/cfb-bulk-history-v3.py
      - name: Build program context
        env:
          CFB_CONTEXT_START: "2004"
          CFB_CONTEXT_END: "2026"
        run: python scripts/cfb-program-context.py
      - run: python scripts/cfb-final-enrich.py
      - name: Build provenance and temporal catalog
        run: python scripts/cfb-provenance-catalog.py
      - name: Freeze canonical research warehouse before model tests
        run: |
          V="CFB-2004-2026-${GITHUB_SHA::12}"
          mkdir -p artifacts/cfb-warehouse
          cp -a artifacts/cfb-history-v2 artifacts/cfb-warehouse/history
          cp -a artifacts/cfb-context artifacts/cfb-warehouse/program-context
          cp -a artifacts/cfb-conference artifacts/cfb-warehouse/conference
          cp artifacts/cfb-final/cfb_training_full_enriched_2004_2026.csv artifacts/cfb-warehouse/
          cp artifacts/cfb-final/cfb_training_full_enriched_2004_2026.parquet artifacts/cfb-warehouse/
          cp artifacts/cfb-final/cfb_final_qa.json artifacts/cfb-warehouse/
          cp artifacts/cfb-final/provenance-catalog.json artifacts/cfb-warehouse/
          python scripts/fbis-freeze-snapshot.py --sport CFB --version "$V" --out artifacts/cfb-warehouse/manifest.json --root artifacts/cfb-warehouse
          python scripts/fbis-verify-snapshot.py artifacts/cfb-warehouse/manifest.json
      - name: Publish immutable warehouse to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/fbis-publish-r2.py artifacts/cfb-warehouse/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-canonical-snapshot
          path: |
            artifacts/cfb-warehouse/manifest.json
            artifacts/cfb-warehouse/cfb_final_qa.json
            artifacts/cfb-warehouse/provenance-catalog.json
          retention-days: 90
      - run: python scripts/cfb-v3-walkforward.py
      - run: python scripts/cfb-v4-walkforward.py
      - name: Build v5 context and conference power
        run: python scripts/cfb-v5-context.py
      - name: Run v5 walk-forward
        run: python scripts/cfb-v5-walkforward.py
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-v5
          path: |
            artifacts/cfb-final/v5-context/*
            artifacts/cfb-final/model-v5/*
            artifacts/cfb-final/model-v4/*
          retention-days: 90
