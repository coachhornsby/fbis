name: Daily results and grading

# Free/non-ACTION final-score settlement. Runs after the 07:00 Central ACTION
# snapshot so yesterday's closing market state can be joined to final results.
on:
  schedule:
    - cron: "20 12 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:

concurrency:
  group: daily-results-grade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  settle:
    name: RESULTS 07:20 CT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout grading code
        uses: actions/checkout@v4.2.2

      - name: Gate to 07:20 America/Chicago
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hour="$(TZ=America/Chicago date +%H)"
          local_min="$(TZ=America/Chicago date +%M)"
          if [ "$local_hour" = "07" ] && [ "$local_min" -ge "15" ] && [ "$local_min" -le "30" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "UTC twin cron outside 07:20 Central; no settlement call."
          fi

      - name: Settle yesterday from free scoreboard sources
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          yesterday="$(TZ=America/Chicago date -d 'yesterday' +%F)"
          echo "settling ${yesterday}"
          for sport in mlb nfl nba nhl cfb cbb; do
            body="$(mktemp)"
            set +e
            http="$(curl -sS --max-time 180 --retry 1 --retry-delay 4 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              -o "$body" -w "%{http_code}" \
              "${BASE}/api/harvest?date=${yesterday}&sport=${sport}&settleOnly=1&gradeResearch=1&trigger=schedule&scheduledSlot=daily-results-0720")"
            ec=$?
            set -e
            echo "results sport=${sport} curl_ec=${ec} http=${http:-000}"
            if jq -e . "$body" >/dev/null 2>&1; then
              jq -c '{ok,status,sport,finalsSeen,settled,graded,errors:(.errors//[])}' "$body"
            else
              head -c 400 "$body" || true
              echo
            fi
            # Results are free and isolated by sport. One failed league must not
            # prevent the others from settling.
          done

      - name: Push trusted scoreboard finals into all-projection grader
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          COLLEGE_DATA_API_KEY: ${{ secrets.COLLEGE_DATA_API_KEY }}
        shell: bash
        run: |
          set -u
          yesterday="$(TZ=America/Chicago date -d 'yesterday' +%F)"
          ok=0
          fail=0
          matched=0
          for sport in mlb nfl nba nhl cfb cbb; do
            payload="$(mktemp)"
            if node scripts/fetch-final-scoreboard.mjs "$sport" "$yesterday" > "$payload"; then
              fetch_n="$(jq -r '.fetched // 0' "$payload")"
              final_n="$(jq -r '.completed // 0' "$payload")"
              if [ "$final_n" -eq 0 ]; then
                echo "grade-push sport=${sport} fetched=${fetch_n} finals=0"
                ok=$((ok+1))
                continue
              fi
              # Bound each request so a large Saturday CFB slate cannot exceed
              # the Cloudflare Worker CPU budget while updating all checkpoints.
              chunk=20
              offset=0
              sport_ok=1
              while [ "$offset" -lt "$final_n" ]; do
                chunk_payload="$(mktemp)"
                response="$(mktemp)"
                jq --argjson start "$offset" --argjson size "$chunk"                   '.finals = .finals[$start:($start+$size)]' "$payload" > "$chunk_payload"
                http="$(curl -sS --max-time 120 --retry 1 --retry-delay 2                   -X POST                   -H "x-harvest-secret: ${HARVEST_SECRET}"                   -H "content-type: application/json"                   --data-binary @"$chunk_payload"                   -o "$response" -w "%{http_code}"                   "${BASE}/api/final-grade")"
                if [ "$http" = "200" ] && jq -e '.ok == true' "$response" >/dev/null 2>&1; then
                  m="$(jq -r '.matched // 0' "$response")"
                  matched=$((matched+m))
                  echo "grade-push sport=${sport} offset=${offset} matched=${m}"
                else
                  sport_ok=0
                  fail=$((fail+1))
                  echo "grade-push FAILED sport=${sport} offset=${offset} http=${http:-000}"
                  cat "$response" || true
                  echo
                fi
                offset=$((offset+chunk))
              done
              if [ "$sport_ok" -eq 1 ]; then ok=$((ok+1)); fi
              echo "grade-push sport=${sport} fetched=${fetch_n} finals=${final_n}"
            else
              fail=$((fail+1))
              echo "runner scoreboard FAILED sport=${sport}"
            fi
          done
          {
            echo "## All-projection final grading"
            echo "- successful sports: $ok"
            echo "- failed chunks/fetches: $fail"
            echo "- snapshot game ids graded: $matched"
          } >> "$GITHUB_STEP_SUMMARY"
          # One provider failure must not block other sports. Existing health and
          # the next scheduled run retain the unresolved evidence.
