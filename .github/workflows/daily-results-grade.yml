name: Daily results and grading

# Free/non-ACTION final-score settlement. Runs after the 07:00 Central ACTION
# snapshot so yesterday's closing market state can be joined to final results.
on:
  schedule:
    - cron: "20 12 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:

concurrency:
  group: daily-results-grade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  settle:
    name: RESULTS 07:20 CT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout grading code
        uses: actions/checkout@v7

      - name: Gate to 07:20 America/Chicago
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hour="$(TZ=America/Chicago date +%H)"
          local_min="$(TZ=America/Chicago date +%M)"
          if [ "$local_hour" = "07" ] && [ "$local_min" -ge "15" ] && [ "$local_min" -le "30" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "UTC twin cron outside 07:20 Central; no settlement call."
          fi

      - name: Settle yesterday from free scoreboard sources
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          yesterday="$(TZ=America/Chicago date -d 'yesterday' +%F)"
          echo "settling ${yesterday}"
          for sport in mlb npb kbo nfl nba wnba nhl cfb cbb; do
            body="$(mktemp)"
            set +e
            http="$(curl -sS --max-time 180 --retry 1 --retry-delay 4 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              -o "$body" -w "%{http_code}" \
              "${BASE}/api/harvest?date=${yesterday}&sport=${sport}&settleOnly=1&gradeResearch=1&trigger=schedule&scheduledSlot=daily-results-0720")"
            ec=$?
            set -e
            echo "results sport=${sport} curl_ec=${ec} http=${http:-000}"
            if jq -e . "$body" >/dev/null 2>&1; then
              jq -c '{ok,status,sport,finalsSeen,settled,graded,errors:(.errors//[])}' "$body"
            else
              head -c 400 "$body" || true
              echo
            fi
            # Results are free and isolated by sport. One failed league must not
            # prevent the others from settling.
          done

      - name: Push trusted scoreboard finals into all-projection grader
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          COLLEGE_DATA_API_KEY: ${{ secrets.COLLEGE_DATA_API_KEY }}
        shell: bash
        run: |
          set -u
          yesterday="$(TZ=America/Chicago date -d 'yesterday' +%F)"
          ok=0
          fail=0
          matched=0
          unmatched=0
          for sport in mlb npb kbo nfl nba wnba nhl cfb cbb; do
            payload="$(mktemp)"
            response="$(mktemp)"
            if node scripts/fetch-final-scoreboard.mjs "$sport" "$yesterday" > "$payload"; then
              fetch_n="$(jq -r '.fetched // 0' "$payload")"
              final_n="$(jq -r '.completed // 0' "$payload")"
              http="$(curl -sS --max-time 120 --retry 1 --retry-delay 2                 -X POST                 -H "x-harvest-secret: ${HARVEST_SECRET}"                 -H "content-type: application/json"                 --data-binary @"$payload"                 -o "$response" -w "%{http_code}"                 "${BASE}/api/final-grade")"
              if [ "$http" = "200" ] && jq -e '.ok == true' "$response" >/dev/null 2>&1; then
                ok=$((ok+1))
                m="$(jq -r '.matched // 0' "$response")"
                u="$(jq -r '.unmatched // 0' "$response")"
                matched=$((matched+m))
                unmatched=$((unmatched+u))
                echo "grade-push sport=${sport} fetched=${fetch_n} finals=${final_n} matched=${m} unmatched=${u}"
              else
                fail=$((fail+1))
                echo "grade-push FAILED sport=${sport} http=${http:-000}"
                cat "$response" || true
              fi
            else
              fail=$((fail+1))
              echo "runner scoreboard FAILED sport=${sport}"
            fi
          done
          {
            echo "## All-projection final grading"
            echo "- successful sports: $ok"
            echo "- failed sports: $fail"
            echo "- snapshot game ids graded: $matched"
            echo "- unresolved snapshot game ids: $unmatched"
          } >> "$GITHUB_STEP_SUMMARY"
          # One provider failure must not block other sports. Existing health and
          # the next scheduled run retain the unresolved evidence.


      - name: Grade WNBA PrizePicks projections against player box scores
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          yesterday="$(TZ=America/Chicago date -d 'yesterday' +%F)"
          body="$(mktemp)"
          http="$(curl -sS --max-time 180 --retry 1 --retry-delay 3             -X POST             -H "x-harvest-secret: ${HARVEST_SECRET}"             -H "content-type: application/json"             --data-binary "$(jq -nc --arg date "$yesterday" '{date:$date}')"             -o "$body" -w "%{http_code}"             "${BASE}/api/wnba-prop-grade")"
          cat "$body"
          test "$http" = "200"
          jq -e '.ok==true' "$body" >/dev/null
          {
            echo "## WNBA PrizePicks grading"
            echo "- lines eligible: $(jq -r '.lines // 0' "$body")"
            echo "- graded: $(jq -r '.graded // 0' "$body")"
            echo "- wins: $(jq -r '.wins // 0' "$body")"
            echo "- losses: $(jq -r '.losses // 0' "$body")"
            echo "- pushes: $(jq -r '.pushes // 0' "$body")"
            echo "- unmatched: $(jq -r '.unmatched // 0' "$body")"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Grade WNBA game wager decisions and CLV
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          yesterday="$(TZ=America/Chicago date -d 'yesterday' +%F)"
          body="$(mktemp)"
          http="$(curl -sS --max-time 120 --retry 1 --retry-delay 3             -X POST             -H "x-harvest-secret: ${HARVEST_SECRET}"             -H "content-type: application/json"             --data-binary "$(jq -nc --arg date "$yesterday" '{date:$date}')"             -o "$body" -w "%{http_code}"             "${BASE}/api/wnba-wager-grade")"
          cat "$body"
          test "$http" = "200"
          jq -e '.ok==true' "$body" >/dev/null
          {
            echo "## WNBA game wager grading"
            echo "- candidates: $(jq -r '.candidates // 0' "$body")"
            echo "- graded: $(jq -r '.graded // 0' "$body")"
            echo "- wins: $(jq -r '.wins // 0' "$body")"
            echo "- losses: $(jq -r '.losses // 0' "$body")"
            echo "- pushes: $(jq -r '.pushes // 0' "$body")"
          } >> "$GITHUB_STEP_SUMMARY"
