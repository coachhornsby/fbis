name: Tennis WTA ranked reconciliation

on:
  pull_request:
    paths:
      - "scripts/tennis-wta-ranked-reconcile.mjs"
      - "scripts/tennis-wta-official-audit.mjs"
      - "migrations/0076_tennis_wta_ranked_reconciliation.sql"
      - "schema.extensions.sql"
      - ".github/workflows/tennis-wta-ranked-reconcile.yml"
  push:
    branches: [main]
    paths:
      - "scripts/tennis-wta-ranked-reconcile.mjs"
      - "scripts/tennis-wta-official-audit.mjs"
      - "migrations/0076_tennis_wta_ranked_reconciliation.sql"
      - "schema.extensions.sql"
      - ".github/workflows/tennis-wta-ranked-reconcile.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum current-ranking pages to reconcile"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tennis-pr-{0}', github.run_id) || 'tennis-d1-writes' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WTA_API_BASE: https://api.wtatennis.com/tennis
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Resolve WTA ranking snapshot and cursor
        id: cursor
        run: |
          set -euo pipefail
          probe="$(curl -fsS --retry 2 --retry-delay 1 "${WTA_API_BASE}/players/ranked?type=rankSingles&metric=singles&page=0&pageSize=1")"
          rank_date="$(printf '%s' "$probe" | jq -r '.[0].rankedAt // empty' | cut -c1-10)"
          test -n "$rank_date"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "page=0" >> "$GITHUB_OUTPUT"
            echo "rank_date=$rank_date" >> "$GITHUB_OUTPUT"
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "max_pages=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx wrangler d1 execute fbis --remote --command "SELECT cursor_value,status FROM tennis_ingestion_state WHERE source='WTA_OFFICIAL' AND tour='wta' AND stream='rankings' LIMIT 1" --json >/tmp/wta-rank-cursor.json
          cursor="$(jq -r '.[0].results[0].cursor_value // ""' /tmp/wta-rank-cursor.json)"
          status="$(jq -r '.[0].results[0].status // "PENDING"' /tmp/wta-rank-cursor.json)"
          prior_date="${cursor%%|*}"
          prior_page="${cursor##*|}"
          if [ "$prior_date" != "$rank_date" ]; then page=0; skip=0;
          elif [ "$status" = "COMPLETE" ]; then page=0; skip=1;
          else page="${prior_page:-0}"; skip=0; fi
          echo "page=$page" >> "$GITHUB_OUTPUT"
          echo "rank_date=$rank_date" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "max_pages=${{ github.event.inputs.max_pages || '20' }}" >> "$GITHUB_OUTPUT"

      - name: Build bounded ranked reconciliation shard
        if: steps.cursor.outputs.skip != '1'
        env:
          WTA_RANK_START_PAGE: ${{ steps.cursor.outputs.page }}
          WTA_RANK_MAX_PAGES: ${{ steps.cursor.outputs.max_pages }}
          WTA_RANK_PAGE_SIZE: "100"
        run: node scripts/tennis-wta-ranked-reconcile.mjs

      - name: Verify ranked reconciliation artifact
        if: steps.cursor.outputs.skip != '1'
        run: |
          set -euo pipefail
          jq -e '.source=="WTA_OFFICIAL" and .rankedPlayersReturned>0' artifacts/wta-ranked-reconcile-summary.json >/dev/null
          jq -e '.governance.identityKey=="WTA_OFFICIAL_PLAYER_ID" and .governance.fuzzyMatching==false and .governance.unknownRankStoredAsNull==true' artifacts/wta-ranked-reconcile-summary.json >/dev/null
          jq -e '.duplicateOfficialIds==0' artifacts/wta-ranked-reconcile-summary.json >/dev/null
          cat artifacts/wta-ranked-reconcile-summary.json

      - name: Apply ranked reconciliation to D1
        if: github.event_name != 'pull_request' && steps.cursor.outputs.skip != '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/wta-rank-chunks
          split -l 1000 -d -a 4 artifacts/wta-ranked-reconcile.sql /tmp/wta-rank-chunks/chunk-
          for file in /tmp/wta-rank-chunks/chunk-*; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if npx wrangler d1 execute fbis --remote --file "$file"; then
                ok=1
                sleep 8
                break
              fi
              delay=$((attempt*15))
              echo "WTA ranking D1 chunk busy/failing; retrying in ${delay}s (attempt ${attempt}/6)"
              sleep "$delay"
            done
            test "$ok" = "1"
          done

      - name: Audit official WTA source contract
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node scripts/tennis-wta-official-audit.mjs

      - name: Persist WTA source audit
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npx wrangler d1 execute fbis --remote --file artifacts/wta-source-audit.sql

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: wta-ranked-reconciliation
          path: |
            artifacts/wta-ranked-reconcile-summary.json
            artifacts/wta-source-audit-summary.json
          retention-days: 30
