name: NBA prospective shadow
on:
  workflow_dispatch:
  push:
    branches: [main, "research/nba-decision-v2", "research/nba-player-impact-v1", "research/nba-deep-v2"]
    paths:
      - "functions/lib/nbaModel.js"
      - "functions/lib/nbaPlayerPropModel.js"
      - "functions/lib/nbaPlayerImpact.js"
      - "functions/lib/nbaLineupModel.js"
      - "functions/lib/nbaRoleRedistribution.js"
      - "functions/lib/nbaTravelContext.js"
      - "functions/lib/nbaShotProfile.js"
      - "functions/lib/nbaDeepFeatures.js"
      - "functions/lib/nbaDeepModel.js"
      - "functions/lib/nbaProfileModel.js"
      - "scripts/nba-profile-shadow-project.mjs"
      - "scripts/nba-deep-prospective-ledger.mjs"
      - "migrations/0069_nba_prospective_profile_ablation.sql"
      - "scripts/nba-player-impact-live.mjs"
      - "migrations/0054_nba_persistent_team_profiles.sql"
      - "scripts/nba-official-lineup-collect.mjs"
      - "scripts/nba-deep-shadow-project.mjs"
      - "migrations/0052_nba_deep_game_model.sql"
      - "scripts/nba-shadow-project.mjs"
      - "scripts/nba-canonical-build.mjs"
      - "scripts/nba-merge-canonical.mjs"
      - ".github/workflows/nba-prospective-shadow.yml"
  schedule:
    - cron: "20 16,22 * * *"

permissions:
  contents: read

concurrency:
  group: nba-prospective-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Resolve Chicago dates and checkpoint
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const now=new Date();
          const fmt=d=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
          const today=fmt(now);
          const y=new Date(now.getTime()-86400000);
          const hour=Number(new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"2-digit",hour12:false}).format(now));
          console.log("NBA_TODAY="+today);
          console.log("NBA_YESTERDAY="+fmt(y));
          console.log("NBA_CHECKPOINT="+(hour<15?"MIDDAY":"LATE"));
          NODE

      - name: Load frozen and current-season state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/frozen artifacts/current artifacts/daily
          PREFIX=$(node -p "require('./research/nba/frozen-snapshot.json').r2.prefix")
          npx wrangler r2 object get "fbis-archive/${PREFIX}/nba-canonical.jsonl" --file artifacts/frozen/nba-canonical.jsonl --remote
          npx wrangler r2 object get "fbis-archive/canonical/espn/nba/2026-27/current/nba-canonical.jsonl" --file artifacts/current/previous.jsonl --remote || true
          test -f artifacts/current/previous.jsonl || : > artifacts/current/previous.jsonl
          IMPACT_PREFIX=$(node -p "require('./research/nba/player-impact-snapshot.json').r2.prefix")
          npx wrangler r2 object get "fbis-archive/${IMPACT_PREFIX}/nba-player-impact-v1.json" --file artifacts/frozen/nba-player-impact-v1.json --remote || true
          npx wrangler r2 object get "fbis-archive/${IMPACT_PREFIX}/nba-lineup-effects.json" --file artifacts/frozen/nba-lineup-effects.json --remote || true
          test -f artifacts/frozen/nba-player-impact-v1.json || echo '{"players":{}}' > artifacts/frozen/nba-player-impact-v1.json
          test -f artifacts/frozen/nba-lineup-effects.json || echo '{"effects":[]}' > artifacts/frozen/nba-lineup-effects.json
          mkdir -p artifacts/deep
          npx wrangler r2 object get "fbis-archive/research/nba/deep-v2/latest/nba-fbis-v2-deep-fit.json" --file artifacts/deep/nba-fbis-v2-deep-fit.json --remote || true

      - name: Increment only the latest completed date
        run: |
          node scripts/nba-canonical-build.mjs start="$NBA_YESTERDAY" end="$NBA_YESTERDAY" out=artifacts/daily/nba-daily.jsonl allowEmpty=1
          mkdir -p artifacts/merge
          cp artifacts/current/previous.jsonl artifacts/merge/previous.jsonl
          cp artifacts/daily/nba-daily.jsonl artifacts/merge/daily.jsonl
          node scripts/nba-merge-canonical.mjs artifacts/merge artifacts/current/nba-canonical.jsonl

      - name: Persist current-season canonical state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "fbis-archive/canonical/espn/nba/2026-27/current/nba-canonical.jsonl" --file artifacts/current/nba-canonical.jsonl --remote

      - name: Ensure NBA official-availability schema
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute fbis --remote --file=migrations/0053_nba_official_availability.sql

      - name: Ensure persistent NBA profile schema
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute fbis --remote --file=migrations/0054_nba_persistent_team_profiles.sql

      - name: Collect current confirmed NBA starters
        run: |
          set -euo pipefail
          if node scripts/nba-official-lineup-collect.mjs             out=artifacts/nba-official-lineups.json             sql=artifacts/nba-official-lineups.sql; then
            jq -e '.ok==true' artifacts/nba-official-lineups.json >/dev/null
          else
            echo '{"ok":false,"rows":[],"quality":{"observations":0}}' > artifacts/nba-official-lineups.json
            : > artifacts/nba-official-lineups.sql
          fi

      - name: Load point-in-time NBA availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM player_availability_observations WHERE sport='nba' AND observed_at <= datetime('now') AND observed_at >= datetime('now','-7 days') ORDER BY observed_at ASC"             > artifacts/nba-availability.json
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM nba_official_availability_reports WHERE report_timestamp <= datetime('now') AND report_timestamp >= datetime('now','-24 hours') ORDER BY report_timestamp ASC"             > artifacts/nba-availability-coverage.json || echo '[]' > artifacts/nba-availability-coverage.json
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM nba_player_state_profiles"             > artifacts/nba-player-states-prior.json || echo '[]' > artifacts/nba-player-states-prior.json

      - name: Load latest persisted team snapshot IDs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute fbis --remote --json --command "SELECT s.id,s.team_key,s.as_of FROM nba_team_profile_snapshots s JOIN (SELECT team_key,MAX(as_of) mx FROM nba_team_profile_snapshots GROUP BY team_key) x ON x.team_key=s.team_key AND x.mx=s.as_of" > artifacts/nba-latest-team-snapshots.json

      - name: Build live player impact and role context
        run: |
          node scripts/nba-player-impact-live.mjs             frozen=artifacts/frozen/nba-canonical.jsonl             current=artifacts/current/nba-canonical.jsonl             historicalImpact=artifacts/frozen/nba-player-impact-v1.json             availability=artifacts/nba-availability.json             coverage=artifacts/nba-availability-coverage.json             priorStates=artifacts/nba-player-states-prior.json             lineupEvidence=artifacts/nba-official-lineups.json             lineupEffects=artifacts/frozen/nba-lineup-effects.json             out=artifacts/nba-player-impact-live.json             sql=artifacts/nba-player-impact-live.sql

      - name: Generate calibrated research shadow
        run: |
          node scripts/nba-shadow-project.mjs date="$NBA_TODAY" checkpoint="$NBA_CHECKPOINT" prior=artifacts/frozen/nba-canonical.jsonl current=artifacts/current/nba-canonical.jsonl impact=artifacts/nba-player-impact-live.json

      - name: Generate isolated NBA v1-PROFILE challenger and control freeze
        run: |
          node scripts/nba-profile-shadow-project.mjs date="$NBA_TODAY" checkpoint="$NBA_CHECKPOINT" codeSha="$GITHUB_SHA" prior=artifacts/frozen/nba-canonical.jsonl current=artifacts/current/nba-canonical.jsonl impact=artifacts/nba-player-impact-live.json stateSnapshots=artifacts/nba-latest-team-snapshots.json out=artifacts/nba-three-model-freeze.json sql=artifacts/nba-profile-prospective.sql

      - name: Generate NBA deep-v2 game challenger
        run: |
          if [ -s artifacts/deep/nba-fbis-v2-deep-fit.json ]; then
            node scripts/nba-deep-shadow-project.mjs               date="$NBA_TODAY" checkpoint="$NBA_CHECKPOINT"               prior=artifacts/frozen/nba-canonical.jsonl               current=artifacts/current/nba-canonical.jsonl               impact=artifacts/nba-player-impact-live.json               fit=artifacts/deep/nba-fbis-v2-deep-fit.json               out=artifacts/nba-deep-shadow.json               sql=artifacts/nba-deep-shadow.sql
          else
            echo '{"skipped":true,"reason":"deep_fit_not_available"}' > artifacts/nba-deep-shadow.json
            : > artifacts/nba-deep-shadow.sql
          fi

      - name: Bridge deep-v2 into common prospective ledger
        run: |
          if [ -s artifacts/nba-deep-shadow.json ]; then
            node scripts/nba-deep-prospective-ledger.mjs input=artifacts/nba-deep-shadow.json stateSnapshots=artifacts/nba-latest-team-snapshots.json codeSha="$GITHUB_SHA" sql=artifacts/nba-deep-prospective-ledger.sql
          else
            : > artifacts/nba-deep-prospective-ledger.sql
          fi

      - name: Persist impact context and shadow projections to D1
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -s artifacts/nba-official-lineups.sql ]; then
            npx wrangler d1 execute fbis --remote --file=artifacts/nba-official-lineups.sql
          fi
          npx wrangler d1 execute fbis --remote --file=migrations/0048_nba_player_impact.sql
          npx wrangler d1 execute fbis --remote --file=artifacts/nba-player-impact-live.sql
          npx wrangler d1 execute fbis --remote --file=artifacts/nba-shadow.sql
          npx wrangler d1 execute fbis --remote --file=migrations/0069_nba_prospective_profile_ablation.sql
          if [ -s artifacts/nba-profile-prospective.sql ]; then npx wrangler d1 execute fbis --remote --file=artifacts/nba-profile-prospective.sql; fi
          npx wrangler d1 execute fbis --remote --file=migrations/0052_nba_deep_game_model.sql
          if [ -s artifacts/nba-deep-shadow.sql ]; then
            npx wrangler d1 execute fbis --remote --file=artifacts/nba-deep-shadow.sql
          fi
          if [ -s artifacts/nba-deep-prospective-ledger.sql ]; then npx wrangler d1 execute fbis --remote --file=artifacts/nba-deep-prospective-ledger.sql; fi

      - uses: actions/upload-artifact@v4
        with:
          name: nba-prospective-shadow-${{ github.run_id }}
          path: |
            artifacts/nba-shadow.json
            artifacts/nba-player-impact-live.json
            artifacts/nba-deep-shadow.json
            artifacts/nba-three-model-freeze.json
          retention-days: 90
