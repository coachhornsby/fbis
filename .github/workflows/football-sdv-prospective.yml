name: Football prospective SDV shadow receipts
on:
  push:
    branches: [main]
    paths: [.github/workflows/football-sdv-prospective.yml, functions/api/football-sdv-prospective.js, functions/lib/footballSimulationValidationResearch.js, functions/lib/footballProspectiveOutcomeSelection.js, functions/lib/footballProspectiveGradeIntegrity.js, scripts/football-sdv-prospective-cycle.mjs]
  workflow_run:
    workflows: ["Football SDV verified history and research replay"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 12,20 * * *"
permissions:
  contents: read
concurrency:
  group: football-sdv-prospective-capture
  cancel-in-progress: false
jobs:
  collect-and-grade:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test prospective research-only capture contract
        run: |
          node --test test/football-sdv-prospective.test.js \
            test/football-sdv-prospective-grading.test.js \
            test/football-prospective-outcome-selection.test.js \
            test/football-prospective-postgrade-integrity.test.js \
            test/football-simulation-validation-research.test.js \
            test/cfb-sdv-prospective-champion-audit.test.js \
            test/nfl-sdv-prospective-paired.test.js \
            test/nfl-sdv-verified-transition-research.test.js
          node --check scripts/football-sdv-prospective-cycle.mjs
      - name: Apply immutable prospective research schema only to dedicated sport databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 execute fbis-nfl --remote --file=sql/football/0004_sdv_prospective_receipts.sql
          npx --yes wrangler@4 d1 execute fbis-cfb --remote --file=sql/football/0004_sdv_prospective_receipts.sql
      - name: Capture frozen challengers and grade official completed games
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_URL: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          node scripts/football-sdv-prospective-cycle.mjs
          cat artifacts/football-sdv/prospective-cycle.json >> "$GITHUB_STEP_SUMMARY"
      - name: Store research-only receipts audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-prospective-sdv-${{ github.run_id }}
          path: artifacts/football-sdv/prospective-cycle.json
          retention-days: 30
          if-no-files-found: warn
