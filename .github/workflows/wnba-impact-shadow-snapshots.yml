name: WNBA impact shadow snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/api/wnba-impact-shadow.js"
      - "functions/lib/wnbaPlayerImpactShadow.js"
      - "functions/lib/wnbaProspectiveChallenger.js"
      - "functions/lib/slateEngine.js"
      - "migrations/0079_wnba_possession_challenger_shadow.sql"
      - "migrations/0049_wnba_player_impact.sql"
      - ".github/workflows/wnba-impact-shadow-snapshots.yml"
  schedule:
    - cron: "25 14,19,23 * * *"

permissions:
  contents: read

concurrency:
  group: wnba-impact-shadow-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Capture WNBA impact challengers
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          date_ct="$(TZ=America/Chicago date +%F)"
          body="$(mktemp)"
          http=""
          for attempt in 1 2 3 4 5 6; do
            http="$(curl -sS --max-time 90 --retry 1 --retry-delay 3               -X POST               -H "x-harvest-secret: ${HARVEST_SECRET}"               -H "content-type: application/json"               --data-binary "$(jq -nc --arg date "$date_ct" '{date:$date}')"               -o "$body" -w "%{http_code}"               "${BASE}/api/wnba-impact-shadow" || true)"
            if [ "$http" = "200" ] && jq -e '.ok==true' "$body" >/dev/null 2>&1; then
              break
            fi
            echo "attempt=$attempt http=$http; waiting for Cloudflare deployment"
            cat "$body" || true
            sleep 30
          done
          cat "$body"
          test "$http" = "200"
          jq -e '.ok==true' "$body" >/dev/null
          {
            echo "## WNBA impact shadow"
            echo "- games: $(jq -r '.games // 0' "$body")"
            echo "- game rows inserted: $(jq -r '.gameInserted // 0' "$body")"
            echo "- prop rows: $(jq -r '.props // 0' "$body")"
            echo "- prop rows inserted: $(jq -r '.propInserted // 0' "$body")"
            echo "- possession challenger rows: $(jq -r '.possessionRows // 0' "$body")"
            echo "- possession rows inserted: $(jq -r '.possessionInserted // 0' "$body")"
            echo "- challenger market rows inserted: $(jq -r '.possessionMarketInserted // 0' "$body")"
            echo "- opportunity rows inserted: $(jq -r '.opportunityInserted // 0' "$body")"
            echo "- qualification: OFF"
          } >> "$GITHUB_STEP_SUMMARY"
