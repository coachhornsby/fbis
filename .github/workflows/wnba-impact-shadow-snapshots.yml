name: WNBA impact shadow snapshots
# prerequisite-capture-touch: 2026-10-06
# verified-production-capture-touch: 2026-10-06

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/api/wnba-impact-shadow.js"
      - "functions/lib/wnbaPlayerImpactShadow.js"
      - "functions/lib/wnbaProspectiveChallenger.js"
      - "functions/lib/slateEngine.js"
      - "migrations/0080_wnba_possession_challenger_shadow.sql"
      - "migrations/0049_wnba_player_impact.sql"
      - ".github/workflows/wnba-impact-shadow-snapshots.yml"
  schedule:
    - cron: "25 14,19,23 * * *"

permissions:
  contents: read

concurrency:
  group: wnba-impact-shadow-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Capture WNBA impact challengers
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          total_games=0
          total_game_inserted=0
          total_prop_inserted=0
          total_possession_inserted=0
          total_market_inserted=0
          total_opportunity_inserted=0
          failed_dates=0
          {
            echo "## WNBA impact shadow"
          } >> "$GITHUB_STEP_SUMMARY"

          for offset in 0 1 2 3; do
            date_ct="$(TZ=America/Chicago date -d "+${offset} day" +%F)"
            body="$(mktemp)"
            http="$(curl -sS --max-time 60 --retry 1 --retry-delay 2               -X POST               -H "x-harvest-secret: ${HARVEST_SECRET}"               -H "content-type: application/json"               --data-binary "$(jq -nc --arg date "$date_ct" '{date:$date}')"               -o "$body" -w "%{http_code}"               "${BASE}/api/wnba-impact-shadow" || true)"
            cat "$body"

            if [ "$http" != "200" ] || ! jq -e '.ok==true' "$body" >/dev/null 2>&1; then
              failed_dates=$((failed_dates+1))
              {
                echo "- ${date_ct}: capture failed (HTTP ${http})"
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            games="$(jq -r '.games // 0' "$body")"
            game_inserted="$(jq -r '.gameInserted // 0' "$body")"
            prop_inserted="$(jq -r '.propInserted // 0' "$body")"
            possession_inserted="$(jq -r '.possessionInserted // 0' "$body")"
            market_inserted="$(jq -r '.possessionMarketInserted // 0' "$body")"
            opportunity_inserted="$(jq -r '.opportunityInserted // 0' "$body")"

            total_games=$((total_games+games))
            total_game_inserted=$((total_game_inserted+game_inserted))
            total_prop_inserted=$((total_prop_inserted+prop_inserted))
            total_possession_inserted=$((total_possession_inserted+possession_inserted))
            total_market_inserted=$((total_market_inserted+market_inserted))
            total_opportunity_inserted=$((total_opportunity_inserted+opportunity_inserted))

            {
              echo "- ${date_ct}: games=${games}, legacy_game_inserted=${game_inserted}, possession_inserted=${possession_inserted}, market_inserted=${market_inserted}, opportunity_inserted=${opportunity_inserted}"
            } >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo "- horizon: today + 3 CT dates"
            echo "- total eligible games: ${total_games}"
            echo "- legacy game rows inserted: ${total_game_inserted}"
            echo "- legacy prop rows inserted: ${total_prop_inserted}"
            echo "- possession rows inserted: ${total_possession_inserted}"
            echo "- challenger market rows inserted: ${total_market_inserted}"
            echo "- opportunity rows inserted: ${total_opportunity_inserted}"
            echo "- failed dates: ${failed_dates}"
            echo "- qualification: OFF"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$failed_dates" = "0"
