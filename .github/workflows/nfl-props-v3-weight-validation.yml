name: NFL props v3 weight validation
on:
  push:
    branches: ["nfl-props-v3-weight-validation"]
    paths:
      - "scripts/nfl-props-v3-weight-validation.py"
      - ".github/workflows/nfl-props-v3-weight-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run leakage-safe NFL player prop weight grid
        run: python scripts/nfl-props-v3-weight-validation.py
      - name: Print winner
        run: jq '{examples,best,top10,seasonalTop5}' artifacts/nfl-props-v3-validation/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-props-v3-weight-validation
          path: artifacts/nfl-props-v3-validation/*
          retention-days: 90
