name: CFBD PPA and CBBD native model evidence — bounded once
on:
  pull_request:
    paths:
      - 'scripts/capture-college-model-inputs.mjs'
      - 'scripts/lib/cbbdNativeSource.mjs'
      - 'scripts/lib/cfbdFittedRecovery.mjs'
      - 'test/cbbd-native-source.test.mjs'
      - 'test/cfbd-fitted-recovery.test.mjs'
      - '.github/workflows/fbis-college-model-inputs-once.yml'
  push:
    branches: [main]
    paths: ['.github/workflows/fbis-college-model-inputs-once.yml']
permissions: {contents: read}
concurrency:
  group: fbis-college-model-inputs-once
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: {node-version: '22'}
      - name: Verify source provenance and strict three-call budget offline
        run: |
          node --check scripts/capture-college-model-inputs.mjs
          node --test test/cbbd-native-source.test.mjs test/cfbd-fitted-recovery.test.mjs
      - name: Capture current CFBD and CBBD once into private source storage
        if: github.event_name == 'push'
        env:
          CFBD_CBBD_KEY: ${{ secrets.CFBD_CBBD_KEY || secrets.CFBD_API_KEY || secrets.CBBD_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/capture-college-model-inputs.mjs
      - name: Retain source receipts and derived comparisons only, never raw source records
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: college-current-source-receipt-${{ github.run_id }}
          path: artifacts/college-model-inputs/receipt.json
          retention-days: 7
