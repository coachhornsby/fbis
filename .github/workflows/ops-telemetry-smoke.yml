name: Ops telemetry scheduled-cycle smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-telemetry-smoke.yml"

permissions:
  contents: read

jobs:
  verify-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for exact production SHA
        env:
          BASE: "https://fbis-myz.pages.dev"
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "${BASE}/api/health?_t=$(date +%s)" || true)"
            live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$body" 2>/dev/null || true)"
            echo "deployment attempt=${attempt} http=${code} expected=${EXPECTED_SHA} live=${live}"
            if [ "$code" = "200" ] && [ "$(echo "$live" | tr 'A-F' 'a-f')" = "$(echo "$EXPECTED_SHA" | tr 'A-F' 'a-f')" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Exact production SHA did not become live."
          exit 1

      - name: Execute scheduled cache-only collect cycle
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          run_url_enc="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ.get('RUN_URL',''), safe=''))")"
          body="$(mktemp)"
          code="$(curl -sS --max-time 150             -H "x-harvest-secret: ${HARVEST_SECRET}"             -H "accept: application/json"             -o "$body" -w "%{http_code}"             "${BASE}/api/collect?odds=cache&sport=mlb&trigger=schedule&scheduledSlot=ops-telemetry-smoke&runUrl=${run_url_enc}")"
          cat "$body"
          test "$code" = "200"
          jq -e '.ok == true and .status == "success"' "$body" >/dev/null

      - name: Verify ops control plane populated
        env:
          BASE: "https://fbis-myz.pages.dev"
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 30 -o "$body" -w "%{http_code}" "${BASE}/api/ops-health?_t=$(date +%s)")"
          cat "$body"
          test "$code" = "200"
          jq -e '
            .ok == true and
            ([.components[] | select(.component_id == "github-schedules" and .health_status != null)] | length) > 0 and
            ([.components[] | select(.workflow_freshness_at != null)] | length) > 0 and
            (.metrics.incidents | tonumber) > 0 and
            (.metrics.avgMttrSeconds != null)
          ' "$body" >/dev/null
