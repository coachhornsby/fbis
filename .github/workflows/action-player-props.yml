name: ACTION pro player props (manual fallback)

# Manual fallback only. Normal production scheduling is owned by
# action-orchestrator.yml so props cannot compete with separate fixed-clock jobs.
on:
  workflow_dispatch:

concurrency:
  group: action-pro-player-props-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-props:
    name: MANUAL PRO PLAYER PROPS
    runs-on: ubuntu-latest
    steps:
      - name: Require operator secret
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${HARVEST_SECRET:-}" ]; then
            echo "HARVEST_SECRET unavailable; refusing paid ACTION collection."
            exit 1
          fi

      - name: Collect ACTION player props — pro sports only
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for sport in nfl mlb nba nhl; do
            body="$(mktemp)"
            set +e
            http="$(curl -sS --max-time 420 --retry 0 \
              -X POST \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "content-type: application/json" \
              -H "accept: application/json" \
              -o "$body" -w "%{http_code}" \
              -d "{\"execute\":\"1\",\"sport\":\"${sport}\",\"lifecycle\":\"pregame\",\"profile\":\"PLAYER_PROPS\",\"maxItems\":24}" \
              "${BASE}/api/action-apify-collect?execute=1&sport=${sport}&lifecycle=pregame&profile=PLAYER_PROPS&maxItems=24")"
            curl_ec=$?
            set -e

            echo "ACTION props sport=${sport} curl_ec=${curl_ec} http=${http:-000}"
            if jq -e . "$body" >/dev/null 2>&1; then
              jq -c '{ok,executed,status,reason,sport,profile,expectedSlateGames,gamesReturned,gamesMatched,propsWritten,budget,blocks:(.blocks//[])}' "$body"
            else
              head -c 500 "$body" || true
              echo
            fi
            # No retries. The shared API cost guard remains authoritative.
          done
