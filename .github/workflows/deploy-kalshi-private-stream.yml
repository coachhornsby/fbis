name: Deploy disabled Kalshi private stream runtime
on:
  pull_request:
    paths:
      - "services/kalshi-private-stream/**"
      - "wrangler.kalshi-private-stream.toml"
      - "test/kalshi-private-stream.test.js"
      - ".github/workflows/deploy-kalshi-private-stream.yml"
  push:
    branches: [main]
    paths:
      - "services/kalshi-private-stream/**"
      - "wrangler.kalshi-private-stream.toml"
      - ".github/workflows/deploy-kalshi-private-stream.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbis-kalshi-private-stream-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Verify no-authority private stream tests
        run: node --test test/kalshi-private-stream.test.js test/kalshi-account.test.js
      - name: Verify Durable Object build
        run: npx wrangler deploy --config wrangler.kalshi-private-stream.toml --dry-run --outdir /tmp/kalshi-private-stream
      - name: Deploy DISABLED private stream Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # No credentials copied from Pages. Never enable stream during CI.
          npx wrangler deploy --config wrangler.kalshi-private-stream.toml
      - name: Verify disabled default and no account disclosure
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 -sS \
            https://fbis-kalshi-private-stream.coachhornsby.workers.dev/health \
            | jq -e '.readOnly == true and .canAuthorizeWager == false and .privateDataStored == false and .enabled == false and .operational == false'
