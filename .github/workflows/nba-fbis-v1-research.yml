name: NBA FBIS v1 research
on:
  workflow_dispatch:
    inputs:
      start:
        description: Historical start date
        required: true
        default: "2025-10-21"
      end:
        description: Historical end date
        required: true
        default: "2026-06-21"
  push:
    branches: ["research/nba-decision-v2"]
    paths:
      - "functions/lib/nbaModel.js"
      - "functions/lib/nbaPlayerPropModel.js"
      - "functions/lib/nbaWagerDecision.js"
      - "functions/lib/nbaQualification.js"
      - "scripts/nba-*.mjs"
      - "test/nba-fbis-v1.test.js"
      - "test/nba-wager-decision.test.js"
      - "test/nba-action-governance.test.js"
      - "migrations/0039_nba_research_models.sql"
      - "schema.extensions.sql"
      - ".github/workflows/nba-fbis-v1-research.yml"
permissions: { contents: read }
concurrency:
  group: nba-fbis-v1-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test test/nba-fbis-v1.test.js test/nba-wager-decision.test.js test/nba-action-governance.test.js

  source-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/nba-canonical-build.mjs start=2026-03-01 end=2026-03-10
      - run: node scripts/nba-fbis-v1-walkforward.mjs artifacts/nba-canonical.jsonl
      - run: node scripts/nba-player-prop-walkforward.mjs artifacts/nba-canonical.jsonl
      - run: |
          test -s artifacts/nba-canonical.jsonl
          jq -e '.rows > 0' artifacts/nba-canonical-manifest.json
          jq . artifacts/nba-fbis-v1-walkforward.json
          jq . artifacts/nba-player-prop-walkforward.json

  historical:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build canonical history
        run: |
          START="${{ github.event_name == 'workflow_dispatch' && inputs.start || '2024-10-22' }}"
          END="${{ github.event_name == 'workflow_dispatch' && inputs.end || '2026-06-21' }}"
          node scripts/nba-canonical-build.mjs start="$START" end="$END"
      - run: node scripts/nba-fbis-v1-walkforward.mjs artifacts/nba-canonical.jsonl
      - run: node scripts/nba-player-prop-walkforward.mjs artifacts/nba-canonical.jsonl
      - run: |
          cat artifacts/nba-fbis-v1-walkforward.json
          cat artifacts/nba-player-prop-walkforward.json
      - uses: actions/upload-artifact@v6
        with:
          name: nba-fbis-v1-research-${{ github.run_id }}
          path: artifacts/nba-*
          retention-days: 90
