name: WNBA possession challenger coefficient freeze

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/wnba-possession-challenger-freeze.mjs"
      - "migrations/0080_wnba_possession_challenger_shadow.sql"
      - ".github/workflows/wnba-possession-challenger-freeze.yml"

permissions:
  contents: read

concurrency:
  group: wnba-possession-challenger-coefficient-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Restore frozen historical ablation evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx wrangler r2 object get "fbis-archive/models/wnba/possession-shot/research-current/wnba-possession-ablation-rows.jsonl" --file artifacts/wnba-possession-ablation-rows.jsonl --remote
          npx wrangler r2 object get "fbis-archive/models/wnba/possession-shot/research-current/wnba-possession-ablation.json" --file artifacts/wnba-possession-ablation.json --remote

      - name: Freeze coefficients from verified checkpoint
        run: |
          node scripts/wnba-possession-challenger-freeze.mjs             rows=artifacts/wnba-possession-ablation-rows.jsonl             report=artifacts/wnba-possession-ablation.json             out=artifacts/wnba-possession-challenger-coefficients.json             sql=artifacts/wnba-possession-challenger-coefficients.sql             source=research/wnba/possession-shot/v1/run-37464927545/merged-linear

      - name: Persist frozen coefficients
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Production deploy owns migrations. Recurring research jobs never run
          # migration imports because D1 permits only one long-running import.
          sql="$(cat artifacts/wnba-possession-challenger-coefficients.sql)"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "coefficient D1 write attempt=$attempt/6"
            if npx wrangler d1 execute fbis --remote --command "$sql"; then
              ok=1
              break
            fi
            sleep $((attempt * 8))
          done
          test "$ok" = "1"
          npx wrangler r2 object put "fbis-archive/models/wnba/possession-challenger/v1/coefficients.json" --file artifacts/wnba-possession-challenger-coefficients.json --remote

      - uses: actions/upload-artifact@v6
        with:
          name: wnba-possession-challenger-coefficients-${{ github.run_id }}
          path: artifacts/wnba-possession-challenger-coefficients.json
          retention-days: 90
