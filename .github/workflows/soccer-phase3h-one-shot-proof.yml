name: Soccer Phase 3H one-shot proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/soccer-phase3h-one-shot-proof.yml"

permissions:
  contents: write

concurrency:
  group: soccer-phase3h-one-shot-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Controlled prospective snapshot + idempotency retry
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE: https://fbis-myz.pages.dev
          SNAPSHOT_DATE: "2026-10-09"
          REQUIRED_REPAIR_SHA: "e2b97fcf432c2b47d4d51a72cefb67625824f9bc"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"

          # Do not proof stale Pages code. Wait until production collector SHA
          # contains the bounded Phase 3H-R2 repair in its ancestry.
          collector_sha=""
          for deploy_attempt in $(seq 1 72); do
            summary="$(curl -sS --max-time 30 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              "${BASE}/api/soccer-prospective-shadow?mode=summary&_t=$(date +%s)" || true)"
            collector_sha="$(printf '%s\n' "$summary" | jq -r '.collectorCodeSha // empty' 2>/dev/null || true)"
            if [ -n "$collector_sha" ]; then
              compare="$(curl -sS \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${REQUIRED_REPAIR_SHA}...${collector_sha}" || true)"
              relation="$(printf '%s\n' "$compare" | jq -r '.status // empty' 2>/dev/null || true)"
              echo "deploy attempt=${deploy_attempt} collector=${collector_sha} relation=${relation}"
              if [ "$relation" = "ahead" ] || [ "$relation" = "identical" ]; then
                break
              fi
            fi
            collector_sha=""
            sleep 5
          done
          test -n "$collector_sha"

          # Start early inside a five-minute idempotency bucket so bounded
          # transient retries and the duplicate proof remain in one bucket.
          rem=$(( $(date +%s) % 300 ))
          if [ "$rem" -gt 240 ]; then
            sleep $((300 - rem + 5))
          fi

          request_snapshot() {
            local out status body
            out="$(mktemp)"
            status="$(curl -sS --max-time 90 -o "$out" -w "%{http_code}" \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              "${BASE}/api/soccer-prospective-shadow?mode=snapshot&date=${SNAPSHOT_DATE}&_t=$(date +%s)" || true)"
            body="$(cat "$out")"
            rm -f "$out"
            printf '%s\n%s' "$status" "$body"
          }

          publish_evidence() {
            local first_body="${1:-}" second_body="${2:-}" evidence encoded current sha payload
            evidence="$(jq -n \
              --arg generatedAt "$(date -u +%FT%TZ)" \
              --arg triggerSha "${GITHUB_SHA}" \
              --arg snapshotDate "${SNAPSHOT_DATE}" \
              --argjson first "${first_body:-null}" \
              --argjson second "${second_body:-null}" \
              '{generatedAt:$generatedAt,triggerSha:$triggerSha,snapshotDate:$snapshotDate,first:$first,second:$second}')"
            encoded="$(printf '%s\n' "$evidence" | base64 -w0)"
            current="$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ops/soccer-phase3h-r-proof-latest.json?ref=main")"
            sha="$(printf '%s\n' "$current" | jq -r '.sha // empty')"
            if [ -n "$sha" ]; then
              payload="$(jq -n --arg message "Soccer Phase 3H-R: record controlled proof evidence" --arg content "$encoded" --arg sha "$sha" '{message:$message,content:$content,sha:$sha,branch:"main"}')"
            else
              payload="$(jq -n --arg message "Soccer Phase 3H-R: record controlled proof evidence" --arg content "$encoded" '{message:$message,content:$content,branch:"main"}')"
            fi
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ops/soccer-phase3h-r-proof-latest.json" \
              -d "$payload" >/dev/null
          }

          first=""
          for attempt in 1 2 3 4 5 6; do
            raw="$(request_snapshot)"
            status="$(printf '%s\n' "$raw" | head -n1)"
            body="$(printf '%s\n' "$raw" | tail -n +2)"
            echo "first attempt=${attempt} http=${status}"
            printf '%s\n' "$body" | jq -c '{ok,error,detail,date,snapshotAt,collectorCodeSha,slateGames,eligibleGames,attempted,written,existing,skipped,skippedDetails,researchOnly,canQualify,canAuthorize}' 2>/dev/null || printf '%s\n' "$body"
            if [ "$status" = "200" ] && printf '%s\n' "$body" | jq -e '.ok == true and .eligibleGames > 0 and .attempted > 0 and .written > 0 and .researchOnly == true and .canQualify == false and .canAuthorize == false' >/dev/null 2>&1; then
              first="$body"
              break
            fi
            sleep 3
          done
          if [ -z "$first" ]; then
            publish_evidence "${body:-null}" "null"
            exit 1
          fi

          second=""
          for attempt in 1 2 3 4 5 6; do
            raw="$(request_snapshot)"
            status="$(printf '%s\n' "$raw" | head -n1)"
            body="$(printf '%s\n' "$raw" | tail -n +2)"
            echo "second attempt=${attempt} http=${status}"
            printf '%s\n' "$body" | jq -c '{ok,error,detail,date,snapshotAt,slateGames,eligibleGames,attempted,written,existing,skipped,skippedDetails,researchOnly,canQualify,canAuthorize}' 2>/dev/null || printf '%s\n' "$body"
            if [ "$status" = "200" ] && printf '%s\n' "$body" | jq -e '.ok == true and .attempted > 0 and .written == 0 and .existing == .attempted and .researchOnly == true and .canQualify == false and .canAuthorize == false' >/dev/null 2>&1; then
              second="$body"
              break
            fi
            sleep 3
          done
          if [ -z "$second" ]; then
            publish_evidence "$first" "${body:-null}"
            exit 1
          fi
          publish_evidence "$first" "$second"

          first_bucket="$(printf '%s\n' "$first" | jq -r '.snapshotAt' | xargs -I{} date -u -d "{}" +%s | awk '{print int($1/300)}')"
          second_bucket="$(printf '%s\n' "$second" | jq -r '.snapshotAt' | xargs -I{} date -u -d "{}" +%s | awk '{print int($1/300)}')"
          test "$first_bucket" = "$second_bucket"

# Phase 3H-R controlled rerun trigger after cross-provider identity repair.

# Phase 3H-R3 loader-error diagnostic trigger.

# Phase 3H-R3 diagnostic deployment-gate trigger.

# Phase 3H-R3 future-slate proof trigger: 2026-10-09.
