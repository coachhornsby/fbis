name: Soccer Phase 3H one-shot proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/soccer-phase3h-one-shot-proof.yml"

permissions:
  contents: read

concurrency:
  group: soccer-phase3h-one-shot-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Controlled prospective snapshot + idempotency retry
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          BASE: https://fbis-myz.pages.dev
          SNAPSHOT_DATE: "2026-10-07"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"

          # Start early inside a five-minute idempotency bucket so bounded
          # transient retries and the duplicate proof remain in one bucket.
          rem=$(( $(date +%s) % 300 ))
          if [ "$rem" -gt 20 ]; then
            sleep $((300 - rem + 5))
          fi

          request_snapshot() {
            local out status body
            out="$(mktemp)"
            status="$(curl -sS --max-time 90 -o "$out" -w "%{http_code}" \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              "${BASE}/api/soccer-prospective-shadow?mode=snapshot&date=${SNAPSHOT_DATE}&_t=$(date +%s)" || true)"
            body="$(cat "$out")"
            rm -f "$out"
            printf '%s\n%s' "$status" "$body"
          }

          first=""
          for attempt in 1 2 3 4 5 6; do
            raw="$(request_snapshot)"
            status="$(printf '%s\n' "$raw" | head -n1)"
            body="$(printf '%s\n' "$raw" | tail -n +2)"
            echo "first attempt=${attempt} http=${status}"
            printf '%s\n' "$body" | jq -c '{ok,error,detail,date,snapshotAt,slateGames,eligibleGames,attempted,written,existing,skipped,skippedDetails,researchOnly,canQualify,canAuthorize}' 2>/dev/null || printf '%s\n' "$body"
            if [ "$status" = "200" ] && printf '%s\n' "$body" | jq -e '.ok == true and .eligibleGames > 0 and .attempted > 0 and .written > 0 and .researchOnly == true and .canQualify == false and .canAuthorize == false' >/dev/null 2>&1; then
              first="$body"
              break
            fi
            sleep 3
          done
          test -n "$first"

          second=""
          for attempt in 1 2 3 4 5 6; do
            raw="$(request_snapshot)"
            status="$(printf '%s\n' "$raw" | head -n1)"
            body="$(printf '%s\n' "$raw" | tail -n +2)"
            echo "second attempt=${attempt} http=${status}"
            printf '%s\n' "$body" | jq -c '{ok,error,detail,date,snapshotAt,slateGames,eligibleGames,attempted,written,existing,skipped,skippedDetails,researchOnly,canQualify,canAuthorize}' 2>/dev/null || printf '%s\n' "$body"
            if [ "$status" = "200" ] && printf '%s\n' "$body" | jq -e '.ok == true and .attempted > 0 and .written == 0 and .existing == .attempted and .researchOnly == true and .canQualify == false and .canAuthorize == false' >/dev/null 2>&1; then
              second="$body"
              break
            fi
            sleep 3
          done
          test -n "$second"

          first_bucket="$(printf '%s\n' "$first" | jq -r '.snapshotAt' | xargs -I{} date -u -d "{}" +%s | awk '{print int($1/300)}')"
          second_bucket="$(printf '%s\n' "$second" | jq -r '.snapshotAt' | xargs -I{} date -u -d "{}" +%s | awk '{print int($1/300)}')"
          test "$first_bucket" = "$second_bucket"

# Phase 3H-R controlled rerun trigger after cross-provider identity repair.
