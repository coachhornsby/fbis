name: Soccer Phase 3H one-shot proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/soccer-phase3h-one-shot-proof.yml"

permissions:
  contents: write

concurrency:
  group: soccer-phase3h-one-shot-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Controlled competition-batched prospective proof
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          SNAPSHOT_DATE="$(TZ=America/Chicago date -d '+3 days' +%F)"
          collector_sha=""
          for deploy_attempt in $(seq 1 72); do
            summary="$(curl -sS --max-time 30 -H "x-harvest-secret: ${HARVEST_SECRET}" "${BASE}/api/soccer-prospective-shadow?mode=summary&_t=$(date +%s)" || true)"
            collector_sha="$(printf '%s\n' "$summary" | jq -r '.collectorCodeSha // empty' 2>/dev/null || true)"
            if [ -n "$collector_sha" ]; then
              compare="$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${collector_sha}" || true)"
              relation="$(printf '%s\n' "$compare" | jq -r '.status // empty' 2>/dev/null || true)"
              echo "deploy attempt=${deploy_attempt} collector=${collector_sha} relation=${relation}"
              if [ "$relation" = "ahead" ] || [ "$relation" = "identical" ]; then break; fi
            fi
            collector_sha=""
            sleep 5
          done
          test -n "$collector_sha"
          # Begin near the bucket boundary to leave room for both actual runs.
          rem=$(( $(date +%s) % 300 ))
          if [ "$rem" -gt 30 ]; then sleep $((300 - rem + 5)); fi
          work="$(mktemp -d)"
          printf '%s\n' "$summary" > "$work/before.json"
          request_snapshot() {
            local league="$1" out="$2" status raw
            status="$(curl -sS --max-time 90 -o "$out" -w "%{http_code}" -H "x-harvest-secret: ${HARVEST_SECRET}" "${BASE}/api/soccer-prospective-shadow?mode=snapshot&competition=${league}&date=${SNAPSHOT_DATE}&_t=$(date +%s)" || true)"
            if ! jq -e 'type == "object"' "$out" >/dev/null 2>&1; then
              raw="$(head -c 600 "$out")"
              jq -n --arg http "$status" --arg raw "$raw" '{ok:false,error:"non-json-production-response",http:$http,detail:$raw}' > "$out"
            fi
            jq -c '{ok,error,http,date,snapshotAt,collectorCodeSha,slateGames,eligibleGames,attempted,written,existing,skipped,skippedDetails}' "$out"
          }
          aggregate() {
            jq -s '{ok:all(.[];.ok == true),snapshotAt:.[0].snapshotAt,collectorCodeSha:.[0].collectorCodeSha,
              slateGames:(map(.slateGames // 0)|add),eligibleGames:(map(.eligibleGames // 0)|add),
              attempted:(map(.attempted // 0)|add),written:(map(.written // 0)|add),existing:(map(.existing // 0)|add),
              fixtures:[.[]|.fixtures[]?],batches:.,researchOnly:all(.[];.researchOnly == true),
              canQualify:any(.[];.canQualify == true),canAuthorize:any(.[];.canAuthorize == true)}' "$@"
          }
          # A competition batch bounds the memory/CPU working set without
          # changing histories, coefficients, gates, routing or model inputs.
          failed=0
          for pass in first second; do
            for league in ger.1 fra.1; do
              out="$work/${pass}-${league}.json"
              request_snapshot "$league" "$out"
              if ! jq -e '.ok == true and .eligibleGames > 0 and .attempted > 0 and .researchOnly == true and .canQualify == false and .canAuthorize == false' "$out" >/dev/null; then failed=1; fi
            done
          done
          aggregate "$work/first-ger.1.json" "$work/first-fra.1.json" > "$work/first.json"
          aggregate "$work/second-ger.1.json" "$work/second-fra.1.json" > "$work/second.json"
          jq -n --arg generatedAt "$(date -u +%FT%TZ)" --arg triggerSha "$GITHUB_SHA" --arg snapshotDate "$SNAPSHOT_DATE" \
            --slurpfile before "$work/before.json" --slurpfile first "$work/first.json" --slurpfile second "$work/second.json" \
            '{generatedAt:$generatedAt,triggerSha:$triggerSha,snapshotDate:$snapshotDate,before:$before[0],first:$first[0],second:$second[0]}' > "$work/evidence.json"
          current="$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ops/soccer-phase3h-r-proof-latest.json?ref=main")"
          sha="$(printf '%s\n' "$current" | jq -r .sha)"
          encoded="$(base64 -w0 "$work/evidence.json")"
          jq -n --arg sha "$sha" --arg content "$encoded" '{message:"Soccer R4: record competition-batched production proof",content:$content,sha:$sha,branch:"main"}' > "$work/publish.json"
          curl -fsS -X PUT -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/ops/soccer-phase3h-r-proof-latest.json" --data-binary "@$work/publish.json" >/dev/null
          test "$failed" = 0
          jq -e '.written > 0 and .existing == 0' "$work/first.json" >/dev/null
          jq -e '.written == 0 and .existing == .attempted and .attempted > 0' "$work/second.json" >/dev/null
          jq -e '[.fixtures[] | select((.competition == "ger.1" or .competition == "fra.1") and .v2Ok and .v31Ok and .canonicalHistoryCount > 0 and .v2MarketUsed == false and .v31MarketUsed == false and .postMatchTargetFeaturesUsed == false and .persistentStateUsed == false) | .competition] | unique | length == 2' "$work/first.json" >/dev/null
          for league in ger.1 fra.1; do
            a="$(jq -r .snapshotAt "$work/first-${league}.json")"
            b="$(jq -r .snapshotAt "$work/second-${league}.json")"
            test "$a" != "$b"
          done
          buckets="$(jq -s '[.[]|.snapshotAt|sub("\\.[0-9]+Z$";"Z")|fromdateiso8601 / 300 | floor] | unique | length' "$work/first-ger.1.json" "$work/first-fra.1.json" "$work/second-ger.1.json" "$work/second-fra.1.json")"
          test "$buckets" = 1
