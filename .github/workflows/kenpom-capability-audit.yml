name: KenPom capability audit

on:
  push:
    branches: [main]
    paths:
      - "functions/api/kenpom-audit.js"
      - ".github/workflows/kenpom-capability-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for exact production SHA
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="https://fbis-myz.pages.dev"
          for i in $(seq 1 40); do
            BODY="$(curl -fsS --max-time 20 "$BASE/api/health" || true)"
            SHA="$(printf '%s' "$BODY" | jq -r '.deploymentCommit // .build.commit // empty' 2>/dev/null || true)"
            echo "production_sha=${SHA:-unknown} target=${TARGET_SHA}"
            if [ "$SHA" = "$TARGET_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "Production did not reach target SHA in audit window."
          exit 1

      - name: Probe KenPom API through production secret
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}" || { echo "HARVEST_SECRET missing"; exit 2; }
          mkdir -p artifacts
          HTTP=$(curl -sS --max-time 180 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            -o artifacts/kenpom-capability-audit.json \
            -w "%{http_code}" \
            "https://fbis-myz.pages.dev/api/kenpom-audit")
          echo "http=$HTTP"
          jq -c '{ok,configured,summary,working,failed}' artifacts/kenpom-capability-audit.json
          {
            echo "## KenPom capability audit"
            echo
            jq -r '"- configured: \(.configured)\n- endpoints working: \(.summary.working)/\(.summary.total)\n- failed: \(.summary.failed)"' artifacts/kenpom-capability-audit.json
            echo
            jq -r '.probes[] | "- \(.name): HTTP \(.httpStatus) · rows=\(.rows // "n/a") · ok=\(.ok)"' artifacts/kenpom-capability-audit.json
          } >> "$GITHUB_STEP_SUMMARY"
          test "$HTTP" = "200"
          jq -e '.configured == true' artifacts/kenpom-capability-audit.json >/dev/null

      - name: Upload audit
        uses: actions/upload-artifact@v6
        with:
          name: kenpom-capability-audit
          path: artifacts/kenpom-capability-audit.json
          retention-days: 14