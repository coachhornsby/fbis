name: FBIS D1 pilot offline accounting CI

on:
  pull_request:
    paths:
      - "scripts/fbis_drive_archive_bounded_d1.py"
      - "test/test_d1_pilot_accounting.py"
      - ".github/workflows/fbis-d1-pilot-offline-ci.yml"

permissions:
  contents: read

jobs:
  offline-accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Run secret-free offline accounting fixtures
        run: |
          python -m unittest discover -s test -p test_d1_pilot_accounting.py -v
          python -m py_compile scripts/fbis_drive_archive_bounded_d1.py
          git diff --check
