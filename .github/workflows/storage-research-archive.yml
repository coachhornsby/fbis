name: Storage research archive and independent restore
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ops/triggers/storage-research-archive]
permissions:
  contents: read
concurrency:
  group: fbis-storage-research-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test corruption, source changes and retention guards
        run: node --test test/storage-research-archive.test.mjs
      - name: Copy bounded research cohort, verify R2, restore independently
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARCHIVE_MAX_ROWS: '2000'
          ARCHIVE_START_ROWID: '0'
        run: node scripts/storage-research-archive.mjs
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: storage-research-archive
          path: /tmp/fbis-storage-archive/
          retention-days: 30
          if-no-files-found: error
