name: CFB CORE advanced smoke

# Validates week-aware CORE and a genuine PIT-only shadow challenger.
# Always fixture-only. Provider access must use production quota owner.
on:
  pull_request:
    paths:
      - "functions/lib/cfbCoreAdvancedPlumbing.js"
      - "functions/lib/cfbCoreChallenger.js"
      - "functions/lib/cfbCoreBacktest.js"
      - "functions/lib/cfbdCanonical.js"
      - "functions/lib/collegeJobsCore.js"
      - "functions/lib/cfbCfbdAcquisition.js"
      - "scripts/cfb-core-advanced-live-smoke.mjs"
      - "test/cfb-core-advanced-plumbing.test.js"
      - "test/cfb-core-challenger.test.js"
      - "test/cfb-core-backtest.test.js"
      - ".github/workflows/cfb-core-advanced-smoke.yml"
  workflow_dispatch:
    inputs:
      week:
        description: Target CFB week (optional)
        type: string
        required: false
      season:
        description: Season year
        type: string
        required: false
        default: "2026"
      live:
        description: Spend CFBD quota for a live smoke (research-only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    name: Offline CORE plumbing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test test/cfb-core-advanced-plumbing.test.js test/cfb-core-challenger.test.js test/cfb-core-backtest.test.js
      - name: Fixture smoke
        run: node scripts/cfb-core-advanced-live-smoke.mjs --season 2026 --week 8

  # Deliberately no live CFBD requests from GitHub Actions. Live acquisition
  # must go through the production D1-backed shared quota governor and
  # operator-approved cfb-current-refresh; a raw workflow fetch would bypass it.
