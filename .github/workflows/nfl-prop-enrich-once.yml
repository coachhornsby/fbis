name: NFL PrizePicks projection attach

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-prop-enrich-once.yml"
      - "functions/api/nfl-prop-enrich.js"
      - "functions/api/selective-props.js"
      - "functions/lib/selectivePropEdge.js"
      - "functions/lib/nflVerseFeed.js"
      - "functions/lib/proPlayerProjectionLayer.js"
      - "data/models/nfl-player-props-v3-validation.json"
      - "migrations/0046_nfl_prop_evidence.sql"

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
    steps:
      - name: Wait for production SHA
        run: |
          set -euo pipefail
          expected="$(echo "${GITHUB_SHA}" | tr 'A-F' 'a-f')"
          for i in $(seq 1 36); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)-$i" || true)"
            live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$body" 2>/dev/null | tr 'A-F' 'a-f')"
            if [ "$code" = "200" ] && [ "$live" = "$expected" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Attach NFL projections to persisted PrizePicks rows
        run: |
          set -euo pipefail
          today="$(TZ=America/Chicago date +%F)"
          body="$(mktemp)"
          code="$(curl -sS --max-time 120 -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            -o "$body" -w "%{http_code}" \
            "$BASE/api/nfl-prop-enrich?date=$today&_t=$(date +%s)")"
          cat "$body"
          test "$code" = "200"
          jq -e '.ok==true and .updated>0 and .playerProjectionCandidates>0' "$body" >/dev/null

      - name: Verify selective NFL prop readback
        run: |
          set -euo pipefail
          today="$(TZ=America/Chicago date +%F)"
          curl -fsS --max-time 45 "$BASE/api/selective-props?mode=sport&sport=nfl&date=$today&_t=$(date +%s)" > /tmp/readback.json
          jq -e '.ok==true and .count>2' /tmp/readback.json >/dev/null
          echo "NFL selective props=$(jq -r '.count' /tmp/readback.json)"
