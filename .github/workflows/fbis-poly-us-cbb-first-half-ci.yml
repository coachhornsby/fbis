name: FBIS Polymarket US CBB first-half contract validation
on:
  push:
    branches: [fix/polymarket-us-cbb-first-half-period-20261106]
  pull_request:
    paths:
      - 'services/polymarket-rest-collector/collector.mjs'
      - 'services/polymarket-us-stream/boundedSession.mjs'
      - 'functions/lib/boundedPolymarketBoard.js'
      - 'functions/lib/exchangeCardDelivery.js'
      - 'test/polymarket-us-cbb-first-half-route.test.mjs'
      - 'services/polymarket-rest-collector/pregame.mjs'
      - 'test/polymarket-pregame-rest.test.mjs'
      - '.github/workflows/fbis-poly-us-cbb-first-half-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify no provider-side network or D1 calls required
        run: |
          node --check services/polymarket-rest-collector/collector.mjs
          node --check services/polymarket-us-stream/boundedSession.mjs
          node --check functions/lib/boundedPolymarketBoard.js
          node --check functions/lib/exchangeCardDelivery.js
          node --test test/polymarket-us-cbb-first-half-route.test.mjs test/polymarket-bounded-session.test.mjs test/polymarket-rest-boundary.test.mjs test/exchange-family-binding.test.mjs test/exchange-card-delivery.test.mjs
      - name: Install pinned local runtime test dependencies
        run: npm ci --prefix services/account-budget --ignore-scripts --no-audit --no-fund
      - name: Verify offline REST reference and admission integration
        run: |
          node --import ./test/offline-network.js --test test/polymarket-offline-ci.test.mjs test/polymarket-pregame-rest.test.mjs test/polymarket-rest-boundary.test.mjs test/polymarket-retained-display.test.mjs test/job-execution-budget.test.mjs test/account-budget-admission.test.mjs test/account-budget-entrypoints.test.mjs
          node --test test/polymarket-rest-runtime.test.mjs
      - name: Build existing Pages board without deployment
        run: |
          mkdir -p deploy/board/snapshots
          ./node_modules/.bin/vite build --config vite.publication.config.js
