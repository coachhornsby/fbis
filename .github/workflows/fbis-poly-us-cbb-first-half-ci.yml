name: FBIS Polymarket US CBB first-half contract validation
on:
  push:
    branches: [fix/polymarket-us-cbb-first-half-period-20261106]
  pull_request:
    paths:
      - 'services/polymarket-rest-collector/collector.mjs'
      - 'services/polymarket-us-stream/boundedSession.mjs'
      - 'functions/lib/boundedPolymarketBoard.js'
      - 'functions/lib/exchangeCardDelivery.js'
      - 'test/polymarket-us-cbb-first-half-route.test.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify no provider-side network or D1 calls required
        run: |
          node --check services/polymarket-rest-collector/collector.mjs
          node --check services/polymarket-us-stream/boundedSession.mjs
          node --check functions/lib/boundedPolymarketBoard.js
          node --check functions/lib/exchangeCardDelivery.js
          node --test test/polymarket-us-cbb-first-half-route.test.mjs test/polymarket-bounded-session.test.mjs test/polymarket-rest-boundary.test.mjs test/exchange-family-binding.test.mjs test/exchange-card-delivery.test.mjs
      - name: Probe one bounded public US CBB market page (no credentials)
        run: |
          node --input-type=module <<'NODE'
          const u=new URL('https://gateway.polymarket.us/v1/events');
          for(const [k,v] of Object.entries({tagSlug:'cbb',active:'true',closed:'false',limit:'20',offset:'0'}))u.searchParams.set(k,v);
          const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),12000);
          try{
            const response=await fetch(u,{signal:ac.signal,headers:{accept:'application/json'}});
            if(!response.ok){console.log(JSON.stringify({probe:'HTTP_ERROR',http:response.status}));process.exit(0);}
            const payload=await response.json(),events=Array.isArray(payload.events)?payload.events:[];
            const types=new Map(),samples=[];let markets=0;
            for(const e of events.slice(0,20))for(const m of (e.markets||[]).slice(0,200)){
              markets++;const t=String(m.sportsMarketType||''),t2=String(m.sportsMarketTypeV2||'');
              const key=t+' | '+t2;types.set(key,(types.get(key)||0)+1);
              if(/first|half|period/i.test(key)&&samples.length<12)samples.push({type:t,v2:t2,line:m.line,sideDescriptions:(m.marketSides||[]).slice(0,2).map(z=>({description:z.description,long:z.long}))});
            }
            console.log('FBIS_PERIOD_PROBE '+JSON.stringify({http:response.status,events:events.length,markets,types:[...types].slice(0,40),samples,completeness:'SAMPLE_ONLY'}));
          }catch(e){console.log('FBIS_PERIOD_PROBE '+JSON.stringify({status:'FETCH_UNAVAILABLE',reason:e.name||'ERROR'}));}
          finally{clearTimeout(timer)}
          NODE
      - name: Probe the documented CBB game event by slug, bounded to one public GET
        run: |
          node --input-type=module <<'NODE'
          const slug='cbb-yngst-ohiost-2026-11-06',url='https://gateway.polymarket.us/v1/events/slug/'+slug;
          const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),12000);
          try{
            const response=await fetch(url,{signal:ac.signal,headers:{accept:'application/json'}});
            if(!response.ok){console.log('FBIS_CBB_GAME_PROBE '+JSON.stringify({http:response.status}));process.exit(0);}
            const data=await response.json();const event=data.event||data,rows=Array.isArray(event.markets)?event.markets:[];
            const types=[...new Set(rows.map(x=>String(x.sportsMarketType)+' | '+String(x.sportsMarketTypeV2)))];
            const hits=rows.filter(x=>/first|half|period/i.test(String(x.sportsMarketType)+' '+String(x.sportsMarketTypeV2))).slice(0,14);
            console.log('FBIS_CBB_GAME_PROBE '+JSON.stringify({http:response.status,slug:event.slug,marketCount:rows.length,types:types.slice(0,35),
              candidates:hits.map(x=>({type:x.sportsMarketType,v2:x.sportsMarketTypeV2,line:x.line,sideDescriptions:(x.marketSides||[]).slice(0,2).map(z=>({description:z.description,long:z.long}))}))}));
          }catch(e){console.log('FBIS_CBB_GAME_PROBE '+JSON.stringify({state:'UNAVAILABLE',reason:e.name||'ERROR'}));}
          finally{clearTimeout(timer)}
          NODE
      - name: Build existing Pages board without deployment
        run: npm run build --prefix deploy/board
