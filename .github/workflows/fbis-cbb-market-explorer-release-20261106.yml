name: FBIS CBB first-half market collector — one-time bounded release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fbis-cbb-market-explorer-release-20261106.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbis-cbb-first-half-market-release
  cancel-in-progress: false
jobs:
  deploy-existing-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify bounded first-half market contracts
        run: |
          node --test test/cbb-exchange-market-explorer.test.js test/exchange-card-delivery.test.mjs test/kalshi-basketball-line-quotes.test.mjs
          node --check services/kalshi-public-collector/entrypoint.mjs
      - name: Require existing deployment credentials
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || exit 1
          test -n "${CLOUDFLARE_API_TOKEN:-}" || exit 1
      - name: Deploy existing signed Kalshi bounded collector only
        run: npx wrangler deploy --config wrangler.kalshi-public-collector.toml --keep-vars
      - name: Build existing Cloudflare Pages board from published source
        run: npm run build --prefix deploy/board
      - name: Require static board assets
        run: |
          test -f deploy/board/dist/index.html || exit 1
          test -f deploy/board/functions/api/public/exchange-quotes.js || exit 1
      - name: One-shot deploy existing FBIS Pages production
        working-directory: deploy/board
        run: npx wrangler pages deploy dist --project-name fbis --branch main --commit-hash "${GITHUB_SHA}"
