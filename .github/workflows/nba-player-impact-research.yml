name: NBA player impact research

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: nba-player-impact-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: node --test test/nba-player-impact.test.js test/nba-fbis-v1.test.js

  pbp:
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - { id: "2024a", start: "2024-10-22", end: "2025-01-31" }
          - { id: "2025a", start: "2025-02-01", end: "2025-06-22" }
          - { id: "2025b", start: "2025-10-21", end: "2026-01-31" }
          - { id: "2026a", start: "2026-02-01", end: "2026-04-30" }
          - { id: "2026b", start: "2026-05-01", end: "2026-06-21" }
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - name: Download frozen canonical history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/full artifacts/chunk
          PREFIX=$(node -p "require('./research/nba/frozen-snapshot.json').r2.prefix")
          npx wrangler r2 object get "fbis-archive/${PREFIX}/nba-canonical.jsonl" --file artifacts/full/nba-canonical.jsonl --remote
          jq -c --arg s "${{ matrix.chunk.start }}" --arg e "${{ matrix.chunk.end }}"             'select((.date >= $s and .date <= $e) or ((.start // "")[0:10] >= $s and (.start // "")[0:10] <= $e))'             artifacts/full/nba-canonical.jsonl > artifacts/chunk/nba-canonical.jsonl
          test -s artifacts/chunk/nba-canonical.jsonl
      - name: Acquire normalized PBP
        run: |
          node scripts/nba-pbp-canonical-build.mjs start=${{ matrix.chunk.start }} end=${{ matrix.chunk.end }} out=artifacts/chunk/nba-pbp-${{ matrix.chunk.id }}.jsonl
      - name: Reconstruct lineup stints
        run: |
          node scripts/nba-lineup-stints-build.mjs             games=artifacts/chunk/nba-canonical.jsonl             pbp=artifacts/chunk/nba-pbp-${{ matrix.chunk.id }}.jsonl             out=artifacts/chunk/nba-lineup-stints-${{ matrix.chunk.id }}.jsonl             effects=artifacts/chunk/nba-lineup-effects-${{ matrix.chunk.id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-impact-chunk-${{ matrix.chunk.id }}-${{ github.run_id }}
          path: artifacts/chunk/nba-*
          retention-days: 30

  fit:
    needs: [unit,pbp]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: nba-impact-chunk-*-${{ github.run_id }}
          path: artifacts/chunks
      - name: Reassemble stint and lineup artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/merged artifacts/frozen
          find artifacts/chunks -name 'nba-lineup-stints-*.jsonl' -type f -print0 | sort -z | xargs -0 cat > artifacts/merged/nba-lineup-stints.jsonl
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=[];
          const walk=p=>{for(const n of fs.readdirSync(p)){const f=path.join(p,n),s=fs.statSync(f);if(s.isDirectory())walk(f);else if(/^nba-lineup-effects-.*\.json$/.test(n))files.push(f)}};
          walk('artifacts/chunks');
          const effects=[];for(const f of files){const j=JSON.parse(fs.readFileSync(f));effects.push(...(j.effects||[]))}
          fs.writeFileSync('artifacts/merged/nba-lineup-effects.json',JSON.stringify({generatedAt:new Date().toISOString(),effects},null,2));
          NODE
      - name: Download frozen canonical history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PREFIX=$(node -p "require('./research/nba/frozen-snapshot.json').r2.prefix")
          npx wrangler r2 object get "fbis-archive/${PREFIX}/nba-canonical.jsonl" --file artifacts/frozen/nba-canonical.jsonl --remote
      - name: Fit player impact model
        run: |
          node scripts/nba-player-impact-fit.mjs             games=artifacts/frozen/nba-canonical.jsonl             stints=artifacts/merged/nba-lineup-stints.jsonl             out=artifacts/merged/nba-player-impact-v1.json
      - name: True chronological impact walk-forward
        run: |
          node scripts/nba-player-impact-walkforward.mjs             games=artifacts/frozen/nba-canonical.jsonl             stints=artifacts/merged/nba-lineup-stints.jsonl             out=artifacts/merged/nba-player-impact-walkforward.json             rows=artifacts/merged/nba-player-impact-walkforward-rows.jsonl
          cat artifacts/merged/nba-player-impact-walkforward.json
      - name: Archive research impact artifact and promote only on evidence pass
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          decision=$(jq -r '.decision' artifacts/merged/nba-player-impact-walkforward.json)
          run_prefix="research/nba/player-impact/v1/run-${GITHUB_RUN_ID}"
          latest_prefix="research/nba/player-impact/v1/latest"
          for prefix in "$run_prefix" "$latest_prefix"; do
            npx wrangler r2 object put "fbis-archive/${prefix}/nba-player-impact-v1.json" --file artifacts/merged/nba-player-impact-v1.json --remote
            npx wrangler r2 object put "fbis-archive/${prefix}/nba-lineup-effects.json" --file artifacts/merged/nba-lineup-effects.json --remote
            npx wrangler r2 object put "fbis-archive/${prefix}/walkforward.json" --file artifacts/merged/nba-player-impact-walkforward.json --remote
          done
          if [ "$decision" = "PROMOTE_IMPACT_CONTEXT" ]; then
            npx wrangler r2 object put "fbis-archive/models/nba/player-impact/v1/nba-player-impact-v1.json" --file artifacts/merged/nba-player-impact-v1.json --remote
            npx wrangler r2 object put "fbis-archive/models/nba/player-impact/v1/nba-lineup-effects.json" --file artifacts/merged/nba-lineup-effects.json --remote
            npx wrangler r2 object put "fbis-archive/models/nba/player-impact/v1/walkforward.json" --file artifacts/merged/nba-player-impact-walkforward.json --remote
          else
            echo "Impact layer retained in research/shadow: $decision"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nba-player-impact-v1-${{ github.run_id }}
          path: artifacts/merged/
          retention-days: 90
