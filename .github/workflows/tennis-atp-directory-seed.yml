name: Tennis ATP supplemental identity seed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sql/tennis-atp-canonical-research-seed.sql'
      - '.github/workflows/tennis-atp-directory-seed.yml'
permissions:
  contents: read
concurrency:
  group: tennis-d1-writes
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - name: Read-only ATP population baseline
        run: |
          npx wrangler d1 execute fbis --remote --command "SELECT tour,COUNT(*) AS players FROM tennis_players GROUP BY tour" --json
      - name: Seed supplemental identities without changing official records
        run: npx wrangler d1 execute fbis --remote --file scripts/sql/tennis-atp-canonical-research-seed.sql
      - name: Verify ATP identity population
        run: |
          npx wrangler d1 execute fbis --remote --command "SELECT official_source,COUNT(*) AS players FROM tennis_players WHERE tour='atp' GROUP BY official_source" --json
