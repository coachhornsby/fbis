name: FBIS private Drive archive readback — manual only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fbis-college-drive-readback.yml"
  pull_request:
    paths:
      - "scripts/github_drive_archive_verify.py"
      - "test/github_drive_archive_verify_test.py"
      - ".github/workflows/fbis-college-drive-readback.yml"
  workflow_dispatch:
    inputs:
      verify_drive:
        description: "Explicitly read three allowlisted CBB Drive archives (no model promotion)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fbis-college-drive-readback
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Offline Drive manifest contract tests
        run: python -m unittest discover -s test -p github_drive_archive_verify_test.py -v
      - name: Install authenticated Google read-only client
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_drive)
        run: python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Verify three private Drive archives
        if: github.event_name == 'workflow_dispatch' && inputs.verify_drive
        env:
          FBIS_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.FBIS_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/github_drive_archive_verify.py
      - name: Upload receipts only; never raw provider files
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: fbis-drive-readback-${{ github.run_id }}
          path: artifacts/college-drive-readonly/receipt.json
          retention-days: 7
          if-no-files-found: ignore
