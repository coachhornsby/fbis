name: CFB full-history research dataset
on:
  push:
    branches: ["main"]
    paths:
      - "functions/api/cfb-history-chunk.js"
      - "scripts/cfb-full-history-build.mjs"
      - "scripts/cfb-bulk-history.py"
      - "scripts/cfb-merge-history.py"
      - ".github/workflows/cfb-full-history.yml"
  workflow_dispatch:
    inputs:
      startSeason:
        description: Earliest CFBD season to probe
        required: false
        default: "2000"
      endSeason:
        description: Latest season to probe
        required: false
        default: "2026"

permissions:
  contents: read

concurrency:
  group: cfb-full-history-research-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow

      - name: Wait for exact production SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            tmp="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$tmp" -w "%{http_code}" "${BASE}/api/health?_t=$(date +%s)-${attempt}" || true)"
            live="$(jq -r '.deploymentCommit // .deployment_sha // .commit // empty' "$tmp" 2>/dev/null || true)"
            echo "production_sha attempt=${attempt}/36 http=${code} live=${live:-none} expected=${EXPECTED_SHA}"
            if [ "$code" = "200" ] && [ "$live" = "$EXPECTED_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not converge to expected SHA before history build."
          exit 1

      - name: Build CFBD 2000-2026 history and all-provider market lines
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE: https://fbis-myz.pages.dev
          CFB_HISTORY_START: ${{ github.event.inputs.startSeason || '2000' }}
          CFB_HISTORY_END: ${{ github.event.inputs.endSeason || '2026' }}
          CFB_HISTORY_CHUNK_WEEKS: "4"
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET}" || { echo "HARVEST_SECRET missing"; exit 2; }
          node scripts/cfb-full-history-build.mjs

      - name: Build SportsDataverse/ESPN 2004-2026 enrichment
        env:
          CFB_BULK_START: "2004"
          CFB_BULK_END: "2026"
        run: python scripts/cfb-bulk-history.py

      - name: Merge canonical CFB history
        run: python scripts/cfb-merge-history.py

      - name: QA summaries
        run: |
          echo "=== CFBD ==="
          cat artifacts/cfb-history/cfb_history_qa.json
          echo "=== SportsDataverse ==="
          cat artifacts/cfb-history-v2/cfb_bulk_qa.json
          echo "=== Master ==="
          cat artifacts/cfb-master/cfb_master_qa.json

      - uses: actions/upload-artifact@v4
        with:
          name: cfb-complete-history-${{ github.run_id }}
          path: |
            artifacts/cfb-history/*
            artifacts/cfb-history-v2/*
            artifacts/cfb-master/*
          if-no-files-found: error
          retention-days: 90
