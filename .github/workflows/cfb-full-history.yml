name: CFB full-history coverage audit
on:
  push:
    branches: ["research/cfb-full-history-20261002"]
    paths:
      - "scripts/cfb-history-coverage.mjs"
      - ".github/workflows/cfb-full-history.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit CFBD historical coverage
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_HISTORY_START: "2000"
          CFB_HISTORY_END: "2026"
        run: node scripts/cfb-history-coverage.mjs
      - run: cat artifacts/cfb-history/coverage-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-full-history-coverage
          path: artifacts/cfb-history/*
          retention-days: 90
