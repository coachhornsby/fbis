name: CFB full-history research dataset
on:
  push:
    branches: ["research/cfb-bulk-history-v2"]
    paths:
      - "scripts/cfb-bulk-history.py"
      - "scripts/cfb-cfbd-market-enrichment.mjs"
      - "scripts/cfb-merge-provider-lines.py"
      - "scripts/cfb-compact-walkforward.py"
      - ".github/workflows/cfb-full-history.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cfb-full-history-research
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn
      - name: Build SportsDataverse 2004-2026 canonical CFB history
        env:
          CFB_BULK_START: "2004"
          CFB_BULK_END: "2026"
        run: python scripts/cfb-bulk-history.py
      - name: QA summary
        run: cat artifacts/cfb-history-v2/cfb_bulk_qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-full-history-v2-${{ github.run_id }}
          path: artifacts/cfb-history-v2/*
          if-no-files-found: error
          retention-days: 90
