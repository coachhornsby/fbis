name: NHL v1 live probe

on:
  push:
    branches:
      - "probe/nhl-v1-live-20260929"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live NHL goalie recency model
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nhl.json"
          http="$(curl -sS --max-time 90 -o "$out" -w "%{http_code}" 'https://fbis-myz.pages.dev/api/slate?sport=nhl&date=2026-09-29')"
          echo "http=$http"
          test "$http" = "200"
          jq -e '.sport=="nhl" and (.games|length)==5' "$out" >/dev/null
          echo "modelVersion=$(jq -r '.modelVersion // ""' "$out")"
          echo "fiveLayer=$(jq -c '.research.nhlFiveLayer // {}' "$out")"
          jq -c '.games[] | {matchup:((.away.abbr//.away.name)+" @ "+(.home.abbr//.home.name)),projHome:.nhlV1.home,projAway:.nhlV1.away,homeGoalie:{id:.nhlV1.layers.goalie.home.goalieId,name:.nhlV1.layers.goalie.home.name,status:.nhlV1.layers.goalie.home.status,latestSeason:.nhlV1.layers.goalie.home.latestSeason,latestGames:.nhlV1.layers.goalie.home.latestSeasonGames,latestGsax:.nhlV1.layers.goalie.home.latestSeasonGsax,latestRegressed:.nhlV1.layers.goalie.home.latestSeasonRegressedImpact,priorImpact:.nhlV1.layers.goalie.home.historicalPriorImpact,weights:.nhlV1.layers.goalie.home.priorWeights},awayGoalie:{id:.nhlV1.layers.goalie.away.goalieId,name:.nhlV1.layers.goalie.away.name,status:.nhlV1.layers.goalie.away.status,latestSeason:.nhlV1.layers.goalie.away.latestSeason,latestGames:.nhlV1.layers.goalie.away.latestSeasonGames,latestGsax:.nhlV1.layers.goalie.away.latestSeasonGsax,latestRegressed:.nhlV1.layers.goalie.away.latestSeasonRegressedImpact,priorImpact:.nhlV1.layers.goalie.away.historicalPriorImpact,weights:.nhlV1.layers.goalie.away.priorWeights},maturity:.projectionMaturity,canQualify,canAuthorizeWager}' "$out"
          jq -e '.modelVersion|contains("research-v1.1-five-layer-goalie-recency")' "$out" >/dev/null
          jq -e '.research.nhlFiveLayer.artifactVersion=="research-v1.1-historical-xg-goalie-recency"' "$out" >/dev/null
          jq -e '(.games|length) as $n | ([.games[] | select(.nhlV1.ok==true)] | length) == $n' "$out" >/dev/null
          jq -e '[.games[] | .nhlV1.layers.fiveVFiveXg.goaliePriorWeights | select(."20232024"==0.15 and ."20242025"==0.25 and ."20252026"==0.60)] | length == 5' "$out" >/dev/null
          jq -e '(.games|length) as $n | ([.games[] | select(.projectionMaturity=="RESEARCH" and .canQualify==false and .canAuthorizeWager==false)] | length) == $n' "$out" >/dev/null
