name: CFB CORE original prospective promotion-readiness report
on:
  pull_request:
    paths:
      - "scripts/cfb-core-live-readiness.mjs"
      - "test/cfb-core-live-readiness.test.js"
      - ".github/workflows/cfb-core-readiness-live.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 17 * * 1,4"
  push:
    branches: [main]
    paths:
      - "scripts/cfb-core-live-readiness.mjs"
      - ".github/workflows/cfb-core-readiness-live.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/cfb-core-live-readiness.test.js
      - run: node --check scripts/cfb-core-live-readiness.mjs
  prospective-evaluation:
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2fdc80b8d99070adcef12f7a785c3fc1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read original CORE challenger snapshots from dedicated research DB
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "MISSING_CLOUDFLARE_API_TOKEN"; exit 1; }
          npx wrangler d1 execute fbis-cfb-tier3-research --remote --json --command "SELECT game_id,season,week,kickoff,eligibility,can_qualify,final_verified,actual_home,actual_away,generation_at,feature_cutoff_at,champion_spread,core_spread,champion_p_home_win,core_p_home_win,core_artifact_id,core_model_version,champion_model_version FROM cfb_core_shadow_predictions WHERE season=2026" > /tmp/core-original-shadow.json
          node scripts/cfb-core-live-readiness.mjs /tmp/core-original-shadow.json artifacts/cfb-core-readiness/report.json
      - name: Immutable R2 report and cryptographic readback
        run: |
          set -euo pipefail
          SHA=$(sha256sum artifacts/cfb-core-readiness/report.json | cut -d' ' -f1)
          KEY="cfb/2026/core-prospective-readiness/${SHA}.json"
          npx wrangler r2 object put "fbis-archive/${KEY}" --file artifacts/cfb-core-readiness/report.json --content-type application/json --remote --force
          npx wrangler r2 object get "fbis-archive/${KEY}" --remote --file /tmp/core-readiness-back.json
          echo "${SHA}  /tmp/core-readiness-back.json" | sha256sum -c -
          node -e "const x=require('./artifacts/cfb-core-readiness/report.json');if(x.automaticPromotion||x.wagerAuthority||x.readyForHumanReview)throw Error('UNAUTHORIZED_PROMOTION_OUTPUT')"
          echo "CFB_CORE_PROSPECTIVE_SHADOW_REPORT_READBACK_PASSED"
      - name: Publish independent readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-core-original-prospective-readiness
          path: artifacts/cfb-core-readiness/
          if-no-files-found: warn
          retention-days: 30
