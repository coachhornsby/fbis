name: CFB game intel and props v2
on:
  workflow_dispatch:
  push:
    branches: [research/cfb-game-intel-props-v2]
    paths:
      - 'functions/lib/cfbGameWagerIntelligence.js'
      - 'functions/lib/cfbPropConfidence.js'
      - 'test/cfb-game-intel-props-v2.test.js'
      - 'docs/CFB-*'
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test test/cfb-game-intel-props-v2.test.js
