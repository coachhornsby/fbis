name: One-time FBIS PinnOdds board recovery (free API)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pinnodds-recover-current-board.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: fbis-pinnodds-governed-capture
  cancel-in-progress: false
jobs:
  recover:
    # This is NOT a recurring job. Deliberate single-run commit marker only.
    if: contains(github.event.head_commit.message, 'one-shot-pinnodds-live-board-20261016')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
      PINNODDS_RESTORE_ONCE: '1'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify exact deployed Pages SHA before any provider request
        run: node scripts/verify-deployment-sha.mjs "$GITHUB_SHA"
      - name: Verify collector is deployed, authenticated and ready
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          sep="?"
          if [[ "$url" == *"?"* ]]; then sep="&"; fi
          body="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${url}${sep}audience=sports-projection-orchestrator")"
          token="$(jq -er '.value' <<<"$body")"
          echo "::add-mask::$token"
          echo "OIDC token obtained; no paid provider request."
          code="$(curl -sS --max-time 15 -o /tmp/pinnodds-ready.json -w '%{http_code}' -H "Authorization: Bearer $token" https://fbis-orchestrator.coachhornsby.workers.dev/api/pinnodds-capture)"
          test "$code" = "405"
          jq -e '.ready==true and .version=="pinnodds-governed-capture-v1"' /tmp/pinnodds-ready.json >/dev/null
      - name: Capture free boards, publish R2 evidence, attempt D1 reconciliation
        run: node scripts/collect-pinnodds-governed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinnodds-recovery-${{ github.run_id }}
          path: artifacts/pinnodds-*.json
          retention-days: 14
          if-no-files-found: warn
