name: CFB migration candidate contracts
on:
  pull_request:
    paths:
      - docs/sql/cfb-review-20261011/**
      - test/cfb-candidate-migration-contract.test.py
      - .github/workflows/cfb-migration-candidate-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python test/cfb-candidate-migration-contract.test.py -v
