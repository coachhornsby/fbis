name: KBO Phase 4A external source trial
on:
  push:
    branches:
      - codex/kbo-npb-phase4a-source-trial
  workflow_dispatch:
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded external source trial
        run: python scripts/kbo-phase4a-external-trial.py
