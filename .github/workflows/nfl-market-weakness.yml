name: NFL market weakness research
on:
  push:
    branches: ["research/market-weakness-nfl-cfb"]
    paths:
      - "scripts/nfl-market-weakness.py"
      - "scripts/nfl-pro-v1-1-walkforward.py"
      - "scripts/build-nfl-training-dataset.py"
      - ".github/workflows/nfl-market-weakness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn
      - name: Rebuild leakage-safe NFL dataset
        run: python scripts/build-nfl-training-dataset.py
      - name: Rebuild true OOS NFL-PRO-v1.1 predictions
        run: python scripts/nfl-pro-v1-1-walkforward.py
      - name: Discover and hold out market-weakness regimes
        run: python scripts/nfl-market-weakness.py
      - name: Summary
        run: jq '{modelId,sample,verifiedCount,verified,governance}' artifacts/nfl-market-weakness/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-market-weakness
          path: artifacts/nfl-market-weakness/*
          retention-days: 90
