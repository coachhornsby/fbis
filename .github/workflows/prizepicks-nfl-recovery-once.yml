name: PrizePicks NFL supplemental recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prizepicks-nfl-recovery-once.yml"

concurrency:
  group: prizepicks-nfl-recovery-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover-nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - name: Require credentials
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          test -n "${APIFY_TOKEN:-}"

      - name: Wait for supplemental API deployment
        run: |
          set -euo pipefail
          expected="$(echo "${GITHUB_SHA}" | tr 'A-F' 'a-f')"
          for i in $(seq 1 36); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)-$i" || true)"
            live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$body" 2>/dev/null | tr 'A-F' 'a-f')"
            if [ "$code" = "200" ] && [ "$live" = "$expected" ]; then
              echo "production ready: $live"
              exit 0
            fi
            echo "waiting attempt=$i live=${live:-none} expected=$expected"
            sleep 10
          done
          exit 1

      - name: Build NFL FBIS candidate map
        run: |
          set -euo pipefail
          mkdir -p artifacts
          today="$(TZ=America/Chicago date +%F)"
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 90 -o "$tmp" -w "%{http_code}" "$BASE/api/projections?sport=nfl&date=$today&_t=$(date +%s)")"
          echo "NFL projections http=$code"
          test "$code" = "200"
          jq -c '
            [(.games // [])[] as $g
             | (($g.playerProjections.rows // [])[])
             | select(.playerName != null and .market != null and .fbisProjection != null)
             | {
                 sport:"nfl",
                 eventId:($g.id|tostring),
                 playerName:.playerName,
                 team:(.team // null),
                 home:($g.home.abbr // $g.home.name // null),
                 away:($g.away.abbr // $g.away.name // null),
                 start:($g.start // $g.startCt // null),
                 market:.market,
                 fbisProjection:.fbisProjection,
                 fbisSigma:(.fbisSigma // null),
                 modelVersion:(.modelVersion // .source // null),
                 validationStatus:(.validationStatus // null),
                 validatedPredictive:(.validatedPredictive // false),
                 dataQuality:(.dataQuality // null),
                 playerId:(.playerId // null)
               }]
            | unique_by([.eventId,.playerName,.market])
          ' "$tmp" > artifacts/candidates.json
          echo "NFL candidates=$(jq 'length' artifacts/candidates.json)"
          test "$(jq 'length' artifacts/candidates.json)" -gt 0

      - name: Pull NFL PrizePicks board
        run: |
          set -euo pipefail
          input='{"leagues":["NFL"]}'
          body="$(mktemp)"
          code="$(curl -sS --max-time 240 -X POST \
            -H "Authorization: Bearer ${APIFY_TOKEN}" \
            -H "content-type: application/json" \
            --data-binary "$input" \
            -o "$body" -w "%{http_code}" \
            "https://api.apify.com/v2/acts/zen-studio~prizepicks-player-props/run-sync-get-dataset-items?format=json&clean=true")"
          echo "PrizePicks NFL Actor http=$code"
          case "$code" in 200|201) ;; *) cat "$body"; exit 1 ;; esac
          jq -e 'type=="array"' "$body" >/dev/null
          cp "$body" artifacts/nfl-prizepicks.json
          rows="$(jq 'length' artifacts/nfl-prizepicks.json)"
          echo "NFL actor rows=$rows"
          test "$rows" -gt 0

      - name: Persist NFL supplemental rows
        run: |
          set -euo pipefail
          run_id="pp_nfl_recovery_$(TZ=America/Chicago date +%Y%m%d)_${GITHUB_RUN_ID}"
          payload="$(mktemp)"
          jq -n \
            --arg runId "$run_id" \
            --slurpfile rows artifacts/nfl-prizepicks.json \
            --slurpfile candidates artifacts/candidates.json \
            '{operation:"supplemental_nfl",runId:$runId,rows:$rows[0],candidates:$candidates[0]}' > "$payload"
          body="$(mktemp)"
          code="$(curl -sS --max-time 120 -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            --data-binary "@$payload" \
            -o "$body" -w "%{http_code}" \
            "$BASE/api/prizepicks-props")"
          cat "$body"
          test "$code" = "200"
          jq -e '.ok==true and .written>0' "$body" >/dev/null
          cp "$body" artifacts/persist-result.json

      - name: Verify NFL live readback
        run: |
          set -euo pipefail
          today="$(TZ=America/Chicago date +%F)"
          curl -fsS --max-time 45 "$BASE/api/prizepicks-props?sport=nfl&date=$today&limit=1000&_t=$(date +%s)" > artifacts/readback.json
          jq -e '.ok==true and .count>0 and ([.rows[].sport]|unique)==["nfl"]' artifacts/readback.json >/dev/null
          echo "NFL live rows=$(jq -r '.count' artifacts/readback.json)"
          echo "NFL players=$(jq '[.rows[].player_name]|unique|length' artifacts/readback.json)"
          echo "NFL matched=$(jq -r '.matched' artifacts/persist-result.json)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prizepicks-nfl-recovery-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
