name: CBB source validation

on:
  push:
    paths:
      - ".github/workflows/cbb-source-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate CBB independent sources
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          http="$(curl -sS --max-time 180             -H "x-harvest-secret: ${HARVEST_SECRET}"             -H "accept: application/json"             -o "$out" -w "%{http_code}"             "${BASE}/api/college?job=cbb-current-refresh&trigger=workflow_dispatch")"
          echo "http=$http"
          jq -c '{
            ok,
            status,
            errors:(.errors//[]),
            endpoints:[(.d1.endpoints//[])[] | {
              source:(.source//""),
              path:(.path//.endpoint//""),
              ok:(.ok//false),
              status:(.status//0),
              n:(.n//.recordCount//0),
              reason:(.reason//null)
            }],
            writes:(.writes//null)
          }' "$out"
          test "$http" = "200"
          jq -e '.ok == true and .status == "success"' "$out" >/dev/null
