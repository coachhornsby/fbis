name: Verify independent market payload backup dependencies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ops/triggers/storage-market-dependencies]
permissions:
  contents: read
concurrency:
  group: fbis-storage-market-dependencies
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test test/polymarket-storage.test.js
      - name: Verify pinned cohort receipt and raw-source closure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/storage-market-dependencies.mjs
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: storage-market-dependencies
          path: /tmp/fbis-market-dependencies/
          retention-days: 30
          if-no-files-found: error
