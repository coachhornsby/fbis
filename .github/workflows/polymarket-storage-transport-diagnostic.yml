name: Storage runner transport diagnostic
on:
  push:
    branches: [fix/polymarket-storage-diagnostics-20261015]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const api='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/b50c724c-903b-4241-8ce1-48d931e7a44c/query';
          for(const [name,sql] of [['probe','SELECT 1'],['first-page',"SELECT rowid,id,raw_payload_json,raw_payload_hash FROM normalized_market_observations NOT INDEXED WHERE rowid>0 AND source='Polymarket US' ORDER BY rowid LIMIT 500"],['remaining-page',"SELECT rowid,id,raw_payload_json,raw_payload_hash FROM normalized_market_observations NOT INDEXED WHERE rowid>471570 AND source='Polymarket US' ORDER BY rowid LIMIT 500"]]){
            const start=Date.now();try{const r=await fetch(api,{method:'POST',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(20000)});const t=await r.text();let v;try{v=JSON.parse(t)}catch{v={}}console.log(JSON.stringify({name,status:r.status,ms:Date.now()-start,bytes:Buffer.byteLength(t),success:v.success,errors:v.errors?.map(e=>e.code),rows:v.result?.[0]?.results?.length}));}catch(e){console.log(JSON.stringify({name,error:e.message,ms:Date.now()-start}));}
          }
          const start=Date.now();try{const r=await fetch('https://fbis-myz.pages.dev/api/polymarket-storage',{method:'POST',headers:{'content-type':'application/json','x-harvest-secret':process.env.HARVEST_SECRET},body:JSON.stringify({operation:'receipt',receiptId:'run-38688594777-1-nfl-0'}),signal:AbortSignal.timeout(60000)});if(!r.ok)console.log(JSON.stringify({name:'receipt',status:r.status}));else{const v=await r.json();console.log(JSON.stringify({name:'receipt',status:r.status,offers:v.offers?.length,ms:Date.now()-start}));}}catch(e){console.log(JSON.stringify({name:'receipt',error:e.message,ms:Date.now()-start}));}
          JS
