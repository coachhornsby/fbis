name: CFB first V2 research as-of run (one time)

# Execute once after the CFB research feature's main CI and production release.
# This job does not mutate champion predictions or authorize wagers.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cfb-drive-first-asof-20261022
  cancel-in-progress: false
jobs:
  cfb-asof:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          contains(github.event.workflow_run.head_commit.message, '[CFB-DRIVE-V2-FIRST-ASOF-20261022]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Freeze a genuine as-of-now CFB V2 research observation
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}" || { echo "Missing configured HARVEST_SECRET"; exit 2; }
          mkdir -p sanitized
          payload='{"action":"drive-research-asof","gameId":"401856727"}'
          http="$(curl -sS --show-error --retry 0 --max-time 180 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" -H "content-type: application/json" \
            -X POST --data "$payload" -o response.json -w '%{http_code}' \
            https://fbis-myz.pages.dev/api/cfb-simulation)" || http="000"
          echo "CFB V2 research freeze HTTP ${http}"
          if jq -e . response.json >/dev/null 2>&1; then
            jq '{ok,status,gameId,runId,sourceSnapshotId,sourceFrozenAt,
                researchFrozenAt,trainingGames,trainingDrives,iterations,
                researchMode,marketScope,changesProductionChampion,
                noWagerAuthority,reason,
                distributions:{home_score:.distributions.home_score,
                               away_score:.distributions.away_score,
                               total:.distributions.total,
                               margin:.distributions.margin,
                               home_regulation_lead:.distributions.home_regulation_lead,
                               regulation_tie:.distributions.regulation_tie}}' \
              response.json > sanitized/result.json
            jq -c . sanitized/result.json
            jq -c . sanitized/result.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"ok":false,"error":"MISSING_JSON"}' > sanitized/result.json
            exit 1
          fi
          test "$http" = "200"
          jq -e '.ok == true and
                (.status=="FROZEN" or .status=="ALREADY_FROZEN") and
                .noWagerAuthority == true and
                .researchMode == "NEW_RESEARCH_OBSERVATION_EARLIER_CHAMPION_BASELINE"' \
             response.json >/dev/null
      - name: Verify CFB D1 research receipts
        if: success()
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          http="$(curl -sS --show-error --retry 0 --max-time 60 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -o status.json -w '%{http_code}' \
            "https://fbis-myz.pages.dev/api/cfb-simulation?mode=drives")"
          test "$http" = "200"
          jq '{source,sourceGames,sourceDrives,runs,grades,trainingReady,limitations}' status.json > sanitized/status.json
          jq -e '.source == "CFB_DB" and .runs >= 1' sanitized/status.json >/dev/null
          jq -c . sanitized/status.json
      - name: Retain sanitized provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-v2-first-asof-20261022
          path: sanitized/*.json
          if-no-files-found: ignore
          retention-days: 14
