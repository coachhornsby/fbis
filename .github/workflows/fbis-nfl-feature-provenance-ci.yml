name: NFL feature provenance regression
on:
  pull_request:
    paths:
      - 'functions/lib/nflVerseFeed.js'
      - 'test/nfl-feature-provenance.test.js'
      - 'test/nfl-feature-snapshot.test.js'
      - '.github/workflows/fbis-nfl-feature-provenance-ci.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - run: node --import ./test/offline-network.js --test test/nfl-feature-provenance.test.js test/nfl-feature-snapshot.test.js test/nfl-model.test.js test/nfl-personnel-challenger.test.js test/nfl-pbp-enrich-canon.test.js
