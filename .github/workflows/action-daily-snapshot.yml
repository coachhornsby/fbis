name: ACTION daily market snapshot

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: action-daily-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    name: ACTION DAILY 07:00 CT
    runs-on: ubuntu-latest
    steps:
      - name: Gate to 07:00 America/Chicago
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$(TZ=America/Chicago date +%H)" = "07" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Require operator secret
        if: steps.gate.outputs.run == 'true'
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: test -n "${HARVEST_SECRET:-}"

      - name: Start one paid ACTION run
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          http="$(curl -sS --max-time 30 --retry 0 -X POST             -H "x-harvest-secret: ${HARVEST_SECRET}"             -H "content-type: application/json"             -d '{"mode":"start"}' -o "$body" -w "%{http_code}"             "${BASE}/api/action-daily-async?mode=start")"
          cat "$body"
          test "$http" = "202" -o "$http" = "200"
          jq -e '.ok == true' "$body" >/dev/null

      - name: Harvest same ACTION run
        if: steps.gate.outputs.run == 'true'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(mktemp)"
            http="$(curl -sS --max-time 30 --retry 0 -X POST               -H "x-harvest-secret: ${HARVEST_SECRET}"               -H "content-type: application/json"               -d '{"mode":"harvest"}' -o "$body" -w "%{http_code}"               "${BASE}/api/action-daily-async?mode=harvest")"
            echo "attempt=${attempt} http=${http}"
            cat "$body"
            status="$(jq -r '.status // empty' "$body")"
            if [ "$http" = "200" ] && [ "$status" = "success_daily" ]; then exit 0; fi
            if [ "$status" = "actor_running" ] && [ "$http" = "202" ]; then sleep 30; continue; fi
            if [ "$status" = "already_collected_today" ]; then exit 0; fi
            exit 1
          done
          echo "ACTION run did not finish inside harvest window; no second paid run was started."
          exit 1
