name: CFB bulk history v3 validation
on:
  push:
    branches: ["research/cfb-bulk-history-v3"]
    paths:
      - "scripts/cfb-bulk-history-v3.py"
      - ".github/workflows/cfb-bulk-history-v3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow
      - name: Build expanded SportsDataverse CFB history
        env:
          CFB_BULK_START: "2004"
          CFB_BULK_END: "2026"
        run: python scripts/cfb-bulk-history-v3.py
      - name: QA
        run: cat artifacts/cfb-history-v2/cfb_bulk_qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-bulk-history-v3
          path: artifacts/cfb-history-v2/*
          if-no-files-found: error
          retention-days: 90
