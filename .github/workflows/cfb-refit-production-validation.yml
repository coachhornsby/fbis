name: CFB Refit Production Validation

on:
  push:
    paths:
      - ".github/workflows/cfb-refit-production-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Wait for exact refit deployment
        env:
          BASE: https://fbis-myz.pages.dev
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)" || true)"
            live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$body" 2>/dev/null | tr 'A-F' 'a-f')"
            exp="$(echo "$EXPECTED" | tr 'A-F' 'a-f')"
            echo "attempt=$i http=$code live=$live expected=$exp"
            if [ "$code" = "200" ] && [ "$live" = "$exp" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Verify packaged refit artifact
        run: |
          set -euo pipefail
          jq -e '
            .modelId=="CFB-FBIS-v2" and
            .featureContract=="ppa-derived-base-v2" and
            .canQualify==false and
            .canAuthorize==false and
            .trainN>=1000 and .testN>=1000
          ' data/models/cfb-fbis-v2-fitted-aa.json >/dev/null
          jq '{version,Mstar,Tstar,trainN,testN,featureContract,margin,total}' data/models/cfb-fbis-v2-fitted-aa.json

      - name: Strict Friday holdout replay
        env:
          CFBD_REFIT_PROXY_BASE: https://fbis-myz.pages.dev
          CFBD_REFIT_PROXY_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          node scripts/cfb-v2-holdout-replay.mjs | tee /tmp/holdout.json
          jq -e '.ok==true and .trainingLeakage==false and (.games|length)==5' /tmp/holdout.json >/dev/null
          echo "## Strict Friday holdout" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.games[] | "- \(.matchup): projected \(.projected.away)-\(.projected.home) (total \(.projected.total)); actual \(.actual.away)-\(.actual.home); |margin error| \(.error.absMargin); |total error| \(.error.absTotal)"' /tmp/holdout.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload holdout evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfb-refit-friday-holdout
          path: /tmp/holdout.json
          retention-days: 14
