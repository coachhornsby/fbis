name: CFB prop coverage v3
on:
  workflow_dispatch:
  push:
    branches: [fix/cfb-prop-coverage-v3]
    paths:
      - 'functions/lib/cfbGameWagerIntelligence.js'
      - 'functions/lib/cfbPropConfidence.js'
      - 'functions/lib/cfbPlayerPropMoney.js'
      - 'functions/api/prizepicks-props.js'
      - 'test/cfb-game-intel-props-v2.test.js'
      - 'test/cfb-player-prop-money-v2.test.js'
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test test/cfb-game-intel-props-v2.test.js test/cfb-player-prop-money-v2.test.js
