name: NBA player impact shadow grade

on:
  workflow_dispatch:
  push:
    branches: ["research/nba-player-impact-v1", main]
    paths:
      - "scripts/nba-player-impact-shadow-grade.mjs"
      - "migrations/0048_nba_player_impact.sql"
      - ".github/workflows/nba-player-impact-shadow-grade.yml"
  schedule:
    - cron: "35 17,23 * * *"

permissions:
  contents: read

concurrency:
  group: nba-player-impact-shadow-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Load current-season canonical outcomes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/current
          npx wrangler r2 object get             "fbis-archive/canonical/espn/nba/2026-27/current/nba-canonical.jsonl"             --file artifacts/current/nba-canonical.jsonl --remote || : > artifacts/current/nba-canonical.jsonl

      - name: Export existing shadow rows and existing PrizePicks lines
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM nba_player_prop_impact_shadow WHERE feature_cutoff_timestamp >= datetime('now','-45 days') ORDER BY feature_cutoff_timestamp ASC"             > artifacts/nba-impact-shadow.json || echo '[]' > artifacts/nba-impact-shadow.json
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM prizepicks_prop_lines WHERE sport='nba' AND collected_at >= datetime('now','-45 days') ORDER BY collected_at ASC"             > artifacts/nba-prizepicks.json || echo '[]' > artifacts/nba-prizepicks.json

      - name: Grade impact challenger against baseline
        run: |
          node scripts/nba-player-impact-shadow-grade.mjs

      - name: Persist grades and validation evidence
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --file=migrations/0048_nba_player_impact.sql
          if [ -s artifacts/nba-impact-shadow-grade.sql ]; then
            npx wrangler d1 execute fbis --remote --file=artifacts/nba-impact-shadow-grade.sql
          fi

      - name: Archive shadow validation report
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          npx wrangler r2 object put             "fbis-archive/evaluation/nba/player-impact/${stamp}.json"             --file artifacts/nba-impact-shadow-grade.json --remote

      - name: Publish summary
        run: |
          {
            echo "## NBA player impact challenger"
            jq -r '"- Decision: \(.decision)"' artifacts/nba-impact-shadow-grade.json
            jq -r '"- Core markets improved: \(.improvedCoreMarkets)"' artifacts/nba-impact-shadow-grade.json
            jq -r '"- Enough prospective sample: \(.enough)"' artifacts/nba-impact-shadow-grade.json
            echo "- New PrizePicks paid calls: 0"
            echo "- Challenger qualification: OFF until promotion gate passes"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nba-player-impact-shadow-grade-${{ github.run_id }}
          path: artifacts/nba-impact-shadow-grade.json
          retention-days: 90
