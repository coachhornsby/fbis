name: Basketball form backfill
on:
  push:
    branches: [main]
    paths:
      - "functions/lib/basketballFormModel.js"
      - "functions/api/basketball-form-backfill.js"
      - "functions/lib/slateEngineCore.js"
      - "functions/lib/slateEngine.js"
      - ".github/workflows/basketball-form-backfill.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Wait for production SHA
        env:
          BASE: https://fbis-myz.pages.dev
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            live="$(curl -sS --max-time 15 "$BASE/api/health?_t=$(date +%s)" | jq -r '.deploymentCommit // .build.commitSha // empty' | tr 'A-F' 'a-f')"
            exp="$(echo "$EXPECTED" | tr 'A-F' 'a-f')"
            echo "deployment check $i live=$live expected=$exp"
            [ "$live" = "$exp" ] && exit 0
            sleep 15
          done
          echo "Production never reached expected SHA"
          exit 1
      - name: Backfill scoreboard-derived team form
        env:
          BASE: https://fbis-myz.pages.dev
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "$HARVEST_SECRET"
          run_range () {
            sport="$1"; start="$2"; end="$3"
            cursor="$start"
            while true; do
              chunk_end="$(date -d "$cursor + 13 days" +%F)"
              if [[ "$chunk_end" > "$end" ]]; then chunk_end="$end"; fi
              payload="$(mktemp)"
              body="$(mktemp)"
              node scripts/basketball-backfill-payload.mjs "$sport" "$cursor" "$chunk_end" > "$payload"
              games="$(jq '.games|length' "$payload")"
              echo "$sport runner payload $cursor..$chunk_end games=$games"
              code="$(curl -sS --max-time 120 --retry 1 --retry-all-errors \
                -X POST -H "x-harvest-secret: $HARVEST_SECRET" -H "content-type: application/json" \
                --data-binary "@$payload" -o "$body" -w "%{http_code}" "$BASE/api/basketball-form-backfill")"
              echo "$sport $cursor..$chunk_end http=$code"
              cat "$body"; echo
              test "$code" = "200"
              jq -e '.ok == true and .source == "trusted-runner-payload"' "$body" >/dev/null
              [ "$chunk_end" = "$end" ] && break
              cursor="$(date -d "$chunk_end + 1 day" +%F)"
              sleep 1
            done
          }
          run_range wnba 2025-05-16 2025-09-11
          run_range wnba 2026-05-15 2026-09-30
          run_range nba 2025-10-20 2026-06-22
