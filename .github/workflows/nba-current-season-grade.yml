name: NBA current-season canonical grading
on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/nba-current-season-grade.mjs"
      - "test/nba-current-season-grade.test.mjs"
      - ".github/workflows/nba-current-season-grade.yml"
  pull_request:
    paths:
      - "scripts/nba-current-season-grade.mjs"
      - "test/nba-current-season-grade.test.mjs"
      - ".github/workflows/nba-current-season-grade.yml"
permissions:
  contents: read
concurrency:
  group: nba-current-season-grade
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    env:
      CLOUDFLARE_D1_DATABASE_ID: ed992525-d2ed-4b1d-8a12-feeb2efa152c
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'nba-d1-profile-shadow-main' || format('nba-grade-pr-{0}',github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: node --test test/nba-current-season-grade.test.mjs
      - name: Retrieve authoritative completed canonical games
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/current
          npx wrangler r2 object get "fbis-archive/canonical/espn/nba/2026-27/current/nba-canonical.jsonl" --file artifacts/current/nba-canonical.jsonl --remote
          test -s artifacts/current/nba-canonical.jsonl
      - name: Read only ungraded NBA_DB projection keys
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis-nba --remote --json --command "SELECT id,game_id,tipoff_timestamp,feature_cutoff_timestamp,graded_at FROM nba_game_projections WHERE graded_at IS NULL AND feature_cutoff_timestamp >= datetime('now','-45 days') LIMIT 10000" > artifacts/nba-ungraded-games.json
          npx wrangler d1 execute fbis-nba --remote --json --command "SELECT id,game_id,player_id,market_type,feature_cutoff_timestamp,graded_at FROM nba_player_prop_projections WHERE graded_at IS NULL AND feature_cutoff_timestamp >= datetime('now','-45 days') LIMIT 20000" > artifacts/nba-ungraded-props.json
      - name: Build score-only grades; no wager-authorization changes
        if: github.ref == 'refs/heads/main'
        run: node scripts/nba-current-season-grade.mjs
      - name: Persist score-only grades in NBA_DB
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -s artifacts/nba-current-grades.sql ]; then
            node scripts/d1-batched-sql.mjs artifacts/nba-current-grades.sql
          fi
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: nba-current-season-grade-${{ github.run_id }}
          path: artifacts/nba-current-grades.json
          if-no-files-found: warn
          retention-days: 90
