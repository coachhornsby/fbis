name: KenPom secret sync

on:
  push:
    paths:
      - ".github/workflows/kenpom-secret-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: SYNC KENPOM SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          sep='?'
          if [[ "$url" == *'?'* ]]; then sep='&'; fi
          body="$(curl -fsSL             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${url}${sep}audience=sports-projection-orchestrator")"
          token="$(jq -r '.value // empty' <<<"$body")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Install KenPom secret in Cloudflare Pages
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          http=000
          for attempt in 1 2 3 4 5 6; do
            http="$(curl -sS --max-time 30               -H "Authorization: Bearer ${OIDC_TOKEN}"               -o "$tmp" -w "%{http_code}"               "https://sports-projection-orchestrator.onrender.com/api/admin/export-kenpom" || true)"
            if [ "$http" = "200" ]; then
              break
            fi
            : > "$tmp"
            sleep $((attempt * 5))
          done
          test "$http" = "200"
          bytes="$(wc -c < "$tmp" | tr -d ' ')"
          test "$bytes" -gt 20
          npx --yes wrangler@4.38.0 pages secret put KENPOM_API_KEY --project-name fbis < "$tmp" >/tmp/kenpom-wrangler.log 2>&1
          : > "$tmp"
          echo "KenPom secret installed in Cloudflare Pages (value not printed)."
