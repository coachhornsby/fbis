name: Backfill all learning finals

on:
  push:
    branches:
      - "ops/backfill-learning-finals-20260928"

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          sep='?'
          if [[ "$url" == *'?'* ]]; then sep='&'; fi
          body="$(curl -fsSL             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${url}${sep}audience=sports-projection-orchestrator")"
          token="$(jq -r '.value // empty' <<<"$body")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Apply verified historical residual disposition
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"

          grades="$RUNNER_TEMP/verified-grades.json"
          cat > "$grades" <<'JSON'
          {
            "sport":"all",
            "date":"historical",
            "source":"verified-official-results-20260929",
            "grades":[
              {"gameId":"ncaaf_arizonastatesundevils_kansasjayhawks_2026-09-19_b2","actualHome":24,"actualAway":17},
              {"gameId":"ncaaf_houstoncougars_texastechredraiders_2026-09-19_b3","actualHome":28,"actualAway":26},
              {"gameId":"498b584346a36a484675a05925cf04ab","actualHome":27,"actualAway":24},
              {"gameId":"mlb_orioles_yankees_2026-09-25_b2_g1","actualHome":2,"actualAway":10},
              {"gameId":"mlb_orioles_yankees_2026-09-25_b3","actualHome":6,"actualAway":3}
            ]
          }
          JSON

          exclusions="$RUNNER_TEMP/verified-exclusions.json"
          cat > "$exclusions" <<'JSON'
          {
            "sport":"all",
            "date":"historical",
            "exclusions":[
              {"gameId":"67d8db7cdda7b7a7b0864efc56e1296d","reason":"INVALID_MATCHUP_CHARLOTTE_MISSISSIPPI_STATE"},
              {"gameId":"920238db2d9eb17f89d93e105828d491","reason":"INVALID_MATCHUP_SOUTHERN_UTAH_MINNESOTA"},
              {"gameId":"459dc3c4c5b21cfb74dd42f19c65bbd0","reason":"INVALID_MATCHUP_TENNESSEE_MEMPHIS"},
              {"gameId":"b436e7db5c3fe48ab010cb64bbe54750","reason":"INVALID_MATCHUP_SAN_DIEGO_STATE_MINNESOTA"},
              {"gameId":"83d32f1602fdebfb4245c634e9f4f58a","reason":"INVALID_MATCHUP_TENNESSEE_AUSTIN_PEAY"},
              {"gameId":"824785","reason":"POSTPONED_DUPLICATE_PROVIDER_ID_TORONTO_BALTIMORE"},
              {"gameId":"mlb_bluejays_orioles_2026-09-22_b3","reason":"POSTPONED_TORONTO_BALTIMORE_2026_09_22"},
              {"gameId":"823490","reason":"CANCELED_BALTIMORE_NEW_YORK_2026_09_27"}
            ]
          }
          JSON

          for payload in "$grades" "$exclusions"; do
            out="$(mktemp)"
            http="$(curl -sS --max-time 90               -X POST               -H "x-harvest-secret: ${HARVEST_SECRET}"               -H "content-type: application/json"               --data-binary @"$payload"               -o "$out" -w "%{http_code}"               "${FBIS_BASE}/api/final-grade")"
            cat "$out"
            echo
            test "$http" = "200"
            jq -e '.ok == true' "$out" >/dev/null
          done

      - name: Build unresolved sport/date target list
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          report="$RUNNER_TEMP/before.json"
          http="$(curl -sS --max-time 180 --retry 1 --retry-all-errors             -H "x-harvest-secret: ${HARVEST_SECRET}"             -o "$report" -w "%{http_code}"             "${FBIS_BASE}/api/learning-report?since=2026-01-01&limit=5000")"
          echo "before report http=$http"
          test "$http" = "200"
          jq -e '.ok == true' "$report" >/dev/null

          raw="$RUNNER_TEMP/raw-targets.tsv"
          targets="$RUNNER_TEMP/targets.tsv"
          jq -r '.audit[] | select(.learningStatus=="AWAITING FINAL") | [(.sport|ascii_downcase),(.start//""),(.date//"")] | @tsv' "$report" > "$raw"
          : > "$targets"
          today="$(TZ=America/Chicago date +%F)"
          while IFS=$'\t' read -r sport start stored_date; do
            [ -n "$sport" ] || continue
            game_date=""
            if [ -n "$start" ]; then
              game_date="$(TZ=America/Chicago date -d "$start" +%F 2>/dev/null || true)"
            fi
            if [ -z "$game_date" ]; then game_date="$stored_date"; fi
            [ -n "$game_date" ] || continue
            if [[ "$game_date" < "$today" || "$game_date" == "$today" ]]; then
              printf '%s\t%s\n' "$sport" "$game_date" >> "$targets"
            fi
          done < "$raw"
          sort -u "$targets" -o "$targets"
          echo "targets=$(wc -l < "$targets")"
          cat "$targets"
          echo "targets_file=$targets" >> "$GITHUB_ENV"
          echo "before_report=$report" >> "$GITHUB_ENV"

      - name: Grade unresolved immutable projections
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          COLLEGE_DATA_API_KEY: ${{ secrets.COLLEGE_DATA_API_KEY }}
          FBIS_BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/before.json"
          ok=0
          fail=0
          matched=0
          unmatched=0

          while IFS=$'\t' read -r sport date; do
            [ -n "$sport" ] || continue
            scoreboard="$(mktemp)"
            plan="$(mktemp)"

            set +e
            node scripts/fetch-final-scoreboard.mjs "$sport" "$date" > "$scoreboard"
            fetch_ec=$?
            set -e
            if [ "$fetch_ec" -ne 0 ]; then
              fail=$((fail+1))
              echo "FAIL ${sport} ${date}: scoreboard fetch exit=${fetch_ec}"
              continue
            fi

            node scripts/build-final-grade-plan.mjs "$report" "$scoreboard" "$sport" "$date" > "$plan"
            candidates="$(jq -r '.candidates // 0' "$plan")"
            grades="$(jq -r '.grades | length' "$plan")"
            u="$(jq -r '.unmatchedGameIds | length' "$plan")"
            unmatched=$((unmatched+u))

            echo "PLAN ${sport} ${date}: candidates=${candidates} verified_grades=${grades} unmatched=${u}"
            if [ "$u" -gt 0 ]; then
              echo "UNMATCHED ${sport} ${date}: $(jq -c '.unmatchedGameIds' "$plan")"
            fi

            if [ "$grades" -eq 0 ]; then
              ok=$((ok+1))
              continue
            fi

            chunk_dir="$(mktemp -d)"
            jq -c '.grades | _nwise(25)' "$plan" | split -l 1 - "$chunk_dir/chunk-"
            date_failed=0
            date_matched=0
            for chunk in "$chunk_dir"/chunk-*; do
              [ -s "$chunk" ] || continue
              req="$(mktemp)"
              res="$(mktemp)"
              jq -n                 --arg sport "$sport"                 --arg date "$date"                 --arg source "trusted-scoreboard-reconciled-runner"                 --slurpfile grades "$chunk"                 '{sport:$sport,date:$date,source:$source,grades:$grades[0]}' > "$req"

              http="$(curl -sS --max-time 180 --retry 2 --retry-all-errors                 -X POST                 -H "x-harvest-secret: ${HARVEST_SECRET}"                 -H "content-type: application/json"                 --data-binary @"$req"                 -o "$res" -w "%{http_code}"                 "${FBIS_BASE}/api/final-grade")"

              if [ "$http" != "200" ] || ! jq -e '.ok == true and .mode=="direct-verified-grades"' "$res" >/dev/null 2>&1; then
                echo "FAIL ${sport} ${date}: direct grade http=${http}"
                cat "$res" || true
                date_failed=1
                break
              fi
              m="$(jq -r '.matched // 0' "$res")"
              date_matched=$((date_matched+m))
            done

            if [ "$date_failed" -eq 0 ]; then
              ok=$((ok+1))
              matched=$((matched+date_matched))
              echo "OK ${sport} ${date}: directly graded=${date_matched} unmatched=${u}"
            else
              fail=$((fail+1))
            fi
          done < "$targets_file"

          echo "backfill calls ok=$ok fail=$fail matched=$matched unmatched=$unmatched"
          {
            echo "## Runner-reconciled final backfill"
            echo "- successful sport/date calls: $ok"
            echo "- failed sport/date calls: $fail"
            echo "- verified game ids graded: $matched"
            echo "- residual unmatched game ids: $unmatched"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$fail" = "0"

      - name: Refresh learning dashboard after backfill
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE: https://fbis-myz.pages.dev
          ORCH_URL: https://sports-projection-orchestrator.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          after="$RUNNER_TEMP/after.json"
          sync="$RUNNER_TEMP/sync.json"
          report_http="$(curl -sS --max-time 180 --retry 1 --retry-all-errors             -H "x-harvest-secret: ${HARVEST_SECRET}"             -o "$after" -w "%{http_code}"             "${FBIS_BASE}/api/learning-report?since=2026-01-01&limit=5000")"
          echo "after report http=$report_http"
          test "$report_http" = "200"
          jq -e '.ok == true and .source=="prediction_snapshots"' "$after" >/dev/null

          sync_http="$(curl -sS --max-time 180 --retry 1 --retry-all-errors             -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "content-type: application/json"             --data-binary @"$after"             -o "$sync" -w "%{http_code}"             "${ORCH_URL}/api/sync-learning-dashboard")"
          echo "dashboard sync http=$sync_http"
          cat "$sync"
          test "$sync_http" = "200"
          jq -e '.ok == true' "$sync" >/dev/null

          {
            echo "## Learning population after backfill"
            echo "- snapshots: $(jq -r '.totals.snapshotRows' "$after")"
            echo "- canonical projections: $(jq -r '.totals.canonicalProjections' "$after")"
            echo "- graded canonical projections: $(jq -r '.totals.gradedProjections' "$after")"
            echo "- awaiting finals: $(jq -r '.totals.awaitingFinals' "$after")"
            echo "- rejected post-start: $(jq -r '.totals.rejectedPostStart' "$after")"
            echo "- sheet model rows: $(jq -r '.modelRows' "$sync")"
            echo "- sheet audit rows: $(jq -r '.auditRows' "$sync")"
            echo "- All Projections finals reconciled: $(jq -r '.allProjectionFinalsReconciled' "$sync")"
          } >> "$GITHUB_STEP_SUMMARY"
