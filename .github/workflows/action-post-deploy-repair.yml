name: ACTION post-deploy repair

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: action-post-deploy-repair
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repair:
    name: ACTION POST-DEPLOY REPAIR
    runs-on: ubuntu-latest
    steps:
      - name: Require operator secret
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: test -n "${HARVEST_SECRET:-}"

      - name: Immediate ACTION recovery on currently live production
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          status_body="$(mktemp)"
          status_code="$(curl -sS --max-time 30 -o "$status_body" -w "%{http_code}" "$BASE/api/action-daily-status" || true)"
          state="$(jq -r '.state // "UNAVAILABLE"' "$status_body" 2>/dev/null || echo UNAVAILABLE)"
          echo "predeploy ACTION state=$state http=$status_code"
          cat "$status_body" || true
          if [ "$status_code" = "200" ] && [ "$state" = "HEALTHY" ]; then
            echo "Current production already has a successful daily ACTION run."
            exit 0
          fi

          start_body="$(mktemp)"
          start_code="$(curl -sS --max-time 30 -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -d '{"mode":"start"}' -o "$start_body" -w "%{http_code}" \
            "$BASE/api/action-daily-async?mode=start")"
          echo "predeploy START http=$start_code"
          cat "$start_body"
          test "$start_code" = "200" -o "$start_code" = "202"
          jq -e '.ok == true' "$start_body" >/dev/null

          for attempt in $(seq 1 20); do
            body="$(mktemp)"
            set +e
            code="$(curl -sS --max-time 45 -X POST \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "content-type: application/json" \
              -d '{"mode":"harvest"}' -o "$body" -w "%{http_code}" \
              "$BASE/api/action-daily-async?mode=harvest")"
            curl_ec=$?
            set -e
            echo "predeploy HARVEST attempt=$attempt http=$code curl_ec=$curl_ec"
            cat "$body" || true
            status="$(jq -r '.status // empty' "$body" 2>/dev/null || true)"
            if [ "$curl_ec" -eq 0 ] && [ "$code" = "200" ] && { [ "$status" = "success_daily" ] || [ "$status" = "already_collected_today" ]; }; then exit 0; fi
            if { [ "$curl_ec" -eq 0 ] && [ "$code" = "202" ] && [ "$status" = "actor_running" ]; } || [ "$curl_ec" -eq 28 ]; then
              echo "ACTION harvest still running/transient timeout; retrying."
              sleep 30
              continue
            fi
            echo "Unexpected predeploy harvest response code=$code status=$status"
            exit 1
          done
          exit 1

      - name: Wait for production to reach pushed SHA
        env:
          BASE: "https://fbis-myz.pages.dev"
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)" || true)"
            live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$body" 2>/dev/null | tr 'A-F' 'a-f')"
            expected="$(echo "$EXPECTED_SHA" | tr 'A-F' 'a-f')"
            echo "deploy-check attempt=$attempt http=$code live=$live expected=$expected"
            if [ "$code" = "200" ] && [ "$live" = "$expected" ]; then exit 0; fi
            sleep 10
          done
          echo "Production did not reach expected SHA inside deployment window."
          exit 1

      - name: Inspect ACTION daily state
        id: inspect
        env:
          BASE: "https://fbis-myz.pages.dev"
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 30 -o "$body" -w "%{http_code}" "$BASE/api/action-daily-status")"
          cat "$body"
          test "$code" = "200"
          state="$(jq -r '.state // empty' "$body")"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Start or resume ACTION daily run
        if: steps.inspect.outputs.state != 'HEALTHY'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 30 -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -d '{"mode":"start"}' -o "$body" -w "%{http_code}" \
            "$BASE/api/action-daily-async?mode=start")"
          cat "$body"
          test "$code" = "200" -o "$code" = "202"
          jq -e '.ok == true' "$body" >/dev/null

      - name: Harvest same ACTION run
        if: steps.inspect.outputs.state != 'HEALTHY'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(mktemp)"
            set +e
            code="$(curl -sS --max-time 45 -X POST \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "content-type: application/json" \
              -d '{"mode":"harvest"}' -o "$body" -w "%{http_code}" \
              "$BASE/api/action-daily-async?mode=harvest")"
            curl_ec=$?
            set -e
            cat "$body" || true
            status="$(jq -r '.status // empty' "$body" 2>/dev/null || true)"
            if [ "$curl_ec" -eq 0 ] && [ "$code" = "200" ] && { [ "$status" = "success_daily" ] || [ "$status" = "already_collected_today" ]; }; then exit 0; fi
            if { [ "$curl_ec" -eq 0 ] && [ "$code" = "202" ] && [ "$status" = "actor_running" ]; } || [ "$curl_ec" -eq 28 ]; then
              echo "ACTION harvest still running/transient timeout; retrying."
              sleep 30
              continue
            fi
            echo "Unexpected harvest response code=$code status=$status"
            exit 1
          done
          exit 1

      - name: Verify persisted slate coverage
        env:
          BASE: "https://fbis-myz.pages.dev"
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 30 -o "$body" -w "%{http_code}" "$BASE/api/action-daily-status")"
          cat "$body"
          test "$code" = "200"
          jq -e '.state == "HEALTHY" and .verifiedPersisted == true and .verifiedSlateCoverage == true' "$body" >/dev/null

      - name: Export full persisted ACTION MLB observations
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          day="$(TZ=America/Chicago date +%F)"
          code="$(curl -sS --max-time 60 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -o artifacts/action-mlb-${day}.json -w "%{http_code}" \
            "$BASE/api/action-daily-data?date=${day}&sport=mlb&limit=5000")"
          echo "ACTION MLB export http=$code"
          test "$code" = "200"
          jq '{ok,run,count}' artifacts/action-mlb-${day}.json

      - name: Upload ACTION MLB export
        uses: actions/upload-artifact@v4
        with:
          name: action-mlb-${{ github.run_id }}
          path: artifacts/action-mlb-*.json
          if-no-files-found: error
          retention-days: 14
