name: ACTION post-deploy repair

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: action-post-deploy-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: ACTION POST-DEPLOY REPAIR
    runs-on: ubuntu-latest
    steps:
      - name: Require operator secret
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: test -n "${HARVEST_SECRET:-}"

      - name: Wait for production to reach pushed SHA
        env:
          BASE: "https://fbis-myz.pages.dev"
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)" || true)"
            live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$body" 2>/dev/null | tr 'A-F' 'a-f')"
            expected="$(echo "$EXPECTED_SHA" | tr 'A-F' 'a-f')"
            echo "deploy-check attempt=$attempt http=$code live=$live expected=$expected"
            if [ "$code" = "200" ] && [ "$live" = "$expected" ]; then exit 0; fi
            sleep 10
          done
          echo "Production did not reach expected SHA inside deployment window."
          exit 1

      - name: Inspect ACTION daily state
        id: inspect
        env:
          BASE: "https://fbis-myz.pages.dev"
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 30 -o "$body" -w "%{http_code}" "$BASE/api/action-daily-status")"
          cat "$body"
          test "$code" = "200"
          state="$(jq -r '.state // empty' "$body")"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Start or resume ACTION daily run
        if: steps.inspect.outputs.state != 'HEALTHY'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 30 -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -d '{"mode":"start"}' -o "$body" -w "%{http_code}" \
            "$BASE/api/action-daily-async?mode=start")"
          cat "$body"
          test "$code" = "200" -o "$code" = "202"
          jq -e '.ok == true' "$body" >/dev/null

      - name: Harvest same ACTION run
        if: steps.inspect.outputs.state != 'HEALTHY'
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 30 -X POST \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "content-type: application/json" \
              -d '{"mode":"harvest"}' -o "$body" -w "%{http_code}" \
              "$BASE/api/action-daily-async?mode=harvest")"
            cat "$body"
            status="$(jq -r '.status // empty' "$body" 2>/dev/null || true)"
            if [ "$code" = "200" ] && { [ "$status" = "success_daily" ] || [ "$status" = "already_collected_today" ]; }; then exit 0; fi
            if [ "$code" = "202" ] && [ "$status" = "actor_running" ]; then sleep 30; continue; fi
            echo "Unexpected harvest response code=$code status=$status"
            exit 1
          done
          exit 1

      - name: Verify persisted slate coverage
        env:
          BASE: "https://fbis-myz.pages.dev"
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 30 -o "$body" -w "%{http_code}" "$BASE/api/action-daily-status")"
          cat "$body"
          test "$code" = "200"
          jq -e '.state == "HEALTHY" and .verifiedPersisted == true and .verifiedSlateCoverage == true' "$body" >/dev/null
