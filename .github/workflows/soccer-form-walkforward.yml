name: Soccer-FBIS walk-forward
on:
  push:
    branches: ["feat/soccer-fbis-research","main"]
    paths: ["functions/lib/soccerFbisV1.js","scripts/soccer-form-walkforward.mjs",".github/workflows/soccer-form-walkforward.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/soccer-form-walkforward.mjs
      - run: |
          jq . artifacts/soccer-form-walkforward-report.json
          jq -r '"## Soccer-FBIS-v1 walk-forward\n- n: \(.n)\n- margin MAE: \(.marginMae)\n- total MAE: \(.totalMae)\n- 3-way accuracy: \(.threeWayAccuracy)"' artifacts/soccer-form-walkforward-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: soccer-form-walkforward-${{ github.run_id }}
          path: artifacts/soccer-form-walkforward-*
          retention-days: 90
