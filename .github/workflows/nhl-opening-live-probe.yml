name: NHL opening live probe

on:
  push:
    branches:
      - probe/nhl-opening-live-20260929

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Diagnose local NHL slate path
        run: node scripts/diag-nhl-slate.mjs

      - name: Diagnose NHL schedule sources and production board
        shell: bash
        run: |
          set -euo pipefail
          prod="$RUNNER_TEMP/prod.json"
          espn="$RUNNER_TEMP/espn.json"
          nhl="$RUNNER_TEMP/nhl.json"

          curl -sS --max-time 60 -o "$espn" "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=20260929&limit=300"
          curl -sS --max-time 60 -o "$nhl" "https://api-web.nhle.com/v1/schedule/2026-09-29"
          code="$(curl -sS --max-time 180 -o "$prod" -w "%{http_code}" "https://fbis-myz.pages.dev/api/projections?sport=nhl&date=2026-09-29&tier=public&_t=$(date +%s)")"

          echo "production_http=$code"
          echo "espn_events=$(jq '.events|length' "$espn")"
          echo "nhl_gameweek=$(jq '.gameWeek|length' "$nhl")"
          jq -c '{gameWeek:[.gameWeek[]?|{date,games:[.games[]?|{id,startTimeUTC,gameState,away:.awayTeam.abbrev,home:.homeTeam.abbrev}]}]}' "$nhl"
          jq -c '{sport,date,games:(.games|length),samples:[.games[]?|{away:.away.abbr,home:.home.abbr,model:.model.name,maturity:.model.maturity,independent:.projection.independent}]}' "$prod"

          test "$code" = "200"
          test "$(jq '.games|length' "$prod")" -eq 5
          test "$(jq '[.games[]|select(.projection.independent==true)]|length' "$prod")" -eq 5
          test "$(jq '[.games[]|select(.model.maturity=="RESEARCH")]|length' "$prod")" -eq 5
