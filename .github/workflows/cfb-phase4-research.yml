name: CFB Phase 4 Research Evidence and Weekly Reports
on:
  pull_request:
    paths:
      - "scripts/cfb-phase4-diagnostics.mjs"
      - "scripts/cfb-phase4-possessions.mjs"
      - "scripts/cfb-phase4-possession-challenger.mjs"
      - "scripts/cfb-phase5-pbp-integrity.mjs"
      - "scripts/cfb-phase5-cross-provider-pbp.mjs"
      - "scripts/cfb-phase5-pbp-alternate.mjs"
      - "scripts/cfb-phase5-ncaa-pbp.mjs"
      - "test/cfb-phase5-ncaa-pbp.test.js"
      - "test/cfb-phase5-pbp-integrity.test.js"
      - "scripts/cfb-phase4-ncaa-verify.mjs"
      - "scripts/cfb-phase4-export-d1-sql.mjs"
      - "test/cfb-phase4-ncaa-verify.test.js"
      - ".github/workflows/cfb-phase4-research.yml"
      - "scripts/cfb-226-live-evidence.mjs"
      - "scripts/cfb-226-complete-grade.mjs"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cfb-phase4-diagnostics.mjs'
      - 'scripts/cfb-phase4-possessions.mjs'
      - 'scripts/cfb-phase4-possession-challenger.mjs'
      - 'scripts/cfb-phase5-pbp-integrity.mjs'
      - 'scripts/cfb-phase5-cross-provider-pbp.mjs'
      - 'scripts/cfb-phase5-pbp-alternate.mjs'
      - 'scripts/cfb-phase5-ncaa-pbp.mjs'
      - 'scripts/cfb-phase4-ncaa-verify.mjs'
      - 'scripts/cfb-phase4-export-d1-sql.mjs'
      - '.github/workflows/cfb-phase4-research.yml'
  schedule:
    - cron: '20 13 * * 1'
permissions:
  contents: read
jobs:
  weekly-research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test independent NCAA matching requirements
        run: node --test test/cfb-phase4-ncaa-verify.test.js
      - name: Test structural play-by-play and NCAA terminal-score requirements
        run: node --test test/cfb-phase5-pbp-integrity.test.js
      - name: Validate NCAA independent PBP collection contract
        run: node --test test/cfb-phase5-ncaa-pbp.test.js
      - name: Collect immutable secondary game evidence
        id: collect
        continue-on-error: true
        run: node scripts/cfb-226-live-evidence.mjs
      - name: Grade saved frozen projections
        id: grade
        continue-on-error: true
        run: node scripts/cfb-226-complete-grade.mjs
      - name: Produce frozen-model error diagnostics
        id: diagnose
        continue-on-error: true
        run: node scripts/cfb-phase4-diagnostics.mjs
      - name: Summarize observed postgame drives and possessions
        id: possessions
        continue-on-error: true
        run: node scripts/cfb-phase4-possessions.mjs
      - name: Reconcile ESPN finals with independent NCAA.com scoreboard
        id: ncaa
        continue-on-error: true
        run: node scripts/cfb-phase4-ncaa-verify.mjs
      - name: Verify raw play identity, drive coverage, and final-score consistency
        id: pbp_integrity
        continue-on-error: true
        run: node scripts/cfb-phase5-pbp-integrity.mjs
      - name: Fetch alternate CDN evidence for contradictory terminal play scores
        id: pbp_alternate
        continue-on-error: true
        run: node scripts/cfb-phase5-pbp-alternate.mjs
      - name: Crosscheck play source coverage with licensed CFBD API
        id: pbp_cross_source
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_API_TOKEN: ${{ secrets.CFBD_API_TOKEN }}
        run: |
          node --check scripts/cfb-phase5-cross-provider-pbp.mjs
          node scripts/cfb-phase5-cross-provider-pbp.mjs
      - name: Collect NCAA.com independent play-by-play timelines
        id: ncaa_pbp
        continue-on-error: true
        run: node scripts/cfb-phase5-ncaa-pbp.mjs
      - name: Evaluate forward-chained possession Monte Carlo challenger
        id: challenger
        continue-on-error: true
        run: node scripts/cfb-phase4-possession-challenger.mjs
      - name: Validate all 226 independently verified CFB D1 receipts without DB writes
        run: |
          node scripts/cfb-phase4-export-d1-sql.mjs "cfb/2026/weeks05-08/ci-read-only.zip" "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" /tmp/cfb-phase4-readonly.sql
          test "$(grep -c '^INSERT OR IGNORE' /tmp/cfb-phase4-readonly.sql)" -eq 226
      - name: Package private evidence bundle
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          folder=Path('artifacts/cfb-2026-weeks05-08')
          with zipfile.ZipFile('cfb-phase4-bundle.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as out:
              for f in sorted(folder.rglob('*')):
                  if f.is_file(): out.write(f,f.relative_to(folder))
          PY
      - name: Persist full evidence bundle to private R2 and verify readback
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2fdc80b8d99070adcef12f7a785c3fc1
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "MISSING_CLOUDFLARE_TOKEN"; exit 1; }
          SHA=$(sha256sum cfb-phase4-bundle.zip | cut -d' ' -f1)
          KEY="cfb/2026/weeks05-08/phase4-evidence-${SHA}.zip"
          npx wrangler r2 object put "fbis-archive/${KEY}" --file cfb-phase4-bundle.zip --content-type application/zip --remote --force
          npx wrangler r2 object get "fbis-archive/${KEY}" --file cfb-phase4-readback.zip --remote
          echo "${SHA}  cfb-phase4-readback.zip" | sha256sum -c -
          echo "R2_VERIFIED sha256:${SHA} key=${KEY}"
          node scripts/cfb-phase4-export-d1-sql.mjs "${KEY}" "${SHA}" cfb-phase4-shadow-research.sql
          npx wrangler d1 execute fbis-cfb --remote --file cfb-phase4-shadow-research.sql
          echo "CFB_SHADOW_RESEARCH_IMPORT_COMPLETE r2=${KEY}"
      - name: Upload full research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-phase4-research-evidence
          path: artifacts/cfb-2026-weeks05-08/
          retention-days: 30
          if-no-files-found: warn
      - name: Reject incomplete research cycle
        if: steps.collect.outcome != 'success' || steps.grade.outcome != 'success' || steps.diagnose.outcome != 'success' || steps.possessions.outcome != 'success' || steps.ncaa.outcome != 'success' || steps.challenger.outcome != 'success' || steps.pbp_integrity.outcome != 'success' || steps.pbp_cross_source.outcome != 'success' || steps.pbp_alternate.outcome != 'success' || steps.ncaa_pbp.outcome != 'success'
        run: exit 1
