name: CFB v3 corrected-market finalize
on:
  push:
    branches: ["research/cfb-bulk-history-v3"]
    paths:
      - ".github/workflows/cfb-v3-finalize.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn
      - name: Recover proven full-history base artifact
        run: |
          mkdir -p recovered
          gh run download 37012850005 -R coachhornsby/fbis -n cfb-full-history-v3 -D recovered
          mkdir -p artifacts
          cp -R recovered/cfb-history-v2 artifacts/
          cp -R recovered/cfb-context artifacts/
      - name: Recover corrected CFBD market artifact
        run: |
          mkdir -p corrected-market
          gh run download 37017142528 -R coachhornsby/fbis -n cfb-cfbd-market-history -D corrected-market
          mkdir -p artifacts/cfb-history-v3
          cp corrected-market/cfbd_market_lines_all_providers.csv artifacts/cfb-history-v3/
          cp corrected-market/cfbd_market_qa.json artifacts/cfb-history-v3/
      - name: Build published multi-book historical archive
        run: python scripts/cfb-sdv-line-archive.py
      - name: Build corrected canonical dataset
        run: python scripts/cfb-final-enrich.py
      - name: Run corrected walk-forward
        run: python scripts/cfb-v3-walkforward.py
      - name: Verify evidence
        run: |
          cat artifacts/cfb-line-archive/cfb_line_odds_qa.json
          cat artifacts/cfb-history-v3/cfbd_market_qa.json
          cat artifacts/cfb-final/cfb_final_qa.json
          cat artifacts/cfb-final/model/cfb_v3_walkforward_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-full-history-v3-corrected
          path: |
            artifacts/cfb-line-archive/*
            artifacts/cfb-history-v3/*
            artifacts/cfb-final/*
          retention-days: 90
