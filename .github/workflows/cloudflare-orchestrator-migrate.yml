name: Migrate orchestrator to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [infra/cloudflare-consolidation]
    paths: [".github/workflows/cloudflare-orchestrator-migrate.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
      RENDER_ORCH_URL: https://sports-projection-orchestrator.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          sep='?'
          if [[ "$url" == *'?'* ]]; then sep='&'; fi
          body="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${url}${sep}audience=sports-projection-orchestrator")"
          token="$(jq -r '.value // empty' <<<"$body")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Export Render secrets encrypted to this runner
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out migration-private.pem >/dev/null 2>&1
          openssl rsa -pubout -in migration-private.pem -out migration-public.pem >/dev/null 2>&1
          jq -Rs '{publicKeyPem:.}' migration-public.pem > migration-request.json
          code="$(curl -sS --max-time 60 -o migration-bundle.json -w "%{http_code}"             -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "content-type: application/json"             --data-binary @migration-request.json             "${RENDER_ORCH_URL}/api/migration/export-secrets")"
          echo "encrypted relay http=$code"
          test "$code" = "200"
          jq -e '.ok == true and .algorithm == "RSA-OAEP-SHA256+AES-256-GCM"' migration-bundle.json >/dev/null
          for name in OPENAI_API_KEY GEMINI_API_KEY GOOGLE_SERVICE_ACCOUNT_JSON ORCH_CONTROL_TOKEN; do
            jq -e --arg name "$name" '.present | index($name) != null' migration-bundle.json >/dev/null
          done

      - name: Decrypt bundle locally without logging values
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const b=JSON.parse(fs.readFileSync('migration-bundle.json','utf8'));
          const privateKey=fs.readFileSync('migration-private.pem','utf8');
          const key=crypto.privateDecrypt({key:privateKey,oaepHash:'sha256'},Buffer.from(b.wrappedKey,'base64'));
          const decipher=crypto.createDecipheriv('aes-256-gcm',key,Buffer.from(b.iv,'base64'));
          decipher.setAuthTag(Buffer.from(b.tag,'base64'));
          const plain=Buffer.concat([decipher.update(Buffer.from(b.ciphertext,'base64')),decipher.final()]);
          const secrets=JSON.parse(plain.toString('utf8'));
          fs.writeFileSync('migration-secrets.json',JSON.stringify(secrets),{mode:0o600});
          NODE
          test -s migration-secrets.json

      - name: Deploy Cloudflare orchestrator with cron disabled
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          npx --yes wrangler@4 deploy --config wrangler.orchestrator.toml

      - name: Put migrated secrets on Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          put_json_secret() {
            local name="$1"
            local value
            value="$(node -e "const x=require('./migration-secrets.json'); process.stdout.write(String(x[process.argv[1]]||''))" "$name")"
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --config wrangler.orchestrator.toml >/dev/null
            echo "set $name"
          }
          put_json_secret OPENAI_API_KEY
          put_json_secret GEMINI_API_KEY
          put_json_secret GOOGLE_SERVICE_ACCOUNT_JSON
          put_json_secret ORCH_CONTROL_TOKEN
          test -n "${HARVEST_SECRET}"
          echo "::add-mask::${HARVEST_SECRET}"
          printf '%s' "${HARVEST_SECRET}" | npx --yes wrangler@4 secret put HARVEST_SECRET --config wrangler.orchestrator.toml >/dev/null
          echo "set HARVEST_SECRET"

      - name: Resolve Worker URL
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          sub="$(curl -fsSL -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | jq -r '.result.subdomain // empty')"
          test -n "$sub"
          url="https://fbis-orchestrator.${sub}.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Cloudflare orchestrator URL resolved."

      - name: Validate Cloudflare health and Sheets
        env:
          ORCH_URL: ${{ steps.worker.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          health="$(mktemp)"
          code="$(curl -sS --max-time 60 -o "$health" -w "%{http_code}" "${ORCH_URL}/health")"
          echo "health http=$code"
          test "$code" = "200"
          jq -e '.platform=="cloudflare-workers" and .cronEnabled==false and .credentials.openai==true and .credentials.gemini==true and .credentials.googleSheets==true' "$health" >/dev/null
          sheets="$(mktemp)"
          code="$(curl -sS --max-time 60 -o "$sheets" -w "%{http_code}"             -H "Authorization: Bearer ${OIDC_TOKEN}" "${ORCH_URL}/api/validate/sheets")"
          echo "sheets http=$code"
          test "$code" = "200"
          jq -e '.ok==true' "$sheets" >/dev/null

      - name: Validate OpenAI and Gemini on Cloudflare
        env:
          ORCH_URL: ${{ steps.worker.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 180 -o "$body" -w "%{http_code}"             -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "content-type: application/json"             -d '{}'             "${ORCH_URL}/api/validate/models")"
          echo "models http=$code"
          test "$code" = "200"
          jq -e '.openai.ok==true and .gemini.ok==true and .persisted==false' "$body" >/dev/null

      - name: Validate selective candidate gate
        env:
          ORCH_URL: ${{ steps.worker.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 180 -o "$body" -w "%{http_code}"             -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "content-type: application/json"             -d '{"dryRun":true}'             "${ORCH_URL}/api/select-candidates")"
          echo "selector http=$code"
          test "$code" = "200"
          jq -e '.ok==true and .selected<=5 and .eligible>=.selected' "$body" >/dev/null

      - name: Destroy local migration plaintext
        if: always()
        shell: bash
        run: |
          rm -f migration-secrets.json migration-private.pem migration-public.pem migration-request.json migration-bundle.json
