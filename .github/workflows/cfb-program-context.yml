name: CFB program context history
on:
  push:
    branches: ["research/cfb-bulk-history-v3"]
    paths:
      - "scripts/cfb-program-context.py"
      - ".github/workflows/cfb-program-context.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas pyarrow
      - name: Build historical program context
        run: python scripts/cfb-program-context.py
      - run: cat artifacts/cfb-context/cfb_program_context_qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-program-context
          path: artifacts/cfb-context/*
          if-no-files-found: error
          retention-days: 90
