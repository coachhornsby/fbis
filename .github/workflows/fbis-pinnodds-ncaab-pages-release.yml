name: D1 college basketball cards Pages-only release
on:
  pull_request:
    paths: ['.github/workflows/fbis-pinnodds-ncaab-pages-release.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/fbis-pinnodds-ncaab-pages-release.yml']
permissions:
  contents: read
concurrency:
  group: fbis-card-presentation-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Torvik and private access offline
        run: node --import ./test/offline-network.js --test test/private-torvik-consumer.test.mjs test/torvik-recovery.test.mjs test/cbb-private-access-route.test.mjs test/cbb-card-summary.test.mjs test/torvik-transport-safety.test.js test/polymarket-pregame-rest.test.mjs test/polymarket-board.test.js
      - name: Verify compact market presentation and captured references offline
        run: node --test test/pinnodds-detailed-basketball.test.mjs test/pinnodds-direct-publication.test.mjs test/pinnodds-restart.test.mjs test/pinnodds-recovery-card-render.test.mjs test/pinnodds-card-rows.test.mjs test/shared-venue-fetch-age.test.mjs test/cbb-division-filter.test.mjs
      - name: Preserve approved Pages display flag
        run: |
          if grep -q '^FBIS_POLYMARKET_PREGAME_REST' deploy/board/wrangler.toml; then exit 1; fi
          printf '\nFBIS_POLYMARKET_PREGAME_REST = "true"\n' >> deploy/board/wrangler.toml
      - name: Compile without source collection for review
        run: |
          mkdir -p deploy/board/snapshots data/public/cbb-readiness
          ./node_modules/.bin/vite build --config vite.publication.config.js
      - name: Refresh existing bounded public scoreboard assets only
        if: github.event_name == 'push'
        run: npm run build:publication
      - name: Deploy Pages only, no collector or configuration mutation
        if: github.event_name == 'push'
        working-directory: deploy/board
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../../node_modules/.bin/wrangler pages deploy dist --project-name fbis --branch main --commit-hash "${{ github.sha }}"
