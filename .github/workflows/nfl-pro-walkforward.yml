name: NFL-PRO walk-forward validation
on:
  push:
    branches: ["research/nfl-pro-walkforward","research/nfl-pro-v2-walkforward","main"]
    paths:
      - "scripts/nfl-pro-walkforward.mjs"
      - "functions/lib/nflProModel.js"
      - "functions/lib/nflProV2Model.js"
      - "functions/lib/nflModel.js"
      - ".github/workflows/nfl-pro-walkforward.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/nfl-pro-walkforward.mjs
      - name: Summary
        run: |
          jq . artifacts/nfl-pro-walkforward-report.json
          {
            echo "## NFL-PRO-v2 true walk-forward"
            jq -r '"- paired n: \(.sample.n)","- v2 margin MAE: \(.v2.marginMae)","- v1 margin MAE: \(.pro.marginMae)","- Form margin MAE: \(.base.marginMae)","- v2 total MAE: \(.v2.totalMae)","- v1 total MAE: \(.pro.totalMae)","- Form total MAE: \(.base.totalMae)","- v2 winner accuracy: \(.v2.winnerAccuracy)","- v1 winner accuracy: \(.pro.winnerAccuracy)","- Form winner accuracy: \(.base.winnerAccuracy)","- decision: \(.status)"' artifacts/nfl-pro-walkforward-report.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-pro-walkforward-${{ github.run_id }}
          path: artifacts/nfl-pro-walkforward-*
          retention-days: 90
