name: NHL goalie probability shadow

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nhl-goalie-prob-shadow.yml"
      - "functions/api/nhl-goalie-shadow.js"
      - "workers/sports-projection-orchestrator-worker.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhl-goalie-probability-shadow
  cancel-in-progress: false

jobs:
  freeze-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://fbis-myz.pages.dev
      GITHUB_TOKEN: ${{ github.token }}
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
      TZ: America/Chicago
    steps:
      - name: Wait for exact Pages production SHA
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/nhl-goalie-shadow?_sha=$GITHUB_SHA" || true)"
            live="$(jq -r '.codeSha // empty' "$body" 2>/dev/null || true)"
            if [ "$code" = "200" ] && [ -n "$live" ]; then
              if [ "$live" = "$GITHUB_SHA" ]; then
                echo "Pages production SHA exactly matches workflow SHA: $live"
                exit 0
              fi
              compare="$(curl -sS --max-time 20 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$live" || true)"
              relation="$(printf '%s' "$compare" | jq -r '.status // empty' 2>/dev/null || true)"
              if [ "$relation" = "ahead" ]; then
                echo "Pages production SHA is a verified descendant of workflow SHA: $live"
                exit 0
              fi
            fi
            echo "Waiting for non-stale Pages production SHA. base=$GITHUB_SHA live=${live:-unknown} http=$code relation=${relation:-unknown}"
            sleep 10
          done
          echo "Timed out waiting for Pages production SHA equal to or descended from $GITHUB_SHA"
          exit 1

      - name: Freeze one pregame shadow snapshot per eligible game
        run: |
          set -euo pipefail
          d="$(date +%F)"
          body="$(mktemp)"
          payload="$(jq -nc --arg mode freeze --arg date "$d" --arg codeSha "$GITHUB_SHA" '{mode:$mode,date:$date,codeSha:$codeSha}')"
          code="$(curl -sS --max-time 150 --retry 1 -X POST             -H "x-harvest-secret: $HARVEST_SECRET"             -H "content-type: application/json"             -d "$payload"             -o "$body" -w "%{http_code}" "$BASE/api/nhl-goalie-shadow")"
          cat "$body"
          test "$code" = "200"
          jq -e '.ok == true and .productionChampion == "NHL-PRO-v2" and .productionChanged == false and .qualificationChanged == false and .authority == false and .staking == false' "$body" >/dev/null

      - name: Settle official-final shadow rows
        if: ${{ always() }}
        run: |
          set -euo pipefail
          d="$(date +%F)"
          body="$(mktemp)"
          payload="$(jq -nc --arg mode settle --arg date "$d" '{mode:$mode,date:$date}')"
          code="$(curl -sS --max-time 150 --retry 1 -X POST             -H "x-harvest-secret: $HARVEST_SECRET"             -H "content-type: application/json"             -d "$payload"             -o "$body" -w "%{http_code}" "$BASE/api/nhl-goalie-shadow")"
          cat "$body"
          test "$code" = "200"
          jq -e '.ok == true and .productionChampion == "NHL-PRO-v2" and .productionChanged == false and .qualificationChanged == false and .authority == false and .staking == false' "$body" >/dev/null
