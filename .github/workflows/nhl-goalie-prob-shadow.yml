name: NHL goalie probability shadow

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhl-goalie-probability-shadow
  cancel-in-progress: false

jobs:
  freeze-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
      TZ: America/Chicago
    steps:
      - name: Freeze one pregame shadow snapshot per eligible game
        run: |
          set -euo pipefail
          d="$(date +%F)"
          body="$(mktemp)"
          code="$(curl -sS --max-time 150 --retry 1 -X POST             -H "x-harvest-secret: $HARVEST_SECRET" -H "content-type: application/json"             -d "{"mode":"freeze","date":"$d","codeSha":"${GITHUB_SHA}"}"             -o "$body" -w "%{http_code}" "$BASE/api/nhl-goalie-shadow")"
          cat "$body"
          test "$code" = "200"
          jq -e '.ok == true and .productionChampion == "NHL-PRO-v2" and .productionChanged == false and .authority == false and .staking == false' "$body" >/dev/null
      - name: Settle prior-day shadow rows
        if: ${{ always() }}
        run: |
          set -euo pipefail
          h="$(date +%H)"
          if [ "$h" != "04" ]; then echo "not settlement hour"; exit 0; fi
          d="$(date -d 'yesterday' +%F)"
          body="$(mktemp)"
          code="$(curl -sS --max-time 150 --retry 1 -X POST             -H "x-harvest-secret: $HARVEST_SECRET" -H "content-type: application/json"             -d "{"mode":"settle","date":"$d"}"             -o "$body" -w "%{http_code}" "$BASE/api/nhl-goalie-shadow")"
          cat "$body"
          test "$code" = "200"
          jq -e '.ok == true and .productionChampion == "NHL-PRO-v2" and .productionChanged == false and .authority == false and .staking == false' "$body" >/dev/null
