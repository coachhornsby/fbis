name: Soccer PitchAPI v3 sync

on:
  schedule:
    - cron: "35 11 * * *"
  push:
    branches: [main]
    paths:
      - "functions/api/soccer-pitchapi-sync.js"
      - "functions/api/prop-enrich-current.js"
      - "functions/lib/soccerPitchApiStore.js"
      - ".github/workflows/soccer-pitchapi-v3-sync.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "live or historical"
        required: true
        default: "live"
      league:
        description: "league key for historical mode"
        required: false
        default: "eng.1"
      season:
        description: "PitchAPI season, e.g. 2025/2026 or 2025"
        required: false
        default: ""
      offset:
        description: "historical offset"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: soccer-pitchapi-v3-${{ github.event_name }}-${{ inputs.mode || 'live' }}
  cancel-in-progress: false

jobs:
  live:
    if: github.event_name == 'schedule' || inputs.mode == 'live'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        league: ["eng.1","esp.1","ger.1","ita.1","fra.1","usa.1","usa.nwsl"]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sync recent finals and lineup state through Cloudflare
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          LEAGUE: ${{ matrix.league }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          curl -fsS --connect-timeout 5 --max-time 120 --retry 2 --retry-delay 2 --retry-all-errors             -H "x-harvest-secret: $HARVEST_SECRET"             -H "content-type: application/json"             -d "{"leagueKey":"$LEAGUE","mode":"live","limit":8}"             https://fbis-myz.pages.dev/api/soccer-pitchapi-sync | tee result.json
          jq -e '.ok == true' result.json >/dev/null

  historical:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'historical'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sync one bounded historical shard through Cloudflare
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          LEAGUE: ${{ inputs.league }}
          SEASON: ${{ inputs.season }}
          OFFSET: ${{ inputs.offset }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          test -n "${SEASON:-}"
          curl -fsS --connect-timeout 5 --max-time 120 --retry 2 --retry-delay 2 --retry-all-errors             -H "x-harvest-secret: $HARVEST_SECRET"             -H "content-type: application/json"             -d "{"leagueKey":"$LEAGUE","mode":"historical","season":"$SEASON","offset":$OFFSET,"limit":12}"             https://fbis-myz.pages.dev/api/soccer-pitchapi-sync | tee result.json
          jq -e '.ok == true' result.json >/dev/null


  props-history-hydrate:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league: ["eng.1","esp.1","ger.1","ita.1","fra.1","usa.1","usa.nwsl"]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Hydrate recent PitchAPI player history for props
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          LEAGUE: ${{ matrix.league }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          for offset in 0 12 24 36 48; do
            body="$(curl -fsS --connect-timeout 5 --max-time 120 --retry 2 --retry-delay 2 --retry-all-errors \
              -H "x-harvest-secret: $HARVEST_SECRET" \
              -H "content-type: application/json" \
              -d "{\"leagueKey\":\"$LEAGUE\",\"mode\":\"recent-history\",\"offset\":$offset,\"limit\":12}" \
              https://fbis-myz.pages.dev/api/soccer-pitchapi-sync)"
            echo "$body" | jq .
            echo "$body" | jq -e '.ok == true' >/dev/null
          done


  props-enrich-after-hydrate:
    if: github.event_name == 'push'
    needs: props-history-hydrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
    steps:
      - name: Rebuild current soccer props from hydrated PitchAPI history
        run: |
          set -euo pipefail
          first=1
          for i in $(seq 1 15); do
            payload='{"sport":"soccer","limit":20}'
            if [ "$first" -eq 1 ]; then
              payload='{"sport":"soccer","limit":20,"resetUnavailable":true}'
              first=0
            fi
            out="$(mktemp)"
            curl -fsS --max-time 120 -X POST \
              -H "x-harvest-secret: $HARVEST_SECRET" \
              -H "content-type: application/json" \
              --data "$payload" "$BASE/api/prop-enrich-current" > "$out"
            cat "$out"
            attempted="$(jq -r '.attempted // 0' "$out")"
            [ "$attempted" -gt 0 ] || break
          done
          readback="$(mktemp)"
          curl -fsS --max-time 45 "$BASE/api/selective-props?sport=soccer&mode=sport&_t=$(date +%s)" > "$readback"
          jq -e '.ok==true' "$readback" >/dev/null
          echo "soccer projected cards=$(jq -r '.count // 0' "$readback")"
