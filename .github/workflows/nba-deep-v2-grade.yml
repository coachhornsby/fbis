name: NBA deep v2 prospective grade

on:
  workflow_dispatch:
  push:
    branches: [main, "research/nba-deep-v2"]
    paths:
      - "scripts/nba-deep-shadow-grade.mjs"
      - "migrations/0052_nba_deep_game_model.sql"
      - ".github/workflows/nba-deep-v2-grade.yml"
  schedule:
    - cron: "05 15 * * *"

permissions:
  contents: read

concurrency:
  group: nba-deep-v2-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Load current NBA outcomes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/current
          npx wrangler r2 object get             "fbis-archive/canonical/espn/nba/2026-27/current/nba-canonical.jsonl"             --file artifacts/current/nba-canonical.jsonl --remote || : > artifacts/current/nba-canonical.jsonl

      - name: Export deep challenger rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM nba_deep_game_shadow WHERE feature_cutoff_timestamp >= datetime('now','-120 days') ORDER BY feature_cutoff_timestamp ASC"             > artifacts/nba-deep-shadow-rows.json || echo '[]' > artifacts/nba-deep-shadow-rows.json

      - name: Grade prospective challenger
        run: |
          node scripts/nba-deep-shadow-grade.mjs             shadow=artifacts/nba-deep-shadow-rows.json             canonical=artifacts/current/nba-canonical.jsonl

      - name: Persist grades and validation evidence
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute fbis --remote --file=migrations/0052_nba_deep_game_model.sql
          if [ -s artifacts/nba-deep-prospective-validation.sql ]; then
            npx wrangler d1 execute fbis --remote --file=artifacts/nba-deep-prospective-validation.sql
          fi

      - name: Archive report
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          npx wrangler r2 object put             "fbis-archive/evaluation/nba/deep-v2/${stamp}.json"             --file artifacts/nba-deep-prospective-validation.json --remote

      - uses: actions/upload-artifact@v4
        with:
          name: nba-deep-v2-grade-${{ github.run_id }}
          path: artifacts/nba-deep-prospective-validation.json
          retention-days: 90
