name: Tennis ACTION capability probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4.1.0
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Require existing production credentials
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${APIFY_TOKEN:-}"

      - name: Probe ATP and WTA ACTION capability
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/tennis-action-probe.jsonl
          for sport in atp wta; do
            echo "Planning $sport capability audit"
            curl -fsS --max-time 60               -H "x-harvest-secret: ${HARVEST_SECRET}"               "${BASE}/api/action-research-pull?sport=${sport}&lifecycle=pregame&profile=CAPABILITY_AUDIT&gameStatus=scheduled&maxItems=3&fitBudgetUsd=0.18"               | tee "/tmp/${sport}-plan.json"
            jq -e '.ok == true' "/tmp/${sport}-plan.json" >/dev/null
            allowed="$(jq -r '.safety.allowed // false' "/tmp/${sport}-plan.json")"
            if [ "$allowed" = "true" ]; then
              set +e
              curl -sS --max-time 180 -X POST                 -H "x-harvest-secret: ${HARVEST_SECRET}"                 -H "content-type: application/json"                 -d "{\"sport\":\"${sport}\",\"lifecycle\":\"pregame\",\"profile\":\"CAPABILITY_AUDIT\",\"gameStatus\":\"scheduled\",\"maxItems\":3,\"fitBudgetUsd\":0.18}"                 "${BASE}/api/action-research-pull" | tee "/tmp/${sport}-run.json"
              rc=$?
              set -e
              jq -c --arg sport "$sport" --argjson rc "$rc" '{sport:$sport,curlRc:$rc,run:.}' "/tmp/${sport}-run.json" >> artifacts/tennis-action-probe.jsonl || true
            else
              jq -c --arg sport "$sport" '{sport:$sport,plan:.}' "/tmp/${sport}-plan.json" >> artifacts/tennis-action-probe.jsonl
            fi
          done

      - name: Inspect redacted ATP/WTA Actor schema
        run: |
          set -euo pipefail
          : > artifacts/tennis-action-schema.jsonl
          for sport in atp wta; do
            runfile="/tmp/${sport}-run.json"
            [ -s "$runfile" ] || continue
            run_id="$(jq -r '.runId // empty' "$runfile" 2>/dev/null || true)"
            dataset_id=""
            if [ -n "$run_id" ]; then
              dataset_id="$(npx wrangler d1 execute fbis --remote --json --command "SELECT dataset_id FROM shadow_collection_runs WHERE id='${run_id}' LIMIT 1" | jq -r '[..|objects|select(has("dataset_id"))|.dataset_id][0] // empty')"
            fi
            if [ -z "$dataset_id" ]; then
              dataset_id="$(npx wrangler d1 execute fbis --remote --json --command "SELECT dataset_id FROM shadow_collection_runs WHERE lower(sport)='${sport}' AND dataset_id IS NOT NULL ORDER BY started_at DESC LIMIT 1" | jq -r '[..|objects|select(has("dataset_id"))|.dataset_id][0] // empty')"
            fi
            [ -n "$dataset_id" ] || continue
            curl -fsS --max-time 60 -H "Authorization: Bearer ${APIFY_TOKEN}"               "https://api.apify.com/v2/datasets/${dataset_id}/items?clean=true&format=json" > "/tmp/${sport}-raw.json"
            jq -c --arg sport "$sport" '
              .[0:3][]? |
              {sport:$sport,
               topLevelKeys:(keys|sort),
               type:(.type // .kind // .recordType // null),
               league:(.league // .sport // null),
               eventKeys:((.event // .game // .match // {})|if type=="object" then keys|sort else [] end),
               consensusKeys:((.consensus // .markets // {})|if type=="object" then keys|sort else [] end),
               competitorKeys:((.competitors[0] // {})|if type=="object" then keys|sort else [] end),
               competitorPlayerKeys:((.competitors[0].player // {})|if type=="object" then keys|sort else [] end),
               competitorSample:([.competitors[0:2][]? | {id:(.id // .competitorId // null),playerId:(.playerId // .player.id // null),name:(.name // .fullName // .displayName // .player.name // .player.fullName // .player.displayName // null),side:(.side // .homeAway // .position // null),abbr:(.abbreviation // .abbr // .player.abbreviation // .player.abbr // null)}]),
               moneylineSideKeys:((.consensus.moneyline.sides[0] // {})|if type=="object" then keys|sort else [] end),
               moneylineSides:([.consensus.moneyline.sides[0:2][]? | {side:(.side // .name // null),odds:(.odds // .price // null),ticketPercent:(.ticketPercent // .ticketsPercent // null),moneyPercent:(.moneyPercent // null),sharpGap:(.sharpGap // null),noVigProbability:(.noVigProbability // null)}]),
               sampleIdentity:{
                 id:(.id // .gameId // .eventId // .matchId // null),
                 home:(.homeTeam.name // .homeTeam // .player1.name // .player1 // .competitors[0].name // null),
                 away:(.awayTeam.name // .awayTeam // .player2.name // .player2 // .competitors[1].name // null)
               }}
            ' "/tmp/${sport}-raw.json" >> artifacts/tennis-action-schema.jsonl
          done
          cat artifacts/tennis-action-schema.jsonl

      - name: Inspect persisted tennis ACTION fields
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --json --command "
            SELECT sport,
                   COUNT(*) AS observations,
                   COUNT(DISTINCT canonical_event_id) AS matched_events,
                   SUM(CASE WHEN public_ticket_pct IS NOT NULL THEN 1 ELSE 0 END) AS ticket_rows,
                   SUM(CASE WHEN public_money_pct IS NOT NULL THEN 1 ELSE 0 END) AS money_rows,
                   SUM(CASE WHEN money_minus_ticket_pct IS NOT NULL THEN 1 ELSE 0 END) AS gap_rows,
                   MAX(ABS(money_minus_ticket_pct)) AS max_abs_gap,
                   SUM(CASE WHEN tracked_bet_count IS NOT NULL THEN 1 ELSE 0 END) AS bet_count_rows,
                   SUM(CASE WHEN tracked_volume IS NOT NULL THEN 1 ELSE 0 END) AS volume_rows,
                   MIN(collected_at) AS first_seen,
                   MAX(collected_at) AS last_seen
            FROM action_market_book_observations
            WHERE lower(sport) IN ('atp','wta')
              AND collected_at >= datetime('now','-2 hours')
            GROUP BY sport
            ORDER BY sport;" > artifacts/tennis-action-fields.json
          cat artifacts/tennis-action-fields.json

      - name: Inspect tennis movement coverage
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --json --command "
            SELECT lower(sport) AS sport,
                   COUNT(*) AS movement_rows,
                   COUNT(DISTINCT provider_event_id) AS events,
                   COUNT(DISTINCT sportsbook) AS books
            FROM action_market_book_observations
            WHERE lower(sport) IN ('atp','wta')
              AND provider_timestamp IS NOT NULL
              AND collected_at >= datetime('now','-2 hours')
            GROUP BY lower(sport);" > artifacts/tennis-action-movement.json
          cat artifacts/tennis-action-movement.json

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: tennis-action-capability-probe
          path: artifacts/tennis-action-*.json*
          retention-days: 30
