name: Action Apify post-repair verification

# Bounded shadow verification after matching/prop repairs.
# 1) BASE matching: CFB 3 + NFL 4 (audit fixtures)
# 2) PLAYER_PROPS: 1 CFB + 1 NFL
# Hard spend cap ~$0.50 total. Never touches odds router.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN to execute paid verification
        required: true
        default: ""
  push:
    branches: [main, cursor/action-championship-complete-312d]
    paths:
      - ".github/verify-triggers/action-post-repair-run"

permissions:
  contents: read

concurrency:
  group: action-apify-post-repair-verify
  cancel-in-progress: false

jobs:
  verify:
    name: POST-REPAIR VERIFY (<= $0.50)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: https://fbis-myz.pages.dev
      LIFECYCLE: pregame
      MAX_TOTAL_USD: "0.50"
      CFB_IDS: "287974,287975,288997"
      NFL_IDS: "290853,290851,290845,290800"
      CFB_PROP_ID: "287974"
      NFL_PROP_ID: "290853"
    steps:
      - name: Authorize
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ]; then CONFIRM=RUN; fi
          test "${CONFIRM}" = "RUN" || { echo "Set confirm=RUN to spend"; exit 1; }
          test -n "${HARVEST_SECRET}" || { echo "HARVEST_SECRET missing"; exit 1; }
          echo "authorized=true"

      - name: Record live production SHA
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 30 -o "$tmp" -w '%{http_code}' \
            -H "accept: application/json" \
            "${BASE}/api/health?_=$(date +%s)")"
          live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$tmp")"
          echo "health_http=${code} live_sha=${live}"
          test "$code" = "200"
          test -n "$live"
          echo "LIVE_SHA=${live}" >> "$GITHUB_ENV"
          jq '{deploymentCommit, actionApify, oddsProviders}' "$tmp" > health.json

      - name: Plan all runs (spend gate)
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          : > estimates.txt
          plan() {
            local sport="$1" profile="$2" max="$3" ids="$4" label="$5"
            local tmp; tmp="$(mktemp)"
            local code
            code="$(curl -sS --max-time 60 -o "$tmp" -w '%{http_code}' \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              "${BASE}/api/action-apify-collect?mode=plan&sport=${sport}&lifecycle=${LIFECYCLE}&profile=${profile}&maxItems=${max}&gameUrls=${ids}")"
            echo "${label}_plan_http=${code}"
            test "$code" = "200"
            jq 'del(..| .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?)' "$tmp" > "plan-${label}.json"
            local est
            est="$(jq -r '(.plan.estimatedCostUsd // .budget.estimatedNextRunUsd // 0)' "$tmp")"
            echo "${est}" >> estimates.txt
            echo "${label}_est=${est}"
          }
          plan cfb BASE 3 "${CFB_IDS}" base-cfb
          plan nfl BASE 4 "${NFL_IDS}" base-nfl
          plan cfb PLAYER_PROPS 1 "${CFB_PROP_ID}" props-cfb
          plan nfl PLAYER_PROPS 1 "${NFL_PROP_ID}" props-nfl
          python3 - <<'PY'
          total = sum(float(x or 0) for x in open("estimates.txt") if x.strip())
          cap = float(__import__("os").environ["MAX_TOTAL_USD"])
          print(f"estimated_total_usd={total:.4f} cap={cap}")
          if total > cap:
              raise SystemExit(f"estimate {total} exceeds cap {cap}")
          PY

      - name: Execute BASE matching CFB + NFL
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          run_base() {
            local sport="$1" max="$2" ids_json="$3"
            local tmp; tmp="$(mktemp)"
            local code
            code="$(curl -sS --max-time 300 -o "$tmp" -w '%{http_code}' \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "content-type: application/json" \
              -d "{\"execute\":\"1\",\"sport\":\"${sport}\",\"lifecycle\":\"${LIFECYCLE}\",\"profile\":\"BASE\",\"maxItems\":${max},\"gameUrls\":${ids_json}}" \
              "${BASE}/api/action-apify-collect?execute=1&sport=${sport}&lifecycle=${LIFECYCLE}&profile=BASE&maxItems=${max}")"
            echo "${sport}_base_http=${code}"
            test "$code" = "200"
            jq 'del(..| .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?, .rows?)' "$tmp" > "exec-base-${sport}.json"
            jq '{ok, status, gamesReturned, gamesMatched, matchDetails, denominators, estimatedCostUsd, capabilitySummary}' "exec-base-${sport}.json"
          }
          run_base cfb 3 '["287974","287975","288997"]'
          run_base nfl 4 '["290853","290851","290845","290800"]'

      - name: Execute PLAYER_PROPS CFB (1) + NFL (1)
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for spec in "cfb:${CFB_PROP_ID}" "nfl:${NFL_PROP_ID}"; do
            sport="${spec%%:*}"; id="${spec#*:}"
            tmp="$(mktemp)"
            code="$(curl -sS --max-time 300 -o "$tmp" -w '%{http_code}' \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "content-type: application/json" \
              -d "{\"execute\":\"1\",\"sport\":\"${sport}\",\"lifecycle\":\"${LIFECYCLE}\",\"profile\":\"PLAYER_PROPS\",\"maxItems\":1,\"gameUrls\":[\"${id}\"]}" \
              "${BASE}/api/action-apify-collect?execute=1&sport=${sport}&lifecycle=${LIFECYCLE}&profile=PLAYER_PROPS&maxItems=1")"
            echo "${sport}_props_http=${code}"
            test "$code" = "200"
            jq 'del(..| .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?, .rows?)' "$tmp" > "exec-props-${sport}.json"
            jq '{ok,gamesReturned,gamesMatched,propsWritten,estimatedCostUsd,matchDetails,capabilitySummary:(.capabilitySummary.playerProps // .capabilitySummary)}' "exec-props-${sport}.json"
          done

      - name: Matching + props gate summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          def load(p):
              with open(p) as f: return json.load(f)
          cfb = load("exec-base-cfb.json")
          nfl = load("exec-base-nfl.json")
          props_cfb = load("exec-props-cfb.json")
          props_nfl = load("exec-props-nfl.json")

          def match_gate(doc, sport):
              details = doc.get("matchDetails") or doc.get("matches") or []
              dens = doc.get("denominators") or {}
              print(f"{sport}_denominators={dens}")
              print(f"{sport}_matches={[(d.get('actionGameId') or d.get('actionGameId'), d.get('confidence'), d.get('reason')) for d in details]}")
              if not details:
                  # fall back to aggregate counters when detail array absent
                  matched = int(doc.get("gamesMatched") or dens.get("matchedEvents") or 0)
                  ambiguous = int(dens.get("ambiguousEvents") or 0)
                  unmatched = int(dens.get("unmatchedEvents") or 0)
                  returned = int(doc.get("gamesReturned") or dens.get("actionEventsReturned") or 0)
                  ok = returned > 0 and matched == returned and ambiguous == 0 and unmatched == 0
                  print(f"{sport}_aggregate_gate matched={matched} returned={returned} ambiguous={ambiguous} unmatched={unmatched} ok={ok}")
                  return ok
              bad = [d for d in details if str(d.get("confidence") or "").upper() in ("AMBIGUOUS", "UNMATCHED", "")]
              return len(details) > 0 and len(bad) == 0

          ok_cfb = match_gate(cfb, "cfb")
          ok_nfl = match_gate(nfl, "nfl")
          print("cfb_matching_gate", ok_cfb)
          print("nfl_matching_gate", ok_nfl)
          for sport, doc in [("cfb", props_cfb), ("nfl", props_nfl)]:
              pp = ((doc.get("capabilitySummary") or {}).get("playerProps")
                    if isinstance(doc.get("capabilitySummary"), dict) and "playerProps" in (doc.get("capabilitySummary") or {})
                    else doc.get("capabilitySummary") or {})
              print(f"{sport}_props", {
                  "propRows": pp.get("propRows") or pp.get("propsWritten") or doc.get("propsWritten"),
                  "stablePlayerIdRate": pp.get("stablePlayerIdRate"),
                  "priceCoverage": pp.get("priceCoverage"),
                  "lineCoverage": pp.get("lineCoverage"),
                  "bookCoverage": pp.get("bookCoverage"),
                  "canonicalMarketRate": pp.get("canonicalMarketRate"),
                  "markets": (pp.get("markets") or [])[:20],
                  "rawFieldInventory": ((pp.get("rawFieldInventory") or {}).get("keys") or [])[:20],
              })
          if not (ok_cfb and ok_nfl):
              raise SystemExit("Matching verification gate failed")
          print("matching_verification_passed=true")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: action-post-repair-verify
          path: |
            health.json
            plan-*.json
            exec-*.json
          if-no-files-found: warn
