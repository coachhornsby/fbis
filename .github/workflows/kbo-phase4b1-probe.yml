name: KBO Phase 4B.1 population probe
on:
  push:
    branches:
      - codex/kbo-phase4b1-population
concurrency:
  group: kbo-phase4b1-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Probe official KBO 2025 history
        run: node scripts/kbo-phase4b1-populate.mjs
      - name: Probe raw GameCenter player identity fields
        run: node scripts/kbo-player-id-probe.mjs
      - name: Probe official KBO P_ID directory
        run: python scripts/kbo-pid-directory-probe.py
