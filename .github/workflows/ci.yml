name: CI

# PR → TEST / BUILD only. Push to main → TEST / BUILD then DEPLOY PRODUCTION.
# Feature-branch pushes no longer duplicate PR validation.
on:
  # Always validate PRs (required for branch-protection status checks).
  pull_request:
    branches:
      - main
  # Skip docs-only main pushes so documentation commits do not redeploy.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - "SECURITY.md"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    name: TEST / BUILD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify schema/migrations
        run: npm run verify:migrations
      - name: Run test suite
        run: npm test
      - name: Build app
        run: npm run build

  deploy-production:
    name: DEPLOY PRODUCTION
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Shared with Deploy Pages workflow — serialize production deploys; never cancel in-flight.
    concurrency:
      group: deploy-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact production SHA
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Production was bootstrapped via schema.sql; sync wrangler bookkeeping
          # before apply so already-present columns are not ALTER'd again.
          node scripts/sync-d1-migrations.mjs
          npx wrangler d1 migrations apply fbis --remote

      - name: Build production artifact
        run: npm run build

      - name: Sync HARVEST_SECRET to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET}" || { echo "Missing HARVEST_SECRET"; exit 1; }
          # Keep Pages Functions auth aligned with Actions (dashboard edit is write-only / easy to desync).
          printf '%s' "${HARVEST_SECRET}" | npx wrangler pages secret put HARVEST_SECRET --project-name fbis
          echo "Synced HARVEST_SECRET to Pages project fbis"

      - name: Sync Pages secrets from GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PARLAY_API_KEY_SECRET: ${{ secrets.PARLAY_API_KEY }}
          BALLPARK_PAL_API_KEY_SECRET: ${{ secrets.BALLPARK_PAL_API_KEY }}
          CFBD_API_KEY_SECRET: ${{ secrets.CFBD_API_KEY }}
          CBBD_API_KEY_SECRET: ${{ secrets.CBBD_API_KEY }}
          KENPOM_API_KEY_SECRET: ${{ secrets.KENPOM_API_KEY }}
          SHARPAPI_API_KEY_SECRET: ${{ secrets.SHARPAPI_API_KEY }}
          THERUNDOWN_API_KEY_SECRET: ${{ secrets.THERUNDOWN_API_KEY }}
          THEODDS_API_KEY_SECRET: ${{ secrets.THEODDS_API_KEY }}
          APIFY_TOKEN_SECRET: ${{ secrets.APIFY_TOKEN }}
          ACTION_APIFY_ENABLED_SECRET: ${{ secrets.ACTION_APIFY_ENABLED }}
          ACTION_APIFY_PLAN_SECRET: ${{ secrets.ACTION_APIFY_PLAN }}
          ACTION_APIFY_MONTHLY_BUDGET_USD_SECRET: ${{ secrets.ACTION_APIFY_MONTHLY_BUDGET_USD }}
        run: |
          set -euo pipefail
          # Secrets from GitHub Actions only (never workflow YAML / logs).
          # Odds: SharpAPI / TheRundown intentional fallbacks once rotated keys installed.
          # Action/Apify: shadow candidate only — never ODDS_PROVIDER_ORDER authority.
          # Empty GitHub secrets must NEVER overwrite Cloudflare secrets (credentials).
          # ACTION_APIFY_PLAN is a tier label (not a credential). Owner is on Apify Starter;
          # pin starter when the GH secret is empty or still "free" so health matches billing.
          PARLAY_API_KEY="${PARLAY_API_KEY_SECRET:-}"
          BALLPARK_PAL_API_KEY="${BALLPARK_PAL_API_KEY_SECRET:-}"
          CFBD_API_KEY="${CFBD_API_KEY_SECRET:-}"
          CBBD_API_KEY="${CBBD_API_KEY_SECRET:-}"
          KENPOM_API_KEY="${KENPOM_API_KEY_SECRET:-}"
          SHARPAPI_API_KEY="${SHARPAPI_API_KEY_SECRET:-}"
          THERUNDOWN_API_KEY="${THERUNDOWN_API_KEY_SECRET:-}"
          THEODDS_API_KEY="${THEODDS_API_KEY_SECRET:-}"
          APIFY_TOKEN="${APIFY_TOKEN_SECRET:-}"
          ACTION_APIFY_ENABLED="${ACTION_APIFY_ENABLED_SECRET:-}"
          ACTION_APIFY_PLAN="${ACTION_APIFY_PLAN_SECRET:-starter}"
          if [ "${ACTION_APIFY_PLAN}" = "free" ]; then
            ACTION_APIFY_PLAN=starter
          fi
          ACTION_APIFY_MONTHLY_BUDGET_USD="${ACTION_APIFY_MONTHLY_BUDGET_USD_SECRET:-19}"
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "${value}" ]; then
              echo "skip ${name} (empty — leave existing Cloudflare secret unchanged)"
              return 0
            fi
            # Retry transient Cloudflare/wrangler connectivity flakes (fetch failed).
            local attempt=1
            local max_attempts=4
            local delay=5
            while true; do
              if printf '%s' "${value}" | npx wrangler pages secret put "${name}" --project-name fbis; then
                echo "Synced ${name} to Pages project fbis (attempt ${attempt})"
                return 0
              fi
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Failed to sync ${name} after ${max_attempts} attempts"
                return 1
              fi
              echo "wrangler secret put ${name} failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s"
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          put_secret PARLAY_API_KEY "${PARLAY_API_KEY}"
          put_secret BALLPARK_PAL_API_KEY "${BALLPARK_PAL_API_KEY}"
          put_secret CFBD_API_KEY "${CFBD_API_KEY}"
          put_secret CBBD_API_KEY "${CBBD_API_KEY}"
          put_secret KENPOM_API_KEY "${KENPOM_API_KEY}"
          put_secret SHARPAPI_API_KEY "${SHARPAPI_API_KEY}"
          put_secret THERUNDOWN_API_KEY "${THERUNDOWN_API_KEY}"
          put_secret THEODDS_API_KEY "${THEODDS_API_KEY}"
          put_secret APIFY_TOKEN "${APIFY_TOKEN}"
          put_secret ACTION_APIFY_ENABLED "${ACTION_APIFY_ENABLED}"
          put_secret ACTION_APIFY_PLAN "${ACTION_APIFY_PLAN}"
          put_secret ACTION_APIFY_MONTHLY_BUDGET_USD "${ACTION_APIFY_MONTHLY_BUDGET_USD}"

      - name: Deploy canonical Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist \
            --project-name fbis \
            --branch main \
            --commit-hash "${DEPLOY_SHA}" \
            --commit-message "deploy ${DEPLOY_SHA}"

      - name: VERIFY PRODUCTION SHA
        env:
          BASE: https://fbis-myz.pages.dev
          # Pages alias cutover + Functions activation can lag past ~75s; use full budget.
          VERIFY_MAX_ATTEMPTS: "24"
        run: |
          set -euo pipefail
          # Prefer live /api/health (authoritative Worker env SHA) over wrangler list shape churn.
          # CLI waits between retries via nextVerifyDelayMs (propagating vs mismatch vs unavailable).
          node scripts/verify-deployment-sha.mjs "${DEPLOY_SHA}"
          # Release-gate smoke: product APIs must return JSON, not the SPA HTML shell.
          for path in "/api/health" "/api/projections?sport=mlb" "/api/published-projections"; do
            tmp="$(mktemp)"
            sep=$(echo "$path" | grep -q '?' && echo '&' || echo '?')
            code="$(curl -sS --max-time 30 -o "$tmp" -w "%{http_code}" "${BASE}${path}${sep}_t=$(date +%s)")"
            echo "smoke ${path} http=${code}"
            test "$code" = "200"
            jq -e 'type == "object" or type == "array"' "$tmp" >/dev/null
          done

          # Provider-ingestion release gate. This is read-only and proves the
          # deployed Worker sees the advanced-data credentials that the model
          # pipelines depend on; it does not expose secret values.
          source_tmp="$(mktemp)"
          source_ok=0
          for source_attempt in $(seq 1 12); do
            source_code="$(curl -sS --max-time 30 -o "$source_tmp" -w "%{http_code}" "${BASE}/api/data-health?_t=$(date +%s)-${source_attempt}")"
            echo "smoke /api/data-health attempt=${source_attempt}/12 http=${source_code}"
            if [ "$source_code" = "200" ] && jq -e 'type == "object"' "$source_tmp" >/dev/null 2>&1; then
              # Always print the non-secret state before deciding pass/fail.
              jq -c '{
                cfbd:.runtimeConfig.cfbd,
                cbbd:.runtimeConfig.cbbd,
                ballparkPal:.runtimeConfig.ballpark_pal,
                parlay:.runtimeConfig.parlay_pinnacle,
                savant:.runtimeConfig.baseball_savant,
                nflverse:.runtimeConfig.nflverse,
                kenpom:.runtimeConfig.kenpom_api,
                nba:.runtimeConfig.nba_stats_licensed
              }' "$source_tmp" || true
              if jq -e '
                .runtimeConfig.cfbd.implemented == true and
                .runtimeConfig.cbbd.implemented == true and
                .runtimeConfig.ballpark_pal.implemented == true and
                .runtimeConfig.baseball_savant.implemented == true and
                .runtimeConfig.nflverse.implemented == true and
                .runtimeConfig.parlay_pinnacle.implemented == true and
                .runtimeConfig.cfbd.configured == true and
                .runtimeConfig.cbbd.configured == true
              ' "$source_tmp" >/dev/null; then
                source_ok=1
                break
              fi
            fi
            # Pages/Functions edge propagation can briefly mix the new health SHA
            # with an older route instance. Retry the contract before failing closed.
            sleep 5
          done
          if [ "$source_ok" -ne 1 ]; then
            echo "Provider-ingestion contract did not converge after retries."
            exit 1
          fi

          echo "Release gate smoke passed for ${DEPLOY_SHA}"
          echo "DEPLOY PRODUCTION complete — research catch-up runs in harvest.yml, not this gate."

      - name: CFBD endpoint audit (live production)
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tmp="$(mktemp)"
          http=$(curl -sS --max-time 180 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            -o "$tmp" -w "%{http_code}" \
            "https://fbis-myz.pages.dev/api/college?job=cfbd-endpoint-audit&trigger=workflow_dispatch&year=2026&week=8")
          echo "cfbd_audit_http=${http}"
          cp "$tmp" artifacts/cfbd-endpoint-audit.json
          jq -c '{ok:.ok, job:.job, status:.status, configured:(.d1.audit.summary.configured // null), classifications:(.d1.audit.summary.classifications // {}), availableN:(.d1.audit.summary.available|length // 0)}' "$tmp" || true
          jq -r '.d1.audit.featureTableMarkdown // empty' "$tmp" > artifacts/cfbd-feature-table.md || true
          printf 'production_sha=%s\naudited_at=%s\n' "${DEPLOY_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/cfbd-audit-meta.txt
          test "$http" = "200"
          jq -e '.ok == true and .job == "cfbd-endpoint-audit"' "$tmp" >/dev/null
          {
            echo "## CFBD endpoint audit (post-deploy)"
            echo ""
            echo "- production SHA: \`${DEPLOY_SHA}\`"
            echo "- configured: $(jq -r '.d1.audit.summary.configured' "$tmp")"
            echo "- resultCount: $(jq -r '.d1.audit.summary.resultCount' "$tmp")"
            echo ""
            jq -r '.d1.audit.featureTableMarkdown // "_unavailable_"' "$tmp"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CFBD audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfbd-endpoint-audit-${{ env.DEPLOY_SHA }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Controlled CFBD + CBBD capability audit
        if: contains(github.event.head_commit.message, '[college-capability-audit]')
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # CFBD historical sample: representative older seasons.
          cfbd_hist="artifacts/cfbd-historical-capability.json"
          cfbd_http="$(curl -sS --max-time 240 --retry 0 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            -o "$cfbd_hist" -w "%{http_code}" \
            "${BASE}/api/college?job=cfbd-endpoint-audit&trigger=workflow_dispatch&seasons=2024,2022&week=8")"
          echo "CFBD historical audit http=${cfbd_http}"
          test "$cfbd_http" = "200"
          jq -e '.ok == true and .job == "cfbd-endpoint-audit"' "$cfbd_hist" >/dev/null

          # CBBD: keep each Worker request well below the Pages request ceiling.
          # Walk the live OpenAPI GET inventory in 4-operation / <=12-network-request chunks.
          start=0
          chunk=0
          while true; do
            chunk_tag="$(printf "%02d" "$chunk")"
            out="artifacts/cbbd-capability-chunk-${chunk_tag}.json"
            http="$(curl -sS --max-time 110 --retry 0 \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              -o "$out" -w "%{http_code}" \
              "${BASE}/api/college?job=cbbd-endpoint-audit&trigger=workflow_dispatch&seasons=2026,2024,2022&maxRequests=12&operationStart=${start}&operationLimit=4")"
            echo "CBBD chunk=${chunk} start=${start} http=${http}"
            if [ "$http" != "200" ]; then
              jq -c '{ok:.ok,status:.status,error:.error,errors:.errors,keyHealth:.keyHealth}' "$out" 2>/dev/null || head -c 500 "$out" || true
              exit 1
            fi
            jq -e '.ok == true and .job == "cbbd-endpoint-audit"' "$out" >/dev/null
            has_more="$(jq -r '.d1.audit.summary.hasMore // false' "$out")"
            next_start="$(jq -r '.d1.audit.summary.nextOperationStart // empty' "$out")"
            inv="$(jq -r '.d1.audit.summary.inventoryGetOperations // 0' "$out")"
            win="$(jq -r '.d1.audit.summary.windowOperations // 0' "$out")"
            req="$(jq -r '.d1.audit.summary.requestCount // 0' "$out")"
            echo "CBBD chunk=${chunk}: inventory=${inv} window=${win} requests=${req} hasMore=${has_more} next=${next_start:-none}"
            if [ "$has_more" != "true" ]; then
              break
            fi
            test -n "$next_start"
            start="$next_start"
            chunk=$((chunk + 1))
            if [ "$chunk" -ge 20 ]; then
              echo "CBBD audit exceeded 20 chunks; fail closed."
              exit 1
            fi
          done

          jq -s '
            {
              ok: all(.[]; .ok == true),
              chunkCount: length,
              seasonsTested: (.[0].d1.audit.seasonsTested // []),
              schema: (.[0].d1.audit.schema // {}),
              summary: {
                requestCount: (map(.d1.audit.summary.requestCount // 0) | add),
                inventoryGetOperations: (.[0].d1.audit.summary.inventoryGetOperations // 0),
                historicalCapableOperations: (.[0].d1.audit.summary.historicalCapableOperations // 0),
                classifications: (reduce .[] as $c ({};
                  reduce (($c.d1.audit.summary.classifications // {}) | to_entries[]) as $e (.;
                    .[$e.key] = ((.[$e.key] // 0) + $e.value)))) ,
                available: ([.[].d1.audit.summary.available[]?] | unique),
                availableButEmpty: ([.[].d1.audit.summary.availableButEmpty[]?] | unique),
                notEntitled: ([.[].d1.audit.summary.notEntitled[]?] | unique),
                invalidParameters: ([.[].d1.audit.summary.invalidParameters[]?] | unique),
                authFailure: ([.[].d1.audit.summary.authFailure[]?] | unique),
                transientFailure: ([.[].d1.audit.summary.transientFailure[]?] | unique)
              },
              probes: [.[].d1.audit.probes[]?],
              chunks: map({
                start:.d1.audit.summary.operationStart,
                window:.d1.audit.summary.windowOperations,
                requests:.d1.audit.summary.requestCount,
                classifications:.d1.audit.summary.classifications
              })
            }
          ' artifacts/cbbd-capability-chunk-*.json > artifacts/cbbd-capability-audit.json
          jq -e '.ok == true and .chunkCount > 0' artifacts/cbbd-capability-audit.json >/dev/null

          jq -n \
            --slurpfile current artifacts/cfbd-endpoint-audit.json \
            --slurpfile historical "$cfbd_hist" \
            --slurpfile cbbd artifacts/cbbd-capability-audit.json \
            '{ok:true,auditedAt:(now|todateiso8601),cfbdCurrent:$current[0],cfbdHistorical:$historical[0],cbbd:$cbbd[0]}' \
            > artifacts/college-capability-audit.json

          jq -c '{cfbdCurrent:{seasons:.cfbdCurrent.d1.audit.summary.seasonsTested,resultCount:.cfbdCurrent.d1.audit.summary.resultCount,uniqueEndpoints:.cfbdCurrent.d1.audit.summary.uniqueEndpoints,classifications:.cfbdCurrent.d1.audit.summary.classifications,availableN:(.cfbdCurrent.d1.audit.summary.available|length)},cfbdHistorical:{seasons:.cfbdHistorical.d1.audit.summary.seasonsTested,resultCount:.cfbdHistorical.d1.audit.summary.resultCount,uniqueEndpoints:.cfbdHistorical.d1.audit.summary.uniqueEndpoints,classifications:.cfbdHistorical.d1.audit.summary.classifications,availableN:(.cfbdHistorical.d1.audit.summary.available|length)},cbbd:{seasons:.cbbd.seasonsTested,schema:.cbbd.schema,chunkCount:.cbbd.chunkCount,requestCount:.cbbd.summary.requestCount,inventoryGetOperations:.cbbd.summary.inventoryGetOperations,historicalCapableOperations:.cbbd.summary.historicalCapableOperations,classifications:.cbbd.summary.classifications,availableN:(.cbbd.summary.available|length),availableButEmptyN:(.cbbd.summary.availableButEmpty|length),notEntitledN:(.cbbd.summary.notEntitled|length),authFailureN:(.cbbd.summary.authFailure|length)}}' artifacts/college-capability-audit.json \
            | tee artifacts/college-capability-audit-summary.log

          {
            echo "## Controlled CFBD + CBBD capability audit"
            echo ""
            cat artifacts/college-capability-audit-summary.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload college capability audit artifact
        if: always() && contains(github.event.head_commit.message, '[college-capability-audit]')
        uses: actions/upload-artifact@v4
        with:
          name: college-capability-audit-${{ env.DEPLOY_SHA }}
          path: |
            artifacts/college-capability-audit.json
            artifacts/cfbd-historical-capability.json
            artifacts/cbbd-capability-audit.json
            artifacts/cbbd-capability-chunk-*.json
            artifacts/college-capability-audit-summary.log
          if-no-files-found: warn
          retention-days: 14
      # NFL team_form was never seeded because freeze historically skipped NFL
      # (no independent FBIS projection) — a circular dependency. Seed form from
      # ESPN finals via /api/harvest only. Do NOT call /api/collect here — research
      # catch-up stays in harvest.yml. /api/today builds the slate live from form.
      # Seed NFL team_form in small week chunks (Pages Function request limits).
      # Soft-fail: Pages deploy already verified above; form seed must not red the release gate.
      - name: NFL form backfill (post-deploy seed)
        continue-on-error: true
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -u
          mkdir -p artifacts
          auth=(-H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json")
          total_applied=0
          total_finals=0
          any_fail=0

          seed_chunk() {
            local season="$1"
            local weeks="$2"
            local tag="$3"
            local out="artifacts/nfl-form-backfill-${season}-${tag}.json"
            local http
            http=$(curl -sS --max-time 90 \
              "${auth[@]}" \
              -o "$out" -w "%{http_code}" \
              "${BASE}/api/harvest?formBackfill=1&formSeason=${season}&formWeeks=${weeks}&includePostseason=0&trigger=workflow_dispatch" || echo "000")
            echo "nfl_form_backfill season=${season} weeks=${weeks} http=${http}"
            if [ "$http" != "200" ]; then
              any_fail=1
              echo "chunk_failed season=${season} tag=${tag} http=${http}"
              return 0
            fi
            jq -c '{ok:.ok, season:.season, weeksFetched:.weeksFetched, finalsSeen:.finalsSeen, formApplied:.formApplied, formSkipped:.formSkipped, formFailed:.formFailed, errors:(.errors//[])}' "$out" || true
            applied=$(jq -r '.formApplied // 0' "$out")
            finals=$(jq -r '.finalsSeen // 0' "$out")
            total_applied=$((total_applied + applied))
            total_finals=$((total_finals + finals))
            # Partial ESPN/week failures should not fail the whole seed if rows applied.
            if [ "$(jq -r '.ok' "$out")" != "true" ] && [ "$applied" = "0" ]; then
              any_fail=1
            fi
          }

          # 2025 regular season in 3-week chunks (avoids Pages Function timeout).
          for start in 1 4 7 10 13 16; do
            end=$((start + 2))
            if [ "$end" -gt 18 ]; then end=18; fi
            weeks=$(seq -s, "$start" "$end")
            seed_chunk 2025 "$weeks" "w${start}-${end}"
            sleep 1
          done
          # 2026 early weeks
          seed_chunk 2026 "1,2,3" "w1-3"

          # Aggregate summary artifact
          printf '{"ok":%s,"formApplied":%s,"finalsSeen":%s}\n' \
            "$([ "$any_fail" -eq 0 ] && echo true || echo false)" \
            "$total_applied" "$total_finals" > artifacts/nfl-form-backfill-summary.json

          {
            echo "## NFL form backfill (post-deploy)"
            echo ""
            echo "- production SHA: \`${DEPLOY_SHA}\`"
            echo "- formApplied (sum): ${total_applied}"
            echo "- finalsSeen (sum): ${total_finals}"
            echo "- anyChunkFail: ${any_fail}"
            echo "- note: soft-fail step — Pages deploy already verified; freeze/collect stays in harvest.yml"
          } >> "$GITHUB_STEP_SUMMARY"

          # Soft-fail the step if nothing applied (so the badge shows yellow), but
          # continue-on-error keeps the deploy job green once Pages is live.
          if [ "$total_applied" -le 0 ]; then
            echo "No form rows applied — investigate ESPN/form path."
            exit 1
          fi
          exit 0

      - name: Upload NFL form-backfill artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-form-backfill-${{ env.DEPLOY_SHA }}
          path: artifacts/nfl-form-backfill-*.json
          if-no-files-found: warn
          retention-days: 14

      # Freeze/publish proof lives in harvest.yml (research pipeline), not this
      # deploy gate — CI release-gate tests forbid /api/collect here.