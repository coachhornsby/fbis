name: CI

# PR → TEST / BUILD only. Push to main → TEST / BUILD then DEPLOY PRODUCTION.
# Feature-branch pushes no longer duplicate PR validation.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-build:
    name: TEST / BUILD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify schema/migrations
        run: npm run verify:migrations
      - name: Run test suite
        run: npm test
      - name: Build app
        run: npm run build

  deploy-production:
    name: DEPLOY PRODUCTION
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Shared with Deploy Pages workflow — serialize production deploys; never cancel in-flight.
    concurrency:
      group: deploy-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact production SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Production was bootstrapped via schema.sql; sync wrangler bookkeeping
          # before apply so already-present columns are not ALTER'd again.
          node scripts/sync-d1-migrations.mjs
          npx wrangler d1 migrations apply fbis --remote

      - name: Build production artifact
        run: npm run build

      - name: Sync HARVEST_SECRET to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET}" || { echo "Missing HARVEST_SECRET"; exit 1; }
          # Keep Pages Functions auth aligned with Actions (dashboard edit is write-only / easy to desync).
          printf '%s' "${HARVEST_SECRET}" | npx wrangler pages secret put HARVEST_SECRET --project-name fbis
          echo "Synced HARVEST_SECRET to Pages project fbis"

      - name: Sync free odds backup secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHARPAPI_API_KEY_SECRET: ${{ secrets.SHARPAPI_API_KEY }}
          THERUNDOWN_API_KEY_SECRET: ${{ secrets.THERUNDOWN_API_KEY }}
          THEODDS_API_KEY_SECRET: ${{ secrets.THEODDS_API_KEY }}
        run: |
          set -euo pipefail
          # Prefer GitHub Actions secrets when present; otherwise bootstrap the
          # free-tier keys already provisioned for FBIS so production works
          # without a dashboard visit.
          SHARPAPI_API_KEY="${SHARPAPI_API_KEY_SECRET:-sk_live_VKvAiFyHrGXwe3muxCzFse}"
          THERUNDOWN_API_KEY="${THERUNDOWN_API_KEY_SECRET:-11ab49de1fbdc337e158016c38f9f16e9966657a58f87bee4b689e40b3a432e6}"
          THEODDS_API_KEY="${THEODDS_API_KEY_SECRET:-}"
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "${value}" ]; then
              echo "skip ${name} (empty)"
              return 0
            fi
            printf '%s' "${value}" | npx wrangler pages secret put "${name}" --project-name fbis
            echo "Synced ${name} to Pages project fbis"
          }
          put_secret SHARPAPI_API_KEY "${SHARPAPI_API_KEY}"
          put_secret THERUNDOWN_API_KEY "${THERUNDOWN_API_KEY}"
          put_secret THEODDS_API_KEY "${THEODDS_API_KEY}"

      - name: Deploy canonical Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist \
            --project-name fbis \
            --branch main \
            --commit-hash "${DEPLOY_SHA}" \
            --commit-message "deploy ${DEPLOY_SHA}"

      - name: VERIFY PRODUCTION SHA
        env:
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          # Prefer live /api/health (authoritative Worker env SHA) over wrangler list shape churn.
          # CLI waits between retries via nextVerifyDelayMs (propagating vs mismatch vs unavailable).
          node scripts/verify-deployment-sha.mjs "${DEPLOY_SHA}"
          # Release-gate smoke: product APIs must return JSON, not the SPA HTML shell.
          for path in "/api/health" "/api/projections?sport=mlb" "/api/published-projections"; do
            tmp="$(mktemp)"
            sep=$(echo "$path" | grep -q '?' && echo '&' || echo '?')
            code="$(curl -sS --max-time 30 -o "$tmp" -w "%{http_code}" "${BASE}${path}${sep}_t=$(date +%s)")"
            echo "smoke ${path} http=${code}"
            test "$code" = "200"
            jq -e 'type == "object" or type == "array"' "$tmp" >/dev/null
          done
          echo "Release gate smoke passed for ${DEPLOY_SHA}"
          echo "DEPLOY PRODUCTION complete — research catch-up runs in harvest.yml, not this gate."

      - name: CFBD endpoint audit (live production)
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tmp="$(mktemp)"
          http=$(curl -sS --max-time 180 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            -o "$tmp" -w "%{http_code}" \
            "https://fbis-myz.pages.dev/api/college?job=cfbd-endpoint-audit&trigger=workflow_dispatch&year=2026&week=8")
          echo "cfbd_audit_http=${http}"
          cp "$tmp" artifacts/cfbd-endpoint-audit.json
          jq -c '{ok:.ok, job:.job, status:.status, configured:(.d1.audit.summary.configured // null), classifications:(.d1.audit.summary.classifications // {}), availableN:(.d1.audit.summary.available|length // 0)}' "$tmp" || true
          jq -r '.d1.audit.featureTableMarkdown // empty' "$tmp" > artifacts/cfbd-feature-table.md || true
          printf 'production_sha=%s\naudited_at=%s\n' "${DEPLOY_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/cfbd-audit-meta.txt
          test "$http" = "200"
          jq -e '.ok == true and .job == "cfbd-endpoint-audit"' "$tmp" >/dev/null
          {
            echo "## CFBD endpoint audit (post-deploy)"
            echo ""
            echo "- production SHA: \`${DEPLOY_SHA}\`"
            echo "- configured: $(jq -r '.d1.audit.summary.configured' "$tmp")"
            echo "- resultCount: $(jq -r '.d1.audit.summary.resultCount' "$tmp")"
            echo ""
            jq -r '.d1.audit.featureTableMarkdown // "_unavailable_"' "$tmp"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CFBD audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfbd-endpoint-audit-${{ env.DEPLOY_SHA }}
          path: artifacts/
          if-no-files-found: warn
