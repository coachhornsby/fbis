name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify schema/migrations
        run: npm run verify:migrations
      - name: Run test suite
        run: npm test
      - name: Build app
        run: npm run build

  deploy-production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact production SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Production was bootstrapped via schema.sql; sync wrangler bookkeeping
          # before apply so already-present columns are not ALTER'd again.
          node scripts/sync-d1-migrations.mjs
          npx wrangler d1 migrations apply fbis --remote

      - name: Build production artifact
        run: npm run build

      - name: Sync HARVEST_SECRET to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET}" || { echo "Missing HARVEST_SECRET"; exit 1; }
          # Keep Pages Functions auth aligned with Actions (dashboard edit is write-only / easy to desync).
          printf '%s' "${HARVEST_SECRET}" | npx wrangler pages secret put HARVEST_SECRET --project-name fbis
          echo "Synced HARVEST_SECRET to Pages project fbis"

      - name: Deploy canonical Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist \
            --project-name fbis \
            --branch main \
            --commit-hash "${DEPLOY_SHA}" \
            --commit-message "deploy ${DEPLOY_SHA}"

      - name: Verify Cloudflare production SHA
        env:
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          # Prefer live /api/health (authoritative Worker env SHA) over wrangler list shape churn.
          node scripts/verify-deployment-sha.mjs "${DEPLOY_SHA}"
          # Release-gate smoke: product APIs must return JSON, not the SPA HTML shell.
          for path in "/api/health" "/api/projections?sport=mlb" "/api/published-projections"; do
            tmp="$(mktemp)"
            sep=$(echo "$path" | grep -q '?' && echo '&' || echo '?')
            code="$(curl -sS --max-time 30 -o "$tmp" -w "%{http_code}" "${BASE}${path}${sep}_t=$(date +%s)")"
            echo "smoke ${path} http=${code}"
            test "$code" = "200"
            jq -e 'type == "object" or type == "array"' "$tmp" >/dev/null
          done
          echo "Release gate smoke passed for ${DEPLOY_SHA}"

      - name: Catch-up collect and harvest
        env:
          BASE: https://fbis-myz.pages.dev
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET}" || { echo "Missing HARVEST_SECRET"; exit 1; }
          for sport in mlb nba nfl cfb cbb; do
            echo "collect ${sport}"
            tmp="$(mktemp)"
            code="$(curl -sS --max-time 180 -o "$tmp" -w "%{http_code}" \
              -H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json" \
              "${BASE}/api/collect?odds=cache&sport=${sport}&trigger=schedule&scheduledSlot=post-deploy-catchup&runUrl=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
            echo "collect ${sport} http=${code}"
            jq -c '{ok,status,errors:(.errors//[])[:3]}' "$tmp" || cat "$tmp"
            test "$code" = "200"
            test "$(jq -r '.ok == true' "$tmp")" = "true"
          done
          # CFB first: sport-corrected OPEN college tickets need CFB finals.
          # MLB 10-day harvest can exceed Pages wall time; retry and continue other sports.
          harvest_failed=0
          for sport in cfb mlb nba nfl cbb; do
            echo "harvest ${sport}"
            ok_sport=0
            for attempt in 1 2 3; do
              tmp="$(mktemp)"
              set +e
              code="$(curl -sS --max-time 540 -o "$tmp" -w "%{http_code}" \
                -H "x-harvest-secret: ${HARVEST_SECRET}" -H "accept: application/json" \
                "${BASE}/api/harvest?days=6&sport=${sport}&trigger=schedule&scheduledSlot=post-deploy-catchup&runUrl=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
              curl_ec=$?
              set -e
              echo "harvest ${sport} attempt=${attempt} curl_ec=${curl_ec} http=${code}"
              if [ "$curl_ec" -ne 0 ] || [ "$code" = "000" ] || [ "$code" = "504" ] || [ "$code" = "524" ]; then
                echo "retryable harvest transport/timeout sport=${sport}"
                sleep $((attempt * 8))
                continue
              fi
              jq -c '{ok,status,finals_graded,errors:(.errors//[])[:3]}' "$tmp" || head -c 300 "$tmp" || true
              if [ "$code" = "200" ] && [ "$(jq -r '.ok == true' "$tmp" 2>/dev/null || echo false)" = "true" ]; then
                ok_sport=1
                break
              fi
              sleep $((attempt * 5))
            done
            if [ "$ok_sport" -ne 1 ]; then
              echo "harvest ${sport} failed after retries"
              harvest_failed=1
            fi
          done
          curl -sS --max-time 20 "${BASE}/api/health?_t=$(date +%s)" | jq '{commit:.deploymentCommit,state,schedule:.pipeline.schedule,lastCollect:.pipeline.lastCollectSuccessAt,lastHarvest:.pipeline.lastHarvestSuccessAt}'
          if [ "$harvest_failed" -ne 0 ]; then
            echo "One or more harvest sports failed; collect catch-up succeeded."
            exit 1
          fi
          echo "Post-deploy catch-up complete"
