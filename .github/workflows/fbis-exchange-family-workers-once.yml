name: FBIS exchange market-family workers — bounded one-time release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fbis-exchange-family-workers-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbis-exchange-market-family-workers-once
  cancel-in-progress: false

jobs:
  deploy-market-family-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Install pinned repository and account-budget dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix services/account-budget
      - name: Validate existing account-budget gates and market contracts
        run: |
          node --check services/kalshi-public-collector/entrypoint.mjs
          node --check services/polymarket-rest-collector/collector.mjs
          node --check services/polymarket-rest-collector/worker.mjs
          node --check functions/lib/kalshiBasketballLineQuotes.js
          node --check functions/lib/exchangeCardDelivery.js
          node --test test/exchange-family-binding.test.mjs test/exchange-card-rows.test.mjs test/kalshi-basketball-line-quotes.test.mjs test/polymarket-rest-boundary.test.mjs
      - name: Require existing Cloudflare deployment credentials
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "MISSING_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "MISSING_CLOUDFLARE_TOKEN"; exit 1; }
      - name: Deploy existing signed Kalshi bounded collector only
        run: npx wrangler deploy --config wrangler.kalshi-public-collector.toml --keep-vars
      - name: Deploy existing Polymarket US bounded REST collector only
        run: npx wrangler deploy --config wrangler.polymarket-rest-collector.toml --keep-vars
