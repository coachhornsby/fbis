name: NFL personnel v1.3 prospective shadow
on:
  workflow_dispatch:
  schedule:
    - cron: "27 */3 * * *"
  push:
    branches: [main]
    paths:
      - "functions/lib/nflPersonnelChallenger.js"
      - "functions/api/nfl-personnel-research.js"
      - "migrations/0129_nfl_personnel_research.sql"
      - ".github/workflows/nfl-personnel-shadow.yml"
permissions:
  contents: read
concurrency:
  group: nfl-personnel-v13-prospective
  cancel-in-progress: false
jobs:
  capture-and-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: github.event_name == 'push'
      - name: Apply additive NFL_DB research ledger schema
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute fbis-nfl --remote --file=migrations/0129_nfl_personnel_research.sql
      - name: Wait for expected production SHA
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$BASE/api/health?_t=$(date +%s)" || true)"
            if [ "$code" = 200 ] && grep -q "$EXPECTED_SHA" "$body"; then
              echo "production_sha=$EXPECTED_SHA"
              exit 0
            fi
            sleep 8
          done
          echo "Production SHA not verified; no prospective writes attempted."
          exit 1
      - name: Capture immutable early/late personnel research
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          test -n "$HARVEST_SECRET"
          out="$(mktemp)"
          code="$(curl -sS --max-time 75 --retry 1 -H "x-harvest-secret: $HARVEST_SECRET" -X POST -o "$out" -w '%{http_code}' "$BASE/api/nfl-personnel-research?mode=capture")"
          cat "$out"
          test "$code" = 200
          jq -e '.ok == true and .canQualify == false and .canAuthorizeWager == false and .noRetroactiveCreation == true' "$out" >/dev/null
          {
            echo "## NFL v1.3 shadow capture"
            echo "- eligible: $(jq -r '.eligible' "$out")"
            echo "- inserted: $(jq -r '.inserted' "$out")"
            echo "- already captured: $(jq -r '.already' "$out")"
            echo "- blocked for evidence: $(jq -r '.blocked' "$out")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Grade source-confirmed completed regulation games
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          out="$(mktemp)"
          code="$(curl -sS --max-time 75 --retry 1 -H "x-harvest-secret: $HARVEST_SECRET" -X POST -o "$out" -w '%{http_code}' "$BASE/api/nfl-personnel-research?mode=grade")"
          cat "$out"
          test "$code" = 200
          jq -e '.ok == true and .canQualify == false and .canAuthorizeWager == false' "$out" >/dev/null
          {
            echo "## Official grade"
            echo "- candidates: $(jq -r '.candidates' "$out")"
            echo "- new grades: $(jq -r '.graded' "$out")"
            echo "- unresolved: $(jq -r '.unresolved' "$out")"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report paired accuracy without automatic promotion
        env:
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          out="$(mktemp)"
          code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' "$BASE/api/nfl-personnel-research?mode=summary")"
          test "$code" = 200
          jq -e '.ok == true and .noAutomaticPromotion == true and .canAuthorizeWager == false and .validationStatus == "NOT_PROSPECTIVELY_VALIDATED"' "$out" >/dev/null
          {
            echo "## Paired shadow report"
            echo "- graded checkpoints: $(jq -r '.all.n' "$out")"
            echo "- receiver-depleted checkpoints: $(jq -r '.severeReceiverDepletion.n' "$out")"
            echo "- v1.2 margin MAE: $(jq -r '.all.baselineMarginMAE // "not available"' "$out")"
            echo "- v1.3 margin MAE: $(jq -r '.all.challengerMarginMAE // "not available"' "$out")"
            echo "- promotion authority: none"
          } >> "$GITHUB_STEP_SUMMARY"
