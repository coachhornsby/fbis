name: Sport migration qualify (shadow + NFL cutover rehearsal)

# Produces parity/lag/cutover-rehearsal receipts. Never activates sport authority.
# Never deletes source rows. Agents cannot workflow_dispatch (403) — touch trigger.
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/triggers/sport-migration-qualify"
      - ".github/workflows/sport-migration-qualify.yml"
      - "scripts/sport-migration-qualify-ops.mjs"
      - "scripts/sport-sync-health-ops.mjs"
      - "functions/lib/sportMigrationQualify.js"

permissions:
  contents: read

concurrency:
  group: fbis-sport-migration-qualify-v1
  cancel-in-progress: false

jobs:
  health-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Install undici for long topology fetches
        if: github.event_name != 'pull_request'
        run: npm install --no-save --no-package-lock undici@7.29.0
      - name: Unit-test migration qualify contracts
        run: node --test test/sport-migration-qualify.test.js
      - name: Wait until production contains this qualify change
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --prune
          for i in $(seq 1 60); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)-$i" || true)"
            if [ "$code" = "200" ]; then
              while IFS= read -r prod_sha; do
                [ -n "$prod_sha" ] || continue
                if git cat-file -e "$prod_sha^{commit}" 2>/dev/null \
                  && git merge-base --is-ancestor "$EXPECTED_SHA" "$prod_sha"; then
                  echo "production_contains=$EXPECTED_SHA deployed_sha=$prod_sha"
                  exit 0
                fi
              done < <(jq -r '.. | strings | select(test("^[0-9a-f]{40}$"))' "$body" 2>/dev/null | sort -u)
            fi
            sleep 6
          done
          echo "Production never reached this commit or a descendant inside the bounded gate."
          exit 1
      - name: All-sport sync health rollup
        if: github.event_name != 'pull_request'
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE_URL: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/sport-sync-health-ops.mjs | tee artifacts/sport-sync-health-all.json
          jq -e '.ok==true and .allProductPrimary==true and .cutoverAuthorized==false' \
            artifacts/sport-sync-health-all.json >/dev/null
      - uses: actions/upload-artifact@v4.6.2
        if: always() && github.event_name != 'pull_request'
        with:
          name: sport-sync-health-all
          path: artifacts/sport-sync-health-all.json
          if-no-files-found: ignore
          retention-days: 30

  qualify-wave1:
    needs: health-all
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Delta sync runs in sport-delta-sync-recurring; qualify verifies + rehearses.
          - sport: nfl
            cutover: "true"
            run_delta: "false"
          - sport: cfb
            cutover: "true"
            run_delta: "false"
          - sport: nhl
            cutover: "true"
            run_delta: "false"
          - sport: nba
            cutover: "false"
            run_delta: "false"
          - sport: mlb
            cutover: "false"
            run_delta: "false"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - name: Install undici for long topology fetches
        if: github.event_name != 'pull_request'
        run: npm install --no-save --no-package-lock undici@7.29.0
      - name: Wait until production contains this qualify change
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --prune
          for i in $(seq 1 60); do
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)-$i" || true)"
            if [ "$code" = "200" ]; then
              while IFS= read -r prod_sha; do
                [ -n "$prod_sha" ] || continue
                if git cat-file -e "$prod_sha^{commit}" 2>/dev/null \
                  && git merge-base --is-ancestor "$EXPECTED_SHA" "$prod_sha"; then
                  echo "production_contains=$EXPECTED_SHA deployed_sha=$prod_sha"
                  exit 0
                fi
              done < <(jq -r '.. | strings | select(test("^[0-9a-f]{40}$"))' "$body" 2>/dev/null | sort -u)
            fi
            sleep 6
          done
          echo "Production never reached this commit or a descendant inside the bounded gate."
          exit 1
      - name: Qualify ${{ matrix.sport }} (shadow; cutover rehearsal gated)
        if: github.event_name != 'pull_request'
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE_URL: https://fbis-myz.pages.dev
          SPORT: ${{ matrix.sport }}
          RUN_DELTA_SYNC: ${{ matrix.run_delta }}
          RUN_CUTOVER_REHEARSAL: ${{ matrix.cutover }}
          SAMPLE_SIZE: "40"
          QUALIFY_TIMEOUT_MS: "480000"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/sport-migration-qualify-ops.mjs | tee "artifacts/sport-qualify-${SPORT}.json"
          # When cutover rehearsal is on, readyForCutoverReview + rehearsal must pass.
          # When cutover is off, require working/prefix gates without claiming cutover-ready.
          if [ "${RUN_CUTOVER_REHEARSAL}" = "true" ]; then
            jq -e '
              .ok==true
              and .readyForCutoverReview==true
              and .gates.cutoverRehearsal==true
              and .cutoverAuthorized==false
              and .deletionAuthorized==false
              and .activationPerformed==false
              and .canAuthorizeWager==false
            ' "artifacts/sport-qualify-${SPORT}.json" >/dev/null
          else
            jq -e '
              .ok==true
              and .gates.countParity==true
              and .gates.recordParity==true
              and .gates.productStillPrimary==true
              and .cutoverAuthorized==false
              and .deletionAuthorized==false
              and .activationPerformed==false
              and .canAuthorizeWager==false
            ' "artifacts/sport-qualify-${SPORT}.json" >/dev/null
          fi
      - uses: actions/upload-artifact@v4.6.2
        if: always() && github.event_name != 'pull_request'
        with:
          name: sport-qualify-${{ matrix.sport }}
          path: artifacts/sport-qualify-${{ matrix.sport }}.json
          if-no-files-found: ignore
          retention-days: 30
