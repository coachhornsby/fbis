name: Tennis targeted Polymarket US market refresh
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/tennis-us-targeted-refresh.mjs
      - .github/workflows/tennis-us-targeted-refresh.yml
permissions:
  contents: read
concurrency:
  group: fbis-tennis-us-market-targeted
  cancel-in-progress: false
jobs:
  tennis_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify running production Pages before harvesting
        if: github.event_name == 'push'
        env:
          VERIFY_MODE: resolve-live
        run: node scripts/verify-deployment-sha.mjs
      - name: Validate targeted collector syntax
        run: node --check scripts/tennis-us-targeted-refresh.mjs
      - name: Refresh only independently verified and projected Tennis events
        run: node scripts/tennis-us-targeted-refresh.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-us-market-refresh-${{ github.run_id }}
          path: artifacts/tennis-us-market-refresh.json
          if-no-files-found: warn
          retention-days: 14
