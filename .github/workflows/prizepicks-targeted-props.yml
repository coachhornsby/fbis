name: PrizePicks curated prop lines
# payload-safe persistence

on:
  schedule:
    # GitHub cron is UTC. Redundant delivery windows cover 08:05-10:35 Chicago
    # across CDT/CST. The durable CT-day reservation remains the spend authority.
    - cron: "5,35 13,14,15,16 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/prizepicks-targeted-props.yml"]
  # Manual dispatch is retained for explicit operator recovery.
  workflow_dispatch:

concurrency:
  group: prizepicks-curated-props
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - name: Require credentials
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET:-}"
          test -n "${APIFY_TOKEN:-}"

      - name: Wait for production API after code push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          expected="$(echo "${GITHUB_SHA}" | tr 'A-F' 'a-f')"
          for i in $(seq 1 36); do
            health="$(mktemp)"
            hcode="$(curl -sS --max-time 20 -o "$health" -w "%{http_code}" "$BASE/api/health?_t=$(date +%s)-$i" || true)"
            live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$health" 2>/dev/null | tr 'A-F' 'a-f')"
            code="$(curl -sS --max-time 20 -o /tmp/budget.json -w "%{http_code}" \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              "$BASE/api/prizepicks-props?mode=budget&_t=$(date +%s)-$i" || true)"
            if [ "$hcode" = "200" ] && [ "$code" = "200" ] && jq -e '.targetMonthlyUsd == 22 and .hardMonthlyCapUsd == 25' /tmp/budget.json >/dev/null 2>&1; then
              echo "production API ready: live=${live:-unknown} trigger=$expected"
              cat /tmp/budget.json
              exit 0
            fi
            echo "waiting for production SHA/API attempt=$i/36 health=$hcode live=${live:-none} expected=$expected budget=$code"
            sleep 10
          done
          echo "PrizePicks collection blocked: production API/budget endpoint did not become healthy"
          exit 1

      - name: Shared monthly budget gate
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS --max-time 30 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -o "$body" -w "%{http_code}" \
            "$BASE/api/prizepicks-props?mode=budget&_t=$(date +%s)")"
          cat "$body"
          test "$code" = "200"
          remaining_target="$(jq -r '.remainingToTargetUsd // 0' "$body")"
          remaining_hard="$(jq -r '.remainingUsd // 0' "$body")"
          awk -v t="$remaining_target" -v h="$remaining_hard" 'BEGIN { if (t < 1.00 || h < 1.00) exit 1 }' || {
            echo "Routine PrizePicks pull skipped: shared Apify budget reserve protected."
            echo "SKIP_COLLECTION=1" >> "$GITHUB_ENV"
            exit 0
          }

      - name: Recover an existing reserved acquisition without another paid Actor call
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          state_json="$(mktemp)"
          curl -fsS --max-time 30 -H "x-harvest-secret: ${HARVEST_SECRET}" "$BASE/api/prizepicks-props?mode=acquisition&_t=$(date +%s)" > "$state_json"
          state="$(jq -r '.acquisition.state // ""' "$state_json")"
          existing_run="$(jq -r '.acquisition.run_id // ""' "$state_json")"
          if [ "$state" != "RESERVED" ] || [ -z "$existing_run" ]; then
            echo "RECOVER_ARTIFACT=0" >> "$GITHUB_ENV"
            exit 0
          fi
          source_run="${existing_run##*_}"
          artifacts_json="$(mktemp)"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${source_run}/artifacts" > "$artifacts_json"
          artifact_id="$(jq -r --arg n "prizepicks-curated-${source_run}" '.artifacts[] | select(.name==$n) | .id' "$artifacts_json" | head -1)"
          test -n "$artifact_id"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o /tmp/pp-recovery.zip
          unzip -o /tmp/pp-recovery.zip -d artifacts >/dev/null
          test -s artifacts/prizepicks-rows.json
          test -s artifacts/candidates.json
          echo "PP_RUN_ID=$existing_run" >> "$GITHUB_ENV"
          echo "RECOVER_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "Recovered reserved acquisition artifact from run $source_run; no Actor call will be made."

      - name: Reserve today's single paid PrizePicks acquisition
        if: env.SKIP_COLLECTION != '1' && env.RECOVER_ARTIFACT != '1'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          run_id="pp_$(TZ=America/Chicago date +%Y%m%d)_${GITHUB_RUN_ID}"
          body="$(mktemp)"
          payload="$(jq -nc --arg runId "$run_id" '{operation:"reserve",runId:$runId}')"
          code="$(curl -sS --max-time 30 -X POST -H "x-harvest-secret: ${HARVEST_SECRET}" -H "content-type: application/json" --data-binary "$payload" -o "$body" -w "%{http_code}" "$BASE/api/prizepicks-props")"
          cat "$body"
          if [ "$code" = "409" ] && jq -e '.error=="ALREADY_COLLECTED_TODAY"' "$body" >/dev/null 2>&1; then
            state_json="$(mktemp)"
            curl -fsS --max-time 30 -H "x-harvest-secret: ${HARVEST_SECRET}" "$BASE/api/prizepicks-props?mode=acquisition&_t=$(date +%s)" > "$state_json"
            covered="$(jq -r '[.coverage[].sport] | join(",")' "$state_json")"
            run_id="pprepair_$(TZ=America/Chicago date +%Y%m%d)_${GITHUB_RUN_ID}"
            echo "PrizePicks primary acquisition exists; running coverage repair only. covered=${covered:-none}"
            echo "PP_RUN_ID=$run_id" >> "$GITHUB_ENV"
            echo "COVERAGE_REPAIR=1" >> "$GITHUB_ENV"
            echo "PP_COVERED_SPORTS=$covered" >> "$GITHUB_ENV"
            exit 0
          fi
          test "$code" = "200"
          jq -e '.ok==true and .reserved==true' "$body" >/dev/null
          echo "PP_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Build FBIS candidate map
        if: env.SKIP_COLLECTION != '1' && env.RECOVER_ARTIFACT != '1'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/candidates.ndjson
          today="$(TZ=America/Chicago date +%F)"
          # Only sports with the current durable player-projection contract need candidate matching.
          # Research-only sports still ingest below without blocking on projection APIs.
          for sport in mlb cfb cbb nfl nhl; do
            for date in "$today"; do
              tmp="$(mktemp)"
              code="$(curl -sS --max-time 90 -o "$tmp" -w "%{http_code}" "$BASE/api/projections?sport=$sport&date=$date&_t=$(date +%s)" || true)"
              echo "projection candidates sport=$sport date=$date http=$code"
              if [ "$code" != "200" ]; then continue; fi
              jq --arg sport "$sport" -c '
                (.games // [])[] as $g
                | (($g.playerProjections.rows // [])[])
                | select(.playerName != null and .market != null and .fbisProjection != null)
                | {
                    sport:$sport,
                    eventId:($g.id|tostring),
                    playerName:.playerName,
                    team:(.team // null),
                    home:($g.home.abbr // $g.home.name // null),
                    away:($g.away.abbr // $g.away.name // null),
                    start:($g.start // $g.startCt // null),
                    market:.market,
                    fbisProjection:.fbisProjection,
                    fbisSigma:(.fbisSigma // null),
                    modelSource:(.source // null),
                    modelVersion:(.modelVersion // null),
                    validationStatus:(.validationStatus // null),
                    validatedPredictive:(.validatedPredictive // false),
                    dataQuality:(.dataQuality // null),
                    projectedMinutes:(.projectedMinutes // null),
                    playerId:(.playerId // null)
                  }' "$tmp" >> artifacts/candidates.ndjson || true
            done
          done
          # NBA candidates come from the validated prospective shadow tables.
          # This reuses today's single paid PrizePicks acquisition; it never starts another Actor run.
          nba_tmp="$(mktemp)"
          nba_code="$(curl -sS --max-time 45 -o "$nba_tmp" -w "%{http_code}" "$BASE/api/nba-shadow-props?_t=$(date +%s)" || true)"
          echo "NBA shadow candidates http=$nba_code"
          if [ "$nba_code" = "200" ]; then
            jq -c '
              (.rows // [])[]
              | select(.playerName != null and .market != null and .fbisProjection != null and .canQualify == true)
              | {
                  sport:"nba",
                  eventId:(.eventId|tostring),
                  playerName:.playerName,
                  team:(.team // null),
                  home:null,
                  away:null,
                  start:(.start // null),
                  market:.market,
                  fbisProjection:.fbisProjection,
                  fbisSigma:(.fbisSigma // null),
                  modelVersion:(.modelVersion // null),
                  validationStatus:"PROSPECTIVE_VALIDATION",
                  validatedPredictive:true,
                  dataQuality:null,
                  projectedMinutes:(.projectedMinutes // null),
                  playerId:(.playerId // null)
                }' "$nba_tmp" >> artifacts/candidates.ndjson || true
          fi
          if [ -s artifacts/candidates.ndjson ]; then
            jq -s 'unique_by([.sport,.eventId,.playerName,.market])' artifacts/candidates.ndjson > artifacts/candidates.json
          else
            echo '[]' > artifacts/candidates.json
          fi
          echo "FBIS candidates=$(jq 'length' artifacts/candidates.json)"
          echo "NBA candidates=$(jq '[.[]|select(.sport=="nba")]|length' artifacts/candidates.json)"

      - name: Pull full PrizePicks board once
        if: env.SKIP_COLLECTION != '1' && env.RECOVER_ARTIFACT != '1'
        run: |
          set -euo pipefail
          actor_url="https://api.apify.com/v2/acts/zen-studio~prizepicks-player-props/run-sync-get-dataset-items?format=json&clean=true"
          wanted=("MLB" "NFL" "NHL" "NBA" "College Basketball" "CFB" "Soccer" "Tennis")
          discover="$(mktemp)"
          dcode="$(curl -sS --max-time 120 -X POST -H "Authorization: Bearer ${APIFY_TOKEN}" -H "content-type: application/json" --data-binary '{"listLeagues":true}' -o "$discover" -w "%{http_code}" "$actor_url")"
          case "$dcode" in 200|201) ;; *) echo "PrizePicks league discovery failed HTTP $dcode"; cat "$discover"; exit 1 ;; esac
          jq -e 'type=="array"' "$discover" >/dev/null
          cp "$discover" artifacts/prizepicks-live-leagues.json
          : > artifacts/prizepicks-rows.ndjson
          : > artifacts/prizepicks-coverage.ndjson
          for league in "${wanted[@]}"; do
            # Discovery rows vary by actor version; accept common league/name fields.
            sport_key="$(case "$league" in "College Basketball") echo cbb;; CFB) echo cfb;; *) echo "$league" | tr '[:upper:]' '[:lower:]';; esac)"
            if [ "${COVERAGE_REPAIR:-0}" = "1" ] && echo ",${PP_COVERED_SPORTS:-}," | grep -q ",$sport_key,"; then
              echo "coverage league=$league already persisted; repair skip"
              continue
            fi
            live_present="$(jq -r --arg l "$league" '[.[] | select((if type=="string" then . else (.league // .name // .league_name // "") end) == $l)] | length' "$discover")"
            if [ "$live_present" = "0" ]; then
              echo "coverage league=$league not advertised by discovery; probing directly"
            else
              echo "coverage league=$league advertised by discovery"
            fi
            input="$(jq -nc --arg league "$league" '{leagues:[$league]}')"
            body="$(mktemp)"
            code="$(curl -sS --max-time 240 -X POST -H "Authorization: Bearer ${APIFY_TOKEN}" -H "content-type: application/json" --data-binary "$input" -o "$body" -w "%{http_code}" "$actor_url")"
            case "$code" in 200|201) ;; *) echo "PrizePicks league pull failed league=$league HTTP $code"; cat "$body"; exit 1 ;; esac
            jq -e 'type=="array"' "$body" >/dev/null
            n="$(jq 'length' "$body")"
            echo "coverage league=$league advertised=$live_present rows=$n"
            if [ "$n" -eq 0 ]; then
              jq -nc --arg league "$league" --argjson advertised "$live_present" '{league:$league,expected:($advertised>0),advertised:$advertised,rows:0}' >> artifacts/prizepicks-coverage.ndjson
              continue
            fi
            jq -c '.[]' "$body" >> artifacts/prizepicks-rows.ndjson
            jq -nc --arg league "$league" --argjson live "$live_present" --argjson rows "$n" '{league:$league,expected:true,liveCount:$live,rows:$rows}' >> artifacts/prizepicks-coverage.ndjson
          done
          jq -s 'unique_by(.projection_id // .id // [(.league // .player_league),(.player_name // .playerName),(.stat_type // .stat),(.line // .value),(.odds_type // .oddsTier)])' artifacts/prizepicks-rows.ndjson > artifacts/prizepicks-rows.json
          jq -s '.' artifacts/prizepicks-coverage.ndjson > artifacts/prizepicks-coverage.json
          rows="$(jq 'length' artifacts/prizepicks-rows.json)"
          echo "complete-board rows=$rows"
          jq -e '[.[] | select(.expected==true and .rows==0)] | length == 0' artifacts/prizepicks-coverage.json >/dev/null
          test "$rows" -gt 0
      - name: Persist curated PrizePicks lines
        if: env.SKIP_COLLECTION != '1'
        run: |
          set -euo pipefail
          run_id="${PP_RUN_ID:?daily acquisition reservation missing}"
          payload="$(mktemp)"
          jq -n \
            --arg runId "$run_id" \
            --slurpfile rows artifacts/prizepicks-rows.json \
            --slurpfile candidates artifacts/candidates.json \
            --arg operation "${COVERAGE_REPAIR:+supplemental_coverage}" \
            '{runId:$runId,operation:(if $operation=="" then null else $operation end),rows:$rows[0],candidates:$candidates[0]}' > "$payload"
          body="$(mktemp)"
          code="$(curl -sS --max-time 120 -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            --data-binary "@$payload" \
            -o "$body" -w "%{http_code}" \
            "$BASE/api/prizepicks-props")"
          cat "$body"
          test "$code" = "200"
          jq -e '.ok==true and .written>0' "$body" >/dev/null
          cp "$body" artifacts/persist-result.json

      - name: Verify live PrizePicks readback
        if: env.SKIP_COLLECTION != '1'
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 "$BASE/api/prizepicks-props?limit=500&_t=$(date +%s)" > artifacts/readback.json
          jq -e '.ok==true and .count>0 and (.rows|length)>0' artifacts/readback.json >/dev/null
          {
            echo "## PrizePicks curated feed"
            echo "- FBIS candidates: $(jq 'length' artifacts/candidates.json)"
            echo "- Actor rows: $(jq 'length' artifacts/prizepicks-rows.json)"
            echo "- Persisted: $(jq -r '.written' artifacts/persist-result.json)"
            echo "- Matched to FBIS: $(jq -r '.matched' artifacts/persist-result.json)"
            echo "- Estimated Actor cost: $$(jq -r '.estimatedCostUsd' artifacts/persist-result.json)"
            echo "- Live readback rows: $(jq -r '.count' artifacts/readback.json)"
            echo "- Sports: $(jq -r '[.rows[].sport]|unique|join(", ")' artifacts/readback.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP_COLLECTION != '1'
        with:
          name: prizepicks-curated-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
# operator-trigger: 2026-10-04 daily Zen recovery
# incident-recovery: 2026-10-05 missing scheduled acquisition
# operator-recovery: 2026-10-05 coverage repair after Apify limit increase
# incident-recovery-valid-trigger: 2026-10-05 full league coverage
