name: Emergency cost-stop cancellation
on:
  push:
    paths:
      - .github/workflows/emergency-cost-stop.yml
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel runs that did not stop
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          root='https://api.github.com/repos/'+os.environ['REPOSITORY']
          def api(path,method='GET'):
              req=urllib.request.Request(root+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  if e.code==409 and path.endswith('/force-cancel'): return {}
                  raise
          runs=[]
          for status in ['in_progress','queued','waiting','pending','requested']:
              page=1
              while True:
                  batch=api('/actions/runs?status='+status+'&per_page=100&page='+str(page)).get('workflow_runs',[])
                  runs+=batch
                  if len(batch)<100:break
                  page+=1
          for r in {r['id']:r for r in runs}.values():
              if str(r['id'])==os.environ['CURRENT_RUN']:continue
              api('/actions/runs/'+str(r['id'])+'/force-cancel','POST')
              print('Cancellation requested:',r['id'],r['name'])
          print('Emergency force-cancellation pass complete')
          PY
