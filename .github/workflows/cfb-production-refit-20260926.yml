name: CFB Production Refit 2026-09-26

on:
  push:
    paths:
      - ".github/workflows/cfb-production-refit-20260926.yml"

permissions:
  contents: write

concurrency:
  group: cfb-production-refit-20260926
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Preflight regression tests
        run: |
          set -euo pipefail
          node --test test/cfb-deep-feed.test.js test/cfb-fbis-v2-fit.test.js

      - name: Rebuild strict point-in-time 2022-2025 feature snapshots
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_BACKFILL_SEASONS: "2022,2023,2024,2025"
          CFB_BACKFILL_MODE: historical
          CFB_BACKFILL_PLAYER_ROLES: "0"
          CFB_ABLATIONS: "A,B,C,D,E,F,G,H,I,J,K"
        run: |
          set -euo pipefail
          test -n "${CFBD_API_KEY:-}"
          node scripts/cfb-feature-backfill.mjs
          jq -e '.leakage.acceptedTemporalViolations == 0 and .leakage.postCutoffRejections == 0' artifacts/cfb-fbis-v2-backfill-report.json >/dev/null
          jq -e '.counts.provenancePass >= 1000' artifacts/cfb-fbis-v2-backfill-report.json >/dev/null

      - name: Refit A-K margin and total with corrected feature contract
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_CALIBRATE_SEASONS: "2022,2023,2024,2025"
          CFB_FINAL_SKIP_REBUILD: "0"
          CFB_FINAL_FORCE_REBUILD: "1"
        run: |
          set -euo pipefail
          cp data/cfbd/calibration/final-select-report.json /tmp/old-final-select.json
          node scripts/cfb-v2-final-select.mjs
          jq -e '.eligibleDesignN >= 1000' data/cfbd/calibration/final-select-report.json >/dev/null
          jq -e '.cutoverRecommendation.gameProjectionEngine == "CUTOVER"' data/cfbd/calibration/final-select-report.json >/dev/null
          echo "## Refit selection" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- M*: \(.marginSelection.Mstar)\n- T*: \(.totalSelection.Tstar)\n- OOS N: \(.combinedMT.metrics.n)\n- margin MAE: \(.combinedMT.metrics.maeMargin)\n- total MAE: \(.combinedMT.metrics.maeTotal)\n- margin RMSE: \(.combinedMT.metrics.rmseMargin)\n- total RMSE: \(.combinedMT.metrics.rmseTotal)"' data/cfbd/calibration/final-select-report.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Previous artifact (for comparison only; serving contract was invalid)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- old M*: \(.marginSelection.Mstar)\n- old T*: \(.totalSelection.Tstar)\n- old margin MAE: \(.combinedMT.metrics.maeMargin)\n- old total MAE: \(.combinedMT.metrics.maeTotal)"' /tmp/old-final-select.json >> "$GITHUB_STEP_SUMMARY"

      - name: Package selected production model
        run: |
          set -euo pipefail
          node scripts/cfb-v2-package-production.mjs
          jq -e '.canQualify == false and .canAuthorize == false and .featureContract == "ppa-derived-base-v2"' data/models/cfb-fbis-v2-fitted-aa.json >/dev/null

      - name: Validate fitted production
        run: |
          set -euo pipefail
          node --test test/cfb-fbis-v2-fit.test.js test/cfb-deep-feed.test.js test/cfb-v2-production-cutover.test.js test/cfb-v2-production-cutover.test.js test/cfb-saturday-regressions.test.js
          npm test -- --runInBand 2>/dev/null || npm test

      - name: Persist refit artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/cfb-fbis-v2-design-rows.jsonl data/cfbd/calibration/design-rows.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/models/cfb-fbis-v2-fitted-aa.js             data/models/cfb-fbis-v2-fitted-aa.json             data/cfbd/calibration/             data/cfbd/backfills/2022-2025-historical-summary.json
          if git diff --cached --quiet; then
            echo "No generated refit changes to commit."
            exit 0
          fi
          git commit -m "Refit CFB production model on corrected CFBD contract"
          git push origin HEAD:main

      - name: Upload refit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-production-refit-20260926
          path: |
            artifacts/cfb-fbis-v2-backfill-report.json
            artifacts/cfb-v2-final-select-report.json
            artifacts/cfb-v2-feature-activation-fitted.json
            artifacts/cfb-v2-fitted-coefficients-final.json
            artifacts/cfb-v2-final-select-hashes.json
          if-no-files-found: ignore
          retention-days: 14
