name: Diagnose final reconciliation

on:
  push:
    branches:
      - diag/final-match-20260928

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Diagnose unresolved snapshot/final candidates
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          FBIS_BASE: https://fbis-myz.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.json"
          curl -fsS --max-time 180 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            "${FBIS_BASE}/api/learning-report?since=2026-01-01&limit=5000" > "$report"

          for spec in "cfb 2026-09-03" "cfb 2026-09-04" "cfb 2026-09-06" "cfb 2026-09-12" "cfb 2026-09-19" "cfb 2026-09-25" "cfb 2026-09-26" "mlb 2026-09-22" "mlb 2026-09-25" "mlb 2026-09-27"; do
            sport="${spec%% *}"
            date="${spec##* }"
            payload="$RUNNER_TEMP/${sport}-${date}.json"
            node scripts/fetch-final-scoreboard.mjs "$sport" "$date" > "$payload"
            echo "=== ${sport} ${date} ==="
            SPORT="$sport" DATE="$date" REPORT="$report" FINALS="$payload" node --input-type=module <<'NODE'
import fs from "node:fs";
const report=JSON.parse(fs.readFileSync(process.env.REPORT,"utf8"));
const payload=JSON.parse(fs.readFileSync(process.env.FINALS,"utf8"));
const sport=process.env.SPORT.toUpperCase();
const date=process.env.DATE;
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const snaps=(report.audit||[]).filter(r=>String(r.sport||"").toUpperCase()===sport && !r.actualHome && !r.actualAway);
const finals=payload.finals||[];
for(const s of snaps){
  const st=Date.parse(s.start||"");
  if(!Number.isFinite(st)) continue;
  const exactTime=finals.filter(f=>Math.abs(Date.parse(f.start||"")-st)<=10*60*1000);
  if(!exactTime.length) continue;
  const matchup=String(s.matchup||"").split("@").map(x=>x.trim());
  const sa=matchup[0]||"", sh=matchup[1]||"";
  const scored=exactTime.map(f=>{
    const fa=f.away?.name||f.away?.abbr||"", fh=f.home?.name||f.home?.abbr||"";
    const score=(norm(sa)===norm(fa)?1:0)+(norm(sh)===norm(fh)?1:0);
    return {f,score};
  }).sort((a,b)=>b.score-a.score);
  const best=scored[0];
  console.log(JSON.stringify({
    gameId:s.gameId,date:s.date,start:s.start,matchup:s.matchup,
    candidateCount:exactTime.length,
    bestExactSides:best?.score||0,
    final:best?{
      id:best.f.id,start:best.f.start,
      away:best.f.away?.name||best.f.away?.abbr,
      home:best.f.home?.name||best.f.home?.abbr,
      awayScore:best.f.away?.score??best.f.awayScore,
      homeScore:best.f.home?.score??best.f.homeScore
    }:null
  }));
}
NODE
          done
