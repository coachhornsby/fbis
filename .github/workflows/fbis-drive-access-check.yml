name: FBIS Drive Access Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-drive-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Google Drive credentials and folder visibility (read only)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FBIS_DATA_FOLDER_ID: ${{ vars.FBIS_DATA_FOLDER_ID }}
        run: |
          python -m pip install --disable-pip-version-check --quiet google-auth requests
          python - <<'PY'
          import os, sys, requests
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          keys = ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_REFRESH_TOKEN", "FBIS_DATA_FOLDER_ID")
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              print("CONFIGURATION_MISSING:", ", ".join(missing))
              sys.exit(1)
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )
          try:
              credentials.refresh(Request())
          except Exception as exc:
              print("OAUTH_REFRESH_FAILED:", type(exc).__name__)
              sys.exit(1)
          print("OAUTH_REFRESH_OK")
          try:
              response = requests.get(
                  "https://www.googleapis.com/drive/v3/files/" + os.environ["FBIS_DATA_FOLDER_ID"],
                  params={"fields": "id,name,mimeType", "supportsAllDrives": "true"},
                  headers={"Authorization": "Bearer " + credentials.token},
                  timeout=20,
              )
          except requests.RequestException as exc:
              print("DRIVE_REQUEST_FAILED:", type(exc).__name__)
              sys.exit(1)
          if response.status_code == 200:
              data = response.json()
              if data.get("mimeType") != "application/vnd.google-apps.folder":
                  print("TARGET_NOT_A_FOLDER")
                  sys.exit(1)
              print("DRIVE_FOLDER_READ_OK:", data.get("name", "(unnamed)"))
          elif response.status_code == 404:
              print("DRIVE_FOLDER_NOT_ACCESSIBLE: Pre-existing folders are not automatically accessible under drive.file.")
              sys.exit(1)
          else:
              print("DRIVE_FOLDER_CHECK_FAILED: HTTP", response.status_code)
              sys.exit(1)
          PY
