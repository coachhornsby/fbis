name: Tennis official prospective settlement and promotion evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tennis-prospective-promotion-evidence.yml"
  schedule:
    - cron: '43 2,8,14,20 * * *'
permissions:
  contents: read
concurrency:
  group: tennis-official-prospective-settlement
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://fbis-myz.pages.dev
      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - name: Require source-authenticated execution credentials
        run: test -n "${HARVEST_SECRET:-}"
      - name: Wait for an authoritative live production descendant
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            echo "Production lineage verification attempt $attempt/20"
            if receipt="$(VERIFY_MODE=resolve-live node scripts/verify-deployment-sha.mjs)"; then
              echo "$receipt"
              if live_sha="$(printf '%s' "$receipt" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(r.outcome!=='match'||!(/^[0-9a-f]{40}$/.test(r.productionSha||'')))process.exit(1);process.stdout.write(r.productionSha)})")"; then
                git fetch --no-tags --depth=64 origin main
                if git cat-file -e "$live_sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$live_sha"; then
                  echo "Verified release ancestor $GITHUB_SHA in live production $live_sha"
                  exit 0
                fi
                echo "Production $live_sha does not yet include promotion code commit $GITHUB_SHA"
              fi
            fi
            if [ "$attempt" -lt 20 ]; then sleep 20; fi
          done
          echo "LIVE_PRODUCTION_MISSING_TENNIS_PROMOTION_CODE_AFTER_BOUNDED_WAIT"
          exit 1
      - name: Verify current official WTA completed singles and grade eligible PURE snapshots
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail-with-body --max-time 180 -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            "${BASE}/api/tennis-official-outcome-reconcile" > artifacts/tennis-official-settlement.json
          jq -e '.ok == true and .researchOnly == true and .canAuthorizeWager == false' artifacts/tennis-official-settlement.json
          jq '{asOf,tournamentsExamined,resultsWritten,graded,errors}' artifacts/tennis-official-settlement.json
      - name: Read back prospective promotion certificate
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail-with-body --max-time 90 \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            "${BASE}/api/tennis-promotion-readiness" > artifacts/tennis-promotion-readiness.json
          jq -e '.ok == true and .canAuthorizeWager == false and .productionWrites == 0' artifacts/tennis-promotion-readiness.json
          jq '{asOf,status,promotionReady,cohorts,sourceRights,blockedReasons}' artifacts/tennis-promotion-readiness.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tennis-prospective-promotion-evidence
          path: artifacts/tennis-*.json
          retention-days: 30
          if-no-files-found: warn
