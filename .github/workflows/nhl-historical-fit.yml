name: NHL historical model fit

on:
  schedule:
    - cron: "30 10 15 7 *"
  push:
    branches: [main]
    paths:
      - "scripts/nhl-historical-fit.mjs"
      - ".github/workflows/nhl-historical-fit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fit:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'data: fit NHL historical xG and goalie priors' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fit NHL xG and goalie priors
        run: |
          set -euo pipefail
          node scripts/nhl-historical-fit.mjs \
            --seasons=20232024,20242025,20252026 \
            --concurrency=12 \
            --out=data/models/nhl-fbis-v1.js

      - name: Verify fitted artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"trained": true' data/models/nhl-fbis-v1.js
          grep -q '"validationShots":' data/models/nhl-fbis-v1.js
          grep -q '"expectedGoalieByTeam":' data/models/nhl-fbis-v1.js
          node --check data/models/nhl-fbis-v1.js
          node --test test/nhl-fbis-v1.test.js

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nhl-fbis-v1-historical-fit
          path: data/models/nhl-fbis-v1.js
          retention-days: 30

      - name: Commit fitted artifact
        shell: bash
        run: |
          set -euo pipefail
          cp data/models/nhl-fbis-v1.js "$RUNNER_TEMP/nhl-fbis-v1.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            cp "$RUNNER_TEMP/nhl-fbis-v1.js" data/models/nhl-fbis-v1.js
            git add data/models/nhl-fbis-v1.js

            if git diff --cached --quiet -- data/models/nhl-fbis-v1.js; then
              echo "artifact unchanged"
              exit 0
            fi

            git commit -m "data: fit NHL historical xG and goalie priors"
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi

            echo "artifact push raced with another main update; retrying (${attempt}/3)"
            sleep $((attempt * 2))
          done

          echo "failed to persist NHL historical artifact after 3 attempts"
          exit 1
