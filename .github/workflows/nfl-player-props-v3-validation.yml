name: NFL player props v3 walk-forward

on:
  push:
    branches: ["nfl-props-v3-validation"]
    paths:
      - "scripts/nfl-player-props-v3-walkforward.py"
      - ".github/workflows/nfl-player-props-v3-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-player-props-v3-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run NFL player prop v3 walk-forward grid
        run: python scripts/nfl-player-props-v3-walkforward.py
      - name: Validation summary
        run: jq '{observations,players,configsTested,bestGlobal,bestByMarket,recent2025PlusTop10}' artifacts/nfl-player-props-v3/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-player-props-v3-validation-${{ github.run_id }}
          path: artifacts/nfl-player-props-v3/*
          retention-days: 90
