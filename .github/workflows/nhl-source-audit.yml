name: NHL source audit

on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/nhl-source-audit.mjs"
      - "functions/lib/nhlDataSources.js"
      - ".github/workflows/nhl-source-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit NHL live and archive sources
        run: node scripts/nhl-source-audit.mjs --out=artifacts/nhl-source-audit.json
      - name: Summary
        if: always()
        run: |
          if [ -f artifacts/nhl-source-audit.json ]; then
            echo "## NHL source audit" >> "$GITHUB_STEP_SUMMARY"
            echo "- overall: $(jq -r '.overall' artifacts/nhl-source-audit.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- live primary: $(jq -r '.livePrimary.status' artifacts/nhl-source-audit.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- NHL EDGE: $(jq -r '.livePrimary.edgeStatus // "UNKNOWN"' artifacts/nhl-source-audit.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- SportsDataverse: $(jq -r '.sportsDataverse.status' artifacts/nhl-source-audit.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "- stale archive tags: $(jq -r '.sportsDataverse.staleTags | length' artifacts/nhl-source-audit.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: nhl-source-audit-${{ github.run_id }}
          path: artifacts/nhl-source-audit.json
          if-no-files-found: ignore
          retention-days: 30
