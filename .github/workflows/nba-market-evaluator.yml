name: NBA prospective market evaluator

on:
  workflow_dispatch:
  push:
    branches: [main, "research/nba-fbis-v1"]
    paths:
      - "scripts/nba-market-evaluate.mjs"
      - "functions/lib/nbaQualification.js"
      - ".github/workflows/nba-market-evaluator.yml"
  schedule:
    - cron: "45 15 * * *"

permissions:
  contents: read

concurrency:
  group: nba-market-evaluator
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Load current-season settled NBA canonical state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/current
          npx wrangler r2 object get             "fbis-archive/canonical/espn/nba/2026-27/current/nba-canonical.jsonl"             --file artifacts/current/nba-canonical.jsonl --remote || : > artifacts/current/nba-canonical.jsonl

      - name: Export recent NBA prospective and market rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM nba_game_projections WHERE feature_cutoff_timestamp >= datetime('now','-21 days') ORDER BY feature_cutoff_timestamp ASC"             > artifacts/game-projections.json
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM nba_player_prop_projections WHERE feature_cutoff_timestamp >= datetime('now','-21 days') ORDER BY feature_cutoff_timestamp ASC"             > artifacts/prop-projections.json
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM odds_snapshots WHERE sport='nba' AND captured_at >= datetime('now','-21 days') ORDER BY captured_at ASC"             > artifacts/nba-odds.json
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM prizepicks_prop_lines WHERE sport='nba' AND collected_at >= datetime('now','-21 days') ORDER BY collected_at ASC"             > artifacts/nba-prizepicks.json

      - name: Evaluate entry, close, CLV, result and qualification
        run: |
          node scripts/nba-market-evaluate.mjs

      - name: Apply qualification evidence schema and persist evaluation
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --file=migrations/0041_nba_market_qualification.sql
          npx wrangler d1 execute fbis --remote --file=artifacts/nba-market-evaluation.sql

      - name: Archive evaluator report
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          npx wrangler r2 object put             "fbis-archive/evaluation/nba/prospective/${stamp}.json"             --file artifacts/nba-market-evaluation.json --remote

      - name: Publish evaluator summary
        run: |
          {
            echo "## NBA prospective qualification evaluator"
            jq -r '"- Game evaluations: \(.game.n)"' artifacts/nba-market-evaluation.json
            jq -r '"- Game qualified: \(.game.qualified)"' artifacts/nba-market-evaluation.json
            jq -r '"- Game graded: \(.game.graded)"' artifacts/nba-market-evaluation.json
            jq -r '"- Positive CLV rate: \(.game.positiveClvRate // "n/a")"' artifacts/nba-market-evaluation.json
            jq -r '"- ROI units: \(.game.roiUnits)"' artifacts/nba-market-evaluation.json
            jq -r '"- ROI per qualified graded play: \(.game.roiPct // "n/a")"' artifacts/nba-market-evaluation.json
            jq -r '"- Prop evaluations: \(.props.n)"' artifacts/nba-market-evaluation.json
            jq -r '"- Prop qualified: \(.props.qualified)"' artifacts/nba-market-evaluation.json
            jq -r '"- Qualification state: \(.qualificationState.status)"' artifacts/nba-market-evaluation.json
            echo "- Wager authorization: OFF"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nba-market-evaluation-${{ github.run_id }}
          path: artifacts/nba-market-evaluation.json
          retention-days: 90
