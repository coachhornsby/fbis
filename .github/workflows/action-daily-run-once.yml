name: ACTION daily snapshot one-shot
# controlled production validation for async START + HARVEST

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/action-daily-run-once.yml"

permissions:
  contents: read

concurrency:
  group: action-daily-run-once
  cancel-in-progress: false

jobs:
  run:
    name: RUN ACTION ASYNC CONTROLLED TEST
    runs-on: ubuntu-latest
    steps:
      - name: Require operator secret
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: test -n "${HARVEST_SECRET:-}"

      - name: Start exactly one ACTION run
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          http="$(curl -sS --max-time 30 --retry 0 -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -d '{"mode":"start"}' -o "$body" -w "%{http_code}" \
            "${BASE}/api/action-daily-async?mode=start")"
          echo "START http=${http}"
          cat "$body"
          test "$http" = "202" -o "$http" = "200"
          jq -e '.ok == true' "$body" >/dev/null

      - name: Harvest same ACTION run
        env:
          BASE: "https://fbis-myz.pages.dev"
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(mktemp)"
            http="$(curl -sS --max-time 30 --retry 0 -X POST \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "content-type: application/json" \
              -d '{"mode":"harvest"}' -o "$body" -w "%{http_code}" \
              "${BASE}/api/action-daily-async?mode=harvest")"
            echo "HARVEST attempt=${attempt} http=${http}"
            cat "$body"
            status="$(jq -r '.status // empty' "$body")"
            if [ "$http" = "200" ] && [ "$status" = "success_daily" ]; then exit 0; fi
            if [ "$http" = "202" ] && [ "$status" = "actor_running" ]; then sleep 30; continue; fi
            exit 1
          done
          echo "Actor did not finish inside harvest window; no second paid run was started."
          exit 1
