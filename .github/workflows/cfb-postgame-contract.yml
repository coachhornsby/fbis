name: CFB Offline Postgame Contract
on:
  pull_request:
    paths:
      - scripts/cfb_postgame_rehearsal.py
      - test/cfb-postgame-rehearsal.test.py
      - functions/lib/cfbPostgamePilot.js
      - test/cfb-postgame-pilot.test.js
      - test/cfb-postgame-workerd.integration.mjs
      - docs/sql/cfb-postgame-operational-candidate.sql
      - scripts/cfb-sdv-team-box-normalize.py
      - scripts/cfb-sdv-player-box-normalize.py
      - test/cfb-sdv-opponent-contract.test.py
      - scripts/cfb_postgame_queue.py
      - test/cfb-postgame-queue.test.py
      - .github/workflows/cfb-postgame-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate-atomic-postgame:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Reconcile both cards, players, corrections and immutable snapshots
        run: |
          python test/cfb-postgame-rehearsal.test.py -v
          python test/cfb-postgame-queue.test.py -v
          python test/cfb-sdv-opponent-contract.test.py -v
          node --test test/cfb-postgame-pilot.test.js
          node test/cfb-postgame-workerd.integration.mjs
