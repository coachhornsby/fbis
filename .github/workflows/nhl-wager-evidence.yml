name: NHL wager evidence snapshots\n\non:\n  schedule:\n    - cron: "17 * * * *"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: nhl-wager-evidence\n  cancel-in-progress: false\n\njobs:\n  evidence:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    env:\n      BASE: https://fbis-myz.pages.dev\n      HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}\n      TZ: America/Chicago\n    steps:\n      - name: Decide cadence\n        id: gate\n        run: |\n          set -euo pipefail\n          h="$(date +%H)"\n          d="$(date +%F)"\n          y="$(date -d 'yesterday' +%F)"\n          capture=0\n          settle=0\n          case "$h" in\n            08|11|14) capture=1 ;;\n            15|16|17|18|19|20|21|22|23) capture=1 ;;\n          esac\n          [ "$h" = "04" ] && settle=1 || true\n          echo "capture=$capture" >> "$GITHUB_OUTPUT"\n          echo "settle=$settle" >> "$GITHUB_OUTPUT"\n          echo "date=$d" >> "$GITHUB_OUTPUT"\n          echo "yesterday=$y" >> "$GITHUB_OUTPUT"\n\n      - name: Capture immutable research decisions\n        if: steps.gate.outputs.capture == '1'\n        run: |\n          set -euo pipefail\n          body="$(mktemp)"\n          code="$(curl -sS --max-time 90 -X POST \\n            -H "x-harvest-secret: ${HARVEST_SECRET}" \\n            -H "content-type: application/json" \\n            -d "{\"mode\":\"capture\",\"date\":\"${{ steps.gate.outputs.date }}\"}" \\n            -o "$body" -w "%{http_code}" \\n            "$BASE/api/nhl-wager-research")"\n          cat "$body"\n          test "$code" = "200"\n          jq -e '.ok == true and .authority == false and .staking == false' "$body" >/dev/null\n\n      - name: Settle prior-day NHL evidence\n        if: steps.gate.outputs.settle == '1'\n        run: |\n          set -euo pipefail\n          body="$(mktemp)"\n          code="$(curl -sS --max-time 120 -X POST \\n            -H "x-harvest-secret: ${HARVEST_SECRET}" \\n            -H "content-type: application/json" \\n            -d "{\"mode\":\"settle\",\"date\":\"${{ steps.gate.outputs.yesterday }}\"}" \\n            -o "$body" -w "%{http_code}" \\n            "$BASE/api/nhl-wager-research")"\n          cat "$body"\n          test "$code" = "200"\n          jq -e '.ok == true' "$body" >/dev/null\n\n      - name: Read calibration state\n        if: always()\n        run: |\n          curl -fsS --max-time 45 "$BASE/api/nhl-wager-research" | jq -c '{ok,counts,calibration}'\n