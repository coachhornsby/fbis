name: CFB market weakness research
on:
  push:
    branches: ["research/market-weakness-nfl-cfb"]
    paths:
      - "scripts/cfb-market-weakness.py"
      - ".github/workflows/cfb-market-weakness.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Recover frozen corrected CFB v3 OOS evidence
        run: |
          mkdir -p recovered
          gh run download 37017814589 -R coachhornsby/fbis -n cfb-full-history-v3-corrected -D recovered
          mkdir -p artifacts/cfb-final
          cp -R recovered/cfb-final/* artifacts/cfb-final/
      - name: Discover and hold out CFB market-weakness regimes
        run: python scripts/cfb-market-weakness.py
      - name: Summary
        run: jq '{modelId,sample,verifiedCount,verified,governance}' artifacts/cfb-market-weakness/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-market-weakness
          path: artifacts/cfb-market-weakness/*
          retention-days: 90
