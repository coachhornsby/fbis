name: Inspect Polymarket coverage taxonomy
on:
  push:
    branches: [ops/polymarket-coverage-taxonomy]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile provider game-line counts
        run: |
          node --input-type=module <<'JS'
          for(const id of ['141503','141504','141513','141515','143238']){
            const r=await fetch('https://gateway.polymarket.us/v1/events/'+id),b=await r.json(),e=b.event,m=e?.markets||[];
            console.log(JSON.stringify({id,http:r.status,slug:e?.slug,advertised:e?.marketCounts,returned:m.length,gameLines:m.filter(x=>['SPORTS_MARKET_TYPE_SPREAD','SPORTS_MARKET_TYPE_TOTAL'].includes(x.sportsMarketTypeV2)).length,moneylines:m.filter(x=>['SPORTS_MARKET_TYPE_MONEYLINE','SPORTS_MARKET_TYPE_DRAWABLE_OUTCOME'].includes(x.sportsMarketTypeV2)).length}));
            if(id==='141503'){const q=await (await fetch('https://gateway.polymarket.us/v1/markets?gameId='+id+'&limit=20&offset=0')).json();console.log(JSON.stringify({eventIdFilterCount:q.markets?.length}));}
          }
          JS
