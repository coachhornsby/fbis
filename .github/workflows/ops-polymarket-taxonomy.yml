name: Inspect Polymarket coverage taxonomy
on:
  push:
    branches: [ops/polymarket-coverage-taxonomy]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read stream ownership and compact moneyline delivery
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://fbis-polymarket-owner-audit.coachhornsby.workers.dev',{signal:AbortSignal.timeout(45000)});console.log(JSON.stringify({ownerAudit:await r.json()}));
          const start=Date.now(),q=await fetch('https://fbis-myz.pages.dev/api/polymarket-quotes?sport=nfl&eventIds=401872996',{signal:AbortSignal.timeout(90000)}),text=await q.text(),b=JSON.parse(text);console.log(JSON.stringify({quoteHttp:q.status,bytes:text.length,ms:Date.now()-start,scope:b.scope,offers:b.byEvent?.['401872996']?.length}));
          JS
