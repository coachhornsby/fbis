name: Inspect Polymarket coverage taxonomy
on:
  push:
    branches: [ops/polymarket-coverage-taxonomy]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect existing stream owners and remove temporary diagnostics
        run: |
          node --input-type=module <<'JS'
          const path='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/fbis-polymarket-owner-audit';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'};
          try{
            const r=await fetch(path+'/subdomain',{method:'PUT',headers,body:JSON.stringify({enabled:true})});console.log(JSON.stringify({enable:r.status}));
            if(!r.ok)throw Error('AUDIT_ENDPOINT_UNAVAILABLE');
            for(let i=0;i<6;i++){try{const s=await fetch('https://fbis-polymarket-owner-audit.coachhornsby.workers.dev',{signal:AbortSignal.timeout(20000)});if(s.ok){console.log(JSON.stringify({ownerAudit:await s.json()}));break;}}catch{}await new Promise(r=>setTimeout(r,5000));}
          }finally{
            const a=await fetch(path+'/schedules',{method:'PUT',headers,body:'[]'});console.log(JSON.stringify({cronRemoved:a.status}));
            const d=await fetch(path,{method:'DELETE',headers});console.log(JSON.stringify({temporaryWorkerRemoved:d.status}));if(!d.ok)throw Error('AUDIT_CLEANUP_FAILED');
          }
          JS
