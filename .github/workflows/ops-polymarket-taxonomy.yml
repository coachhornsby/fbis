name: Inspect Polymarket coverage taxonomy
on:
  push:
    branches: [ops/polymarket-coverage-taxonomy]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public provider league metadata and current coverage
        run: |
          node --input-type=module <<'JS'
          for(const path of ['/v2/sports?limit=50&offset=0','/v2/leagues?limit=50&offset=0','/v2/leagues?limit=50&offset=50']){
            const r=await fetch('https://gateway.polymarket.us'+path,{signal:AbortSignal.timeout(20000)});console.log(JSON.stringify({path,http:r.status,body:await r.json()}));
          }
          const r=await fetch('https://fbis-myz.pages.dev/api/polymarket-bootstrap');console.log(JSON.stringify({coverage:await r.json()}));
          JS
