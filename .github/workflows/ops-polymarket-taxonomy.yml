name: Inspect Polymarket coverage taxonomy
on:
  push:
    branches: [ops/polymarket-coverage-taxonomy]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect complete event resources
        run: |
          node --input-type=module <<'JS'
          for(const id of ['141502','159680','152758']){
            const r=await fetch('https://gateway.polymarket.us/v1/events/'+id);const b=await r.json(),e=b.event;console.log(JSON.stringify({id,http:r.status,keys:Object.keys(b),eventId:e?.id,gameId:e?.gameId,count:e?.markets?.length,marketCounts:e?.marketCounts,types:e?.markets?.reduce((a,m)=>(a[m.sportsMarketTypeV2]=(a[m.sportsMarketTypeV2]||0)+1,a),{}),sample:e?.markets?.slice(0,2)}));
          }
          JS
