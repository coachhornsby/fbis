name: Inspect Polymarket coverage taxonomy
on:
  push:
    branches: [ops/polymarket-coverage-taxonomy]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live quote delivery and response size
        run: |
          node --input-type=module <<'JS'
          const h=await (await fetch('https://fbis-polymarket-us-stream.coachhornsby.workers.dev/health')).json();console.log(JSON.stringify({health:{version:h.codeVersion,connected:h.connected,subscriptions:h.subscriptions,subscriptionIds:h.subscribedMarketIds?.length,uncovered:h.uncoveredCount,queued:h.queued,lastError:h.lastError,persistence:h.persistenceStatus}}));
          for(const path of ['/api/polymarket-quotes?sport=nfl&eventIds=401872996','/api/projections?sport=nfl&date=2026-10-18']){
            const start=Date.now(),r=await fetch('https://fbis-myz.pages.dev'+path,{signal:AbortSignal.timeout(90000)}),text=await r.text();let b;try{b=JSON.parse(text);}catch{}
            console.log(JSON.stringify({path,http:r.status,bytes:text.length,ms:Date.now()-start,keys:Object.keys(b||{}),offers:b?.byEvent?.['401872996']?.length,moneyline:b?.byEvent?.['401872996']?.filter(x=>x.marketFamily==='moneyline').map(x=>({source:x.source,side:x.side,price:x.contractPrice,time:x.sourceObservedAt}))}));
          }
          JS
