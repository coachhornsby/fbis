name: Deploy Pages

# Canonical production is https://fbis-myz.pages.dev/ (Wrangler Pages project `fbis`).
# Direct-upload deploy: Git is not connected, so main-push must publish the SHA.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify schema/migrations
        run: npm run verify:migrations
      - name: Run test suite
        run: npm test
      - name: Build app
        run: npm run build
      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured as a GitHub Actions secret."
            echo "Cannot deploy https://fbis-myz.pages.dev/ from this workflow."
            exit 1
          fi
      - name: Deploy canonical Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist \
            --project-name fbis \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "deploy ${GITHUB_SHA}"
      - name: Apply additive migration 0013
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --file=migrations/0013_probability_integrity.sql
