name: CFB player directory Phase B

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      start_year:
        description: "First verified roster season"
        required: false
        default: "2004"
      end_year:
        description: "Last verified roster season"
        required: false
        default: "2026"

permissions:
  contents: read

concurrency:
  group: cfb-player-directory-phase-b
  cancel-in-progress: false

jobs:
  populate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CFB_ROSTER_START: ${{ inputs.start_year }}
      CFB_ROSTER_END: ${{ inputs.end_year }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install roster dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Require Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Build bounded Phase B SQL shards
        run: python scripts/cfb-player-directory-build.py
      - name: Apply season shards to production D1
        run: |
          set -euo pipefail
          for file in artifacts/cfb-player-directory/cfb-player-directory-20*.sql; do
            season="$(basename "${file}" .sql | sed 's/.*-//')"
            echo "Checking durable Phase B state for ${season}"
            existing="$(npx wrangler d1 execute fbis --remote --json --command="SELECT COUNT(*) AS n, SUM(CASE WHEN temporal_confidence IS NOT NULL THEN 1 ELSE 0 END) AS temporal_n FROM cfb_roster_membership WHERE source='SPORTSDATAVERSE_ESPN_CFB_ROSTERS' AND season=${season};")"
            n="$(printf '%s' "${existing}" | jq -r '.[0].results[0].n // 0')"
            temporal_n="$(printf '%s' "${existing}" | jq -r '.[0].results[0].temporal_n // 0')"
            if [ "${n}" -gt 0 ] && [ "${n}" -eq "${temporal_n}" ]; then
              echo "Season ${season} already durably populated with temporal confidence (${n} rows); skipping"
              continue
            fi

            echo "Applying ${file}"
            ok=0
            for attempt in 1 2 3; do
              if npx wrangler d1 execute fbis --remote --file="${file}"; then
                ok=1
                break
              fi

              echo "Wrangler import returned failure for ${file}; verifying durable production state"
              landed="$(npx wrangler d1 execute fbis --remote --json --command="SELECT COUNT(*) AS n, SUM(CASE WHEN temporal_confidence IS NOT NULL THEN 1 ELSE 0 END) AS temporal_n FROM cfb_roster_membership WHERE source='SPORTSDATAVERSE_ESPN_CFB_ROSTERS' AND season=${season};")"
              landed_n="$(printf '%s' "${landed}" | jq -r '.[0].results[0].n // 0')"
              landed_temporal_n="$(printf '%s' "${landed}" | jq -r '.[0].results[0].temporal_n // 0')"
              if [ "${landed_n}" -gt 0 ] && [ "${landed_n}" -eq "${landed_temporal_n}" ]; then
                echo "Season ${season} is durably populated despite Wrangler failure (${landed_n} rows); continuing"
                ok=1
                break
              fi

              echo "D1 import attempt ${attempt} failed for ${file}; retrying"
              sleep $((attempt * 5))
            done
            test "${ok}" -eq 1 || { echo "D1 import failed after retries and durable verification: ${file}"; exit 1; }
          done
      - name: Finalize active state and coverage
        run: npx wrangler d1 execute fbis --remote --file=artifacts/cfb-player-directory/cfb-player-directory-finalize.sql
      - name: Verify production Phase B counts and governance
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --command="SELECT COUNT(*) AS canonical_players FROM cfb_canonical_players; SELECT COUNT(*) AS provider_ids FROM cfb_player_provider_ids; SELECT COUNT(*) AS aliases FROM cfb_player_aliases; SELECT COUNT(*) AS memberships FROM cfb_roster_membership; SELECT COUNT(*) AS observations FROM cfb_roster_observations; SELECT COUNT(*) AS pit_unresolved FROM cfb_roster_membership WHERE pit_resolvable=0; SELECT COUNT(*) AS orphan_team_rows FROM cfb_roster_membership m LEFT JOIN cfb_canonical_teams t ON t.team_id=m.team_id WHERE t.team_id IS NULL; SELECT identity_status,COUNT(*) AS n FROM cfb_canonical_players GROUP BY identity_status; SELECT state_family,mode,can_influence_projection,can_qualify,can_authorize_wager FROM cfb_state_overlay_governance WHERE state_family IN ('PLAYER_DIRECTORY','ROSTER_STATE') ORDER BY state_family;"
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-player-directory-phase-b
          path: artifacts/cfb-player-directory/qa.json
          if-no-files-found: error
          retention-days: 30
