name: Torvik transport safety
on:
  pull_request:
    paths:
      - 'functions/lib/torvikCbb.js'
      - 'test/torvik-transport-safety.test.js'
      - 'test/college.test.js'
      - '.github/workflows/fbis-torvik-transport-ci.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
      - run: node --import ./test/offline-network.js --test test/torvik-transport-safety.test.js test/college.test.js
