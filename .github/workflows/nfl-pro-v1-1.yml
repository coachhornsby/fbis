name: NFL-PRO-v1.2 NGS walk-forward
on:
  push:
    branches: ["research/nfl-pro-v1-1", "rebuild/nfl-props-edge-v2", "nfl-prizepicks-history-backtest"]
    paths:
      - "scripts/build-nfl-training-dataset.py"
      - "scripts/nfl-pro-v1-1-walkforward.py"
      - ".github/workflows/nfl-pro-v1-1.yml"
      - "scripts/nfl-prizepicks-history-backtest.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn
      - name: Clone free PrizePicks history source
        if: github.ref_name == 'nfl-prizepicks-history-backtest'
        run: git clone --filter=blob:none https://github.com/enkday/prizepicks-data-mirror.git /tmp/prizepicks-data-mirror
      - name: Run NFL PrizePicks historical backtest
        if: github.ref_name == 'nfl-prizepicks-history-backtest'
        run: python scripts/nfl-prizepicks-history-backtest.py
      - name: Print PrizePicks validation summary
        if: github.ref_name == 'nfl-prizepicks-history-backtest'
        run: jq '{sourceCommitCount,sourceFirstCommit,sourceLastCommit,historicalUniqueLines,scheduleMatchedLines,joinedModelLineRows,gradedRows,configuration,summary}' artifacts/nfl-prizepicks-history/report.json
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'nfl-prizepicks-history-backtest'
        with:
          name: nfl-prizepicks-history-backtest
          path: artifacts/nfl-prizepicks-history/*
          retention-days: 90
      - name: Rebuild leakage-safe NFL dataset
        if: github.ref_name != 'nfl-prizepicks-history-backtest'
        run: python scripts/build-nfl-training-dataset.py
      - name: Run nested walk-forward NFL-PRO-v1.1 validation
        if: github.ref_name != 'nfl-prizepicks-history-backtest'
        run: python scripts/nfl-pro-v1-1-walkforward.py
      - name: Summary
        if: github.ref_name != 'nfl-prizepicks-history-backtest'
        run: jq . artifacts/nfl-pro-v1-2/report.json
      - uses: actions/upload-artifact@v4
        if: github.ref_name != 'nfl-prizepicks-history-backtest'
        with:
          name: nfl-pro-v1-2
          path: artifacts/nfl-pro-v1-2/*
          retention-days: 90
