name: NFL-PRO-v1.1 compact walk-forward\non:\n  push:\n    branches: ["research/nfl-pro-v1-1"]\n    paths:\n      - "scripts/build-nfl-training-dataset.py"\n      - "scripts/nfl-pro-v1-1-walkforward.py"\n      - ".github/workflows/nfl-pro-v1-1.yml"\n  workflow_dispatch:\npermissions:\n  contents: read\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    timeout-minutes: 45\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with: { python-version: "3.12" }\n      - run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn\n      - name: Rebuild leakage-safe NFL dataset\n        run: python scripts/build-nfl-training-dataset.py\n      - name: Run nested walk-forward NFL-PRO-v1.1 validation\n        run: python scripts/nfl-pro-v1-1-walkforward.py\n      - name: Summary\n        run: |\n          jq . artifacts/nfl-pro-v1-1/report.json\n      - uses: actions/upload-artifact@v4\n        with:\n          name: nfl-pro-v1-1\n          path: artifacts/nfl-pro-v1-1/*\n          retention-days: 90\n