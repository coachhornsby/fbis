name: NFL player props v3 fast validation
on:
  push:
    branches: ["nfl-props-v3-validation"]
    paths:
      - "scripts/nfl-player-props-v3-walkforward.py"
      - ".github/workflows/nfl-player-props-v3-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run optimized NFL prop v3 walk-forward
        run: python scripts/nfl-player-props-v3-walkforward.py
      - name: Show decision report
        run: jq . artifacts/nfl-player-props-v3/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-player-props-v3-fast-${{ github.run_id }}
          path: artifacts/nfl-player-props-v3/*
          retention-days: 90
