name: Deploy persistent Polymarket US market stream
on:
  pull_request:
    paths:
      - "services/polymarket-us-stream/**"
      - "wrangler.polymarket-us-stream.toml"
      - "functions/lib/polymarketUsSignedWs.js"
      - "functions/lib/marketObservationLedger.js"
      - "functions/lib/marketTemporal.js"
      - "functions/lib/marketHistoryVerifiedArchive.js"
      - "functions/lib/databaseTopology.js"
      - "functions/lib/r2Archive.js"
      - "functions/lib/sha256Hex.js"
      - ".github/workflows/deploy-polymarket-us-stream.yml"
  push:
    branches: [main]
    paths:
      - "functions/lib/marketObservationLedger.js"
      - "functions/lib/marketTemporal.js"
      - "functions/lib/marketHistoryVerifiedArchive.js"
      - "functions/lib/databaseTopology.js"
      - "functions/lib/r2Archive.js"
      - "functions/lib/sha256Hex.js"
      - "services/polymarket-us-stream/**"
      - "wrangler.polymarket-us-stream.toml"
      - "functions/lib/polymarketUsSignedWs.js"
      - ".github/workflows/deploy-polymarket-us-stream.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbis-polymarket-us-durable-stream-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Market source/governance regression
        run: node --test test/polymarket-us-signed-ws.test.js test/polymarket-us-persistent-stream.test.js test/polymarket-stream-control.test.js
      - name: Validate primary-first bounded history shadow replication
        run: node --test test/polymarket-persistent-shadow-routing.test.mjs test/polymarket-shadow-durable-retry.test.mjs test/market-history-ws-shadow.test.mjs
      - name: Verify Worker and Durable Object bundle
        run: npx wrangler deploy --config wrangler.polymarket-us-stream.toml --dry-run --outdir /tmp/fbis-polymarket-us-stream
      - name: Deploy isolated read-only stream to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # Alias-first rename preserves the existing namespace/data while moving
          # WebSocket-pinned actors onto the current class implementation.
          current_class="$(node --input-type=module <<'JS'
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/fbis-polymarket-us-stream/settings',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          if(!r.ok)throw Error('WORKER_SETTINGS_UNAVAILABLE');const b=await r.json();console.log(b.result.bindings.find(x=>x.name==='PM_STREAM')?.class_name||'');
          JS
          )"
          if [ "$current_class" = "PolymarketMarketStream" ]; then
            node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const source=readFileSync('wrangler.polymarket-us-stream.toml','utf8');
          writeFileSync('wrangler.polymarket-alias-stage.toml',source.split('\n[[migrations]]\ntag = "v2-complete-coverage-rename"')[0].replace('class_name = "PolymarketMarketStreamRecovered"','class_name = "PolymarketMarketStream"'));
          JS
            npx wrangler deploy --config wrangler.polymarket-alias-stage.toml
            rm wrangler.polymarket-alias-stage.toml
          fi
          npx wrangler deploy --config wrangler.polymarket-us-stream.toml
          echo "Published dedicated Polymarket US read-only stream; credentials provisioned separately as encrypted Worker secrets." >> "$GITHUB_STEP_SUMMARY"
      - name: Sync HARVEST_SECRET for Cloudflare-native CORE heartbeat
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HARVEST_SECRET}" || { echo "HARVEST_SECRET not configured"; exit 1; }
          printf '%s' "${HARVEST_SECRET}" | npx wrangler secret put HARVEST_SECRET --config wrangler.polymarket-us-stream.toml
          echo "Synced HARVEST_SECRET onto fbis-polymarket-us-stream for CORE cron heartbeat" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify independent stream shadow status and default-off flag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          file="$(mktemp)"
          verified=0
          for attempt in $(seq 1 84); do
            code="$(curl -sS --retry 2 --retry-all-errors --retry-delay 2 --max-time 30 -o "$file" -w '%{http_code}' "https://fbis-polymarket-us-stream.coachhornsby.workers.dev/health" || true)"
            echo "stream-status attempt=$attempt http=$code"
            if [ "$code" = "200" ] && jq -e '.readOnly == true and .canAuthorizeWager == false
              and .codeVersion == "board-ws-q4-archive-catchup-20261020"
              and .wsPersistTarget.reason == "WS_Q4_DEFAULT"
              and .wsPersistTarget.store == "MARKET_HISTORY_2026Q4"
              and .wsPersistTarget.blocked != true
              and .diagnosticsVersion == 2
              and (.subscribedMarketIds | type) == "array"
              and .shadow.enabled == false
              and .shadow.sourceIsAuthoritative == true
              and .shadow.gap == 0' "$file" >/dev/null 2>&1; then
              verified=1
              break
            fi
            # The health endpoint contains non-sensitive counters only. Avoid
            # treating a still-propagating old Durable Object as a release failure.
            if [ "$code" = "200" ]; then
              jq -c '{connected,operational,readOnly,canAuthorizeWager,subscriptions,
                codeVersion,wsPersistTarget,
                shadowPresent:(.shadow!=null),shadowEnabled:.shadow.enabled,
                shadowGap:.shadow.gap,lastError}' "$file" || true
            fi
            sleep 5
          done
          test "$verified" = "1" || { echo "Stream shadow status contract did not converge"; exit 1; }
          jq -c '{connected,operational,subscriptions,inserted,lastError,
            shadow:{enabled:.shadow.enabled,loaded:.shadow.loaded,pending:.shadow.pending,
              verified:.shadow.verified,written:.shadow.written,failed:.shadow.failed,gap:.shadow.gap}}' "$file"
      - name: Activate collector after Pages and Worker are ready
        if: github.event_name != 'pull_request'
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          BASE: https://fbis-myz.pages.dev
        run: |
          set -euo pipefail
          node scripts/verify-deployment-sha.mjs "$GITHUB_SHA"
          response="$(curl --fail-with-body -sS --retry 4 --retry-all-errors --retry-delay 5 --max-time 125 -X POST -H "x-harvest-secret: $HARVEST_SECRET" "$BASE/api/polymarket-stream-start")"
          # HTTP 200 may wrap a disconnected DO. Inspect the JSON state before
          # treating the live WS collector as started. Never print credentials.
          echo "$response" | jq -c '{ok,connected,operational,lastError,lastConnectAttemptAt,signerProxyConfigured,subscriptions}'
          if ! jq -e '.ok==true and .connected==true' <<<"$response" >/dev/null; then
            echo "Persistent Polymarket WebSocket did not connect; deployment activation is NOT healthy."
            exit 1
          fi
