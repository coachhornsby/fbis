name: Soccer-FBIS market benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/soccer-market-benchmark.mjs"

permissions:
  contents: read

concurrency:
  group: soccer-market-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      SOCCER_MARKET_BENCHMARK_BUDGET_USD: "3.0"
      SOCCER_MARKET_BENCHMARK_DATES: "48"
      SOCCER_MARKET_BENCHMARK_MAX_GAMES: "30"
      SOCCER_MARKET_BENCHMARK_MIN_MATCHED: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Apify token
        run: test -n "${APIFY_TOKEN:-}"
      - name: Rebuild true walk-forward rows
        run: node scripts/soccer-form-walkforward.mjs
      - name: Benchmark against Zen ACTION no-vig 1X2
        run: node scripts/soccer-market-benchmark.mjs
      - name: Show benchmark
        if: always()
        run: test -f artifacts/soccer-market-benchmark.json && jq . artifacts/soccer-market-benchmark.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-market-benchmark-${{ github.run_id }}
          path: |
            artifacts/soccer-market-benchmark.json
            artifacts/soccer-market-benchmark-rows.jsonl
            artifacts/soccer-form-walkforward-report.json
          if-no-files-found: warn
          retention-days: 30
