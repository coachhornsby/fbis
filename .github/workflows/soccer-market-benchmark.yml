name: Soccer-FBIS market benchmark

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/models/soccer-market-benchmark-trigger.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: soccer-market-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      SOCCER_MARKET_BENCHMARK_BUDGET_USD: "1.0"
      SOCCER_MARKET_BENCHMARK_DATES: "4"
      SOCCER_MARKET_BENCHMARK_MAX_GAMES: "24"
      SOCCER_MARKET_BENCHMARK_MIN_MATCHED: "20"
      SOCCER_MARKET_WAIT_SECS: "45"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require Apify token
        run: test -n "${APIFY_TOKEN:-}"

      - name: Reuse latest successful walk-forward artifact
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow soccer-v2-walkforward.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "using v2 walk-forward run $run_id"
          mkdir -p artifacts
          gh run download "$run_id" -n "soccer-v2-walkforward-$run_id" -D artifacts
          test -s artifacts/soccer-v2-walkforward-rows.jsonl

      - name: Benchmark bounded sample against Zen ACTION no-vig 1X2
        run: node scripts/soccer-market-benchmark.mjs

      - name: Show benchmark
        if: always()
        run: test -f artifacts/soccer-market-benchmark.json && jq . artifacts/soccer-market-benchmark.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-market-benchmark-${{ github.run_id }}
          path: |
            artifacts/soccer-market-benchmark.json
            artifacts/soccer-market-benchmark-rows.jsonl
          if-no-files-found: warn
          retention-days: 30
