name: Action Apify PPE capability audit

# Cross-sport enriched shadow audit (MLB 3 + CFB 3 + NFL 4).
# Products: BASE + MOVEMENT + PLAYER_PROPS + GAME_PROPS + GAME_DETAIL.
# Hard spend cap: $0.75 total across three Actor starts. Shadow only.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN to execute paid capability audit
        required: true
        default: ""
      lifecycle:
        description: Lifecycle window
        required: true
        default: pregame
        type: choice
        options: [early_slate, pregame, final_pregame]
  # Push trigger used when workflow_dispatch is unavailable to the automation token.
  push:
    branches: [main]
    paths:
      - ".github/audit-triggers/action-ppe-capability-run"

permissions:
  contents: read

concurrency:
  group: action-apify-capability-audit
  cancel-in-progress: false

jobs:
  audit:
    name: CAPABILITY AUDIT (<= $0.75)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE: https://fbis-myz.pages.dev
      LIFECYCLE: ${{ github.event.inputs.lifecycle || 'pregame' }}
      PROFILE: CAPABILITY_AUDIT
      MAX_TOTAL_USD: "0.75"
      # Deliberate high-signal sample (Action game IDs from public scoreboard).
      # MLB 2026-09-12: PHI@ATL, NYM@NYY, PIT@CHC
      MLB_IDS: "294952,294941,294942"
      # CFB: OU@MICH, OSU@TEX, BAMA@UK
      CFB_IDS: "287974,287975,288997"
      # NFL: BUF@HOU, NO@DET, TB@CIN, DAL@NYG
      NFL_IDS: "290853,290851,290845,290800"
    steps:
      - name: Require confirmation + HARVEST_SECRET
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ]; then
            CONFIRM=RUN
          fi
          test "${CONFIRM}" = "RUN" || { echo "Set confirm=RUN to spend"; exit 1; }
          test -n "${HARVEST_SECRET}" || { echo "HARVEST_SECRET missing"; exit 1; }
          echo "audit_authorized=true event=${EVENT_NAME}"

      - name: Wait for production deploy SHA
        env:
          WANT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "want_sha=${WANT_SHA}"
          deadline=$((SECONDS + 900))
          while true; do
            tmp="$(mktemp)"
            code="$(curl -sS --max-time 30 -o "$tmp" -w '%{http_code}' \
              -H "accept: application/json" \
              "${BASE}/api/health?_=$(date +%s)" || true)"
            live="$(jq -r '.deploymentCommit // .build.commitSha // empty' "$tmp" 2>/dev/null || true)"
            echo "health_http=${code} live_sha=${live}"
            if [ "${code}" = "200" ] && [ -n "${live}" ] && [ "${live}" = "${WANT_SHA}" ]; then
              echo "production_sha_matched=true"
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "Timed out waiting for production deploymentCommit=${WANT_SHA} (live=${live})"
              exit 1
            fi
            sleep 15
          done

      - name: No-spend plans (MLB/CFB/NFL)
        id: plans
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          : > estimate-accumulate.txt
          for spec in "mlb:3:${MLB_IDS}:2026-09-12" "cfb:3:${CFB_IDS}:" "nfl:4:${NFL_IDS}:"; do
            sport="${spec%%:*}"
            rest="${spec#*:}"
            max="${rest%%:*}"
            rest2="${rest#*:}"
            ids="${rest2%%:*}"
            date="${rest2#*:}"
            tmp="$(mktemp)"
            qs="mode=plan&sport=${sport}&lifecycle=${LIFECYCLE}&profile=${PROFILE}&maxItems=${max}&gameUrls=${ids}"
            if [ -n "${date}" ]; then qs="${qs}&date=${date}"; fi
            code="$(curl -sS --max-time 60 -o "$tmp" -w '%{http_code}' \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              "${BASE}/api/action-apify-collect?${qs}")"
            echo "${sport}_plan_http=${code}"
            test "$code" = "200"
            jq 'del(.. | .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?)' "$tmp" > "plan-${sport}.redacted.json"
            cat "plan-${sport}.redacted.json"
            est="$(jq -r '(.plan.estimatedCostUsd // .budget.estimatedNextRunUsd // 0)' "$tmp")"
            echo "${sport}_estimate=${est}"
            python3 - <<PY
          est = float("${est}" or 0)
          print(f"${sport}_estimate_ok={est}")
          open("estimate-accumulate.txt","a").write(f"{est}\n")
          PY
            jq -e '.plan.input.includeLineMovement == true
              and .plan.input.includePlayerProps == true
              and .plan.input.includeGameProps == true
              and .plan.input.includeGameDetail == true
              and (.plan.input.includeWeather != true)' "$tmp" >/dev/null
            allowed="$(jq -r '.safety.allowed // .safety.ok // true' "$tmp")"
            test "${allowed}" = "true"
          done
          total="$(python3 - <<'PY'
          s=sum(float(x) for x in open("estimate-accumulate.txt") if x.strip())
          print(f"{s:.6f}")
          PY
          )"
          echo "total_estimate=${total}"
          python3 - <<PY
          total = float("${total}")
          cap = float("${MAX_TOTAL_USD}")
          if total > cap:
              raise SystemExit(f"total estimatedCostUsd={total} exceeds hard cap={cap}")
          print(f"budget_ok total={total} cap={cap}")
          PY
          echo "total_estimate=${total}" >> "$GITHUB_OUTPUT"

      - name: Execute MLB capability audit (3 games)
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 420 -o "$tmp" -w '%{http_code}' \
            -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -H "accept: application/json" \
            -d "{\"execute\":\"1\",\"sport\":\"mlb\",\"lifecycle\":\"${LIFECYCLE}\",\"profile\":\"${PROFILE}\",\"maxItems\":3,\"gameUrls\":[\"294952\",\"294941\",\"294942\"],\"date\":\"2026-09-12\"}" \
            "${BASE}/api/action-apify-collect?execute=1&sport=mlb&lifecycle=${LIFECYCLE}&profile=${PROFILE}&maxItems=3")"
          echo "mlb_exec_http=${code}"
          jq 'del(.. | .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?, .rows?)' "$tmp" > exec-mlb.redacted.json
          cat exec-mlb.redacted.json
          test "$code" = "200"
          jq -e '.ok == true and (.executed == true or .executed == true)' "$tmp" >/dev/null

      - name: Execute CFB capability audit (3 games)
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 420 -o "$tmp" -w '%{http_code}' \
            -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -H "accept: application/json" \
            -d "{\"execute\":\"1\",\"sport\":\"cfb\",\"lifecycle\":\"${LIFECYCLE}\",\"profile\":\"${PROFILE}\",\"maxItems\":3,\"gameUrls\":[\"287974\",\"287975\",\"288997\"]}" \
            "${BASE}/api/action-apify-collect?execute=1&sport=cfb&lifecycle=${LIFECYCLE}&profile=${PROFILE}&maxItems=3")"
          echo "cfb_exec_http=${code}"
          jq 'del(.. | .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?, .rows?)' "$tmp" > exec-cfb.redacted.json
          cat exec-cfb.redacted.json
          test "$code" = "200"
          jq -e '.ok == true and .executed == true' "$tmp" >/dev/null

      - name: Execute NFL capability audit (4 games)
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 420 -o "$tmp" -w '%{http_code}' \
            -X POST \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "content-type: application/json" \
            -H "accept: application/json" \
            -d "{\"execute\":\"1\",\"sport\":\"nfl\",\"lifecycle\":\"${LIFECYCLE}\",\"profile\":\"${PROFILE}\",\"maxItems\":4,\"gameUrls\":[\"290853\",\"290851\",\"290845\",\"290800\"]}" \
            "${BASE}/api/action-apify-collect?execute=1&sport=nfl&lifecycle=${LIFECYCLE}&profile=${PROFILE}&maxItems=4")"
          echo "nfl_exec_http=${code}"
          jq 'del(.. | .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?, .rows?)' "$tmp" > exec-nfl.redacted.json
          cat exec-nfl.redacted.json
          test "$code" = "200"
          jq -e '.ok == true and .executed == true' "$tmp" >/dev/null

      - name: Cold health + scorecard + monthly (D1 durability)
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: |
          set -euo pipefail
          for mode in health monthly; do
            tmp="$(mktemp)"
            code="$(curl -sS --max-time 60 -o "$tmp" -w '%{http_code}' \
              -H "x-harvest-secret: ${HARVEST_SECRET}" \
              -H "accept: application/json" \
              "${BASE}/api/action-apify-collect?mode=${mode}&sport=cfb&profile=${PROFILE}&_=$(date +%s)")"
            echo "cold_${mode}_http=${code}"
            test "$code" = "200"
            jq 'del(.. | .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?)' "$tmp" > "cold-${mode}.redacted.json"
            cat "cold-${mode}.redacted.json"
          done
          tmp="$(mktemp)"
          code="$(curl -sS --max-time 60 -o "$tmp" -w '%{http_code}' \
            -H "x-harvest-secret: ${HARVEST_SECRET}" \
            -H "accept: application/json" \
            "${BASE}/api/action-apify-collect?mode=scorecard&window=24h&_=$(date +%s)")"
          echo "cold_scorecard_http=${code}"
          test "$code" = "200"
          jq 'del(.. | .token?, .authorization?, .apifyToken?, .APIFY_TOKEN?)' "$tmp" > cold-scorecard.redacted.json
          cat cold-scorecard.redacted.json

      - name: Safety invariants
        run: |
          set -euo pipefail
          health="$(curl -sS --max-time 30 -H "accept: application/json" "${BASE}/api/health?_=$(date +%s)")"
          echo "$health" | jq '{
            deploymentCommit,
            migration: .build.schemaVersion,
            migrationStatus: .build.migrationStatus,
            router: (.oddsProviders.order // .oddsProviders.order),
            action: .actionApify
          }'
          echo "$health" | jq -e '
            ((.oddsProviders.order // .oddsProviders.order) == ["parlay","theodds","sharpapi","therundown"])
            and .actionApify.inProductionRouter == false
            and .actionApify.canQualify == false
            and .actionApify.canAuthorizeWager == false
            and .actionApify.mode == "shadow"
          ' >/dev/null
          echo "safety_ok=true"

      - name: Upload redacted capability audit artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: action-apify-capability-audit
          path: |
            *.redacted.json
          if-no-files-found: ignore
          retention-days: 30
