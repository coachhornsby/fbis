name: WNBA player impact live refresh

on:
  push:
    branches: ["research/wnba-player-impact-v1"]
    paths:
      - ".github/workflows/wnba-player-impact-live.yml"
      - "scripts/wnba-player-impact-live.mjs"
      - "scripts/wnba-canonical-build.mjs"
      - "scripts/wnba-merge-canonical.mjs"
      - "migrations/0049_wnba_player_impact.sql"
      - "research/wnba/player-impact-snapshot.json"
      - "functions/lib/wnbaPlayerImpactShadow.js"
  workflow_dispatch:
  schedule:
    - cron: "10 14,19,23 * * *"

permissions:
  contents: read

concurrency:
  group: wnba-player-impact-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Resolve Chicago dates
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const now=new Date();
          const fmt=d=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
          console.log("WNBA_TODAY="+fmt(now));
          console.log("WNBA_YESTERDAY="+fmt(new Date(now.getTime()-86400000)));
          NODE

      - name: Load frozen research and current season state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/frozen artifacts/current artifacts/daily artifacts/merge
          CUR="models/wnba/player-impact/research-current"
          npx wrangler r2 object get "fbis-archive/${CUR}/wnba-canonical.jsonl" --file artifacts/frozen/wnba-canonical.jsonl --remote || : > artifacts/frozen/wnba-canonical.jsonl
          npx wrangler r2 object get "fbis-archive/${CUR}/wnba-player-impact-v1.json" --file artifacts/frozen/wnba-player-impact-v1.json --remote || echo '{"players":{}}' > artifacts/frozen/wnba-player-impact-v1.json
          npx wrangler r2 object get "fbis-archive/${CUR}/wnba-lineup-effects.json" --file artifacts/frozen/wnba-lineup-effects.json --remote || echo '{"effects":[]}' > artifacts/frozen/wnba-lineup-effects.json
          npx wrangler r2 object get "fbis-archive/canonical/espn/wnba/current/wnba-canonical.jsonl" --file artifacts/current/previous.jsonl --remote || : > artifacts/current/previous.jsonl

      - name: Increment latest completed date only
        run: |
          node scripts/wnba-canonical-build.mjs start="$WNBA_YESTERDAY" end="$WNBA_YESTERDAY" out=artifacts/daily/wnba-daily.jsonl allowEmpty=1
          cp artifacts/current/previous.jsonl artifacts/merge/previous.jsonl
          cp artifacts/daily/wnba-daily.jsonl artifacts/merge/daily.jsonl
          node scripts/wnba-merge-canonical.mjs artifacts/merge artifacts/current/wnba-canonical.jsonl

      - name: Persist current-season canonical state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "fbis-archive/canonical/espn/wnba/current/wnba-canonical.jsonl" --file artifacts/current/wnba-canonical.jsonl --remote

      - name: Load point-in-time WNBA availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute fbis --remote --json --command             "SELECT * FROM player_availability_observations WHERE sport='wnba' AND observed_at <= datetime('now') AND observed_at >= datetime('now','-7 days') ORDER BY observed_at ASC"             > artifacts/wnba-availability.json

      - name: Build current impact and role context
        run: |
          node scripts/wnba-player-impact-live.mjs             frozen=artifacts/frozen/wnba-canonical.jsonl             current=artifacts/current/wnba-canonical.jsonl             historicalImpact=artifacts/frozen/wnba-player-impact-v1.json             availability=artifacts/wnba-availability.json             lineups=artifacts/frozen/wnba-lineup-effects.json             out=artifacts/wnba-player-impact-live.json             sql=artifacts/wnba-player-impact-live.sql

      - name: Persist live impact context
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute fbis --remote --file=migrations/0049_wnba_player_impact.sql
          if [ -s artifacts/wnba-player-impact-live.sql ]; then
            npx wrangler d1 execute fbis --remote --file=artifacts/wnba-player-impact-live.sql
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wnba-player-impact-live-${{ github.run_id }}
          path: |
            artifacts/wnba-player-impact-live.json
            artifacts/current/wnba-canonical.jsonl
          retention-days: 30
