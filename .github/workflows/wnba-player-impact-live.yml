name: WNBA player impact live refresh

on:
  push:
    branches: ["research/wnba-player-impact-v1", main]
    paths:
      - ".github/workflows/wnba-player-impact-live.yml"
      - "scripts/wnba-player-impact-live.mjs"
      - "scripts/wnba-canonical-build.mjs"
      - "scripts/wnba-merge-canonical.mjs"
      - "migrations/0049_wnba_player_impact.sql"
      - "scripts/wnba-merge-lineup-stints.mjs"
      - "scripts/wnba-lineup-effects-build.mjs"
      - "research/wnba/player-impact-snapshot.json"
      - "functions/lib/wnbaPlayerImpactShadow.js"
  workflow_dispatch:
  schedule:
    - cron: "10 14,19,23 * * *"

permissions:
  contents: read

concurrency:
  group: wnba-player-impact-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Resolve Chicago dates
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const now=new Date();
          const fmt=d=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
          console.log("WNBA_TODAY="+fmt(now));
          console.log("WNBA_YESTERDAY="+fmt(new Date(now.getTime()-86400000)));
          NODE

      - name: Load frozen research and current season state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/frozen artifacts/current artifacts/daily artifacts/merge artifacts/stints artifacts/combined
          CUR="models/wnba/player-impact/research-current"
          npx wrangler r2 object get "fbis-archive/${CUR}/wnba-canonical.jsonl" --file artifacts/frozen/wnba-canonical.jsonl --remote || : > artifacts/frozen/wnba-canonical.jsonl
          npx wrangler r2 object get "fbis-archive/${CUR}/wnba-player-impact-v1.json" --file artifacts/frozen/wnba-player-impact-v1.json --remote || echo '{"players":{}}' > artifacts/frozen/wnba-player-impact-v1.json
          npx wrangler r2 object get "fbis-archive/${CUR}/wnba-lineup-effects.json" --file artifacts/frozen/wnba-lineup-effects.json --remote || echo '{"effects":[]}' > artifacts/frozen/wnba-lineup-effects.json
          npx wrangler r2 object get "fbis-archive/canonical/espn/wnba/current/wnba-canonical.jsonl" --file artifacts/current/previous.jsonl --remote || : > artifacts/current/previous.jsonl
          npx wrangler r2 object get "fbis-archive/canonical/espn/wnba/current/wnba-lineup-stints.jsonl" --file artifacts/current/previous-stints.jsonl --remote || : > artifacts/current/previous-stints.jsonl
          npx wrangler r2 object get "fbis-archive/canonical/espn/wnba/current/wnba-pbp.jsonl" --file artifacts/current/previous-pbp.jsonl --remote || : > artifacts/current/previous-pbp.jsonl
          npx wrangler r2 object get "fbis-archive/${CUR}/wnba-lineup-stints.jsonl" --file artifacts/frozen/wnba-lineup-stints.jsonl --remote || : > artifacts/frozen/wnba-lineup-stints.jsonl

      - name: Increment latest completed date only
        run: |
          node scripts/wnba-canonical-build.mjs start="$WNBA_YESTERDAY" end="$WNBA_YESTERDAY" out=artifacts/daily/wnba-daily.jsonl allowEmpty=1
          node scripts/wnba-pbp-canonical-build.mjs start="$WNBA_YESTERDAY" end="$WNBA_YESTERDAY" out=artifacts/daily/wnba-daily-pbp.jsonl
          node scripts/wnba-lineup-stints-build.mjs             games=artifacts/daily/wnba-daily.jsonl             pbp=artifacts/daily/wnba-daily-pbp.jsonl             out=artifacts/daily/wnba-daily-stints.jsonl             effects=artifacts/daily/wnba-daily-effects.json
          mkdir -p artifacts/pbp-merge
          cp artifacts/current/previous-pbp.jsonl artifacts/pbp-merge/previous.jsonl
          cp artifacts/daily/wnba-daily-pbp.jsonl artifacts/pbp-merge/daily.jsonl
          node scripts/wnba-merge-pbp.mjs artifacts/pbp-merge artifacts/current/wnba-pbp.jsonl
          cp artifacts/current/previous.jsonl artifacts/merge/previous.jsonl
          cp artifacts/daily/wnba-daily.jsonl artifacts/merge/daily.jsonl
          node scripts/wnba-merge-canonical.mjs artifacts/merge artifacts/current/wnba-canonical.jsonl
          node scripts/wnba-possession-state-build.mjs games=artifacts/current/wnba-canonical.jsonl pbp=artifacts/current/wnba-pbp.jsonl out=artifacts/current/wnba-possession-state.jsonl shots=artifacts/current/wnba-shot-events.jsonl profiles=artifacts/current/wnba-shot-profiles.jsonl
          cp artifacts/current/previous-stints.jsonl artifacts/stints/previous.jsonl
          cp artifacts/daily/wnba-daily-stints.jsonl artifacts/stints/daily.jsonl
          node scripts/wnba-merge-lineup-stints.mjs artifacts/stints artifacts/current/wnba-lineup-stints.jsonl
          cp artifacts/frozen/wnba-lineup-stints.jsonl artifacts/combined/historical.jsonl
          cp artifacts/current/wnba-lineup-stints.jsonl artifacts/combined/current.jsonl
          node scripts/wnba-merge-lineup-stints.mjs artifacts/combined artifacts/current/wnba-all-lineup-stints.jsonl
          node scripts/wnba-lineup-effects-build.mjs artifacts/current/wnba-all-lineup-stints.jsonl artifacts/current/wnba-lineup-effects.json

      - name: Persist current-season canonical state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "fbis-archive/canonical/espn/wnba/current/wnba-canonical.jsonl" --file artifacts/current/wnba-canonical.jsonl --remote
          npx wrangler r2 object put "fbis-archive/canonical/espn/wnba/current/wnba-lineup-stints.jsonl" --file artifacts/current/wnba-lineup-stints.jsonl --remote
          npx wrangler r2 object put "fbis-archive/canonical/espn/wnba/current/wnba-lineup-effects.json" --file artifacts/current/wnba-lineup-effects.json --remote
          npx wrangler r2 object put "fbis-archive/canonical/espn/wnba/current/wnba-pbp.jsonl" --file artifacts/current/wnba-pbp.jsonl --remote
          npx wrangler r2 object put "fbis-archive/canonical/espn/wnba/current/wnba-possession-state.jsonl" --file artifacts/current/wnba-possession-state.jsonl --remote
          npx wrangler r2 object put "fbis-archive/canonical/espn/wnba/current/wnba-shot-events.jsonl" --file artifacts/current/wnba-shot-events.jsonl --remote
          npx wrangler r2 object put "fbis-archive/canonical/espn/wnba/current/wnba-shot-profiles.jsonl" --file artifacts/current/wnba-shot-profiles.jsonl --remote

      - name: Load point-in-time WNBA availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            if npx wrangler d1 execute fbis --remote --json --command               "SELECT * FROM player_availability_observations WHERE sport='wnba' AND observed_at <= datetime('now') AND observed_at >= datetime('now','-7 days') ORDER BY observed_at ASC"               > artifacts/wnba-availability.json; then
              ok=1
              break
            fi
            echo "availability D1 read attempt=$attempt/5 failed; retrying"
            sleep $((attempt * 6))
          done
          if [ "$ok" != "1" ]; then
            echo "availability read unavailable after retries; fail-soft with no verified availability context"
            printf '[]\n' > artifacts/wnba-availability.json
          fi

      - name: Build current impact and role context
        run: |
          node scripts/wnba-player-impact-live.mjs             frozen=artifacts/frozen/wnba-canonical.jsonl             current=artifacts/current/wnba-canonical.jsonl             historicalImpact=artifacts/frozen/wnba-player-impact-v1.json             availability=artifacts/wnba-availability.json             lineups=artifacts/frozen/wnba-lineup-effects.json             out=artifacts/wnba-player-impact-live.json             sql=artifacts/wnba-player-impact-live.sql

      - name: Persist live impact context
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Schema is migration-owned. Scheduled refresh writes only current state.
          if [ -s artifacts/wnba-player-impact-live.sql ]; then
            sql="$(cat artifacts/wnba-player-impact-live.sql)"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if npx wrangler d1 execute fbis --remote --command "$sql"; then
                ok=1
                break
              fi
              echo "impact context D1 write attempt=$attempt/6 failed; retrying"
              sleep $((attempt * 8))
            done
            test "$ok" = "1"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wnba-player-impact-live-${{ github.run_id }}
          path: |
            artifacts/wnba-player-impact-live.json
            artifacts/current/wnba-canonical.jsonl
          retention-days: 30
# repaired-current-state-smoke: 2026-10-04
