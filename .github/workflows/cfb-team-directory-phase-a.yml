name: CFB team directory Phase A

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/cfb-team-directory-build.mjs"
      - ".github/workflows/cfb-team-directory-phase-a.yml"
      - "migrations/0067_cfb_persistent_directory_phase_a.sql"
      - "functions/lib/cfbTeamDirectory.js"
  workflow_dispatch:
    inputs:
      start_year:
        description: "First season for conference history"
        required: false
        default: "2000"
      end_year:
        description: "Last season for conference history"
        required: false
        default: "2026"

permissions:
  contents: read

concurrency:
  group: cfb-team-directory-phase-a
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CFB_DIRECTORY_START: ${{ inputs.start_year }}
      CFB_DIRECTORY_END: ${{ inputs.end_year }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Require credentials
        run: |
          set -euo pipefail
          test -n "${CFBD_API_KEY}" || { echo "Missing CFBD_API_KEY"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Build bounded directory SQL
        run: node scripts/cfb-team-directory-build.mjs
      - name: Apply to production D1
        run: npx wrangler d1 execute fbis --remote --file=artifacts/cfb-directory/cfb-team-directory.sql
      - name: Verify production counts and governance
        run: |
          set -euo pipefail
          npx wrangler d1 execute fbis --remote --command="SELECT COUNT(*) AS canonical_teams FROM cfb_canonical_teams; SELECT COUNT(*) AS provider_ids FROM cfb_team_provider_ids; SELECT COUNT(*) AS aliases FROM cfb_team_aliases; SELECT COUNT(*) AS conference_runs FROM cfb_conference_membership; SELECT state_family,mode,can_influence_projection,can_qualify,can_authorize_wager FROM cfb_state_overlay_governance WHERE state_family IN ('TEAM_DIRECTORY','TEAM_STATE');"
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-team-directory-phase-a
          path: artifacts/cfb-directory/*
          if-no-files-found: error
          retention-days: 30
