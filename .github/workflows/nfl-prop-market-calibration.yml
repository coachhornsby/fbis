name: NFL prop market calibration

on:
  workflow_dispatch:
  schedule:
    - cron: "41 10 * * 2"
  push:
    branches: [main]
    paths:
      - "scripts/nfl-prizepicks-history-backtest.py"
      - "scripts/nfl-prop-market-calibration.py"
      - "data/models/nfl-prop-market-calibration-v2.json"
      - "functions/lib/selectivePropEdge.js"
      - "migrations/0065_nfl_qb_shadow_prop_calibration.sql"
      - ".github/workflows/nfl-prop-market-calibration.yml"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install project dependencies
        run: npm ci
      - name: Install calibration dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Clone free historical PrizePicks source
        run: git clone --filter=blob:none https://github.com/enkday/prizepicks-data-mirror.git /tmp/prizepicks-data-mirror
      - name: Rebuild leakage-safe NFL PrizePicks history
        run: python scripts/nfl-prizepicks-history-backtest.py
      - name: Run market-specific calibration audit
        run: python scripts/nfl-prop-market-calibration.py
      - name: Verify calibration-before-stars governance
        run: |
          jq -e '.governance.unvalidatedMaxStars==3 and .governance.rawZMayCreateFourOrFiveStars==false' artifacts/nfl-prop-market-calibration/report.json >/dev/null
          jq '{validatedMarkets,markets}' artifacts/nfl-prop-market-calibration/report.json
      - name: Persist research calibration ledger
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute fbis --remote --file=migrations/0065_nfl_qb_shadow_prop_calibration.sql
          npx wrangler d1 execute fbis --remote --file=artifacts/nfl-prop-market-calibration/calibration.sql
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-prop-market-calibration-${{ github.run_id }}
          path: |
            artifacts/nfl-prop-market-calibration/report.json
            artifacts/nfl-prop-market-calibration/calibration.sql
            artifacts/nfl-prizepicks-history/report.json
          retention-days: 90
