name: Polymarket bounded storage recovery
on:
  push:
    branches: [fix/polymarket-storage-diagnostics-20261015]
permissions:
  contents: read
concurrency:
  group: fbis-polymarket-remaining-recovery
  cancel-in-progress: true
jobs:
  compact:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {start: 123249, end: 125000}
          - {start: 199908, end: 200000}
          - {start: 471570, end: 475000}
          - {start: 200553, end: 250000}
          - {start: 475000, end: 525000}
          - {start: 525000, end: 9007199254740991}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - name: Verify deployed maintenance source
        run: |
          VERIFY_MODE=resolve-live node scripts/verify-deployment-sha.mjs > /tmp/storage-live.json
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const sha=JSON.parse(await readFile('/tmp/storage-live.json','utf8')).productionSha;
          if(!/^[a-f0-9]{40}$/.test(sha))throw Error('Live SHA missing');
          for(const path of ['functions/lib/polymarketPayloadArchive.js','functions/api/polymarket-storage.js']){
            const r=await fetch('https://raw.githubusercontent.com/coachhornsby/fbis/'+sha+'/'+path);
            if(!r.ok)throw Error('Source verification unavailable');
            const remote=await r.text(),local=await readFile(path,'utf8');
            if(remote!==local)throw Error('DEPLOYED_MAINTENANCE_SOURCE_CHANGED: '+path);
          }
          console.log('Verified unchanged maintenance source at '+sha);
          JS
      - name: Compact existing verified archives in bounded rowid section
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
          COMPACTION_APPLY: 'true'
          COMPACTION_CUTOFF: '2026-10-15T16:12:25.588Z'
          COMPACTION_START: ${{ matrix.start }}
          COMPACTION_END: ${{ matrix.end }}
        run: node scripts/compact-polymarket-storage-shard.mjs
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: polymarket-storage-section-${{ matrix.start }}
          path: /tmp/fbis-polymarket-storage-result.json
          if-no-files-found: ignore
