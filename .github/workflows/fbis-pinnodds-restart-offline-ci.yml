name: PinnOdds restart offline checks
on:
  pull_request:
    paths:
      - 'services/pinnodds-restart/**'
      - 'src/lib/pinnoddsStaticReference.js'
      - 'src/PublicationApp.jsx'
      - 'scripts/build-pinnodds-static-reference.mjs'
      - 'scripts/build-pinnodds-publication-offline.mjs'
      - 'test/pinnodds-restart.test.mjs'
      - '.github/workflows/fbis-pinnodds-restart-offline-ci.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
      - run: node --import ./test/offline-network.js --test test/pinnodds-restart.test.mjs test/pinnodds-markets.test.js test/pinnodds-account-usage.test.mjs test/pinnodds-governed-capture.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-pinnodds-publication-offline.mjs
