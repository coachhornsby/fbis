name: NBA player impact checks

on:
  push:
    branches: ["research/nba-player-impact-v1", main]
    paths:
      - "functions/lib/nbaPlayerImpact.js"
      - "functions/lib/nbaLineupModel.js"
      - "functions/lib/nbaRoleRedistribution.js"
      - "functions/lib/nbaPlayerPropModel.js"
      - "scripts/nba-player-impact-live.mjs"
      - "scripts/nba-shadow-project.mjs"
      - "test/nba-player-impact.test.js"
      - ".github/workflows/nba-player-impact-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: node --test test/nba-player-impact.test.js test/nba-fbis-v1.test.js test/nba-action-governance.test.js
