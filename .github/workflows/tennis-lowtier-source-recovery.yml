name: Tennis lower-tier source recovery audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/api/tennis-profile-reconciliation.js"
      - "scripts/tennis-lowtier-source-recovery-audit.mjs"
      - "scripts/lib/tennis-lowtier-source-audit.mjs"
      - ".github/workflows/tennis-lowtier-source-recovery.yml"
permissions:
  contents: read
concurrency:
  group: tennis-lowtier-source-recovery
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: {node-version: '22'}
      - name: Wait for an authoritative live production descendant
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            echo "Production lineage verification attempt $attempt/20"
            if receipt="$(VERIFY_MODE=resolve-live node scripts/verify-deployment-sha.mjs)"; then
              echo "$receipt"
              if live_sha="$(printf '%s' "$receipt" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);if(r.outcome!=='match'||!(/^[0-9a-f]{40}$/.test(r.productionSha||'')))process.exit(1);process.stdout.write(r.productionSha)})")"; then
                git fetch --no-tags --depth=64 origin main
                if git cat-file -e "$live_sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$live_sha"; then
                  echo "Verified release ancestor $GITHUB_SHA in live production $live_sha"
                  exit 0
                fi
                echo "Production $live_sha does not yet include audit commit $GITHUB_SHA"
              fi
            fi
            if [ "$attempt" -lt 20 ]; then sleep 20; fi
          done
          echo "LIVE_PRODUCTION_MISSING_TENNIS_AUDIT_COMMIT_AFTER_BOUNDED_WAIT"
          exit 1
      - name: Audit source-backed Challenger Futures and ITF recovery candidates
        env:
          HARVEST_SECRET: ${{ secrets.HARVEST_SECRET }}
        run: node scripts/tennis-lowtier-source-recovery-audit.mjs
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: tennis-lowtier-source-recovery
          path: artifacts/tennis-lowtier-source-recovery.json
          retention-days: 30
          if-no-files-found: warn
