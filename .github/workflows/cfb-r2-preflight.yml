name: CFB R2 archive preflight
on:
  push:
    branches: ["research/cfb-v5-context-engine"]
    paths:
      - ".github/workflows/cfb-r2-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify R2 write and delete
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          key="preflight/cfb-build-${GITHUB_RUN_ID}.txt"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/fbis-archive/objects/${key}"
          printf 'fbis-r2-preflight\n' > /tmp/r2-preflight.txt
          curl -fsS -X PUT "$base"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: text/plain"             --data-binary @/tmp/r2-preflight.txt | tee /tmp/put.json
          jq -e '.success == true' /tmp/put.json
          curl -fsS -X DELETE "$base"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/delete.json
          jq -e '.success == true' /tmp/delete.json
          echo "R2 write/delete preflight passed."
