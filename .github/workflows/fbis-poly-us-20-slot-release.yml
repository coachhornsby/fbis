name: FBIS Polymarket bounded 20-slot pilot — one-time release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fbis-poly-us-20-slot-release.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: fbis-poly-us-20-slot-one-time-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regression tests and script check
        run: |
          node --test test/polymarket-us-20-slot-lease-pilot.test.mjs test/polymarket-cbb-1h-roster-priority.test.mjs test/polymarket-bounded-session.test.mjs
          node --check services/polymarket-roster-publisher/worker.mjs
      - name: Check existing Cloudflare credentials
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || exit 1
          test -n "${CLOUDFLARE_API_TOKEN:-}" || exit 1
      - name: Deploy existing roster publisher only
        run: npx wrangler deploy --config wrangler.polymarket-roster-publisher.toml --keep-vars
