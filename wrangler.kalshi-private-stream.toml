name = "fbis-kalshi-private-stream"
main = "services/kalshi-private-stream/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# FAIL CLOSED BY DEFAULT. The user must add separate Worker encrypted secrets:
# KALSHI_API_KEY_ID and KALSHI_PRIVATE_KEY_PEM1, then opt in to enabling stream.
[vars]
CLOUDFLARE_ACCOUNT_ID = "2fdc80b8d99070adcef12f7a785c3fc1"
KALSHI_PRIVATE_STREAM_MODE = "disabled"

[triggers]
crons = []

[[durable_objects.bindings]]
name = "ACCOUNT_SESSION"
class_name = "KalshiPrivateAccountSession"

[[migrations]]
tag = "v1-kalshi-private-account-session"
new_sqlite_classes = ["KalshiPrivateAccountSession"]

[observability]
enabled = true

[observability.traces]
enabled = true

# Shared account admission; policy stays paused until measured costs and bounded jobs are configured.
[[durable_objects.bindings]]
name = "FBIS_ACCOUNT_BUDGET"
class_name = "AccountBudget"
script_name = "fbis-account-budget"
