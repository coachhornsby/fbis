name = "fbis-orchestrator"
main = "workers/sports-projection-orchestrator-worker.mjs"
compatibility_date = "2026-09-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[triggers]
crons = []

[vars]
CLOUDFLARE_ACCOUNT_ID = "2fdc80b8d99070adcef12f7a785c3fc1"
SPREADSHEET_ID = "1B1IVONVvmP50JPCqb64fzEsSaTv6AuHQ04YqEzBhjAo"
ORCHESTRATOR_VERSION = "AI-ORCH-v0.4-cloudflare"
PROJECTION_PROTOCOL = "MULTISPORT-PROJ-v0.2"
PROJECTION_SCHEMA_VERSION = "projection-v0.3"
OPENAI_MODEL = "gpt-5.6-sol"
GEMINI_MODEL = "gemini-3.8-flash"
MAX_RUNS_PER_INVOCATION = "5"
FBIS_BASE_URL = "https://fbis-myz.pages.dev"
LLM_SELECTION_ENABLED = "false"
LLM_MAX_GAMES_PER_DAY = "8"
LLM_MAX_PER_SCAN = "5"
LLM_MIN_QUALITY = "76"
LLM_MIN_MINUTES_TO_START = "60"
LLM_HORIZON_HOURS = "36"
WIN_PROB_DELTA_PP = "4"
TOTAL_DELTA = "0.75"
SP_IP_DELTA = "0.5"
SP_K_DELTA = "0.75"
GITHUB_OIDC_AUDIENCE = "sports-projection-orchestrator"
GITHUB_OIDC_REPOSITORY = "coachhornsby/fbis"
ORCH_CRON_ENABLED = "true"
# Active recovery is fail closed until the narrowly scoped GitHub workflow
# dispatch credential is installed as a Worker SECRET, never in this TOML.
TENNIS_RECOVERY_ENABLED = "true"

# The Tennis refresh watchdog uses read-only latest metadata; no ingestion
# authority or paid provider capability is added by this binding.
[[r2_buckets]]
binding = "R2_ARCHIVE"
bucket_name = "fbis-archive"

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Shared account admission; policy stays paused until measured costs and bounded jobs are configured.
[[durable_objects.bindings]]
name = "FBIS_ACCOUNT_BUDGET"
class_name = "AccountBudget"
script_name = "fbis-account-budget"
