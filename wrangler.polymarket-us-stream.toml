name = "fbis-polymarket-us-stream"
main = "services/polymarket-us-stream/boundedWorker.mjs"
workers_dev = false
preview_urls = false
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Dedicated read-only market collector; no order execution routes.
[triggers]
crons = []

[[durable_objects.bindings]]
name = "PM_STREAM"
class_name = "PolymarketMarketStreamRecovered"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PolymarketMarketStream"]

# Research snapshots only; this Worker has no D1 bindings.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "fbis-archive"

# Code ceilings: one connection, 50 contracts, 128 received frames, 20 seconds.
[vars]
CLOUDFLARE_ACCOUNT_ID = "2fdc80b8d99070adcef12f7a785c3fc1"

# Preserve the existing namespace migration history; no automatic reactivation.

[[migrations]]
tag = "v2-complete-coverage-rename"
renamed_classes = [{ from = "PolymarketMarketStream", to = "PolymarketMarketStreamCoverage" }]

[[migrations]]
tag = "v3-capacity-routing-rename"
renamed_classes = [{ from = "PolymarketMarketStreamCoverage", to = "PolymarketMarketStreamRecovered" }]

[observability.traces]
enabled = false
head_sampling_rate = 0.1

[observability]
enabled = false

# Shared account admission; policy stays paused until measured costs and bounded jobs are configured.
[[durable_objects.bindings]]
name = "FBIS_ACCOUNT_BUDGET"
class_name = "AccountBudget"
script_name = "fbis-account-budget"

[limits]
cpu_ms = 100
