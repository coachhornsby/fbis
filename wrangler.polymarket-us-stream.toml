name = "fbis-polymarket-us-stream"
main = "services/polymarket-us-stream/worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Dedicated read-only market collector; no order execution routes.
[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "PM_STREAM"
class_name = "PolymarketMarketStreamCoverage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PolymarketMarketStream"]

[[d1_databases]]
binding = "DB"
database_name = "fbis"
database_id = "b50c724c-903b-4241-8ce1-48d931e7a44c"

# Independent observation shadow target. Core market/projected-eligibility reads
# continue to use the existing DB binding; no cross-D1 joins or source deletes.
[[d1_databases]]
binding = "MARKET_HISTORY_DB"
database_name = "fbis-market-history"
database_id = "c32ccf06-c896-4d24-bb89-3e87a7412899"

# Existing Polymarket REST owner archives contract rosters here; no provider calls
# are made by the stream to rediscover the same markets.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "fbis-archive"

# Soft operational capacity — not a verified Polymarket hard quota.
# Subscribe frames remain ≤50 slugs; total scales via multiple frames on one DO.
[vars]
MARKET_HISTORY_SHADOW_WS = "disabled"
STREAM_COVER_ALL_ELIGIBLE = "enabled"
STREAM_MAX_CONTRACTS = "500"
STREAM_MAX_PER_CONNECTION = "50"
STREAM_MAX_CONNECTIONS = "10"
STREAM_MIN_PER_SPORT = "1"

# Reactivate DO after idle recycle (ops 20261016T210342Z)

[[migrations]]
tag = "v2-complete-coverage-rename"
renamed_classes = [{ from = "PolymarketMarketStream", to = "PolymarketMarketStreamCoverage" }]
