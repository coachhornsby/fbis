name = "fbis-kalshi-public-collector"
main = "services/kalshi-public-collector/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Single centrally scheduled poll: one NFL or CFB series per fifteen minutes.
# No account credentials. No D1, no betting decisions or venue execution.
[triggers]
crons = []

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "fbis-archive"

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
CLOUDFLARE_ACCOUNT_ID = "2fdc80b8d99070adcef12f7a785c3fc1"

# Shared account admission; policy stays paused until measured costs and bounded jobs are configured.
[[durable_objects.bindings]]
name = "FBIS_ACCOUNT_BUDGET"
class_name = "AccountBudget"
script_name = "fbis-account-budget"
