name = "fbis-kalshi-public-collector"
main = "services/kalshi-public-collector/entrypoint.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# One rotating sport REST poll per two minutes; bounded market WS per minute.
# No account credentials. No D1, no betting decisions or venue execution.
[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "fbis-archive"

[observability]
enabled = false

[observability.traces]
enabled = false

[vars]
CLOUDFLARE_ACCOUNT_ID = "2fdc80b8d99070adcef12f7a785c3fc1"

# Shared account admission; policy stays paused until measured costs and bounded jobs are configured.
[[durable_objects.bindings]]
name = "FBIS_ACCOUNT_BUDGET"
class_name = "AccountBudget"
script_name = "fbis-account-budget"

[limits]
cpu_ms = 100

[[durable_objects.bindings]]
name = "MARKET_SESSION"
class_name = "KalshiMarketPriceSession"

[[migrations]]
tag = "v1-bounded-market-price-session"
new_sqlite_classes = ["KalshiMarketPriceSession"]
