name = "fbis"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ACTION_APIFY_PLAN / ACTION_APIFY_MONTHLY_BUDGET_USD are pinned to starter/19 by
# CI + Sync Pages Secrets (tier config, not credentials). Do NOT also declare them
# under [vars] — Cloudflare rejects duplicate binding names when a Pages secret exists.

[[d1_databases]]
binding = "DB"
database_name = "fbis"
database_id = "b50c724c-903b-4241-8ce1-48d931e7a44c"

# Licensed Tier 3 research data is isolated from the full 10GB primary D1.
[[d1_databases]]
binding = "TIER3_DB"
database_name = "fbis-cfb-tier3-research"
database_id = "3dcddd30-8790-48f0-a6a3-cc3ad9b95295"

# Independent 50-column market evidence shadow shard. Source-of-truth writes,
# decision links, CLV, settlement, cards and models remain on primary DB.
# No consumer cutover or retention release is authorized by this binding.
[[d1_databases]]
binding = "MARKET_HISTORY_DB"
database_name = "fbis-market-history"
database_id = "c32ccf06-c896-4d24-bb89-3e87a7412899"

# Separate operational D1 for new feature development. No existing reads or writes are redirected.
[[d1_databases]]
binding = "OPERATIONS_DB"
database_name = "fbis-operations-20261017"
database_id = "2371df3a-17bf-44d6-abf0-d275cf2f331e"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "fbis-archive"

# Separate D1 write copies only; authoritative reads, CLV, and qualification
# remain on primary. Roll back by setting this to "disabled".
[vars]
MARKET_HISTORY_SHADOW_WS = "enabled"
